description: >-
  Recipes so nothing goes to waste: what is left of a Spanish stew, yesterday's roast chicken,
  stale bread, fish from dinner, vegetables going soft and fruit that is too ripe. Ropa vieja,
  stew croquettes, roast chicken lasagne, roast meat cannelloni, empanadillas, mash and roast
  meat pie, baked eggs with leftover vegetables, fish loaf, ripe fruit smoothie and jam,
  vegetable peel stock and croutons.
