    cook: 25
    servings: 4
    notes: Los ñoquis frescos de paquete se asan sin cocerlos antes y quedan crujientes por fuera.
    tags: [una bandeja, pasta, vegetariana, al horno]
    utensils: [Horno]
    ingredients:
      - items:
          - [ñoquis frescos, 800, g]
          - [tomates cherry, 500, g]
          - [dientes de ajo, 3, null]
          - [mozzarella, 125, g]
          - [albahaca fresca, null, null]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 220 °C.
      - Mezcla en la bandeja los ñoquis, los tomates, el ajo laminado, el aceite y la sal.
      - Hornea 20 minutos, removiendo a mitad, hasta que los tomates revienten y los ñoquis se doren.
      - Reparte la mozzarella en trozos, hornea 5 minutos más y sirve con albahaca.

  - name: Chuletas de cerdo con patatas y pimientos
    health: [YELLOW, "Cerdo con patatas y verduras: completo; las chuletas tienen algo de grasa."]
