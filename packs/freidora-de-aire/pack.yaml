          - [perejil picado, 1, cucharada]
          - [eneldo picado, 1, cucharadita]
          - [mostaza de Dijon, 1, cucharadita]
          - [aceite de oliva, 1, cucharada]
          - [sal, null, null]
    steps:
      - Sala el salmón y unta la parte de arriba con la mostaza.
      - Mezcla el pan rallado con las hierbas y el aceite y presiónalo sobre la mostaza.
      - Coloca los lomos con la piel hacia abajo y cocina a 190 °C durante 8-10 minutos, según el grosor.

  - name: Gambas rebozadas con panko
    health: [YELLOW, "Gambas magras con rebozado sin freír, pero la salsa de mayonesa añade bastante grasa. Moderar la salsa."]
    nutrition: [380, 26, 32, 16]
