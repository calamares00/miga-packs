  - name: Champiñones rellenos
    health: [YELLOW, "Champiñones ligeros, pero rellenos de jamón y queso de untar, que aportan grasa y sal."]
    nutrition: [140, 8, 4, 10]
    photo: freidora-de-aire/champinones-rellenos.jpg
