name: Tápers para el trabajo
series: Cocina de cada día
family: tapers-para-el-trabajo
description: >-
  Comidas que aguantan bien en la nevera, viajan en táper y se recalientan sin perder gracia:
  ensaladas de alubias y de quinoa, arroz con pollo, muslos al horno con patatas,
  garbanzos con chorizo y calabaza, pollo con champiñones, macarrones con chorizo, burritos,
  fideos salteados, tortilla de patatas y espinacas, pastel de patata y atún, bulgur con
  verduras, pasta con pollo y pesto y pimientos rellenos. Con notas de conservación y de cómo
  recalentar cada una.
author: Miga
authorGithub: calamares00
