name: "Thermomix: salsas y bases"
series: Electrodomésticos
family: thermomix-salsas-y-bases
description: >-
  Las salsas y bases que más se usan en la cocina, programadas para Thermomix TM6, que funcionan
  igual en TM5 y TM7: bechamel, mayonesa, alioli, sofrito, tomate frito, pesto, salsa boloñesa,
  salsa de queso, salsa brava, holandesa, romesco, salsa de yogur con hierbas, salsa de
  champiñones y caldos de verduras y de pollo. Muchas se congelan bien en porciones.
author: Miga
authorGithub: calamares00
