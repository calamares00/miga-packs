recipes:

  - name: Patatas fritas en freidora de aire
    health: [GREEN, "Patatas hechas con muy poco aceite: mucha menos grasa que fritas. Un acompañamiento sencillo y razonable."]
    nutrition: [250, 5, 48, 7]
    photo: freidora-de-aire/patatas-fritas-en-freidora-de-aire.jpg
    category: Verduras
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 2
    notes: Remojar las patatas en agua fría les quita almidón y salen más crujientes.
    tags: [guarnición, vegana, sin gluten]
    utensils: [Freidora de aire]
    ingredients:
      - items:
          - [patatas grandes, 2, null]
          - [aceite de oliva, 1, cucharada]
          - [sal, null, null]
          - [pimentón dulce, 0.5, cucharadita, optional]
    steps:
      - Pela las patatas y córtalas en bastones de 1 cm de grosor.
      - Déjalas en agua fría 10 minutos, escúrrelas y sécalas muy bien con un paño.
      - Mézclalas con el aceite y colócalas en la cesta sin amontonarlas.
      - Cocina a 200 °C durante 18-20 minutos, agitando la cesta a mitad de tiempo.
      - Sala nada más sacarlas y espolvorea el pimentón si quieres.

  - name: Alitas de pollo crujientes
    health: [YELLOW, "Las alitas tienen bastante piel y grasa, aunque sin freír en aceite. Mucha proteína; mejor con ensalada."]
    nutrition: [560, 46, 2, 40]
    photo: freidora-de-aire/alitas-de-pollo-crujientes.jpg
    category: Carnes
    difficulty: EASY
    prep: 5
    cook: 25
    servings: 2
    tags: [aperitivo, sin gluten]
    utensils: [Freidora de aire]
    ingredients:
      - items:
          - [alitas de pollo, 1, kg]
          - [ajo en polvo, 1, cucharadita]
          - [pimentón de la Vera, 1, cucharadita]
          - [aceite de oliva, 1, cucharada]
          - [sal, 1, cucharadita]
          - [pimienta negra, 0.5, cucharadita]
    steps:
      - Seca bien las alitas con papel de cocina.
      - Mézclalas con el aceite, el ajo en polvo, el pimentón, la sal y la pimienta.
      - Colócalas en la cesta en una sola capa y cocina a 180 °C durante 15 minutos.
      - Dales la vuelta, sube a 200 °C y cocina 8-10 minutos más, hasta que la piel esté dorada y crujiente.

  - name: Contramuslos de pollo al limón y romero
    health: [YELLOW, "Contramuslo con piel, más graso que la pechuga, con limón y hierbas. Sin freír en aceite resulta razonable."]
    nutrition: [380, 30, 2, 28]
    photo: freidora-de-aire/contramuslos-de-pollo-al-limon-y-romero.jpg
    category: Carnes
    difficulty: EASY
    prep: 5
    cook: 25
    servings: 4
    tags: [sin gluten]
    utensils: [Freidora de aire]
    ingredients:
      - items:
          - [contramuslos de pollo con piel, 4, null]
          - [limón, 1, null]
          - [ajo, 2, diente]
          - [romero fresco, 2, rama]
          - [aceite de oliva, 1, cucharada]
          - [sal, null, null]
          - [pimienta negra, null, null]
    steps:
      - Mezcla el aceite con el ajo picado, la ralladura y el zumo del limón, las hojas de romero, sal y pimienta.
      - Embadurna los contramuslos y, si tienes tiempo, déjalos marinar 30 minutos.
      - Colócalos con la piel hacia abajo y cocina a 190 °C durante 12 minutos.
      - Dales la vuelta y cocina 10-12 minutos más, hasta que la piel esté dorada y el jugo salga transparente.

  - name: Nuggets de pollo caseros
    health: [GREEN, "Pechuga magra empanada sin freír en aceite: mucha proteína y grasa moderada. Más sana que los nuggets comprados."]
    nutrition: [300, 34, 20, 9]
    photo: freidora-de-aire/nuggets-de-pollo-caseros.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 12
    servings: 4
    tags: [niños]
    utensils: [Freidora de aire]
    ingredients:
      - items:
          - [pechugas de pollo, 2, null]
          - [huevo, 1, null]
          - [pan rallado panko, 100, g]
          - [queso parmesano rallado, 30, g]
          - [pimentón dulce, 1, cucharadita]
          - [aceite de oliva en espray, null, null]
          - [sal, null, null]
    steps:
      - Corta el pollo en trozos del tamaño de un bocado y sálalo.
      - Mezcla el panko con el parmesano y el pimentón.
      - Pasa cada trozo por el huevo batido y después por el pan rallado, apretando para que se adhiera.
      - Colócalos en la cesta sin que se toquen y rocíalos con un poco de aceite.
      - Cocina a 200 °C durante 10-12 minutos, dándoles la vuelta a mitad de tiempo.

  - name: Salmón con costra de hierbas
    health: [GREEN, "Salmón rico en omega 3 con una costra ligera de pan y hierbas. Un plato muy equilibrado."]
    nutrition: [450, 36, 7, 31]
    category: Pescados y mariscos
