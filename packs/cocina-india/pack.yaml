      - "Fríe el comino en el aceite, añade la cebolla picada y dórala 6 minutos. Agrega el ajo, el jengibre y el chile picados."
      - "Añade los tomates picados y el chile en polvo y cocina 6 minutos. Incorpora la berenjena, sala y cocina 5 minutos más."
      - Termina con el garam masala y el cilantro. Sirve con chapatis.

  - name: Samosas de patata
    health: [RED, "Empanadillas fritas rellenas de patata: muy calóricas por la fritura y la masa."]
    nutrition: [380, 7, 48, 18]
    photo: cocina-india/samosas-de-patata.jpg
    category: Entrantes
    difficulty: HARD
    prep: 45
    cook: 30
    servings: 6
    notes: "Se fríen a fuego medio-bajo para que la masa quede crujiente y con burbujitas, sin dorarse demasiado rápido."
    tags: [vegano, frito, aperitivo]
    ingredients:
      - group: Masa
        items:
          - [harina de trigo, 250, g]
          - [semillas de ajwain o comino, 0.5, cucharadita]
          - [aceite, 4, cucharada]
          - [sal, 0.5, cucharadita]
          - [agua fría, 90, ml]
      - group: Relleno
        items:
          - [patatas, 600, g]
          - [guisantes, 100, g]
          - [aceite, 2, cucharada]
          - [comino en grano, 1, cucharadita]
          - [jengibre fresco rallado, 1, cucharada]
          - [chile verde, 1, null]
          - [cilantro molido, 2, cucharadita]
          - [garam masala, 1, cucharadita]
          - [amchur o zumo de limón, 1, cucharadita]
          - [sal, 1, cucharadita]
      - group: Para freír
        items:
          - [aceite de girasol, 1, l]
    steps:
      - "Mezcla la harina con el ajwain, la sal y el aceite frotando con los dedos. Añade el agua poco a poco y forma una masa firme. Tápala y déjala reposar 30 minutos."
      - "Cuece las patatas, pélalas y cháfalas en trozos. Fríe el comino en el aceite, añade el jengibre, el chile, los guisantes y las especias, y luego la patata. Sala y deja enfriar."
      - "Divide la masa en 6 bolas, estira cada una en un óvalo y córtalo por la mitad. Forma un cono con cada mitad sellando el borde con agua."
      - Rellena los conos y cierra la parte superior presionando bien.
      - "Fríe las samosas en aceite a 160 °C unos 12-15 minutos, hasta que estén doradas. Sírvelas con chutney de menta o de tamarindo."

  - name: Bhajis de cebolla
