name: Microondas
series: Electrodomésticos
family: microondas
description: >-
  El microondas sirve para mucho más que calentar: bizcocho en taza, huevos al plato, salmón y
  bacalao con verduras, flan de queso, risotto, brócoli con almendras, pollo al limón,
  berenjenas rellenas, mermelada exprés, natillas de chocolate y almendras garrapiñadas. Tiempos
  para un microondas de 800 W: con más potencia, acórtalos; con menos, alárgalos. Usa recipientes
  aptos y tapa con una tapa de microondas o film perforado.
author: Miga
authorGithub: calamares00
