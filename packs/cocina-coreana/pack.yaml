description: >-
  La cocina de Corea, picante, fermentada y para compartir: bibimbap, bulgogi, kimchi casero,
  japchae, kimbap, tteokbokki, guisos de kimchi y de tofu sedoso, samgyetang, pajeon de marisco,
  arroz frito con kimchi, dakgalbi, pollo frito coreano, galbi jjim, bossam, guarniciones (banchan)
  como la tortilla enrollada, los brotes de soja y el pepino aliñados y, de postre, hotteok y
  patbingsu. El gochujang y el gochugaru se encuentran en tiendas asiáticas.
