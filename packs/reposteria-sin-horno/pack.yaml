name: Repostería sin horno
series: Cocina de cada día
family: reposteria-sin-horno
description: >-
  Postres que se hacen en la nevera o en un cazo, sin encender el horno: tarta de queso fría,
  tarta de tres chocolates, tarta de limón, mousse de limón, tocino de cielo, copas de yogur con
  frutos rojos, bolitas de dátiles y cacao, barritas de cereales, crema de cacao y avellanas,
  tarta de fresas, vasitos de mango y yogur y peras al vino. Casi todos se preparan el día antes.
author: Miga
authorGithub: calamares00
