language: en
name: Cooking with kids
series: Everyday cooking
family: cocinar-con-ninos
description: >-
  Simple recipes to cook as a family, with jobs children can do on their own: oat and banana
  cookies, coconut balls, yoghurt ice lollies, strawberry milkshake, tuna stuffed eggs, pasta
  salad, chicken wraps, sandwich-bread pizzas, mini quiches, baked meatballs, salmon parcels and
  chocolate salami. Each recipe says what the child can do; the oven, sharp knives and the hob
  always with an adult.
author: Miga
authorGithub: calamares00
