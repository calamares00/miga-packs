    steps:
      - Marina el pollo con el ajo rallado, las especias, el aceite y un poco de sal 30 minutos.
      - Dora el pollo en la cazuela y retíralo. Pocha la cebolla en láminas 10 minutos.
      - Devuelve el pollo, añade el agua y las hierbas, tapa y cuece a fuego suave 40 minutos.
      - Añade la piel del limón en conserva en tiras y las aceitunas y cocina 10 minutos más, hasta que la salsa espese.

  - name: Pasta al pesto genovés
    health: [YELLOW, "Pasta con pesto de albahaca, piñones, queso y aceite de oliva. Muy sabroso, pero el pesto es calórico."]
    nutrition: [680, 19, 82, 32]
