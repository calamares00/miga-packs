name: "Cocina fusión: ítalo-peruana"
series: Cocina fusión
description: >-
  Lo que dejaron en la mesa peruana los inmigrantes ligures del siglo XIX, mezclado con ajíes,
  papas y quesos andinos: tallarines rojos, tallarines a la huancaína con lomo saltado, menestrón,
  pastel de acelga, ñoquis de papa amarilla y panetón.
