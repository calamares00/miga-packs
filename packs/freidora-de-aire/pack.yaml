          - [miel, 3, cucharada]
          - [mostaza, 2, cucharada]
          - [pimentón dulce, 1, cucharadita]
          - [ajo en polvo, 1, cucharadita]
          - [sal, 1, cucharadita]
    steps:
      - Corta las costillas en trozos que quepan en la cesta y frótalas con la sal, el pimentón y el ajo en polvo.
      - Cocina a 180 °C durante 20 minutos, dándoles la vuelta a mitad de tiempo.
      - Mezcla la miel con la mostaza y pinta las costillas por todos los lados.
      - Sube a 200 °C y cocina 8-10 minutos más, pintándolas otra vez a mitad de tiempo, hasta que estén caramelizadas.

