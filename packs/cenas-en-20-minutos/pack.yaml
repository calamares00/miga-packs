description: >-
  Cenas caseras que están en la mesa en 20 minutos o menos, con ingredientes de cualquier
  supermercado: tortillas, revueltos, pasta, pescado a la plancha, wok de pollo, cremas de
  verduras, ensaladas completas y pizzas exprés. Para los días en que no apetece complicarse.
