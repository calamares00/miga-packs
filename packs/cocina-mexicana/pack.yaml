      - Cocina 2-3 minutos por lado, hasta que el queso se funda y la tortilla esté dorada.
      - Sirve con salsa verde.

  - name: Chiles rellenos de queso
    health: [RED, "Chiles rellenos de queso, rebozados y fritos: mucha grasa."]
    nutrition: [480, 22, 18, 36]
    photo: cocina-mexicana/chiles-rellenos-de-queso.jpg
    category: Verduras
    difficulty: HARD
    prep: 40
    cook: 30
    servings: 4
    tags: [vegetariana, fritura]
    utensils: [Batidora]
    notes: Si no encuentras chiles poblanos, usa pimientos italianos verdes; quedan menos picantes.
    ingredients:
      - group: Chiles
        items:
          - [chiles poblanos, 4, null]
          - [queso fresco o Oaxaca, 250, g]
          - [huevos, 3, null]
          - [harina de trigo, 4, cucharada]
          - [aceite de girasol para freír, 300, ml]
          - [sal, null, null]
      - group: Caldillo de tomate
        items:
          - [tomates, 4, null]
          - [cebolla blanca, 0.25, null]
          - [ajo, 1, diente]
          - [caldo de verduras, 250, ml]
          - [aceite de oliva, 1, cucharada]
    steps:
      - group: Chiles
        items:
          - Asa los chiles directamente al fuego o bajo el grill hasta que la piel se ennegrezca. Mételos en una bolsa 10 minutos y pélalos.
          - Haz un corte lateral, retira las semillas con cuidado y rellena con el queso. Cierra con un palillo.
          - Monta las claras a punto de nieve, añade las yemas y una pizca de sal.
          - Pasa los chiles por harina y luego por el huevo, y fríelos en aceite caliente hasta que estén dorados. Escúrrelos.
      - group: Caldillo
        items:
          - Tritura el tomate con la cebolla, el ajo y el caldo. Cuécelo con el aceite 10 minutos y sala.
          - Sirve los chiles bañados en el caldillo caliente.

  - name: Carnitas
