  - name: Seven-vegetable couscous
    health: [GREEN, "Semolina with lots of vegetables and chickpeas: complete and high in fibre."]
    nutrition: [560, 28, 78, 15]
    photo: cocina-marroqui/cuscus-con-siete-verduras.jpg
    category: Pasta
    difficulty: MEDIUM
    prep: 30
    cook: 75
    servings: 6
    notes: The Friday couscous. The semolina is steamed over the stew in a couscoussier; with instant couscous, just soak it in the broth.
    tags: [couscous, vegetables, one-pot]
    utensils: [Steamer]
    ingredients:
      - items:
          - [lamb or beef in pieces, 600, g]
          - [medium-grain couscous, 500, g]
          - [cooked chickpeas, 400, g]
          - [onions, 2, null]
          - [tomatoes, 2, null]
          - [carrots, 3, null]
          - [turnips, 2, null]
          - [courgettes, 2, null]
          - [piece of pumpkin, 400, g]
          - [small cabbage, 0.5, null]
          - [ground ginger, 1, tsp]
          - [turmeric, 1, tsp]
          - [black pepper, 1, tsp]
          - [saffron threads, 1, pinch]
          - [bunch of coriander and parsley, 1, null]
          - [olive oil, 4, tbsp]
          - [butter, 40, g]
          - [salt, null, null]
    steps:
      - In the bottom of the couscoussier, sauté the meat with the onion, tomato, spices, oil and tied herbs for 10 minutes. Cover with 2 litres of water and simmer for 40 minutes.
      - Add the carrots, turnips and cabbage and cook for 15 minutes; then the courgette, pumpkin and chickpeas, 15 minutes more.
      - Meanwhile, moisten the couscous with a glass of salted water, rub it apart with your fingers and steam it in the top part for 15 minutes. Repeat twice more, moistening and fluffing between steamings.
      - Toss the couscous with the butter, mound it on a platter with the meat in the centre and the vegetables around, and spoon over broth.

  - name: Harira
    health: [GREEN, "Soup of pulses, tomato and meat: lots of fibre and protein."]
    nutrition: [340, 20, 46, 9]
    photo: cocina-marroqui/harira.jpg
    category: Soups
    difficulty: MEDIUM
    prep: 20
    cook: 75
    servings: 6
    notes: The soup that breaks the fast in Ramadan, with dates and chebakia. Soak the dried chickpeas the night before.
    tags: [soup, legumes, ramadan]
    utensils: [Pressure cooker]
    ingredients:
      - items:
          - [lamb or beef in small cubes, 250, g]
          - [soaked dried chickpeas, 150, g]
          - [lentils, 100, g]
          - [onion, 1, null]
          - [celery sticks, 2, null]
          - [crushed ripe tomatoes, 500, g]
          - [tomato paste, 2, tbsp]
          - [bunch of coriander and parsley chopped, 1, null]
          - [ground ginger, 1, tsp]
          - [turmeric, 1, tsp]
          - [ground cinnamon, 0.5, tsp]
          - [vermicelli, 50, g]
          - [flour, 3, tbsp]
          - [olive oil, 2, tbsp]
          - [lemons to serve, 2, null]
          - [salt, null, null]
    steps:
      - Sauté the meat with the chopped onion and celery, the spices, half the herbs and the oil for 5 minutes.
      - Add the chickpeas and 2 litres of water and simmer for 40 minutes (15 in a pressure cooker).
      - Add the lentils, tomato and tomato paste and simmer 30 minutes more.
      - Mix the flour with a glass of cold water and pour it in slowly while stirring to thicken. Add the vermicelli and the remaining herbs and cook for 5 minutes. Season.
      - Serve with lemon to squeeze over.

  - name: Chicken pastilla
    health: [RED, "Crisp pastry with chicken, almonds and sugar: very high in calories."]
    nutrition: [640, 32, 52, 34]
    photo: cocina-marroqui/pastela-de-pollo.jpg
    category: Breads and doughs
    difficulty: HARD
    prep: 45
    cook: 90
    servings: 8
    notes: Bastilla, the festive dish of Fez, sweet and savoury at once. Traditionally made with pigeon.
    tags: [celebration, oven, chicken]
    origin: Fez
    utensils: [Oven]
    ingredients:
      - group: For the filling
        items:
          - [chicken thighs, 1.2, kg]
          - [onions, 3, null]
          - [bunch of parsley and coriander chopped, 1, null]
          - [ground ginger, 1, tsp]
          - [ground cinnamon, 1, tsp]
          - [ras el hanout, 1, tsp]
          - [saffron threads, 1, pinch]
          - [eggs, 6, null]
          - [butter, 50, g]
          - [salt, null, null]
      - group: For the almonds and assembly
        items:
          - [blanched almonds, 250, g]
          - [icing sugar, 60, g]
          - [ground cinnamon for the almonds, 1, tsp]
          - [orange blossom water, 1, tbsp]
          - [warqa or brick pastry sheets, 12, null]
          - [melted butter for brushing, 80, g]
          - [icing sugar and cinnamon to decorate, null, null]
    steps:
      - Cook the chicken with the grated onion, spices, herbs, butter and a glass of water, covered, for 1 hour. Take out the chicken and shred it without skin or bones.
      - Reduce the sauce by half, add the beaten eggs and stir over low heat until they set in curds. Drain.
      - Fry or toast the almonds, chop them coarsely and mix with the sugar, cinnamon and orange blossom water.
      - Heat the oven to 180 °C. Line a round tin with 8 buttered pastry sheets, overlapping and hanging over the edge.
      - Layer egg, chicken and almonds, fold the overhanging sheets over, top with 4 more buttered sheets and tuck the edges underneath.
      - Bake for 30 minutes, until golden. Decorate with icing sugar and lines of cinnamon.

  - name: Lamb tagine with prunes
    health: [YELLOW, "Lamb with dried fruit and honey: protein and iron, but sweet and with fat."]
    nutrition: [620, 38, 46, 32]
    photo: cocina-marroqui/tajin-de-cordero-con-ciruelas.jpg
    category: Meat
    difficulty: MEDIUM
    prep: 20
    cook: 120
    servings: 6
    notes: The festive tagine, topped with fried almonds and sesame. A heavy-based casserole works too.
    tags: [tagine, lamb, celebration]
    utensils: []
    ingredients:
      - items:
          - [lamb shoulder or neck in pieces, 1.5, kg]
          - [onions, 2, null]
          - [prunes, 250, g]
          - [honey, 3, tbsp]
          - [cinnamon stick, 1, null]
          - [ground cinnamon, 1, tsp]
          - [ground ginger, 1, tsp]
          - [saffron threads, 1, pinch]
          - [butter, 30, g]
          - [olive oil, 3, tbsp]
          - [blanched almonds, 80, g]
          - [toasted sesame seeds, 1, tbsp]
          - [salt, null, null]
    steps:
      - Put the lamb in the tagine or casserole with the grated onion, spices, oil, butter, salt and a glass of water. Cover and simmer gently for 1½ hours, until tender.
      - Soak the prunes in warm water for 15 minutes and cook them separately with the honey, cinnamon stick and a little of the stew liquid until glazed.
      - Fry the almonds in a little oil until golden.
      - Reduce the lamb sauce if very thin and serve topped with the prunes, almonds and sesame.

  - name: Kefta tagine with eggs
    health: [YELLOW, "Meatballs in tomato sauce with egg: lots of protein, some fat."]
    nutrition: [480, 34, 12, 33]
    category: Meat
    difficulty: EASY
    prep: 20
    cook: 35
    servings: 4
    notes: Eaten straight from the tagine, scooping with khobz bread.
    tags: [tagine, meatballs, eggs]
    utensils: []
    ingredients:
      - group: For the kefta
        items:
          - [minced beef and lamb, 500, g]
          - [small grated onion, 1, null]
          - [chopped parsley and coriander, 3, tbsp]
          - [ground cumin, 1, tsp]
          - [sweet paprika, 1, tsp]
          - [salt, null, null]
      - group: For the sauce
        items:
          - [grated ripe tomatoes, 800, g]
          - [garlic cloves, 3, null]
          - [ground cumin for the sauce, 1, tsp]
          - [sweet paprika for the sauce, 1, tsp]
          - [chilli, 1, pinch, optional]
          - [olive oil, 3, tbsp]
          - [eggs, 4, null]
    steps:
      - Mix the kefta ingredients and shape into walnut-sized meatballs.
      - In the tagine or a deep frying pan, simmer the tomato with the chopped garlic, spices, oil and salt for 15 minutes.
      - Add the meatballs and cook, covered, for 15 minutes.
      - Crack the eggs on top, cover and leave for 5 minutes, until the whites set. Sprinkle with parsley.

  - name: Fish tagine
    health: [GREEN, "White fish with vegetables and chermoula: lots of protein and little fat."]
    nutrition: [380, 34, 28, 14]
    photo: cocina-marroqui/tajin-de-pescado.jpg
    category: Fish and seafood
    difficulty: MEDIUM
    prep: 30
    cook: 40
    servings: 4
    notes: Chermoula is the herb and spice marinade of the Moroccan coast. Marinate the fish for at least 1 hour.
    tags: [tagine, fish, gluten-free]
    utensils: []
    ingredients:
      - group: For the chermoula
        items:
          - [bunch of coriander and parsley, 1, null]
          - [garlic cloves, 4, null]
          - [ground cumin, 1, tsp]
          - [sweet paprika, 2, tsp]
          - [lemon juice, 1, null]
          - [olive oil, 5, tbsp]
          - [salt, null, null]
      - group: For the tagine
        items:
          - ["white fish steaks (hake, meagre or sea bream)", 1, kg]
          - [potatoes, 3, null]
          - [tomatoes, 3, null]
          - [green pepper, 1, null]
          - [carrot, 1, null]
          - [green olives, 80, g]
          - [preserved lemon, 1, null]
    steps:
      - Blend the chermoula ingredients and marinate the fish in half of it for at least 1 hour.
      - Layer thin slices of potato and carrot in the base of the tagine, then the tomato and pepper strips, and pour over the rest of the chermoula and half a glass of water.
      - Cover and cook gently for 20 minutes.
      - Lay the fish on top with the olives and strips of preserved lemon, cover and cook 15 minutes more.

  - name: Zaalouk
    health: [GREEN, "Aubergine and tomato with spices and olive oil: light and with fibre."]
    nutrition: [150, 3, 14, 10]
