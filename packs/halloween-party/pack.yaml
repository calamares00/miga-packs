description: >-
  Recipes for a Halloween party, with pumpkin and plenty of fun to make with the kids: pumpkin and
  sweet potato soup, sausage mummies, spiderweb pizza, spider deviled eggs, witch fingers, banana
  ghosts, clementine pumpkins, graveyard brownies, candy apples, pumpkin bread, spiced pumpkin
  cookies and witch's brew punch. Ask about allergies, and take care with hot caramel and whole
  olives around little ones.
