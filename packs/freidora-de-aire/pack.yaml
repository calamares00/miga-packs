      - Pásalas por harina, luego por el huevo batido y por último por el panko mezclado con el ajo en polvo.
      - Colócalas en la cesta en una sola capa y rocíalas con aceite.
      - Cocina a 200 °C durante 7-8 minutos, dándoles la vuelta a mitad de tiempo.
      - Sirve con la mayonesa mezclada con la sriracha.

  - name: Varitas de merluza caseras
    health: [GREEN, "Pescado blanco empanado sin freír en aceite. Mucha proteína y poca grasa; buena opción para niños."]
    nutrition: [300, 30, 30, 6]
