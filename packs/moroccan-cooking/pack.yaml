          - [oil for frying, null, null]
    steps:
      - Crumble the cheeses and mix with the egg, herbs and cumin.
      - Cut the pastry sheets into 6 cm wide strips.
      - Put a teaspoon of filling at one end and fold into triangles to the end of the strip. Seal with a little egg.
      - Fry in hot oil until golden and drain on paper.

  - name: Rfissa
    health: [YELLOW, "Chicken with lentils over msemen: complete, but heavy."]
    nutrition: [690, 42, 62, 30]
    photo: cocina-marroqui/rfissa.jpg
    category: Meat
    difficulty: HARD
    prep: 30
    cook: 90
    servings: 6
    notes: A celebration dish made after a birth. Use day-old msemen. Fenugreek is the spice that gives its aroma.
    tags: [chicken, legumes, celebration]
    utensils: []
    ingredients:
      - items:
          - [free-range chicken in pieces, 1.5, kg]
          - [day-old msemen or trid, 8, null]
          - [lentils, 150, g]
          - [soaked fenugreek seeds, 2, tbsp]
          - [onions, 3, null]
          - [ras el hanout, 2, tsp]
          - [ground ginger, 1, tsp]
          - [saffron threads, 1, pinch]
          - [bunch of coriander and parsley, 1, null]
          - [butter, 30, g]
          - [olive oil, 4, tbsp]
          - [salt, null, null]
    steps:
      - Sauté the chicken with the sliced onion, spices, oil, butter and tied herbs for 10 minutes.
      - Add the fenugreek, lentils and 1.5 litres of water and simmer, covered, for 1 hour, until the chicken is tender.
      - Tear the msemen into strips and warm them over steam for 10 minutes.
      - Arrange the msemen on a platter, pour over plenty of broth and top with the chicken and lentils.

  - name: Lamb mechoui
    health: [YELLOW, "Lamb roasted with butter and spices: lots of protein and fat."]
    nutrition: [620, 46, 1, 48]
    photo: cocina-marroqui/mechui-de-cordero.jpg
    category: Meat
    difficulty: MEDIUM
    prep: 15
    cook: 240
    servings: 6
    notes: The roast lamb of celebrations. Served with cumin and salt for dipping, and eaten with your hands.
    tags: [lamb, oven, celebration, gluten-free]
    utensils: [Oven]
    ingredients:
      - items:
          - [lamb shoulders, 2, null]
          - [soft butter, 80, g]
          - [garlic cloves, 4, null]
          - [ground cumin, 2, tsp]
          - [sweet paprika, 2, tsp]
          - [saffron threads, 1, pinch]
          - [salt, null, null]
          - [cumin and salt to serve, null, null]
    steps:
      - Mix the butter with the crushed garlic, spices and salt.
      - Make a few cuts in the meat and rub it well with the butter. Leave for 1 hour.
      - Roast at 160 °C in a dish with a glass of water, covered with foil, for 3 hours, basting now and then.
      - Uncover, raise to 220 °C and roast 30 minutes more, until the skin is crisp and the meat comes off the bone.

  - name: Kefta skewers
    health: [YELLOW, "Grilled minced meat: lots of protein, with the fat of the meat."]
    nutrition: [380, 28, 4, 28]
    photo: cocina-marroqui/pinchos-de-kefta.jpg
    category: Meat
    difficulty: EASY
    prep: 20
    cook: 10
    servings: 4
    notes: The street-stall skewers. Stuff them into khobz with Moroccan salad.
    tags: [barbecue, minced meat, gluten-free]
    utensils: [Barbecue]
    ingredients:
      - items:
          - [minced beef and lamb, 600, g]
          - [small onion grated and squeezed, 1, null]
          - [chopped parsley and coriander, 4, tbsp]
          - [ground cumin, 1, tsp]
          - [sweet paprika, 1, tsp]
          - [ground cinnamon, 1, pinch]
          - [salt, 1, tsp]
    steps:
      - Mix and knead all the ingredients well. Rest in the fridge for 30 minutes.
      - Mould the meat around flat skewers into long sausages.
      - Grill on a very hot barbecue or griddle for 8-10 minutes, turning.

  - name: Msemen
    health: [YELLOW, "Flaky semolina and flour flatbread with butter: high in calories."]
    nutrition: [280, 6, 40, 11]
    photo: cocina-marroqui/msemen.jpg
    category: Breads and doughs
    difficulty: MEDIUM
    prep: 40
    cook: 20
    servings: 8
    notes: The square breakfast flatbreads, with honey and butter or with fresh cheese.
    tags: [bread, breakfast, vegetarian]
    utensils: [Griddle]
    ingredients:
      - items:
          - [plain flour, 300, g]
          - [fine semolina, 100, g]
          - [salt, 1, tsp]
          - [sugar, 1, tsp]
          - [warm water, 250, ml]
          - [oil, 60, ml]
          - [soft butter, 50, g]
          - [fine semolina for sprinkling, 3, tbsp]
    steps:
      - Knead the flour, semolina, salt, sugar and water for 10 minutes, until very elastic. Divide into 8 balls, oil them and rest for 15 minutes.
      - With oiled hands, stretch each ball until very thin and translucent. Spread with butter and sprinkle with semolina.
      - Fold the sides into the centre in thirds, then top to bottom, into a square. Flatten with your hand.
      - Cook on the griddle over medium heat for 3-4 minutes per side, until golden and flaky.

  - name: Khobz
    health: [GREEN, "Flour and semolina bread: simple carbohydrates, hardly any fat."]
    nutrition: [210, 7, 42, 2]
    photo: cocina-marroqui/khobz.jpg
    category: Breads and doughs
    difficulty: EASY
    prep: 20
    cook: 25
    servings: 8
    notes: The round, flat everyday bread, for scooping up tagines and salads.
    tags: [bread, vegan]
    utensils: [Oven, Stand mixer]
    ingredients:
      - items:
          - [plain flour, 400, g]
          - [fine semolina, 100, g]
          - [dried yeast, 7, g]
          - [salt, 1.5, tsp]
          - [sugar, 1, tsp]
          - [warm water, 320, ml]
          - [olive oil, 1, tbsp]
          - [anise or sesame seeds, 1, tbsp, optional]
    steps:
      - Knead all the ingredients for 10 minutes, until smooth.
      - Divide into 2 balls, flatten into 2 cm thick discs on a tray dusted with semolina, cover and leave to rise for 1 hour.
      - Heat the oven to 220 °C. Prick the loaves with a fork.
      - Bake for 20-25 minutes, until golden and hollow-sounding underneath.

  - name: Baghrir
    health: [YELLOW, "Semolina pancakes with honey and butter: sweet."]
    nutrition: [290, 6, 48, 9]
    photo: cocina-marroqui/baghrir.jpg
    category: Breads and doughs
    difficulty: MEDIUM
    prep: 15
    cook: 30
    servings: 6
    notes: The thousand-hole pancakes. Cooked on one side only, without flipping, in a non-stick pan.
    tags: [breakfast, snack, vegetarian]
    utensils: [Blender]
    ingredients:
      - items:
          - [fine semolina, 250, g]
          - [plain flour, 50, g]
          - [dried yeast, 7, g]
          - [baking powder, 1, tsp]
          - [sugar, 1, tbsp]
          - [salt, 1, pinch]
          - [warm water, 550, ml]
          - [honey, 4, tbsp]
          - [butter, 40, g]
    steps:
      - Blend everything except the honey and butter for 2 minutes into a smooth, runny batter. Rest for 30 minutes, until bubbly.
      - Heat a non-stick pan over medium heat without fat and pour in a ladle of batter.
      - Cook on one side only for 2 minutes, until the surface is full of holes and dry.
      - Melt the honey with the butter and pour over the pancakes to serve.

  - name: Chebakia
    health: [RED, "Fried sesame biscuits soaked in honey: very sweet."]
    nutrition: [150, 3, 18, 8]
    photo: cocina-marroqui/chebakia.jpg
    category: Desserts
    difficulty: HARD
    prep: 60
    cook: 30
    servings: 30
    notes: The Ramadan sweet, shaped like a flower. Servings are pieces. Keeps for weeks in a tin.
    tags: [dessert, fried, ramadan]
    utensils: []
    ingredients:
      - items:
          - [plain flour, 500, g]
          - [toasted ground sesame seeds, 150, g]
          - [sesame seeds to decorate, 50, g]
          - [ground anise, 1, tsp]
          - [ground cinnamon, 1, tsp]
          - [saffron threads, 1, pinch]
          - [egg, 1, null]
          - [melted butter, 60, g]
          - [vinegar, 2, tbsp]
          - [orange blossom water, 60, ml]
          - [dried yeast, 1, tsp]
          - [honey, 1, kg]
          - [oil for frying, null, null]
    steps:
      - Mix the flour with the ground sesame, spices, egg, butter, vinegar, orange blossom water and yeast and knead into a firm dough. Rest for 30 minutes.
      - Roll thinly and cut 8 x 6 cm rectangles. Make 4 parallel cuts inside each rectangle without reaching the edges.
      - Thread alternate strips over a finger, pinch the corners together and turn inside out to form the flower.
      - Fry over medium heat until golden and transfer straight into the hot honey for 5 minutes.
      - Drain and sprinkle with sesame.

  - name: Gazelle horns
    health: [RED, "Pastries filled with almond and sugar: sweet and rich."]
    nutrition: [130, 3, 15, 7]
    photo: cocina-marroqui/cuernos-de-gacela.jpg
    category: Desserts
    difficulty: HARD
    prep: 60
    cook: 15
    servings: 30
    notes: Kaab el ghzal, the fine pastry served with tea for guests. Servings are pieces.
    tags: [dessert, almond]
    utensils: [Oven, Food processor]
    ingredients:
      - group: For the almond paste
