  - name: Menemen
    health: [GREEN, "Huevos revueltos con tomate y pimiento: proteína y verdura, poca grasa."]
    nutrition: [240, 13, 10, 16]
    photo: cocina-turca/menemen.jpg
    category: Huevos
    difficulty: EASY
    prep: 10
    cook: 15
    servings: 3
    notes: El desayuno turco por excelencia. Se sirve en la misma sartén, con pan para mojar.
    tags: [huevos, desayuno, vegetariana, sin gluten, rápida]
    utensils: []
    ingredients:
      - items:
          - [huevos, 4, null]
          - [tomates maduros, 4, null]
          - [pimientos verdes alargados, 2, null]
          - [cebolla pequeña, 1, null, optional]
          - [mantequilla o aceite de oliva, 2, cucharada]
          - [copos de pimiento rojo (pul biber), 1, cucharadita]
          - [sal, null, null]
    steps:
      - Pocha los pimientos y la cebolla picados en la mantequilla 5 minutos.
      - Añade los tomates pelados y troceados y cuece 5-8 minutos, hasta que suelten el agua y se espese.
      - Añade los huevos batidos con sal y remueve suavemente lo justo para que cuajen jugosos.
      - Espolvorea el pul biber y sirve enseguida.

  - name: Huevos çılbır
    health: [YELLOW, "Huevos escalfados sobre yogur con mantequilla especiada: proteína y algo de grasa."]
    nutrition: [320, 18, 8, 24]
    photo: cocina-turca/huevos-clbr.jpg
    category: Huevos
    difficulty: MEDIUM
    prep: 10
    cook: 10
    servings: 2
    notes: Plato de los sultanes otomanos. El yogur debe estar a temperatura ambiente.
    tags: [huevos, desayuno, vegetariana, sin gluten]
    utensils: []
    ingredients:
      - items:
          - [huevos, 4, null]
          - [yogur griego, 250, g]
          - [diente de ajo, 1, null]
          - [mantequilla, 30, g]
          - [copos de pimiento rojo (pul biber), 1, cucharadita]
          - [eneldo o menta, 1, cucharada]
          - [vinagre, 1, cucharada]
          - [sal, null, null]
    steps:
      - Mezcla el yogur con el ajo machacado y una pizca de sal y repártelo en dos platos.
      - Escalfa los huevos 3 minutos en agua a punto de hervir con el vinagre y colócalos sobre el yogur.
      - Funde la mantequilla con el pul biber hasta que se ponga roja y riega los huevos.
      - Espolvorea las hierbas y sirve con pan.

  - name: Lahmacun
    health: [YELLOW, "Masa fina con carne picada y verduras: equilibrada, algo calórica."]
    nutrition: [420, 22, 54, 13]
    photo: cocina-turca/lahmacun.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 40
    cook: 15
    servings: 6
    notes: Se sirve con perejil, cebolla y limón por encima y se enrolla para comer.
    tags: [masa, carne picada, horno]
    utensils: [Horno, Robot de cocina]
    ingredients:
      - group: Para la masa
        items:
          - [harina de trigo, 400, g]
          - [levadura seca de panadería, 5, g]
          - [agua templada, 240, ml]
          - [aceite de oliva, 1, cucharada]
          - [sal, 1, cucharadita]
      - group: Para la cobertura
        items:
          - [carne picada de cordero o ternera, 300, g]
          - [cebolla, 1, null]
          - [pimiento rojo, 1, null]
          - [tomate, 1, null]
          - [dientes de ajo, 2, null]
          - [pasta de pimiento rojo o concentrado de tomate, 1, cucharada]
          - [perejil picado, 3, cucharada]
          - [comino molido, 1, cucharadita]
          - [copos de pimiento rojo (pul biber), 1, cucharadita]
          - [sal, null, null]
      - group: Para servir
        items:
          - [cebolla roja en juliana, 1, null]
          - [perejil, null, null]
          - [limones, 2, null]
    steps:
      - Amasa los ingredientes de la masa 10 minutos y déjala levar tapada 1 hora.
      - Pica muy fino la cebolla, el pimiento, el tomate y el ajo en el robot y mézclalo con la carne, la pasta de pimiento, el perejil y las especias.
      - Precalienta el horno a 250 °C con la bandeja dentro. Divide la masa en 6 bolas y estíralas en óvalos muy finos.
      - Extiende una capa fina de carne hasta el borde y hornea cada lahmacun 6-8 minutos, hasta que el borde esté crujiente.
      - Sirve con cebolla, perejil y limón y enróllalo.

  - name: Pide de carne
    health: [YELLOW, "Pan en forma de barca con carne y verduras: completo y calórico."]
    nutrition: [520, 26, 60, 19]
    photo: cocina-turca/pide-de-carne.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 40
    cook: 15
    servings: 4
    notes: La pizza turca, en forma de barca. Se puede rellenar también de queso o de huevo.
    tags: [masa, carne picada, horno]
    origin: Mar Negro
    utensils: [Horno]
    ingredients:
      - group: Para la masa
        items:
          - [harina de trigo, 400, g]
          - [levadura seca de panadería, 7, g]
          - [agua templada, 220, ml]
          - [yogur natural, 2, cucharada]
          - [aceite de oliva, 2, cucharada]
          - [azúcar, 1, cucharadita]
          - [sal, 1, cucharadita]
      - group: Para el relleno
        items:
          - [carne picada de ternera, 400, g]
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [tomates, 2, null]
          - [perejil picado, 2, cucharada]
          - [copos de pimiento rojo (pul biber), 1, cucharadita]
          - [mantequilla derretida, 30, g]
          - [sal, null, null]
    steps:
      - Amasa los ingredientes de la masa y déjala levar 1 hora.
      - Saltea la carne con la cebolla, el pimiento y el tomate picados 10 minutos, hasta que se seque. Añade el perejil, las especias y la sal.
      - Precalienta el horno a 240 °C. Divide la masa en 4, estírala en óvalos alargados, reparte el relleno y dobla los bordes hacia dentro, pellizcando las puntas para formar barcas.
      - Hornea 12-15 minutos y pinta los bordes con mantequilla al salir.

  - name: Börek de espinacas y queso
    health: [YELLOW, "Láminas de masa con espinacas y queso: verdura con bastante grasa."]
    nutrition: [420, 15, 32, 26]
    photo: cocina-turca/borek-de-espinacas-y-queso.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 30
    cook: 40
    servings: 6
    notes: Se hace con yufka; la pasta filo es la alternativa más fácil de encontrar.
    tags: [horno, verduras, vegetariana]
    utensils: [Horno]
    ingredients:
      - items:
          - [láminas de pasta filo o yufka, 12, null]
          - [espinacas frescas, 500, g]
          - [cebolla, 1, null]
          - [queso feta o beyaz peynir, 200, g]
          - [huevos, 2, null]
          - [leche, 150, ml]
          - [yogur natural, 100, g]
          - [aceite de oliva, 80, ml]
          - [semillas de sésamo o de comino negro, 1, cucharada]
          - [sal, null, null]
    steps:
      - Pocha la cebolla en un poco de aceite, añade las espinacas picadas y cocina hasta que pierdan el agua. Escurre bien y mezcla con el queso desmenuzado.
      - Bate los huevos con la leche, el yogur, el resto del aceite y una pizca de sal.
      - Precalienta el horno a 190 °C. En una fuente engrasada pon capas de 2 láminas pintadas con la mezcla de huevo y, cada 4 láminas, una capa de relleno.
      - Termina con láminas, pinta con el resto de la mezcla y espolvorea las semillas.
      - Hornea 35-40 minutos, hasta que esté dorado. Deja reposar 10 minutos antes de cortar.

  - name: Simit
    health: [YELLOW, "Rosca de pan con melaza y sésamo: hidratos, algo de azúcar."]
    nutrition: [310, 9, 52, 7]
    photo: cocina-turca/simit.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 30
    cook: 20
    servings: 8
    notes: La rosca de sésamo de los puestos callejeros de Estambul. La melaza de uva (pekmez) le da el color.
    tags: [pan, desayuno, vegana]
    origin: Estambul
    utensils: [Horno, Amasadora]
    ingredients:
      - items:
          - [harina de trigo, 500, g]
          - [levadura seca de panadería, 7, g]
          - [agua templada, 300, ml]
          - [aceite de oliva, 2, cucharada]
          - [azúcar, 1, cucharadita]
          - [sal, 1.5, cucharadita]
          - [melaza de uva o miel de caña, 100, ml]
          - [agua para la melaza, 150, ml]
          - [semillas de sésamo, 200, g]
    steps:
      - Amasa la harina, la levadura, el agua, el aceite, el azúcar y la sal 10 minutos y deja levar 1 hora.
      - Divide la masa en 8 porciones, forma con cada una dos cordones de 50 cm, retuércelos juntos y cierra en forma de rosca.
      - Mezcla la melaza con el agua, pasa por ella las roscas y rebózalas en el sésamo tostado.
      - Deja reposar 15 minutos y hornea a 220 °C 15-20 minutos, hasta que estén muy doradas.

  - name: Mantı
    health: [YELLOW, "Pasta rellena de carne con yogur y mantequilla: completa y calórica."]
    nutrition: [560, 28, 58, 23]
    photo: cocina-turca/mant.jpg
    category: Pastas
    difficulty: HARD
    prep: 90
    cook: 15
    servings: 4
    notes: Los raviolis turcos de Kayseri; cuanto más pequeños, más habilidad tiene quien los hace. Se pueden congelar crudos.
    tags: [pasta, carne picada]
    origin: Kayseri
    utensils: []
    ingredients:
      - group: Para la masa
        items:
          - [harina de trigo, 300, g]
          - [huevo, 1, null]
          - [agua, 100, ml]
          - [sal, 1, cucharadita]
      - group: Para el relleno
        items:
          - [carne picada de ternera o cordero, 250, g]
          - [cebolla pequeña rallada, 1, null]
          - [perejil picado, 2, cucharada]
          - [sal y pimienta, null, null]
      - group: Para servir
        items:
          - [yogur natural, 400, g]
          - [dientes de ajo, 2, null]
          - [mantequilla, 50, g]
          - [concentrado de tomate, 1, cucharada]
          - [copos de pimiento rojo (pul biber), 1, cucharadita]
          - [menta seca, 1, cucharadita]
    steps:
      - Amasa la harina con el huevo, el agua y la sal hasta tener una masa firme y lisa. Deja reposar 30 minutos.
      - Mezcla los ingredientes del relleno.
      - Estira la masa muy fina y córtala en cuadrados de 3 cm. Pon una bolita de relleno en cada uno y une las cuatro puntas en un saquito.
      - Cuece los mantı en agua con sal 8-10 minutos.
      - Sirve con el yogur mezclado con el ajo y riega con la mantequilla fundida con el tomate, el pul biber y la menta.

  - name: İskender kebab
    health: [RED, "Carne con pan, salsa de tomate, mantequilla y yogur: muy calórico."]
    nutrition: [720, 42, 46, 40]
    photo: cocina-turca/iskender-kebab.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 25
    servings: 4
    notes: Creado en Bursa. En casa se hace con filetes muy finos de ternera en lugar de carne de döner.
    tags: [kebab, ternera]
    origin: Bursa
    utensils: []
    ingredients:
      - items:
          - [filetes muy finos de ternera o cordero, 600, g]
          - [pan de pide o de pita, 2, null]
          - [tomate triturado, 400, g]
          - [concentrado de tomate, 1, cucharada]
          - [mantequilla, 80, g]
          - [yogur natural espeso, 400, g]
          - [aceite de oliva, 2, cucharada]
          - [comino molido, 1, cucharadita]
          - [sal, null, null]
    steps:
      - Corta la carne en tiras finas, aliña con el comino, la sal y el aceite y saltéala a fuego muy fuerte por tandas.
      - Cuece el tomate con el concentrado, una cucharada de mantequilla y sal 10 minutos.
      - Corta el pan en dados, tuéstalo y repártelo en los platos. Riégalo con un poco de salsa de tomate.
      - Pon la carne encima, cubre con más salsa y, al servir, riega con la mantequilla restante fundida y muy caliente. Acompaña con el yogur.

  - name: Adana kebab
    health: [YELLOW, "Carne picada de cordero a la brasa: mucha proteína y bastante grasa."]
    nutrition: [460, 30, 6, 35]
    photo: cocina-turca/adana-kebab.jpg
