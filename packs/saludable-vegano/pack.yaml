description: >-
  Platos 100 % vegetales y completos, con legumbres, tofu, cereales integrales y frutos secos para
  no quedarse corto de proteína: tofu salteado con brócoli, boloñesa de lentejas, chili sin carne,
  bol de quinoa y garbanzos, tacos de coliflor asada, hamburguesas de lentejas, curry de verduras
  con coco, ensalada de fideos de arroz con tofu, guiso de alubias blancas y mousse de chocolate y
  aguacate.
