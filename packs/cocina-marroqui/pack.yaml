      - Tritura todos los ingredientes menos la miel y la mantequilla con la batidora 2 minutos, hasta tener una masa líquida y lisa. Deja reposar 30 minutos, hasta que tenga burbujas.
      - Calienta una sartén antiadherente a fuego medio sin grasa y vierte un cucharón de masa.
      - Cocina solo por un lado 2 minutos, hasta que la superficie se llene de agujeros y quede seca.
      - Funde la miel con la mantequilla y riega las tortitas al servir.

