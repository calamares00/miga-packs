description: >-
  La cocina de las regiones de Colombia: bandeja paisa, frijoles antioqueños, ajiaco santafereño,
  sancocho, arepas, empanadas, patacones, hogao, ají, arroz con pollo, changua, pandebono,
  buñuelos, natilla, posta negra cartagenera, mote de queso, arroz con coco, cazuela de mariscos,
  sobrebarriga y limonada de coco. Con equivalencias para los ingredientes menos habituales fuera
  de Colombia.
