  - name: Crème brûlée
    health: [RED, "Nata, yemas y azúcar: un postre muy calórico."]
    nutrition: [420, 5, 26, 33]
    photo: cocina-francesa/creme-brulee.jpg
    category: Postres
    difficulty: MEDIUM
    prep: 15
    cook: 45
    servings: 6
    notes: Hace falta un soplete para caramelizar el azúcar. Necesita al menos 4 horas de nevera.
    tags: [postre, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [nata para montar, 500, ml]
          - [vaina de vainilla, 1, null]
          - [yemas de huevo, 6, null]
          - [azúcar, 80, g]
          - [azúcar moreno para caramelizar, 6, cucharada]
    steps:
      - Precalienta el horno a 150 °C. Calienta la nata con la vainilla abierta y deja infusionar 15 minutos.
      - Bate las yemas con el azúcar, añade la nata colada poco a poco y quita la espuma.
      - Reparte en cazuelitas y hornéalas al baño maría 35-40 minutos, hasta que estén cuajadas pero tiemblen en el centro.
      - Enfría y refrigera 4 horas. Antes de servir, espolvorea el azúcar moreno y caramelízalo con el soplete.

  - name: Profiteroles con chocolate
    health: [RED, "Pasta choux con nata o helado y chocolate: muy dulce."]
    nutrition: [430, 7, 34, 30]
