      - Chop the lettuce and spread it on a platter. Arrange each ingredient on top in a row.
      - Mix the vinaigrette ingredients, drizzle over the salad and sprinkle with the chives.

  - name: Deviled eggs
    health: [YELLOW, "Eggs with a filling of yolk and mayonnaise: protein, though the mayonnaise adds fat."]
    nutrition: [130, 6, 1, 11]
    photo: cocina-estadounidense/huevos-rellenos-a-la-diabla.jpg
    category: Eggs
    difficulty: EASY
    prep: 15
    cook: 12
    servings: 6
    notes: A must at family gatherings and picnics.
    tags: [snack, gluten-free]
    ingredients:
      - items:
          - [eggs, 6, null]
          - [mayonnaise, 3, tbsp]
          - [mustard, 1, tsp]
          - [cider vinegar, 1, tsp]
          - [salt, null, null]
          - [paprika, null, null]
          - [chopped chives, 1, tbsp]
    steps:
      - Boil the eggs for 10-11 minutes, cool them in iced water and peel.
      - Halve them lengthways and scoop out the yolks.
      - Mash the yolks with the mayonnaise, mustard, vinegar and salt until smooth.
      - Pipe or spoon the filling into the whites and sprinkle with paprika and chives.

  - name: Boston baked beans
    health: [YELLOW, "Beans with plenty of fibre and protein, but with bacon, molasses and sugar."]
    nutrition: [380, 17, 52, 12]
    photo: cocina-estadounidense/alubias-al-horno-de-boston.jpg
    category: Legumes
    difficulty: EASY
    prep: 15
    cook: 300
    servings: 8
    origin: Boston
    notes: Soak the beans the night before. Molasses gives them their colour and sweet flavour.
    tags: [stew, baked]
    utensils: [Oven]
    ingredients:
      - items:
          - [dried navy or haricot beans, 450, g]
          - [bacon or salt pork, 150, g]
          - [onion, 1, null]
          - [molasses, 80, ml]
          - [brown sugar, 2, tbsp]
          - [mustard powder, 1, tsp]
          - [salt, 1, tsp]
          - [black pepper, 0.5, tsp]
    steps:
      - Simmer the drained beans in water for 1 hour, until the skins split when you blow on them. Drain, keeping the water.
      - Preheat the oven to 150 °C. Put half the bacon, the whole onion and the beans in a casserole and top with the rest of the bacon.
      - Mix the molasses, sugar, mustard, salt and pepper with 500 ml of the hot cooking water and pour over the beans.
      - Cover and bake for 4 hours, adding water if they dry out. Uncover for the last hour so they brown.

