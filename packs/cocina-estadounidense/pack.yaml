recipes:

  - name: Macarrones con queso
    health: [RED, "Pasta con salsa de queso cheddar, mantequilla y leche entera: mucha grasa saturada y calorías."]
    nutrition: [780, 32, 75, 38]
    photo: cocina-estadounidense/macarrones-con-queso.jpg
    category: Pastas
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    notes: En inglés, mac and cheese. El queso se añade fuera del fuego para que la salsa no se corte.
    tags: [pasta, al horno, niños]
    utensils: [Horno]
    ingredients:
      - items:
          - [macarrones, 300, g]
          - [mantequilla, 40, g]
          - [harina, 30, g]
          - [leche entera, 700, ml]
          - [queso cheddar rallado, 250, g]
          - [mostaza en polvo, 0.5, cucharadita]
          - [pimentón dulce, 0.5, cucharadita]
          - [pan rallado, 30, g]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 190 °C. Cuece la pasta 2 minutos menos de lo indicado y escúrrela.
      - Derrite la mantequilla, añade la harina y cocina 1 minuto. Incorpora la leche poco a poco, removiendo, y cuece hasta que espese.
      - Fuera del fuego, añade la mostaza, el pimentón, la sal y 200 g de cheddar y remueve hasta que se funda.
      - Mezcla con la pasta, pásala a una fuente y cubre con el resto del queso y el pan rallado.
      - Hornea 20 minutos, hasta que esté dorado y burbujeante.

  - name: Cerdo desmenuzado
    health: [YELLOW, "Paletilla de cerdo cocinada lentamente con salsa dulce: mucha proteína, pero corte graso y azúcar."]
    nutrition: [480, 45, 8, 29]
    photo: cocina-estadounidense/cerdo-desmenuzado.jpg
    category: Carnes
    difficulty: EASY
    prep: 20
    cook: 360
    servings: 8
    origin: Sur de Estados Unidos
    notes: En inglés, pulled pork. Tradicionalmente se ahúma; esta versión al horno es la más habitual en casa. En olla lenta, 8 horas a baja potencia.
    tags: [barbacoa, cerdo]
    utensils: [Horno]
    ingredients:
      - group: Carne
        items:
          - [paletilla o aguja de cerdo deshuesada, 2, kg]
          - [vinagre de manzana, 100, ml]
          - [caldo de pollo, 200, ml]
      - group: Adobo seco
        items:
          - [azúcar moreno, 2, cucharada]
          - [pimentón ahumado, 2, cucharada]
          - [ajo en polvo, 1, cucharadita]
          - [cebolla en polvo, 1, cucharadita]
          - [comino molido, 1, cucharadita]
          - [sal, 1, cucharada]
          - [pimienta negra, 1, cucharadita]
      - group: Para servir
        items:
          - [salsa barbacoa, 200, ml]
          - [panecillos de hamburguesa, 8, null]
          - [ensalada de col, null, null, optional]
    steps:
      - Mezcla el adobo, frota la carne por todas partes y, si puedes, déjala en la nevera toda la noche.
      - Precalienta el horno a 150 °C. Pon la carne en una cazuela con el vinagre y el caldo, tapa y hornea 5-6 horas, hasta que se deshaga con un tenedor.
      - Desmenuza la carne con dos tenedores, quitando la grasa, y mézclala con parte del jugo y la salsa barbacoa.
      - Sírvela en los panecillos con ensalada de col.

  - name: Pollo frito al estilo del sur
    health: [RED, "Pollo rebozado y frito en abundante aceite: mucha grasa y calorías. Para ocasiones."]
    nutrition: [720, 48, 42, 38]
    photo: cocina-estadounidense/pollo-frito-al-estilo-del-sur.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 30
    servings: 4
    origin: Sur de Estados Unidos
    notes: El suero de mantequilla (buttermilk) ablanda la carne. Puedes sustituirlo por leche con una cucharada de zumo de limón. Marina al menos 4 horas.
    tags: [frito, pollo]
    ingredients:
      - group: Marinada
        items:
          - [pollo troceado, 1.2, kg]
          - [buttermilk, 500, ml]
          - [salsa picante, 1, cucharada]
          - [sal, 2, cucharadita]
      - group: Rebozado
        items:
          - [harina, 300, g]
          - [levadura química, 1, cucharadita]
          - [pimentón dulce, 2, cucharadita]
          - [ajo en polvo, 1, cucharadita]
          - [cebolla en polvo, 1, cucharadita]
          - [cayena molida, 0.5, cucharadita]
          - [pimienta negra, 1, cucharadita]
          - [sal, 2, cucharadita]
          - [aceite de girasol para freír, null, null]
    steps:
      - Marina el pollo en el buttermilk con la salsa picante y la sal al menos 4 horas en la nevera.
      - Mezcla los ingredientes del rebozado. Añade 3 cucharadas de la marinada y frota con los dedos para formar grumitos.
      - Escurre cada trozo de pollo, rebózalo apretando bien y deja que repose 10 minutos.
      - Fríe en tandas en aceite a 165 °C 12-15 minutos, dándole la vuelta, hasta que esté dorado y el interior llegue a 75 °C.
      - Escúrrelo sobre una rejilla.

  - name: Sopa de almejas de Nueva Inglaterra
    health: [YELLOW, "Almejas con patata en sopa cremosa: proteína y hierro, pero la panceta, la mantequilla y la nata la hacen grasa."]
    nutrition: [480, 22, 34, 28]
    photo: cocina-estadounidense/sopa-de-almejas-de-nueva-inglaterra.jpg
    category: Sopas y cremas
    difficulty: MEDIUM
    prep: 20
    cook: 35
    servings: 4
    origin: Nueva Inglaterra
    notes: En inglés, clam chowder. Se acompaña con galletas saladas.
    tags: [sopa, marisco]
    ingredients:
      - items:
          - [almejas, 1.5, kg]
          - [agua, 250, ml]
          - [panceta ahumada, 100, g]
          - [cebolla, 1, null]
          - [apio, 2, rama]
          - [patatas, 500, g]
          - [mantequilla, 30, g]
          - [harina, 30, g]
          - [leche entera, 500, ml]
          - [nata para cocinar, 200, ml]
          - [tomillo seco, 0.5, cucharadita]
          - [laurel, 1, hoja]
          - [sal, null, null]
          - [pimienta negra, null, null]
    steps:
      - Pon las almejas con el agua en una olla tapada a fuego fuerte hasta que se abran. Saca la carne, pícala y cuela el caldo.
      - Dora la panceta en dados en la mantequilla. Añade la cebolla y el apio picados y pocha 8 minutos.
      - Espolvorea la harina, remueve 1 minuto y añade el caldo de las almejas, las patatas en dados, el tomillo y el laurel. Cuece 15 minutos.
      - Añade la leche y la nata y calienta sin que hierva 5 minutos. Incorpora las almejas, salpimienta y sirve.

  - name: Chili con carne
    health: [YELLOW, "Carne picada con alubias, tomate y especias: completo y con fibra, aunque la carne aporta grasa."]
    nutrition: [470, 34, 28, 24]
    photo: cocina-estadounidense/chili-con-carne.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 120
    servings: 6
    origin: Texas
    notes: El chile en polvo estadounidense es una mezcla de chiles secos con comino y orégano. Está mejor al día siguiente.
    tags: [guiso, picante]
    ingredients:
      - items:
          - [carne picada de ternera, 750, g]
          - [cebollas, 2, null]
          - [ajo, 4, diente]
          - [pimiento rojo, 1, null]
          - [chile en polvo, 2, cucharada]
          - [comino molido, 2, cucharadita]
          - [orégano seco, 1, cucharadita]
          - [pimentón ahumado, 1, cucharadita]
          - [tomate triturado, 800, g]
          - [concentrado de tomate, 2, cucharada]
          - [alubias rojas cocidas, 400, g]
          - [caldo de carne, 250, ml]
          - [chocolate negro, 15, g, optional]
          - [aceite de girasol, 2, cucharada]
          - [sal, null, null]
    steps:
      - Dora la carne en el aceite a fuego fuerte, en tandas, y retírala.
      - Pocha la cebolla, el ajo y el pimiento picados 8 minutos. Añade las especias y sofríe 1 minuto.
      - Devuelve la carne, añade el tomate, el concentrado y el caldo y cuece a fuego suave, tapado a medias, 1 hora y media.
      - Añade las alubias y el chocolate y cuece 20 minutos más. Ajusta de sal y sirve con queso rallado, cebolla o nata agria.

  - name: Pan de maíz
    health: [YELLOW, "Pan de maíz con mantequilla y azúcar: más dulce y graso que el pan normal."]
    nutrition: [280, 6, 36, 11]
    photo: cocina-estadounidense/pan-de-maiz.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 10
    cook: 25
    servings: 8
    origin: Sur de Estados Unidos
    notes: En inglés, cornbread. Si lo horneas en una sartén de hierro precalentada, los bordes quedan crujientes.
    tags: [pan, al horno]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de maíz, 150, g]
          - [harina de trigo, 125, g]
          - [azúcar, 50, g]
          - [levadura química, 1, cucharada]
          - [sal, 1, cucharadita]
          - [huevos, 2, null]
          - [buttermilk, 250, ml]
          - [mantequilla derretida, 80, g]
    steps:
      - Precalienta el horno a 200 °C con la sartén de hierro o un molde de 20 cm dentro.
      - Mezcla las harinas, el azúcar, la levadura y la sal.
      - Bate los huevos con el buttermilk y casi toda la mantequilla y mézclalo con los secos sin batir demasiado.
      - Pinta el molde caliente con el resto de la mantequilla, vierte la masa y hornea 20-25 minutos, hasta que esté dorado.

  - name: Tortitas americanas
    health: [YELLOW, "Tortitas con mantequilla y sirope de arce: muchos hidratos refinados y azúcar. Mejor con fruta."]
    nutrition: [420, 10, 62, 13]
    photo: cocina-estadounidense/tortitas-americanas.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 10
    cook: 15
    servings: 4
    notes: En inglés, pancakes. Unos grumos en la masa son normales; si la bates de más, salen duras.
    tags: [desayuno, dulce]
    ingredients:
      - items:
          - [harina, 200, g]
          - [azúcar, 2, cucharada]
          - [levadura química, 2, cucharadita]
          - [bicarbonato, 0.5, cucharadita]
          - [sal, 1, pizca]
          - [buttermilk, 350, ml]
          - [huevo, 1, null]
          - [mantequilla derretida, 40, g]
          - [sirope de arce, null, null]
    steps:
      - Mezcla la harina, el azúcar, la levadura, el bicarbonato y la sal.
      - Bate el buttermilk con el huevo y la mantequilla y mézclalo con los secos, solo hasta que se integren.
      - Calienta una sartén antiadherente a fuego medio y vierte un cucharón pequeño de masa por tortita.
      - Cuando salgan burbujas en la superficie, dales la vuelta y cocina 1 minuto más.
      - Sírvelas apiladas con mantequilla y sirope de arce.

  - name: Pastel de carne
    health: [YELLOW, "Carne picada al horno con glaseado de ketchup: buena proteína, aunque con grasa y algo de azúcar."]
    nutrition: [470, 32, 15, 31]
    photo: cocina-estadounidense/pastel-de-carne.jpg
    category: Carnes
    difficulty: EASY
    prep: 20
    cook: 60
    servings: 6
    notes: En inglés, meatloaf. Deja que repose 10 minutos antes de cortarlo para que no se desmorone.
    tags: [al horno, casero]
    utensils: [Horno]
    ingredients:
      - group: Pastel
        items:
          - [carne picada mixta, 900, g]
          - [cebolla, 1, null]
          - [ajo, 2, diente]
          - [pan rallado, 60, g]
          - [leche, 120, ml]
          - [huevos, 2, null]
          - [salsa Worcestershire, 1, cucharada]
          - [ketchup, 2, cucharada]
          - [perejil picado, 2, cucharada]
          - [sal, 1.5, cucharadita]
          - [pimienta negra, 0.5, cucharadita]
      - group: Glaseado
        items:
          - [ketchup, 120, g]
          - [azúcar moreno, 2, cucharada]
          - [vinagre de manzana, 1, cucharada]
    steps:
      - Precalienta el horno a 180 °C. Remoja el pan rallado en la leche.
      - Mezcla la carne con la cebolla y el ajo muy picados, el pan, los huevos, la salsa Worcestershire, el ketchup, el perejil, la sal y la pimienta, sin amasar demasiado.
      - Dale forma de pan alargado sobre una bandeja con papel de horno.
      - Mezcla los ingredientes del glaseado y pinta el pastel con la mitad.
      - Hornea 45 minutos, pinta con el resto del glaseado y hornea 15 minutos más.

  - name: Jambalaya
    health: [YELLOW, "Arroz con pollo, gambas y verduras, completo, pero la salchicha ahumada aporta grasa y sal."]
    nutrition: [530, 36, 48, 20]
    photo: cocina-estadounidense/jambalaya.jpg
    category: Arroces
    difficulty: MEDIUM
    prep: 20
    cook: 40
    servings: 6
    origin: Luisiana
    notes: La base de cebolla, pimiento verde y apio se llama «la santísima trinidad» de la cocina criolla. La salchicha andouille se puede sustituir por otra ahumada.
    tags: [arroz, picante]
    ingredients:
      - items:
          - [salchicha andouille, 300, g]
          - [contramuslos de pollo deshuesados, 400, g]
          - [gambas peladas, 300, g]
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [apio, 2, rama]
          - [ajo, 3, diente]
          - [tomate triturado, 400, g]
          - [arroz de grano largo, 300, g]
          - [caldo de pollo, 750, ml]
          - [condimento cajún, 2, cucharadita]
          - [tomillo seco, 1, cucharadita]
          - [laurel, 2, hoja]
          - [cebolletas, 2, null]
          - [aceite de girasol, 2, cucharada]
    steps:
      - Dora la salchicha en rodajas y el pollo en trozos en el aceite. Retíralos.
      - Pocha la cebolla, el pimiento, el apio y el ajo picados 8 minutos.
      - Añade el cajún, el tomillo, el laurel, el tomate y el arroz y remueve 2 minutos.
      - Devuelve la carne, añade el caldo, tapa y cuece a fuego suave 20 minutos, sin remover.
      - Coloca las gambas encima, tapa y cuece 5 minutos más. Sirve con cebolleta picada.

  - name: Gumbo de pollo y salchicha
    health: [YELLOW, "Guiso con verduras, pollo y salchicha sobre roux de aceite y harina: sabroso pero graso y salado."]
    nutrition: [520, 32, 22, 34]
    photo: cocina-estadounidense/gumbo-de-pollo-y-salchicha.jpg
    category: Sopas y cremas
    difficulty: HARD
    prep: 30
    cook: 120
    servings: 6
    origin: Luisiana
    notes: El roux oscuro, del color del chocolate, es lo que da sabor y cuerpo al gumbo. Hay que removerlo sin parar y no dejar que se queme.
    tags: [guiso, picante]
    ingredients:
      - items:
          - [aceite de girasol, 80, ml]
          - [harina, 80, g]
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [apio, 2, rama]
          - [ajo, 4, diente]
          - [salchicha andouille, 300, g]
          - [contramuslos de pollo, 600, g]
          - [caldo de pollo, 1.5, l]
          - [condimento cajún, 2, cucharadita]
          - [laurel, 2, hoja]
          - [tomillo seco, 1, cucharadita]
          - [quingombó (okra), 200, g, optional]
          - [cebolletas, 2, null]
          - [arroz blanco cocido, 600, g]
    steps:
      - Haz el roux calentando el aceite con la harina a fuego medio-bajo y removiendo sin parar 30-40 minutos, hasta que tenga color chocolate.
      - Añade la cebolla, el pimiento, el apio y el ajo picados y cocina 5 minutos.
      - Incorpora el caldo poco a poco, removiendo, y añade el pollo, la salchicha en rodajas, el cajún, el laurel y el tomillo.
      - Cuece a fuego suave 1 hora. Saca el pollo, desmenúzalo y devuélvelo a la olla con el quingombó en rodajas. Cuece 20 minutos más.
      - Sirve en cuencos sobre arroz blanco con cebolleta picada.

