          - [onion, 1, null]
          - [leek, 1, null]
          - [butter, 30, g]
          - [peeled cooked chestnuts, 400, g]
          - [potato, 100, g]
          - [vegetable stock, 700, g]
          - [single cream, 100, g]
          - [salt, 1, tsp]
          - [black pepper, null, null]
    steps:
      - Put the onion and leek, in pieces, in the bowl and chop 5 sec/speed 5.
      - Add the butter and sauté 6 min/100°C/speed 1.
      - Add the chestnuts, the potato in pieces, the stock, salt and pepper and cook 20 min/100°C/speed 1.
      - Add the cream and blend 1 min/speed 5-10, increasing gradually.

  - name: Celeriac soup
    category: Soups
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    notes: Programmed for the Thermomix TM6. Celeriac has a mild celery and hazelnut flavour.
    tags: [soup, vegetarian, winter]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [onion, 1, null]
          - [butter, 30, g]
          - [peeled celeriac, 500, g]
