    steps:
      - Limpia los champiñones, quítales el pie y pícalo.
      - Saltea los pies picados con el ajo y el jamón en el aceite 3 minutos y mézclalo con el queso y el perejil.
      - Rellena los sombreros con la mezcla.
      - Cocina a 180 °C durante 8-10 minutos, hasta que estén tiernos y dorados por encima.

