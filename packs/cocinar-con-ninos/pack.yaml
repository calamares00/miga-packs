name: Cocinar con niños
series: Cocina de cada día
family: cocinar-con-ninos
description: >-
  Recetas sencillas para cocinar en familia, con tareas que los niños pueden hacer solos: galletas
  de avena y plátano, bolitas de coco, polos de yogur, batido de fresa, huevos rellenos, ensalada
  de pasta, wraps de pollo, pizzas de pan de molde, mini quiches, albóndigas al horno, salmón en
  papillote y salchichón de chocolate. Cada receta dice qué puede hacer el niño; el horno, los
  cuchillos afilados y el fuego, siempre con un adulto.
author: Miga
authorGithub: calamares00
