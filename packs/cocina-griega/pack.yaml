name: "Cocina del mundo: Grecia"
series: Cocina del mundo
description: >-
  La cocina griega más allá de la ensalada y el tzatziki: souvlaki, spanakopita, pastitsio,
  gemista, fasolada, avgolemono, dolmades, keftedes, briam, fava, kleftiko, stifado, queso
  saganaki, gambas con feta, gigantes, taramosalata, melitzanosalata, spanakorizo, loukoumades y
  baklava. Con aceite de oliva, limón, orégano y eneldo.
author: Miga
authorGithub: calamares00
