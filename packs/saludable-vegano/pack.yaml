recipes:

  - name: Tofu salteado con brócoli y sésamo
    health: [GREEN, "Tofu con verdura y arroz integral: proteína vegetal completa y fibra."]
    nutrition: [430, 22, 46, 17]
    photo: saludable-vegano/tofu-salteado-con-brocoli-y-sesamo.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 15
    servings: 4
    tags: [vegano, tofu, salteado]
    utensils: [Wok]
    ingredients:
      - items:
          - [tofu firme, 400, g]
          - [brócoli, 1, null]
          - [pimiento rojo, 1, null]
          - [ajo, 2, diente]
          - [jengibre fresco rallado, 1, cucharada]
          - [salsa de soja baja en sal, 3, cucharada]
          - [sirope de arce, 1, cucharada]
          - [vinagre de arroz, 1, cucharada]
          - [maicena, 2, cucharada]
          - [aceite de girasol, 2, cucharada]
          - [semillas de sésamo, 1, cucharada]
          - [arroz integral cocido, 600, g]
    steps:
      - "Escurre el tofu, sécalo con papel, córtalo en dados y rebózalo en la maicena."
      - Dóralo en el wok con el aceite por todos los lados y sácalo.
      - "Saltea el ajo y el jengibre, añade el brócoli en ramilletes y el pimiento y saltea 4 minutos con un chorrito de agua."
      - "Añade la soja, el sirope y el vinagre, vuelve a echar el tofu y saltea 1 minuto. Sirve con arroz integral y sésamo."

  - name: Boloñesa de lentejas
    health: [GREEN, "Salsa de lentejas y verduras con pasta integral: fibra, hierro y proteína vegetal."]
    nutrition: [520, 24, 86, 9]
    photo: saludable-vegano/bolonesa-de-lentejas.jpg
    category: Pastas
    difficulty: EASY
    prep: 15
    cook: 40
    servings: 4
    tags: [vegano, pasta, legumbres]
    ingredients:
      - items:
          - [lentejas rojas o pardinas, 200, g]
          - [cebolla, 1, null]
          - [zanahoria, 1, null]
          - [apio, 1, rama]
          - [ajo, 2, diente]
          - [champiñones, 200, g]
          - [tomate triturado, 800, g]
          - [orégano seco, 1, cucharadita]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [espaguetis integrales, 320, g]
          - [levadura nutricional (opcional), 2, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - "Pica muy fina la cebolla, la zanahoria, el apio, el ajo y los champiñones y póchalos en el aceite 10 minutos."
      - "Añade las lentejas lavadas, el tomate, el orégano y 400 ml de agua. Cuece 25-30 minutos, hasta que las lentejas estén tiernas. Salpimienta."
      - Cuece la pasta y sírvela con la salsa y la levadura nutricional por encima.

  - name: Chili sin carne
    health: [GREEN, "Chili de legumbres y verduras: mucha fibra y proteína vegetal, casi sin grasa."]
    nutrition: [380, 18, 60, 7]
    photo: saludable-vegano/chili-sin-carne.jpg
    category: Legumbres
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 6
    tags: [vegano, legumbres, sin gluten]
    ingredients:
      - items:
          - [alubias rojas cocidas, 400, g]
          - [alubias negras cocidas, 400, g]
          - [lentejas cocidas, 250, g]
          - [cebolla, 1, null]
          - [pimiento rojo, 1, null]
          - [pimiento verde, 1, null]
          - [ajo, 3, diente]
          - [tomate triturado, 800, g]
          - [maíz dulce, 150, g]
          - [comino molido, 2, cucharadita]
          - [pimentón ahumado, 2, cucharadita]
          - [chile en polvo, 1, cucharadita]
          - [cacao puro en polvo, 1, cucharadita]
          - [aceite de oliva, 2, cucharada]
          - [sal, null, null]
    steps:
      - "Sofríe la cebolla, los pimientos y el ajo picados en el aceite 8 minutos. Añade las especias y el cacao y remueve 1 minuto."
      - Añade el tomate y 200 ml de agua y cuece 10 minutos.
      - "Incorpora las legumbres escurridas y el maíz, sala y cuece 15 minutos más. Sírvelo con arroz integral o aguacate."

  - name: Bol de quinoa y garbanzos
    health: [GREEN, "Bol de cereal integral, legumbre, verdura y tahini: equilibrado y saciante."]
    nutrition: [540, 20, 62, 23]
    photo: saludable-vegano/bol-de-quinoa-y-garbanzos.jpg
    category: Ensaladas
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 2
    tags: [vegano, sin gluten, ensalada]
    utensils: [Horno]
    ingredients:
      - items:
          - [quinoa, 120, g]
          - [garbanzos cocidos, 250, g]
          - [pimentón ahumado, 1, cucharadita]
          - [boniato, 1, null]
          - [kale o espinacas, 60, g]
          - [aguacate, 1, null]
          - [col lombarda, 80, g]
          - [tahini, 2, cucharada]
          - [zumo de limón, 2, cucharada]
          - [aceite de oliva virgen extra, 1, cucharada]
          - [sal, null, null]
    steps:
      - "Asa el boniato en dados y los garbanzos con el aceite, el pimentón y sal a 210 °C 25 minutos."
      - Cuece la quinoa en el doble de agua 12 minutos.
      - "Mezcla el tahini con el limón, una pizca de sal y agua hasta que quede una salsa fluida."
      - "Reparte en cuencos la quinoa, el kale, la lombarda en tiras, el boniato, los garbanzos y el aguacate, y riega con la salsa."

