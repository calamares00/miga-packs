name: "Fusion cuisine: Chifa"
series: Fusion cuisine
description: >-
  The cooking of Cantonese immigrants in Peru, which spread from Lima's Chinatown to the whole
  country with the wok, soy sauce and Peruvian produce: tallarín saltado, chi jau kay, kam lu
  wantán, aeropuerto, pollo enrollado, fried wontons, pork with tamarind and fuchifú soup.
