description: >-
  La cocina de los tejanos de origen mexicano, con más queso amarillo, comino y carne de ternera
  que la de México: nachos, chile con queso, enchiladas de queso con chili gravy, tacos crujientes
  de carne, tacos de desayuno, pollo King Ranch, frito pie y sopaipillas.
