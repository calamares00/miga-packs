          - [yogur griego natural, 250, g]
          - [huevo, 1, null]
          - [mostaza de Dijon, 1, cucharadita]
          - [queso cheddar o emmental rallado, 60, g]
          - [nuez moscada, 1, pizca]
          - [cebollino, 1, manojo]
          - [sal y pimienta negra, null, null]
    steps:
      - Precalienta el horno a 200 °C. Cuece la coliflor en ramilletes al vapor 8 minutos y colócala en una fuente.
      - "Mezcla el yogur con el huevo, la mostaza, la mitad del queso, la nuez moscada, sal y pimienta."
      - "Cubre la coliflor con la mezcla, espolvorea el resto del queso y gratina 20 minutos. Termina con cebollino."

  - name: Cuscús con verduras asadas y halloumi
    health: [GREEN, "Cuscús integral con verduras y un poco de halloumi: completo y equilibrado."]
    nutrition: [480, 20, 55, 20]
    photo: saludable-vegetariano/cuscus-con-verduras-asadas-y-halloumi.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    tags: [vegetariano, al horno]
    utensils: [Horno]
    ingredients:
      - items:
          - [cuscús integral, 200, g]
          - [caldo de verduras caliente, 220, ml]
          - [halloumi, 200, g]
          - [calabacín, 1, null]
          - [pimiento rojo, 1, null]
          - [cebolla morada, 1, null]
          - [tomates cherry, 200, g]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [ras el hanout o comino, 1, cucharadita]
          - [menta fresca, 1, puñado]
          - [limón, 1, null]
    steps:
      - Asa las verduras en trozos con 2 cucharadas de aceite y las especias a 210 °C 25 minutos.
      - "Vierte el caldo sobre el cuscús, tapa 5 minutos y suéltalo con un tenedor."
      - Dora el halloumi en lonchas en una sartén sin aceite 1-2 minutos por lado.
      - "Mezcla el cuscús con las verduras, el resto del aceite y el zumo de limón, y sirve con el halloumi y la menta."

  - name: Huevos al horno con espinacas y tomate
    health: [GREEN, "Huevos cuajados sobre verdura y tomate: proteína y fibra con poca grasa."]
    nutrition: [250, 16, 12, 15]
    photo: saludable-vegetariano/huevos-al-horno-con-espinacas-y-tomate.jpg
    category: Huevos
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 4
    tags: [huevos, vegetariano, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [huevos, 8, null]
          - [espinacas frescas, 300, g]
          - [tomate triturado, 400, g]
          - [cebolla, 1, null]
          - [ajo, 2, diente]
          - [pimentón dulce, 1, cucharadita]
          - [queso feta, 50, g]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - "Precalienta el horno a 190 °C. Pocha la cebolla y el ajo en el aceite, añade el pimentón y el tomate y cuece 10 minutos. Incorpora las espinacas y sala."
      - "Reparte en cuatro cazuelitas, haz dos huecos en cada una y casca los huevos."
      - "Hornea 10-12 minutos, hasta que la clara esté cuajada y la yema líquida. Termina con el feta y pimienta."
