description: >-
  Timeless recipes for Christmas Eve, Christmas Day and Twelfth Night: prawn cocktail, ham
  croquettes, galets soup, roast lamb, suckling pig, sea bream, hake in green sauce, red cabbage,
  roscón de Reyes, turrón, polvorones and marzipan. With notes for cooking ahead and for big
  gatherings.
