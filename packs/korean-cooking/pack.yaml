description: >-
  The cooking of Korea, spicy, fermented and made for sharing: bibimbap, bulgogi, homemade kimchi,
  japchae, kimbap, tteokbokki, kimchi and soft tofu stews, samgyetang, seafood pajeon, kimchi fried
  rice, dakgalbi, Korean fried chicken, galbi jjim, bossam, side dishes (banchan) such as rolled
  omelette, seasoned bean sprouts and cucumber salad and, for dessert, hotteok and patbingsu.
  Gochujang and gochugaru are sold in Asian shops.
