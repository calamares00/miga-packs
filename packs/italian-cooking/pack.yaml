    steps:
      - Cut the aubergines into cubes, salt them for 30 minutes, pat dry and fry them in plenty of oil until golden.
      - Blanch the celery, in pieces, for 2 minutes.
      - Gently cook the onion in the 4 tablespoons of oil for 10 minutes. Add the crushed tomatoes and simmer for 10 minutes.
      - Add the celery, olives, capers and pine nuts and cook for 5 minutes. Add the vinegar and sugar and let the vinegar cook off for 2 minutes.
      - Add the aubergine, fold gently and let it cool slightly. Serve with basil.

