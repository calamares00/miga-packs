  - name: Tarta de manzana
    health: [RED, "Tarta de masa con mucha mantequilla y relleno azucarado de manzana: muy calórica."]
    nutrition: [470, 5, 62, 24]
    photo: cocina-estadounidense/tarta-de-manzana.jpg
    category: Postres
    difficulty: MEDIUM
    prep: 60
    cook: 60
    servings: 8
    notes: En inglés, apple pie. La mantequilla de la masa debe estar muy fría para que quede hojaldrada. Deja que la tarta se enfríe 2 horas antes de cortarla.
    tags: [postre, al horno]
    utensils: [Horno]
    ingredients:
      - group: Masa
        items:
          - [harina, 375, g]
          - [mantequilla muy fría en dados, 250, g]
          - [azúcar, 1, cucharada]
          - [sal, 1, cucharadita]
          - [agua helada, 120, ml]
      - group: Relleno
        items:
          - [manzanas Granny Smith o Golden, 1.2, kg]
          - [azúcar, 120, g]
          - [canela molida, 1, cucharadita]
          - [nuez moscada, 1, pizca]
          - [zumo de limón, 1, cucharada]
          - [maicena, 3, cucharada]
          - [mantequilla, 20, g]
          - [huevo para pintar, 1, null]
    steps:
      - Mezcla la harina, el azúcar y la sal. Añade la mantequilla y desmenúzala con los dedos hasta que queden trozos del tamaño de un guisante.
      - Añade el agua poco a poco hasta que la masa se una. Divídela en dos discos, envuélvelos y refrigéralos 1 hora.
      - Pela las manzanas, córtalas en láminas y mézclalas con el azúcar, la canela, la nuez moscada, el limón y la maicena.
      - Precalienta el horno a 200 °C. Estira un disco y forra un molde de 23 cm. Rellena, reparte la mantequilla en trocitos y cubre con el otro disco. Sella los bordes y haz unos cortes.
      - Pinta con huevo y hornea 20 minutos. Baja a 180 °C y hornea 40 minutos más, hasta que esté dorada y el jugo burbujee.

  - name: Galletas con pepitas de chocolate
    health: [RED, "Galletas con mantequilla, azúcar y chocolate: dulces y calóricas. Una o dos de vez en cuando."]
    nutrition: [160, 2, 20, 8]
    photo: cocina-estadounidense/galletas-con-pepitas-de-chocolate.jpg
    category: Postres
    difficulty: EASY
    prep: 15
    cook: 12
    servings: 20
    notes: En inglés, chocolate chip cookies. Sácalas del horno cuando el centro aún parezca blando; se endurecen al enfriarse.
    tags: [postre, chocolate]
    utensils: [Horno]
    ingredients:
      - items:
          - [mantequilla blanda, 115, g]
          - [azúcar moreno, 100, g]
          - [azúcar blanco, 50, g]
          - [huevo, 1, null]
          - [extracto de vainilla, 1, cucharadita]
          - [harina, 190, g]
          - [bicarbonato, 0.5, cucharadita]
          - [sal, 0.5, cucharadita]
          - [pepitas de chocolate, 170, g]
    steps:
      - Precalienta el horno a 180 °C.
      - Bate la mantequilla con los dos azúcares hasta que esté cremosa. Añade el huevo y la vainilla.
      - Incorpora la harina, el bicarbonato y la sal, y después las pepitas de chocolate.
      - Forma bolas de una cucharada y colócalas separadas en bandejas con papel de horno.
      - Hornea 10-12 minutos, hasta que los bordes estén dorados. Deja que se enfríen 5 minutos en la bandeja.

