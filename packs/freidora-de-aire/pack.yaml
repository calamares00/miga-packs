      - Cocina a 200 °C durante 10 minutos, agitando la cesta a mitad de tiempo.
      - Mézclalos con el aceite y las especias y cocina 4-5 minutos más, hasta que estén crujientes.

  - name: Albóndigas en freidora de aire
    health: [YELLOW, "Carne picada mixta sin freír en aceite. Buena proteína, aunque la carne aporta grasa."]
    nutrition: [380, 26, 8, 27]
