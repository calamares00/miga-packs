description: >-
  Las recetas de la Cuaresma y la Semana Santa en España: dulces de sartén como pestiños,
  buñuelos de viento, flores fritas y bartolillos, la mona de Pascua y el hornazo, y los platos de
  vigilia con bacalao (a la vizcaína, soldaditos de Pavía, buñuelos, tortilla, patatas con bacalao
  y empanada de bacalao con pasas). Las torrijas y el potaje de vigilia ya están en otros packs.
