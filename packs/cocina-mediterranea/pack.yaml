      - Añade los garbanzos escurridos y el comino y tritura 2-3 minutos, añadiendo el agua fría poco a poco hasta que quede muy cremoso.
      - Sirve con un hilo de aceite, pimentón y pan de pita.

  - name: Tabulé
    health: [GREEN, "Ensalada de hierbas, tomate y bulgur con aceite de oliva: fibra, vitaminas y antioxidantes."]
    nutrition: [230, 4, 17, 17]
