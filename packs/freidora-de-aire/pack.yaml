name: Freidora de aire
series: Electrodomésticos
description: >-
  Recetas pensadas para la freidora de aire: patatas, alitas, nuggets caseros, pescado rebozado,
  verduras crujientes, albóndigas, hamburguesas, costillas y hasta postres. Con muy poco aceite y
  los tiempos y temperaturas de cada plato. Los tiempos son orientativos: cada modelo calienta de
  forma distinta.
author: Miga
authorGithub: calamares00
