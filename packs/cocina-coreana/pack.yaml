  - name: Bibimbap
    health: [GREEN, "Arroz con muchas verduras, carne y huevo: un plato completo y equilibrado."]
    nutrition: [580, 28, 76, 18]
    photo: cocina-coreana/bibimbap.jpg
    category: Arroces
    difficulty: MEDIUM
    prep: 30
    cook: 25
    servings: 4
    notes: «Arroz mezclado». Cada verdura se prepara por separado y se mezcla todo en la mesa con la salsa. En cuenco de piedra caliente (dolsot) el arroz hace costra.
    tags: [arroz, verduras, plato único]
    utensils: []
    ingredients:
      - group: Para la base
        items:
          - [arroz de grano corto, 400, g]
          - [carne picada o filetes finos de ternera, 250, g]
          - [salsa de soja, 2, cucharada]
          - [espinacas, 200, g]
          - [brotes de soja, 200, g]
          - [zanahorias, 2, null]
          - [calabacín, 1, null]
          - [setas shiitake, 150, g]
          - [huevos, 4, null]
          - [aceite de sésamo, 3, cucharada]
          - [dientes de ajo, 2, null]
          - [semillas de sésamo, 1, cucharada]
          - [sal, null, null]
      - group: Para la salsa
        items:
          - [gochujang (pasta de guindilla coreana), 3, cucharada]
          - [aceite de sésamo para la salsa, 1, cucharada]
          - [azúcar, 1, cucharada]
          - [vinagre de arroz, 1, cucharada]
          - [agua, 1, cucharada]
    steps:
      - Cuece el arroz. Marina la carne con la soja, un ajo picado y un poco de aceite de sésamo.
      - Escalda las espinacas y los brotes de soja por separado 1 minuto, escúrrelos y alíñalos con aceite de sésamo, ajo y sal.
      - Saltea por separado la zanahoria y el calabacín en tiras y las setas en láminas, con una pizca de sal. Saltea la carne.
      - Mezcla los ingredientes de la salsa. Fríe los huevos con la yema líquida.
      - Sirve el arroz en cuencos, coloca encima las verduras y la carne por montoncitos, el huevo en el centro y el sésamo, con la salsa al lado. Se mezcla todo antes de comer.

  - name: Bulgogi
    health: [YELLOW, "Ternera marinada a la plancha: mucha proteína, marinada algo dulce."]
    nutrition: [380, 32, 14, 21]
    photo: cocina-coreana/bulgogi.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 10
    servings: 4
    notes: La pera rallada ablanda la carne. Pide en la carnicería la carne cortada muy fina, o congélala 30 minutos para cortarla tú.
    tags: [ternera, barbacoa]
    utensils: [Plancha]
    ingredients:
      - items:
          - [lomo bajo o aguja de ternera en lonchas muy finas, 600, g]
          - [pera, 0.5, null]
          - [cebolla, 1, null]
          - [cebolletas, 3, null]
          - [dientes de ajo, 4, null]
          - [salsa de soja, 5, cucharada]
          - [azúcar moreno, 2, cucharada]
          - [aceite de sésamo, 2, cucharada]
          - [semillas de sésamo, 1, cucharada]
          - [pimienta negra, 0.5, cucharadita]
    steps:
      - Ralla la pera, la mitad de la cebolla y el ajo y mézclalos con la soja, el azúcar, el aceite de sésamo y la pimienta.
      - Marina la carne con la mezcla y el resto de la cebolla en juliana al menos 1 hora.
      - Cocínala en la plancha o la sartén muy caliente por tandas, 3-4 minutos, hasta que se dore.
      - Sirve con las cebolletas picadas y el sésamo, con arroz y hojas de lechuga para envolver.

  - name: Kimchi
    health: [GREEN, "Col fermentada con especias: fibra y probióticos, pero con bastante sal."]
    nutrition: [35, 2, 6, 0]
    photo: cocina-coreana/kimchi.jpg
    category: Verduras
    difficulty: MEDIUM
    prep: 60
    cook: 0
    servings: 20
    notes: El baechu kimchi, la guarnición de todas las comidas. Fermenta 1-2 días a temperatura ambiente y luego se guarda en la nevera; dura semanas y cada vez sabe más ácido. Usa guantes para mezclar.
    tags: [fermentados, conserva, sin gluten]
    utensils: []
    ingredients:
      - items:
          - [col china, 1.5, kg]
          - [sal gruesa, 100, g]
          - [gochugaru (copos de guindilla coreana), 50, g]
          - [salsa de pescado, 3, cucharada]
          - [dientes de ajo, 6, null]
          - [jengibre fresco, 1, trozo]
          - [azúcar, 1, cucharada]
          - [harina de arroz glutinoso, 1, cucharada]
          - [agua, 150, ml]
          - [rábano blanco (daikon), 200, g]
          - [cebolletas, 4, null]
    steps:
      - Corta la col en cuartos a lo largo, sala bien entre las hojas y deja 2 horas, dándole la vuelta a mitad. Aclárala 3 veces y escúrrela bien.
      - Cuece la harina de arroz con el agua 2 minutos hasta que espese y deja enfriar.
      - Mezcla la papilla con el gochugaru, la salsa de pescado, el ajo y el jengibre rallados, el azúcar, el rábano en tiras y las cebolletas en trozos.
      - Unta cada hoja de la col con la pasta, dobla los cuartos y apriétalos en un tarro de cristal sin dejar aire, dejando 3 cm libres arriba.
      - Deja fermentar 1-2 días a temperatura ambiente, apretando cada día, y guárdalo en la nevera.

  - name: Japchae
    health: [YELLOW, "Fideos de boniato con verduras y carne: completo, algo graso por el sésamo."]
    nutrition: [420, 16, 62, 13]
    photo: cocina-coreana/japchae.jpg
    category: Pastas
    difficulty: MEDIUM
    prep: 30
    cook: 20
    servings: 4
    notes: Los fideos de fécula de boniato (dangmyeon) quedan transparentes y elásticos. Se toma templado o frío, y es plato de fiesta.
    tags: [fideos, verduras, fiesta, sin gluten]
    utensils: [Wok]
    ingredients:
      - items:
          - [fideos de boniato (dangmyeon), 250, g]
          - [filetes finos de ternera, 200, g]
          - [espinacas, 200, g]
          - [zanahoria, 1, null]
          - [cebolla, 1, null]
          - [pimiento rojo, 1, null]
          - [setas shiitake, 150, g]
          - [dientes de ajo, 3, null]
          - [salsa de soja sin gluten, 5, cucharada]
          - [azúcar, 2, cucharada]
          - [aceite de sésamo, 3, cucharada]
          - [aceite de girasol, 2, cucharada]
          - [semillas de sésamo, 1, cucharada]
    steps:
      - Cuece los fideos 6 minutos, escúrrelos, córtalos con tijera en trozos largos y alíñalos con 1 cucharada de soja y 1 de aceite de sésamo.
      - Escalda las espinacas 30 segundos, escúrrelas y alíñalas con sal y aceite de sésamo.
      - Corta la carne, las verduras y las setas en tiras y saltéalas por separado en el wok con un poco de aceite.
      - Mezcla los fideos con todo, el ajo picado, el resto de la soja, el azúcar y el aceite de sésamo y saltea 2 minutos. Espolvorea el sésamo.

  - name: Kimbap
    health: [GREEN, "Rollos de arroz con verduras, huevo y alga: equilibrados y ligeros."]
    nutrition: [430, 15, 70, 10]
    photo: cocina-coreana/kimbap.jpg
    category: Arroces
    difficulty: MEDIUM
    prep: 40
    cook: 25
    servings: 4
    notes: Los rollos de arroz de las excursiones. A diferencia del sushi, el arroz se aliña con sésamo y sal, no con vinagre. Hace falta una esterilla de bambú.
    tags: [arroz, picnic]
    utensils: []
    ingredients:
      - items:
          - [arroz de grano corto, 400, g]
          - [hojas de alga nori, 5, null]
          - [huevos, 3, null]
          - [zanahoria, 1, null]
          - [espinacas, 200, g]
          - [rábano encurtido amarillo (danmuji), 5, tira]
          - [palitos de cangrejo o jamón cocido en tiras, 5, null]
          - [aceite de sésamo, 3, cucharada]
          - [semillas de sésamo, 1, cucharada]
          - [sal, null, null]
    steps:
      - Cuece el arroz y alíñalo templado con 2 cucharadas de aceite de sésamo y 1 cucharadita de sal.
      - Haz una tortilla fina con los huevos y córtala en tiras. Saltea la zanahoria en tiras finas. Escalda las espinacas y alíñalas con sal y sésamo.
      - Pon una hoja de nori sobre la esterilla, extiende una capa fina de arroz dejando 3 cm libres arriba y coloca los rellenos en fila.
      - Enrolla apretando con la esterilla y sella con unos granos de arroz.
      - Pinta los rollos con aceite de sésamo, espolvorea el sésamo y córtalos en rodajas con un cuchillo mojado.

  - name: Tteokbokki
    health: [YELLOW, "Pasteles de arroz en salsa picante: muchos hidratos y azúcar."]
    nutrition: [420, 12, 82, 5]
    photo: cocina-coreana/tteokbokki.jpg
    category: Pastas
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 4
    notes: La comida callejera más popular de Corea. Los pasteles de arroz (tteok) se venden frescos o congelados en tiendas asiáticas.
    tags: [picante, comida callejera]
    utensils: []
    ingredients:
      - items:
          - [pasteles de arroz alargados (garae-tteok), 500, g]
          - [placas de pastel de pescado (eomuk), 2, null, optional]
          - [caldo de anchoas o agua, 500, ml]
          - [gochujang, 3, cucharada]
          - [gochugaru, 1, cucharada]
          - [salsa de soja, 1, cucharada]
          - [azúcar, 2, cucharada]
          - [dientes de ajo, 2, null]
          - [cebolletas, 3, null]
          - [huevos cocidos, 2, null]
    steps:
      - Si los pasteles de arroz están duros, remójalos 20 minutos en agua templada.
      - Lleva el caldo a ebullición con el gochujang, el gochugaru, la soja, el azúcar y el ajo picado.
      - Añade los pasteles de arroz y el pastel de pescado en triángulos y cuece a fuego medio 10-12 minutos, removiendo, hasta que la salsa espese y brille.
      - Añade las cebolletas en trozos y los huevos cocidos partidos y sirve enseguida.

  - name: Kimchi jjigae
    health: [GREEN, "Guiso de kimchi con tofu y cerdo: proteína y probióticos, algo salado."]
    nutrition: [340, 24, 14, 21]
    photo: cocina-coreana/kimchi-jjigae.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Sale mejor con kimchi bien fermentado y ácido. Se sirve hirviendo, con arroz blanco.
    tags: [sopa, picante, fermentados, sin gluten]
    utensils: []
    ingredients:
      - items:
          - [kimchi maduro, 400, g]
          - [jugo del kimchi, 100, ml]
          - [panceta de cerdo en lonchas, 200, g]
          - [tofu firme, 300, g]
          - [cebolla, 1, null]
          - [gochugaru, 1, cucharada]
          - [dientes de ajo, 2, null]
          - [caldo de anchoas o agua, 600, ml]
          - [cebolletas, 2, null]
          - [aceite de sésamo, 1, cucharada]
    steps:
      - Saltea la panceta en trozos con el aceite de sésamo 3 minutos. Añade el kimchi cortado y saltea 5 minutos más.
      - Añade la cebolla en juliana, el ajo, el gochugaru, el jugo del kimchi y el caldo y cuece 15 minutos.
      - Añade el tofu en dados y cuece 5 minutos más. Termina con la cebolleta picada.

  - name: Sundubu jjigae
    health: [GREEN, "Guiso de tofu sedoso con marisco: mucha proteína y poca grasa."]
    nutrition: [260, 22, 10, 14]
    photo: cocina-coreana/sundubu-jjigae.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 2
    notes: El tofu sedoso (sundubu) se rompe a cucharadas en el caldo. El huevo se casca al final, crudo, y se cuaja con el calor del guiso.
    tags: [sopa, picante, tofu, marisco]
    utensils: []
    ingredients:
      - items:
          - [tofu sedoso, 350, g]
          - [almejas o gambas, 150, g]
          - [cebolla pequeña, 1, null]
          - [calabacín pequeño, 0.5, null]
          - [gochugaru, 1.5, cucharada]
          - [dientes de ajo, 2, null]
          - [salsa de soja, 1, cucharada]
          - [aceite de sésamo, 1, cucharada]
          - [caldo de anchoas o agua, 400, ml]
          - [huevos, 2, null]
          - [cebolleta, 1, null]
    steps:
      - Sofríe el gochugaru con el ajo y el aceite de sésamo a fuego suave 1 minuto, hasta que el aceite se ponga rojo.
      - Añade la cebolla y el calabacín en dados y el caldo y cuece 5 minutos.
      - Añade el marisco y el tofu a cucharadas grandes y cuece 5 minutos. Sazona con la soja.
      - Casca los huevos encima, añade la cebolleta y sirve hirviendo.

  - name: Samgyetang
    health: [GREEN, "Caldo de pollo con arroz, ajo y ginseng: proteína y poca grasa."]
    nutrition: [520, 48, 40, 18]
    photo: cocina-coreana/samgyetang.jpg
    category: Sopas y cremas
    difficulty: MEDIUM
    prep: 20
    cook: 75
    servings: 2
    notes: Se toma en los días más calurosos del verano para recuperar fuerzas. Se hace con pollitos (picantones), uno por persona; el ginseng es opcional.
    tags: [sopa, pollo, sin gluten]
    utensils: [Olla exprés]
    ingredients:
      - items:
          - [picantones (pollitos de 500 g), 2, null]
          - [arroz glutinoso remojado 1 hora, 80, g]
          - [dientes de ajo, 10, null]
          - [azufaifas secas (dátiles chinos), 4, null]
          - [raíz de ginseng fresco, 2, null, optional]
          - [jengibre fresco, 1, trozo]
          - [cebolletas, 2, null]
          - [sal y pimienta para servir, null, null]
    steps:
      - Lava los picantones por dentro y rellénalos con el arroz, 3 ajos y 1 azufaifa cada uno. Cruza las patas y átalas.
      - Ponlos en una olla con el resto de los ajos y las azufaifas, el ginseng, el jengibre y agua que los cubra.
      - Cuece a fuego suave 1 hora (20 minutos en olla exprés), quitando la espuma, hasta que la carne se separe del hueso.
      - Sirve cada pollito en un cuenco con su caldo, la cebolleta picada y sal y pimienta para que cada uno sazone.

  - name: Pajeon de marisco
    health: [YELLOW, "Tortita frita de cebolleta y marisco: proteína, pero frita en aceite."]
    nutrition: [380, 18, 44, 14]
    photo: cocina-coreana/pajeon-de-marisco.jpg
    category: Entrantes
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: El haemul pajeon es el plato de los días de lluvia, con makgeolli. La salsa es de soja con vinagre.
    tags: [marisco, aperitivo]
    utensils: []
    ingredients:
      - group: Para la tortita
        items:
          - [harina de trigo, 150, g]
          - [harina de arroz o fécula de patata, 2, cucharada]
          - [agua muy fría, 250, ml]
          - [huevo, 1, null]
          - [manojo de cebolletas, 1, null]
          - ["marisco variado (gambas, calamar, mejillones)", 250, g]
          - [guindilla roja, 1, null, optional]
          - [aceite de girasol para freír, 6, cucharada]
          - [sal, 0.5, cucharadita]
      - group: Para la salsa
        items:
          - [salsa de soja, 3, cucharada]
          - [vinagre de arroz, 1, cucharada]
          - [gochugaru para la salsa, 1, cucharadita]
          - [semillas de sésamo, 1, cucharadita]
    steps:
      - Mezcla las harinas, la sal, el agua y el huevo hasta tener una masa ligera y sin grumos.
      - Calienta 3 cucharadas de aceite en una sartén grande y coloca la mitad de las cebolletas enteras en paralelo.
      - Reparte la mitad del marisco troceado y la guindilla y cubre con la mitad de la masa.
      - Fríe 4-5 minutos por cada lado, aplastando, hasta que esté crujiente. Repite con el resto.
      - Mezcla los ingredientes de la salsa y sirve la tortita cortada en cuadrados.

  - name: Arroz frito con kimchi
    health: [YELLOW, "Arroz salteado con kimchi y huevo: completo, con algo de grasa."]
    nutrition: [480, 16, 64, 17]
    photo: cocina-coreana/arroz-frito-con-kimchi.jpg
    category: Arroces
    difficulty: EASY
    prep: 10
    cook: 15
    servings: 2
    notes: El kimchi bokkeumbap aprovecha el arroz del día anterior y el kimchi que se ha pasado de ácido.
    tags: [arroz, fermentados, rápida, aprovechamiento]
    utensils: [Wok]
    ingredients:
      - items:
          - [arroz cocido del día anterior, 400, g]
          - [kimchi maduro picado, 200, g]
          - [jugo del kimchi, 3, cucharada]
          - [panceta o jamón en dados, 80, g]
          - [gochujang, 1, cucharada]
          - [mantequilla o aceite, 1, cucharada]
          - [aceite de sésamo, 1, cucharada]
          - [huevos, 2, null]
          - [alga nori en tiras, 1, null]
          - [cebolleta, 1, null]
    steps:
      - Saltea la panceta en el wok 2 minutos. Añade el kimchi y saltea 3 minutos.
      - Añade el arroz, el jugo del kimchi, el gochujang y la mantequilla y saltea a fuego fuerte 5 minutos.
      - Riega con el aceite de sésamo. Fríe los huevos aparte.
      - Sirve el arroz con un huevo encima, la cebolleta y el alga.

  - name: Dakgalbi
    health: [YELLOW, "Pollo salteado con verduras y salsa picante: proteína, con salsa dulce."]
    nutrition: [440, 36, 34, 17]
    photo: cocina-coreana/dakgalbi.jpg
    category: Carnes
    difficulty: EASY
    prep: 20
    cook: 20
    servings: 4
    notes: Plato de Chuncheon, que se cocina en la mesa en una gran plancha. Al final se saltea arroz en la salsa que queda.
    tags: [pollo, picante]
    origin: Chuncheon
    utensils: [Wok]
    ingredients:
      - items:
          - [muslos de pollo deshuesados, 700, g]
          - [col, 300, g]
          - [boniato, 1, null]
          - [cebolla, 1, null]
          - [pasteles de arroz (tteok), 150, g, optional]
          - [hojas de perilla o cebolletas, 4, null]
          - [gochujang, 3, cucharada]
          - [gochugaru, 1, cucharada]
          - [salsa de soja, 2, cucharada]
          - [azúcar, 1, cucharada]
          - [dientes de ajo, 3, null]
          - [jengibre rallado, 1, cucharadita]
          - [aceite de girasol, 2, cucharada]
    steps:
      - Mezcla el gochujang, el gochugaru, la soja, el azúcar, el ajo y el jengibre y marina el pollo en trozos 30 minutos.
      - Calienta el aceite en el wok y pon el boniato en bastones y la col y la cebolla en trozos grandes.
      - Añade el pollo con su marinada y los pasteles de arroz y saltea a fuego medio 12-15 minutos, hasta que el pollo esté hecho y el boniato tierno.
      - Añade las hojas de perilla o las cebolletas al final.

  - name: Pollo frito coreano
    health: [RED, "Pollo frito dos veces y glaseado con salsa dulce: muy calórico."]
    nutrition: [620, 36, 46, 32]
    photo: cocina-coreana/pollo-frito-coreano.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 30
    servings: 4
    notes: El yangnyeom chikin. La doble fritura es lo que lo deja crujiente aunque lleve salsa. Se acompaña de rábano encurtido.
    tags: [pollo, fritos]
    utensils: []
    ingredients:
      - group: Para el pollo
        items:
          - [alitas y muslitos de pollo, 1.2, kg]
          - [fécula de patata o maicena, 100, g]
          - [harina de trigo, 30, g]
          - [levadura química, 1, cucharadita]
          - [ajo en polvo, 1, cucharadita]
          - [sal, 1, cucharadita]
          - [aceite para freír, null, null]
      - group: Para la salsa
        items:
          - [gochujang, 3, cucharada]
          - [kétchup, 2, cucharada]
          - [miel o sirope de arroz, 3, cucharada]
          - [salsa de soja, 1, cucharada]
          - [dientes de ajo, 3, null]
          - [semillas de sésamo, 1, cucharada]
    steps:
      - Seca bien el pollo y sálalo. Mezcla la fécula, la harina, la levadura y el ajo en polvo y reboza el pollo.
      - Fríe en aceite a 160 °C 10-12 minutos y deja reposar 5 minutos sobre una rejilla.
      - Fríe de nuevo a 180 °C 3-4 minutos, hasta que esté muy crujiente.
      - Calienta los ingredientes de la salsa hasta que burbujee, mezcla con el pollo y espolvorea el sésamo.

