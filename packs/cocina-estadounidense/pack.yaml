          - [extracto de vainilla, 1, cucharadita]
          - [ralladura de limón, 1, cucharadita]
          - [huevos, 4, null]
          - [nata agria, 200, g]
    steps:
      - Precalienta el horno a 175 °C. Tritura las galletas, mézclalas con la mantequilla y presiónalas en el fondo de un molde desmontable de 23 cm. Hornea 10 minutos.
      - Baja el horno a 160 °C. Bate el queso con el azúcar y la harina a velocidad baja, sin meter aire. Añade la vainilla, la ralladura y los huevos de uno en uno, y por último la nata agria.
