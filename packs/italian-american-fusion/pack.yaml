description: >-
  The cooking of Italian immigrants in New York, New Jersey and San Francisco, more generous with
  meat, cheese and sauce than Italy's: spaghetti and meatballs, chicken parmesan, penne alla vodka,
  fettuccine Alfredo, baked ziti, shrimp scampi, cioppino and Italian wedding soup.
