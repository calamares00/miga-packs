    originCountry: MA
    tags: [vegana, legumbres]
    ingredients:
      - group: Verduras
        items:
          - [cebolla, 1, null]
          - [zanahorias, 2, null]
          - [calabacín, 1, null]
          - [nabo, 1, null]
          - [calabaza, 250, g]
          - [garbanzos cocidos, 400, g]
          - [tomate triturado, 200, g]
          - [ras el hanout, 2, cucharadita]
          - [cúrcuma, 0.5, cucharadita]
          - [caldo de verduras, 1, l]
          - [aceite de oliva, 3, cucharada]
          - [sal, null, null]
      - group: Cuscús
        items:
          - [sémola de cuscús, 300, g]
          - [mantequilla o aceite, 20, g]
          - [pasas, 40, g, optional]
    steps:
      - Sofríe la cebolla en el aceite, añade las especias y el tomate, y cocina 5 minutos.
      - Agrega la zanahoria, el nabo y el caldo, y cuece 15 minutos. Añade la calabaza, el calabacín y los garbanzos y cuece 15 minutos más. Sala.
      - Pon la sémola en un bol, cúbrela con 300 ml del caldo hirviendo y tapa 5 minutos. Suéltala con un tenedor y la mantequilla.
      - Sirve el cuscús con las verduras y su caldo por encima, y las pasas si te gustan.

  - name: Tajín de pollo con limón y aceitunas
    health: [YELLOW, "Pollo con especias, limón y aceitunas. Sabroso y con proteína, aunque los muslos con piel y las aceitunas aportan grasa y sal."]
    nutrition: [520, 38, 8, 37]
