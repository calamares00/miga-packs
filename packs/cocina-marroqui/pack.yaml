    ingredients:
      - items:
          - [harina de trigo, 300, g]
          - [sémola fina de trigo, 100, g]
          - [sal, 1, cucharadita]
          - [azúcar, 1, cucharadita]
          - [agua templada, 250, ml]
          - [aceite, 60, ml]
          - [mantequilla blanda, 50, g]
          - [sémola fina para espolvorear, 3, cucharada]
    steps:
      - Amasa la harina, la sémola, la sal, el azúcar y el agua 10 minutos, hasta tener una masa muy elástica. Divídela en 8 bolas, úntalas de aceite y deja reposar 15 minutos.
      - Con las manos aceitadas, estira cada bola hasta que quede muy fina y transparente. Úntala con mantequilla y espolvorea sémola.
      - Dobla los lados hacia el centro en tercios y luego de arriba abajo, formando un cuadrado. Aplánalo con la mano.
      - Cocina en la plancha a fuego medio 3-4 minutos por lado, hasta que esté dorado y hojaldrado.

