    steps:
      - Remoja el bulgur en agua fría 15 minutos y escúrrelo bien.
      - Pica muy fino el perejil y la hierbabuena, bien secos, con un cuchillo afilado.
      - Corta el tomate en dados pequeños y la cebolleta muy fina.
      - Mezcla todo con el limón, el aceite y sal justo antes de servir.

  - name: Falafel
    health: [YELLOW, "Garbanzos y hierbas muy sanos, pero las bolas van fritas en aceite. Al horno serían más ligeras."]
    nutrition: [380, 14, 40, 18]
    photo: cocina-mediterranea/falafel.jpg
    category: Legumbres
    difficulty: MEDIUM
    prep: 20
    cook: 15
    servings: 4
    origin: Oriente Próximo
    tags: [vegana, fritura]
    utensils: [Robot de cocina]
    notes: Los garbanzos deben ser secos y remojados, no cocidos; si no, el falafel se deshace.
    ingredients:
      - items:
          - [garbanzos secos remojados 24 horas, 250, g]
          - [cebolla, 0.5, null]
          - [ajo, 2, diente]
          - [perejil fresco, 1, manojo]
          - [cilantro fresco, 0.5, manojo]
          - [comino molido, 1, cucharadita]
          - [cilantro molido, 1, cucharadita]
          - [bicarbonato, 0.5, cucharadita]
          - [sal, 1, cucharadita]
          - [aceite de girasol para freír, 500, ml]
    steps:
      - Escurre muy bien los garbanzos y tritúralos con la cebolla, el ajo, las hierbas y las especias hasta tener una textura de arena gruesa.
      - Añade la sal y el bicarbonato y refrigera la masa 30 minutos.
      - Forma bolitas o discos del tamaño de una nuez.
      - Fríelas en aceite a 175 °C 3-4 minutos, hasta que estén doradas. Escúrrelas.
      - Sirve en pan de pita con ensalada y salsa de tahini o tzatziki.

  - name: Shakshuka
    health: [GREEN, "Huevos en salsa de tomate y pimiento con especias: proteína y verdura. Muy equilibrado."]
    nutrition: [380, 17, 21, 25]
    photo: cocina-mediterranea/shakshuka.jpg
    category: Huevos
    difficulty: EASY
    prep: 10
    cook: 25
    servings: 2
    origin: Túnez
    originCountry: TN
    tags: [vegetariana, sin gluten, desayuno]
    ingredients:
      - items:
          - [huevos, 4, null]
          - [tomate triturado, 400, g]
          - [pimiento rojo, 1, null]
          - [cebolla, 1, null]
          - [ajo, 2, diente]
          - [comino molido, 1, cucharadita]
          - [pimentón dulce, 1, cucharadita]
          - [harissa o chile, 1, cucharadita, optional]
          - [aceite de oliva, 3, cucharada]
          - [cilantro o perejil fresco, null, null]
          - [sal, null, null]
    steps:
      - Sofríe la cebolla y el pimiento en tiras en el aceite 10 minutos.
      - Añade el ajo y las especias, remueve 1 minuto y agrega el tomate y la harissa. Cocina 10 minutos y sala.
      - Haz cuatro huecos en la salsa y casca un huevo en cada uno.
      - Tapa y cocina a fuego suave 6-8 minutos, hasta que las claras cuajen y las yemas sigan líquidas.
      - Sirve con cilantro y pan para mojar.

  - name: Cuscús de verduras
    health: [GREEN, "Cuscús con muchas verduras y garbanzos: fibra, proteína vegetal y poca grasa."]
    nutrition: [560, 18, 94, 13]
    photo: cocina-mediterranea/cuscus-de-verduras.jpg
