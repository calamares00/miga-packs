name: Barbecue
series: Specials
family: barbacoa
description: >-
  Recipes for a summer party around the barbecue or grill: Iberian pork burgers, ribs, chicken
  and vegetable skewers, Iberian pork secreto, lamb chops, grilled salmon and sardines, corn on
  the cob, foil-baked potatoes, grilled vegetables, homemade barbecue sauce, tomato and tuna
  belly salad and, for dessert, grilled pineapple and bananas. Almost everything also works on a
  griddle or under the oven grill.
author: Miga
authorGithub: calamares00
