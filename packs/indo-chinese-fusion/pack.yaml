description: >-
  Indo-Chinese cooking, born among the Hakka Chinese of Kolkata and now at every street stall in
  India: gobi manchurian, chilli chicken, Hakka noodles, Schezwan fried rice, chilli paneer,
  manchow soup, sweetcorn soup and honey chilli potatoes.
