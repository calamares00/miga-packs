description: >-
  Recetas para no tirar nada: lo que sobra del cocido, el pollo asado de ayer, el pan duro, el
  pescado de la cena, las verduras que se ablandan y la fruta demasiado madura. Ropa vieja,
  croquetas de cocido, lasaña de pollo asado, canelones de carne asada, empanadillas, pastel de
  puré y carne, huevos al horno con verduras, pastel de pescado, batido y mermelada de fruta
  madura, caldo de pieles de verdura y picatostes.
