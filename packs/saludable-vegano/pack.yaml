          - [cebolla, 1, null]
          - [puerro, 1, null]
          - [zanahorias, 2, null]
          - [pimiento rojo, 1, null]
          - [calabacín, 1, null]
          - [ajo, 2, diente]
          - [tomate triturado, 200, g]
          - [pimentón dulce, 1, cucharadita]
          - [caldo de verduras, 600, ml]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - "Pocha la cebolla, el puerro, el pimiento y el ajo picados en el aceite 10 minutos."
      - "Añade la zanahoria en rodajas, el pimentón y el tomate y cocina 3 minutos."
      - Agrega el caldo y cuece 10 minutos. Añade el calabacín en dados y las alubias y cuece 12 minutos más. Sala.

  - name: Mousse de chocolate y aguacate
    health: [YELLOW, "Postre de aguacate y cacao con poco azúcar: grasas saludables, pero calórico."]
    nutrition: [260, 4, 22, 18]
    photo: saludable-vegano/mousse-de-chocolate-y-aguacate.jpg
    category: Postres
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 4
    tags: [postre, vegano, sin gluten, sin cocción]
    utensils: [Batidora]
    ingredients:
      - items:
          - [aguacates maduros, 2, null]
          - [cacao puro en polvo, 4, cucharada]
          - [sirope de arce o dátiles, 4, cucharada]
          - [bebida vegetal, 60, ml]
          - [vainilla, 1, cucharadita]
          - [sal, 1, pizca]
          - [frambuesas para servir, 100, g]
    steps:
      - "Tritura la pulpa de los aguacates con el cacao, el sirope, la bebida, la vainilla y la sal hasta que quede muy cremoso."
      - Prueba y ajusta el dulzor.
      - Reparte en vasitos y enfría 1 hora. Sirve con frambuesas.
