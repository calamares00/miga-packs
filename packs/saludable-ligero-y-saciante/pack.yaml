language: es
name: "Cocina saludable: ligero y saciante"
series: Cocina saludable
description: >-
  Platos de menos de 450 kcal por ración que llenan de verdad, con proteína magra, verdura y fibra:
  merluza en papillote, ensalada niçoise, brochetas de pollo con yogur, sopa de pollo y verduras,
  bacalao al horno con tomate, wok de gambas, pavo relleno de espinacas, crema fría de pepino,
  hamburguesas de pollo y calabacín y ensalada de pollo, mango y aguacate.
