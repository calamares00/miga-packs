  Dishes without meat or fish, with eggs, dairy, pulses and plenty of vegetables, complete in
  protein: vegetable frittata, aubergines stuffed with quinoa and feta, peppers stuffed with brown
  rice, black bean burgers, lentil salad with feta, crustless spinach quiche, courgettes stuffed
  with ricotta, cauliflower baked with yoghurt, couscous with vegetables and halloumi and baked
  eggs with spinach.
