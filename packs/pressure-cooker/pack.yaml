id: pressure-cooker
version: 1
updated: 2026-11-13
language: en
name: Pressure cooker
series: Kitchen appliances
family: olla-expres
description: >-
  Long stews in half or a third of the time with the pressure cooker: Madrid-style tripe, beef
  and potato stew, pork knuckle, ox tongue in sauce, pig's trotters, chicken in beer, larded beef,
  Asturian beans with clams, pinto beans with chorizo, cuttlefish with potatoes, soupy chicken
  rice and garlic rabbit. Times are counted from when the cooker reaches pressure (second ring or
  high pressure). Never fill it more than two-thirds full, or half full with pulses.
author: Miga
authorGithub: calamares00
