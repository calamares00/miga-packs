description: >-
  La cocina de los inmigrantes cantoneses en Perú, que desde el barrio chino de Lima llegó a todo
  el país con el wok, la soja y los productos peruanos: tallarín saltado, chi jau kay, kam lu
  wantán, aeropuerto, pollo enrollado, wantanes fritos, chancho con tamarindo y sopa fuchifú.
