      - items:
          - [carrots, 600, g]
          - [garlic cloves, 2, null]
          - [ground cumin, 1, tsp]
          - [sweet paprika, 0.5, tsp]
          - [ground cinnamon, 1, pinch]
          - [lemon juice, 1, tbsp]
