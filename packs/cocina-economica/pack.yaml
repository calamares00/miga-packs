description: >-
  Platos completos con ingredientes baratos y de temporada, de los de toda la vida: judías verdes
  con patatas, patatas a la importancia, arroz con verduras, espaguetis con atún, pollo guisado
  con patatas, huevos a la flamenca, empanadillas de atún, caballa al horno, hígado encebollado,
  sopa de cebolla, coliflor al ajoarriero y pasta con brócoli. Con trucos para abaratar en las
  notas.
