    steps:
      - Pon la cebolla y el ajo en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 6 min/120 °C/vel 1.
      - Añade el pavo salpimentado y programa 6 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el vino y programa 2 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade las zanahorias, las patatas, el caldo, el romero y la sal y programa 20 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade los guisantes y programa 5 min/100 °C/giro a la izquierda/vel cuchara.

  - name: Menestra de verduras
    health: [GREEN, "Muchas verduras de temporada con un poco de jamón: ligera, rica en fibra y vitaminas."]
    nutrition: [210, 10, 22, 9]
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    notes: Programado para Thermomix TM6. Las verduras se cuecen al vapor en el Varoma y el cestillo, así no pierden color. Sin jamón es vegetariana.
    tags: [verduras, ligero]
    utensils: [Thermomix]
    ingredients:
      - group: Verduras al vapor
        items:
          - [judías verdes troceadas, 200, g]
          - [zanahorias en rodajas, 2, null]
          - [coliflor en ramilletes, 200, g]
          - [alcachofas en conserva, 6, null]
          - [guisantes, 100, g]
          - [agua, 700, g]
      - group: Para el sofrito
        items:
          - [cebolla, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 30, g]
          - [taquitos de jamón serrano, 60, g, optional]
          - [harina, 1, cucharada]
          - [sal, null, null]
    steps:
      - Pon el agua en el vaso. Coloca las zanahorias y la coliflor en el cestillo y las judías en el recipiente Varoma. Programa 20 min/Varoma/vel 1.
      - Añade los guisantes al Varoma y programa 5 min/Varoma/vel 1. Reserva las verduras y 200 g del caldo; vacía el vaso.
      - Pon la cebolla y el ajo en el vaso y pica 4 seg/vel 5. Añade el aceite y el jamón y sofríe 6 min/120 °C/vel 1.
      - Añade la harina y programa 1 min/120 °C/vel 1. Añade el caldo reservado y programa 3 min/100 °C/vel 2.
      - Pon todas las verduras y las alcachofas en una fuente, vierte la salsa por encima y mezcla con cuidado. Ajusta de sal.

  - name: Risotto de gambas
    health: [YELLOW, "Arroz con gambas y algo de queso y mantequilla: rico en hidratos, mejor en raciones moderadas."]
    nutrition: [470, 24, 66, 12]
    category: Arroces
    difficulty: EASY
    prep: 10
    cook: 25
    servings: 4
    notes: "Programado para Thermomix TM6. La mariposa no hace falta: el giro a la izquierda remueve el arroz sin romperlo."
    tags: [arroz, marisco]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [chalota, 1, null]
          - [diente de ajo, 1, null]
          - [aceite de oliva virgen extra, 30, g]
          - [arroz para risotto (arborio o carnaroli), 320, g]
          - [vino blanco, 80, g]
          - [caldo de pescado caliente, 850, g]
          - [gambas peladas, 300, g]
          - [mantequilla, 20, g]
          - [parmesano rallado, 40, g]
          - [perejil picado, 1, cucharada]
          - [sal, null, null]
    steps:
      - Pon la chalota y el ajo en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 4 min/120 °C/vel 1.
      - Añade el arroz y programa 2 min/120 °C/giro a la izquierda/vel cuchara para nacararlo.
      - Añade el vino y programa 1 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el caldo y programa 13 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade las gambas y programa 3 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade la mantequilla y el parmesano, mezcla 20 seg/giro a la izquierda/vel cuchara y deja reposar 2 minutos. Sirve con perejil.

  - name: Sopa de picadillo
    health: [GREEN, "Caldo casero con huevo, jamón y fideos: reconfortante, ligero y con proteína."]
    nutrition: [240, 16, 24, 8]
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 50
    servings: 4
    notes: Programado para Thermomix TM6. Si tienes caldo de cocido, sáltate los primeros pasos y empieza por los fideos.
    tags: [sopa, cuchara, invierno]
    utensils: [Thermomix]
    ingredients:
      - group: Para el caldo
        items:
          - [carcasa de pollo, 1, null]
          - [hueso de jamón, 1, null]
          - [puerro, 1, null]
          - [zanahoria, 1, null]
          - [rama de apio, 1, null]
          - [agua, 1400, g]
      - group: Para el picadillo
        items:
          - [fideos finos, 80, g]
          - [huevos cocidos, 2, null]
          - [taquitos de jamón serrano, 60, g]
          - [hierbabuena, null, null, optional]
          - [sal, null, null]
    steps:
      - Pon en el vaso todos los ingredientes del caldo y programa 40 min/100 °C/giro a la izquierda/vel cuchara.
      - Cuela el caldo, desecha los huesos y las verduras y vuelve a poner el caldo en el vaso. Ajusta de sal.
      - Añade los fideos y programa el tiempo que indique el paquete/100 °C/giro a la izquierda/vel cuchara.
      - Sirve con el huevo cocido y el jamón picados y, si te gusta, una hoja de hierbabuena.

  - name: Carrillada al vino tinto
    health: [YELLOW, "Carne muy tierna y sabrosa, con una salsa de vino reducida: mejor en ocasiones especiales."]
    nutrition: [520, 40, 14, 30]
    category: Carnes
    difficulty: MEDIUM
    prep: 15
    cook: 100
    servings: 4
    notes: "Programado para Thermomix TM6. La carrillada necesita tiempo: si después de 90 minutos aún no está tierna, programa 15 minutos más."
    tags: [guiso, cerdo, ocasión especial]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [zanahorias, 2, null]
          - [puerro, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 40, g]
          - [carrilleras de cerdo limpias, 800, g]
          - [harina, 1, cucharada]
          - [vino tinto, 250, g]
          - [caldo de carne, 200, g]
          - [hoja de laurel, 1, null]
          - [tomillo seco, 0.5, cucharadita]
          - [sal, 1, cucharadita]
    steps:
      - Pon la cebolla, las zanahorias, el puerro y el ajo en trozos en el vaso y pica 4 seg/vel 5. Añade el aceite y sofríe 10 min/120 °C/vel 1.
      - Añade las carrilleras enharinadas y salpimentadas y programa 6 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el vino y programa 5 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el caldo, el laurel, el tomillo y la sal y programa 90 min/98 °C/giro a la izquierda/vel cuchara.
      - Saca las carrilleras. Quita el laurel, tritura la salsa 30 seg/vel 5-10 subiendo poco a poco y vierte sobre la carne. Sirve con puré de patatas.

  - name: Calamares con patatas
    health: [GREEN, "Calamar con patatas en un guiso de cuchara: proteína magra y poca grasa."]
    nutrition: [380, 28, 40, 11]
