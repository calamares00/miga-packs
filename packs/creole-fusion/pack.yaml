description: >-
  The Creole cooking of New Orleans, where France, Spain, West Africa and the Caribbean met: shrimp
  Creole, red beans and rice, crawfish étouffée, grillades and grits, dirty rice, muffuletta,
  beignets and bread pudding with whiskey sauce.
