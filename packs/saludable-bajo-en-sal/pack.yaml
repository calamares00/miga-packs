name: "Cocina saludable: bajo en sal"
series: Cocina saludable
family: saludable-bajo-en-sal
description: >-
  Recetas sin sal añadida o con muy poca, que ganan sabor con hierbas, especias, ajo, cítricos y
  vinagres, y sin ingredientes muy salados como embutidos, quesos curados o salsas de soja: pollo
  marinado al limón, lubina con hinojo y naranja, solomillo con manzana, crema de puerros y
  manzana, ensalada de arroz integral, verduras asadas especiadas, tortilla de calabacín, pan sin
  sal con semillas, salsa de tomate casera y peras asadas.
