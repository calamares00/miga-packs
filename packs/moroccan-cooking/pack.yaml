  - name: Carrot salad with cumin
    health: [GREEN, "Cooked carrots with spices: fibre and vitamin A with very little fat."]
    nutrition: [110, 1, 13, 6]
    category: Salads
    difficulty: EASY
    prep: 10
    cook: 10
    servings: 4
