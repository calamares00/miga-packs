    ingredients:
      - items:
          - [glutinous rice flour, 200, g]
          - [lukewarm water, 150, ml]
          - [pandan extract, 0.5, tsp]
          - [palm sugar, 80, g]
          - [desiccated coconut, 100, g]
          - [salt, 1, pinch]
    steps:
      - Mix the coconut with the salt and steam it for 5 minutes to soften it.
      - Mix the flour with the water and pandan extract into a smooth, pliable dough. If it cracks, add a little more water.
      - Chop the palm sugar into small pieces. Take walnut-sized pieces of dough, flatten them, put a piece of sugar in the middle and seal into a ball.
      - Cook them in boiling water until they float and 1 minute more.
      - Drain and roll them in the coconut.

