      - Put the onion in the bowl and chop 5 sec/speed 5.
      - Add the butter and sauté 5 min/100°C/speed 1.
      - Add the celeriac, potato and peeled apple in pieces and chop 5 sec/speed 5.
      - Add the stock and salt and cook 25 min/100°C/speed 1.
      - Add the cream and blend 1 min/speed 5-10, increasing gradually.

  - name: White bean soup
    category: Legumes
    difficulty: EASY
    prep: 5
    cook: 20
    servings: 4
    notes: Programmed for the Thermomix TM6. Made with cooked beans, from a jar or left over from the day before.
    tags: [soup, vegan]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [onion, 1, null]
          - [garlic, 2, clove]
          - [extra virgin olive oil, 40, g]
          - [fresh rosemary, 1, sprig]
          - [drained cooked white beans, 600, g]
          - [vegetable stock, 600, g]
          - [salt, 1, tsp]
    steps:
      - Put the onion and garlic in the bowl and chop 5 sec/speed 5.
      - Add the oil and rosemary leaves and sauté 5 min/120°C/speed 1.
      - Add the beans, stock and salt and cook 12 min/100°C/speed 1.
      - Blend 1 min/speed 5-10, increasing gradually, and serve with a drizzle of oil.

  - name: Beetroot soup
    category: Soups
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programmed for the Thermomix TM6. Serve with a spoonful of yoghurt or soured cream and dill.
    tags: [soup, vegetarian]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [onion, 1, null]
          - [extra virgin olive oil, 30, g]
          - [cooked beetroot, 400, g]
          - [potato, 200, g]
          - [vegetable stock, 600, g]
          - [cider vinegar, 1, tbsp]
          - [salt, 1, tsp]
          - [Greek yoghurt, 4, tbsp, optional]
    steps:
      - Put the onion in the bowl and chop 5 sec/speed 5.
      - Add the oil and sauté 5 min/120°C/speed 1.
      - Add the beetroot and potato in pieces, the stock and salt and cook 20 min/100°C/speed 1.
      - Add the vinegar and blend 1 min/speed 5-10, increasing gradually. Serve with a spoonful of yoghurt.
