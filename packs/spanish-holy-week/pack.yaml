description: >-
  The recipes of Lent and Holy Week in Spain: fried sweets such as pestiños, cream puffs, rosette
  fritters and bartolillos, the Easter mona cake and the hornazo, and the Lenten salt cod dishes
  (Biscay-style, soldaditos de Pavía, fritters, omelette, potatoes with cod and cod and raisin
  empanada). Torrijas and the Lenten chickpea stew are already in other packs.
