      - Fríe el comino y el laurel en el aceite. Añade la cebolla rallada o muy picada y dórala 10 minutos.
      - "Agrega la pasta de jengibre y ajo, el cilantro molido y el chile, y luego el tomate. Cuece 10 minutos."
      - "Incorpora las alubias escurridas y 400 ml de agua. Cuece 20 minutos a fuego suave, aplastando algunas alubias para espesar."
      - Termina con el garam masala y sal. Sirve con arroz blanco.

