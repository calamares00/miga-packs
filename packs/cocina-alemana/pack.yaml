name: "Cocina del mundo: Alemania"
description: >-
  Los clásicos de la cocina alemana de norte a sur: schnitzel, rouladen, sauerbraten, ensalada de
  patata suaba, bratkartoffeln, kartoffelpuffer, käsespätzle, königsberger klopse, currywurst,
  frikadellen, potajes de lentejas y de guisantes, sopa de patata, flammkuchen, brezeln,
  maultaschen, obatzda y postres como el pastel de manzana, la tarta Selva Negra y la rote grütze.
