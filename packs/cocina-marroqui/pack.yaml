  - name: Cuscús con siete verduras
    health: [GREEN, "Sémola con muchas verduras y garbanzos: completo y con mucha fibra."]
    nutrition: [560, 28, 78, 15]
    photo: cocina-marroqui/cuscus-con-siete-verduras.jpg
    category: Pastas
    difficulty: MEDIUM
    prep: 30
    cook: 75
    servings: 6
    notes: El cuscús de los viernes. La sémola se cuece al vapor sobre el guiso en una cuscusera; con sémola precocida basta hidratarla con el caldo.
    tags: [cuscús, verduras, plato único]
    utensils: [Vaporera]
    ingredients:
      - items:
          - [carne de cordero o ternera en trozos, 600, g]
          - [cuscús de grano medio, 500, g]
          - [garbanzos cocidos, 400, g]
          - [cebollas, 2, null]
          - [tomates, 2, null]
          - [zanahorias, 3, null]
          - [nabos, 2, null]
          - [calabacines, 2, null]
          - [trozo de calabaza, 400, g]
          - [col pequeña, 0.5, null]
          - [jengibre molido, 1, cucharadita]
          - [cúrcuma, 1, cucharadita]
          - [pimienta negra, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [manojo de cilantro y perejil, 1, null]
          - [aceite de oliva, 4, cucharada]
          - [mantequilla, 40, g]
          - [sal, null, null]
    steps:
      - En la parte baja de la cuscusera, rehoga la carne con la cebolla, el tomate, las especias, el aceite y las hierbas atadas 10 minutos. Cubre con 2 litros de agua y cuece 40 minutos.
      - Añade las zanahorias, los nabos y la col y cuece 15 minutos; luego el calabacín, la calabaza y los garbanzos, 15 minutos más.
      - Mientras, moja el cuscús con un vaso de agua con sal, sepáralo con los dedos y cuécelo al vapor en la parte de arriba 15 minutos. Repítelo dos veces más, mojando y separando entre vapores.
      - Mezcla el cuscús con la mantequilla, ponlo en una fuente en forma de montaña con la carne en el centro y las verduras alrededor y riégalo con caldo.

  - name: Harira
    health: [GREEN, "Sopa de legumbres, tomate y carne: mucha fibra y proteína."]
    nutrition: [340, 20, 46, 9]
    photo: cocina-marroqui/harira.jpg
    category: Sopas y cremas
    difficulty: MEDIUM
    prep: 20
    cook: 75
    servings: 6
    notes: La sopa con la que se rompe el ayuno en Ramadán, acompañada de dátiles y chebakia. Pon los garbanzos secos a remojo la noche antes.
    tags: [sopa, legumbres, ramadán]
    utensils: [Olla exprés]
    ingredients:
      - items:
          - [carne de cordero o ternera en dados pequeños, 250, g]
          - [garbanzos secos remojados, 150, g]
          - [lentejas, 100, g]
          - [cebolla, 1, null]
          - [ramas de apio, 2, null]
          - [tomates maduros triturados, 500, g]
          - [concentrado de tomate, 2, cucharada]
          - [manojo de cilantro y perejil picados, 1, null]
          - [jengibre molido, 1, cucharadita]
          - [cúrcuma, 1, cucharadita]
          - [canela molida, 0.5, cucharadita]
          - [fideos finos, 50, g]
          - [harina, 3, cucharada]
          - [aceite de oliva, 2, cucharada]
          - [limones para servir, 2, null]
          - [sal, null, null]
    steps:
      - Rehoga la carne con la cebolla y el apio picados, las especias, la mitad de las hierbas y el aceite 5 minutos.
      - Añade los garbanzos y 2 litros de agua y cuece 40 minutos (15 en olla exprés).
      - Añade las lentejas, el tomate y el concentrado y cuece 30 minutos más.
      - Disuelve la harina en un vaso de agua fría y viértela poco a poco removiendo para espesar. Añade los fideos y el resto de las hierbas y cuece 5 minutos. Sala.
      - Sirve con limón para exprimir.

  - name: Pastela de pollo
    health: [RED, "Hojaldre de pasta brick con pollo, almendra y azúcar: muy calórica."]
    nutrition: [640, 32, 52, 34]
    photo: cocina-marroqui/pastela-de-pollo.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 45
    cook: 90
    servings: 8
    notes: La bastela, el plato de fiesta de Fez, dulce y salada a la vez. Se hace tradicionalmente con pichón.
    tags: [fiesta, horno, pollo]
    origin: Fez
    utensils: [Horno]
    ingredients:
      - group: Para el relleno
        items:
          - [muslos de pollo, 1.2, kg]
          - [cebollas, 3, null]
          - [manojo de perejil y cilantro picados, 1, null]
          - [jengibre molido, 1, cucharadita]
          - [canela molida, 1, cucharadita]
          - [ras el hanout, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [huevos, 6, null]
          - [mantequilla, 50, g]
          - [sal, null, null]
      - group: Para la almendra y el montaje
        items:
          - [almendras crudas peladas, 250, g]
          - [azúcar glas, 60, g]
          - [canela molida para la almendra, 1, cucharadita]
          - [agua de azahar, 1, cucharada]
          - [hojas de pasta brick, 12, null]
          - [mantequilla derretida para pintar, 80, g]
          - [azúcar glas y canela para decorar, null, null]
    steps:
      - Cuece el pollo con la cebolla rallada, las especias, las hierbas, la mantequilla y un vaso de agua tapado 1 hora. Saca el pollo, deshílalo sin piel ni huesos.
      - Reduce la salsa a la mitad, añade los huevos batidos y remueve a fuego bajo hasta que cuajen en grumos. Escurre.
      - Fríe o tuesta las almendras, pícalas gruesas y mézclalas con el azúcar, la canela y el azahar.
      - Precalienta el horno a 180 °C. Forra un molde redondo con 8 hojas de brick pintadas con mantequilla, solapadas y colgando por fuera.
      - Pon capas de huevo, pollo y almendra, cubre con las hojas que cuelgan y 4 más pintadas y mete los bordes por debajo.
      - Hornea 30 minutos, hasta que esté dorada. Decora con azúcar glas y líneas de canela.

  - name: Tajín de cordero con ciruelas
    health: [YELLOW, "Cordero con fruta seca y miel: proteína y hierro, pero dulce y con grasa."]
    nutrition: [620, 38, 46, 32]
    photo: cocina-marroqui/tajin-de-cordero-con-ciruelas.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 120
    servings: 6
    notes: El tajín de fiesta, con almendras fritas y sésamo por encima. Se puede hacer en una cazuela de fondo grueso.
    tags: [tajín, cordero, fiesta]
    utensils: []
    ingredients:
      - items:
          - [paletilla o cuello de cordero en trozos, 1.5, kg]
          - [cebollas, 2, null]
          - [ciruelas pasas, 250, g]
          - [miel, 3, cucharada]
          - [canela en rama, 1, null]
          - [canela molida, 1, cucharadita]
          - [jengibre molido, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [mantequilla, 30, g]
          - [aceite de oliva, 3, cucharada]
          - [almendras peladas, 80, g]
          - [semillas de sésamo tostado, 1, cucharada]
          - [sal, null, null]
    steps:
      - Pon en el tajín o la cazuela el cordero con la cebolla rallada, las especias, el aceite, la mantequilla, sal y un vaso de agua. Tapa y cuece a fuego suave 1 hora y media, hasta que la carne esté tierna.
      - Hidrata las ciruelas en agua templada 15 minutos y cuécelas aparte con la miel, la canela en rama y un poco de caldo del guiso hasta que estén glaseadas.
      - Fríe las almendras en un poco de aceite hasta que estén doradas.
      - Reduce la salsa del cordero si está muy líquida y sírvelo con las ciruelas por encima, las almendras y el sésamo.

  - name: Tajín de kefta con huevos
    health: [YELLOW, "Albóndigas en salsa de tomate con huevo: mucha proteína, algo de grasa."]
    nutrition: [480, 34, 12, 33]
    category: Carnes
    difficulty: EASY
    prep: 20
    cook: 35
    servings: 4
    notes: Se come directamente del tajín mojando pan khobz.
    tags: [tajín, albóndigas, huevos]
    utensils: []
    ingredients:
      - group: Para la kefta
        items:
          - [carne picada de ternera y cordero, 500, g]
          - [cebolla pequeña rallada, 1, null]
          - [perejil y cilantro picados, 3, cucharada]
          - [comino molido, 1, cucharadita]
          - [pimentón dulce, 1, cucharadita]
          - [sal, null, null]
      - group: Para la salsa
        items:
          - [tomates maduros rallados, 800, g]
          - [dientes de ajo, 3, null]
          - [comino molido para la salsa, 1, cucharadita]
          - [pimentón dulce para la salsa, 1, cucharadita]
          - [guindilla, 1, pizca, optional]
          - [aceite de oliva, 3, cucharada]
          - [huevos, 4, null]
    steps:
      - Mezcla los ingredientes de la kefta y forma albóndigas pequeñas del tamaño de una nuez.
      - En el tajín o una sartén honda, cuece el tomate con el ajo picado, las especias, el aceite y sal 15 minutos.
      - Añade las albóndigas y cuece tapado 15 minutos.
      - Casca los huevos encima, tapa y deja 5 minutos, hasta que la clara cuaje. Espolvorea perejil.

  - name: Tajín de pescado
    health: [GREEN, "Pescado blanco con verduras y chermoula: mucha proteína y poca grasa."]
    nutrition: [380, 34, 28, 14]
    photo: cocina-marroqui/tajin-de-pescado.jpg
    category: Pescados y mariscos
    difficulty: MEDIUM
    prep: 30
    cook: 40
    servings: 4
    notes: La chermoula es el adobo de hierbas y especias de la costa marroquí. Deja marinar el pescado al menos 1 hora.
    tags: [tajín, pescado, sin gluten]
    utensils: []
    ingredients:
      - group: Para la chermoula
        items:
          - [manojo de cilantro y perejil, 1, null]
          - [dientes de ajo, 4, null]
          - [comino molido, 1, cucharadita]
          - [pimentón dulce, 2, cucharadita]
          - [zumo de limón, 1, null]
          - [aceite de oliva, 5, cucharada]
          - [sal, null, null]
      - group: Para el tajín
        items:
          - ["pescado blanco en rodajas (merluza, corvina o dorada)", 1, kg]
          - [patatas, 3, null]
          - [tomates, 3, null]
          - [pimiento verde, 1, null]
          - [zanahoria, 1, null]
          - [aceitunas verdes, 80, g]
          - [limón en conserva, 1, null]
    steps:
      - Tritura los ingredientes de la chermoula y marina el pescado con la mitad al menos 1 hora.
      - Pon en el fondo del tajín las patatas y la zanahoria en rodajas finas, encima el tomate y el pimiento en tiras, y riega con el resto de la chermoula y medio vaso de agua.
      - Tapa y cuece a fuego suave 20 minutos.
      - Coloca el pescado encima con las aceitunas y el limón en conserva en tiras, tapa y cuece 15 minutos más.

  - name: Zaalouk
    health: [GREEN, "Berenjena y tomate con especias y aceite de oliva: ligero y con fibra."]
    nutrition: [150, 3, 14, 10]
    photo: cocina-marroqui/zaalouk.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 4
    notes: Ensalada cocinada que se toma templada o fría, con pan. Asar la berenjena al fuego le da un sabor ahumado.
    tags: [berenjena, vegana, sin gluten]
    utensils: []
    ingredients:
      - items:
          - [berenjenas, 2, null]
          - [tomates maduros, 4, null]
          - [dientes de ajo, 3, null]
          - [comino molido, 1, cucharadita]
          - [pimentón dulce, 1, cucharadita]
          - [cilantro y perejil picados, 3, cucharada]
          - [aceite de oliva virgen extra, 4, cucharada]
          - [zumo de limón, 1, cucharada]
          - [sal, null, null]
    steps:
      - Asa las berenjenas enteras en el horno o al fuego hasta que estén blandas. Pélalas y pícalas.
      - Pela y ralla los tomates y cuécelos con el ajo picado, las especias y el aceite 10 minutos.
      - Añade la berenjena y cocina aplastando con un tenedor 15 minutos, hasta que quede un puré con textura.
      - Añade las hierbas y el limón, sala y sirve templado o frío.

