          - [cacao puro en polvo, 1, cucharada]
          - [sal, 1, pizca]
          - [nueces troceadas, 50, g, optional]
    steps:
      - Funde el chocolate con la mantequilla al baño maría o en el microondas (en tandas de 30 segundos) y deja que se temple.
      - Bate los huevos con el azúcar, añade el chocolate y después la harina, el cacao y la sal tamizados. Incorpora las nueces.
      - Vierte en el molde engrasado y cocina a 160 °C durante 16-18 minutos. Debe quedar algo húmedo en el centro.
      - Deja que se enfríe antes de cortarlo en cuadrados.
