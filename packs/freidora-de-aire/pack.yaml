      - Colócalos en la cesta sin amontonarlos y rocíalos con aceite.
      - Cocina a 200 °C durante 10 minutos, dándoles la vuelta con cuidado a mitad de tiempo.

  - name: Coles de Bruselas crujientes
    health: [GREEN, "Verdura rica en fibra con poco aceite. La miel añade algo de azúcar, pero el plato sigue siendo ligero."]
    nutrition: [150, 5, 16, 7]
    photo: freidora-de-aire/coles-de-bruselas-crujientes.jpg
