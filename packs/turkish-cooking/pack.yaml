    steps:
      - Cut the tomato, cucumber, pepper and onion into small dice.
      - Mix with the parsley.
      - Dress with the lemon, oil, salt and sumac and serve at once.

  - name: Künefe
    health: [RED, "Kadaif pastry with cheese, butter and syrup: very sweet and rich."]
    nutrition: [520, 13, 58, 27]
    photo: cocina-turca/kunefe.jpg
    category: Desserts
    difficulty: MEDIUM
    prep: 20
    cook: 25
    servings: 4
    notes: The sweet of Hatay, eaten straight from the oven with the cheese melted. Use an unsalted cheese that stretches.
    tags: [dessert, cheese]
    origin: Hatay
    utensils: [Oven]
    ingredients:
      - group: For the syrup
        items:
          - [sugar, 200, g]
          - [water, 150, ml]
          - [lemon juice, 1, tsp]
      - group: For the künefe
        items:
          - [kadaif pastry, 250, g]
          - [melted butter, 100, g]
          - [unsalted melting cheese (drained fresh mozzarella), 200, g]
          - [chopped pistachios, 2, tbsp]
    steps:
      - Boil the sugar with the water for 10 minutes, add the lemon and leave to cool.
      - Pull the kadaif apart with your fingers and mix it with the butter.
      - Heat the oven to 200 °C. Press half the pastry into a 22 cm tin, cover with the cheese, then the rest of the pastry, pressing down.
      - Bake for 20-25 minutes, until golden. Turn out onto a plate, pour over the cold syrup and sprinkle with pistachios. Serve hot.

  - name: Revani
    health: [RED, "Semolina sponge soaked in syrup: very sweet."]
    nutrition: [360, 6, 58, 12]
    photo: cocina-turca/revani.jpg
    category: Desserts
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 12
    notes: An Ottoman semolina cake. The cold syrup goes over the hot cake so it soaks it up well.
    tags: [dessert, cake]
    utensils: [Oven, Blender]
    ingredients:
      - group: For the syrup
        items:
          - [sugar, 300, g]
          - [water, 500, ml]
          - [lemon juice, 1, tbsp]
      - group: For the cake
        items:
          - [eggs, 4, null]
          - [sugar for the cake, 150, g]
          - [plain yoghurt, 125, g]
          - [sunflower oil, 100, ml]
          - [fine semolina, 200, g]
          - [plain flour, 100, g]
