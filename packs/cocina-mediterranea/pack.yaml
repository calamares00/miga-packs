    originCountry: ES
    tags: [vegana, sin gluten, verduras]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [pimiento rojo, 1, null]
          - [calabacines, 2, null]
          - [tomate triturado, 400, g]
          - [aceite de oliva virgen extra, 5, cucharada]
          - [azúcar, 1, cucharadita, optional]
          - [sal, null, null]
          - [huevos fritos, 4, null, optional]
    steps:
      - Corta todas las verduras en dados de tamaño parecido.
      - Pocha la cebolla en el aceite 10 minutos. Añade los pimientos y cocina 10 minutos más.
      - Incorpora el calabacín y deja que suelte el agua, unos 10 minutos.
      - Añade el tomate, sal y el azúcar si el tomate es ácido, y cocina 15 minutos a fuego suave.
      - Sirve con un huevo frito encima.

  - name: Ensalada griega
    health: [GREEN, "Verduras frescas, aceitunas y feta con aceite de oliva. Saludable, aunque el queso y las aceitunas son salados."]
    nutrition: [330, 9, 10, 28]
