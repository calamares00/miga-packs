description: >-
  Desserts made in the fridge or a saucepan, without turning on the oven: no-bake cheesecake,
  triple chocolate cake, lemon icebox pie, lemon mousse, tocino de cielo, yoghurt and berry pots,
  date and cocoa balls, cereal bars, chocolate hazelnut spread, strawberry fridge cake, mango and
  yoghurt pots and pears in red wine. Most are made the day before.
