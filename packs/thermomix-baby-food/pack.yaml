language: en
name: "Thermomix: baby food"
series: Kitchen appliances
family: thermomix-comida-para-bebes
description: >-
  Homemade purées and porridges for starting solids, from 6 months, programmed for the Thermomix
  TM6 (they work just the same on the TM5 and TM7): vegetables, chicken, beef, white fish,
  pulses, fruit and oats. No salt or sugar. Every baby goes at their own pace: always follow your
  paediatrician's advice on introducing foods and textures, and offer one new food at a time to
  spot allergies.
author: Miga
authorGithub: calamares00
