language: es
name: Olla exprés
series: Electrodomésticos
family: olla-expres
description: >-
  Guisos largos en la mitad o un tercio del tiempo con la olla a presión: callos a la madrileña,
  estofado de ternera, codillo, lengua en salsa, manitas de cerdo, pollo a la cerveza, carne
  mechada, fabes con almejas, alubias pintas con chorizo, patatas con sepia, arroz caldoso con
  pollo y conejo al ajillo. Los tiempos son desde que la olla alcanza la presión (segundo anillo
  o presión alta). No llenes la olla más de dos tercios, y con legumbres, no más de la mitad.
