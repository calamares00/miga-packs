description: >-
  The cooking of Texans of Mexican descent, with more yellow cheese, cumin and beef than Mexico's:
  nachos, chile con queso, cheese enchiladas with chili gravy, crispy beef tacos, breakfast tacos,
  King Ranch chicken, Frito pie and sopaipillas.
