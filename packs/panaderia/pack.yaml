recipes:

  - name: Masa madre
    health: [GREEN, "Es un fermento para hacer pan, no se come solo. Harina y agua, sin grasa ni azúcar."]
    nutrition: [340, 11, 70, 2]
    photo: panaderia/masa-madre.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 1
    notes: Tarda de 5 a 7 días en estar activa. Está lista cuando dobla su volumen en 4-6 horas después de alimentarla y huele ácida y agradable. Guárdala en la nevera y aliméntala una vez por semana.
    tags: [masa madre, básicos, vegana]
    ingredients:
      - items:
          - [harina integral de centeno o de trigo, 50, g]
          - [agua sin cloro templada, 50, g]
          - [harina de trigo de fuerza para alimentarla, 50, g]
    steps:
      - Día 1. Mezcla en un tarro limpio 50 g de harina integral y 50 g de agua. Tápalo sin cerrar del todo y déjalo a unos 24 °C.
      - Días 2 a 7. Cada 24 horas, tira la mitad y añade 50 g de harina (de fuerza o integral) y 50 g de agua. Mezcla bien.
      - Al principio puede subir y bajar e incluso oler raro; es normal. A partir del día 4 o 5 empezará a crecer de forma regular.
      - Cuando doble su volumen en 4-6 horas tras alimentarla, ya puedes usarla. Úsala en su punto más alto.

  - name: Hogaza de masa madre
    health: [GREEN, "Pan de masa madre con algo de harina integral: sin grasa ni azúcar y más digestivo. Moderar por la sal."]
    nutrition: [200, 7, 41, 1]
    photo: panaderia/hogaza-de-masa-madre.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 60
    cook: 45
    servings: 10
    notes: Necesita unas 5 horas de fermentación en bloque y una noche en la nevera. Se hornea en una olla de hierro con tapa para conseguir una buena corteza.
    tags: [masa madre, pan]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo de fuerza, 450, g]
          - [harina integral de trigo, 50, g]
          - [agua templada, 350, g]
          - [masa madre activa, 100, g]
          - [sal, 10, g]
    steps:
      - Mezcla las harinas con 330 g de agua y deja que repose 1 hora (autolisis).
      - Añade la masa madre y la sal con el resto del agua y pellizca la masa hasta integrarlo todo.
      - Durante las 2 primeras horas, haz una serie de pliegues cada 30 minutos (estira un lado de la masa hacia arriba y dóblalo sobre sí misma, girando el bol). Deja que fermente hasta que crezca un 50 % y tenga burbujas, unas 4-5 horas en total a 24 °C.
      - Vuelca la masa, dale forma de bola tensa y colócala en un banneton o un bol con un paño enharinado. Tápala y déjala en la nevera 12-16 horas.
      - Precalienta el horno a 250 °C con la olla dentro 45 minutos. Vuelca la hogaza sobre papel de horno, haz un corte con una cuchilla y métela en la olla.
      - Hornea tapada 20 minutos, destapa, baja a 230 °C y hornea 20-25 minutos más, hasta que esté muy dorada. Deja que se enfríe sobre una rejilla al menos 1 hora antes de cortarla.

  - name: Barra de pan
    health: [GREEN, "Pan sencillo de harina, agua, levadura y sal, sin grasa. Mejor con harina integral para más fibra."]
    nutrition: [590, 20, 122, 2]
    photo: panaderia/barra-de-pan.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 30
    cook: 22
    servings: 3
    notes: El vapor del primer tramo del horneado es lo que da la corteza fina y crujiente. Con poca levadura y más tiempo de fermentación, el pan sabe mejor.
    tags: [pan]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo panadera, 500, g]
          - [agua, 330, g]
          - [levadura fresca, 5, g]
          - [sal, 10, g]
    steps:
      - Disuelve la levadura en el agua, mézclala con la harina y la sal y amasa 10 minutos, hasta que la masa esté lisa y elástica.
      - Deja que fermente tapada 2 horas a temperatura ambiente, con un pliegue a la hora.
      - Divide en 3 piezas, bolea suavemente y deja que reposen 20 minutos. Dales forma de barra de unos 35 cm.
      - Colócalas sobre un paño enharinado haciendo pliegues entre ellas, tapa y deja que leven 45-60 minutos.
      - Precalienta el horno a 240 °C con una bandeja vacía en la base. Pasa las barras a la bandeja, haz 3-4 cortes en diagonal, echa un vaso de agua en la bandeja caliente para crear vapor y hornea 20-22 minutos.

  - name: Pan de molde
    health: [YELLOW, "Pan blando con leche, mantequilla y azúcar: algo más graso y dulce que el pan corriente."]
    nutrition: [190, 6, 33, 4]
    photo: panaderia/pan-de-molde.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 25
    cook: 30
    servings: 12
    notes: Necesita unas 2 horas y media de levado en total. Para que la miga quede tierna, guárdalo en una bolsa cuando esté frío.
    tags: [pan, desayuno]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo de fuerza, 500, g]
          - [leche templada, 250, g]
          - [agua templada, 50, g]
          - [mantequilla blanda, 40, g]
          - [azúcar, 20, g]
          - [levadura seca de panadería, 7, g]
          - [sal, 10, g]
    steps:
      - Mezcla la harina, el azúcar, la levadura, la leche y el agua y amasa 5 minutos. Añade la sal y la mantequilla y amasa 10 minutos más, hasta que esté lisa.
      - Deja que fermente tapada 1 hora y media, hasta que doble su volumen.
      - Desgasifica, estírala en un rectángulo del largo del molde y enróllala apretando. Colócala en un molde de 25 cm engrasado con el cierre hacia abajo.
      - Deja que leve 1 hora, hasta que sobresalga del molde.
      - Hornea a 190 °C 30 minutos. Desmolda enseguida y deja que se enfríe sobre una rejilla.

  - name: Pan integral
    health: [GREEN, "Pan integral con semillas: mucha fibra y grasas saludables. Una de las mejores opciones de pan."]
    nutrition: [170, 6, 30, 4]
    photo: panaderia/pan-integral.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 20
    cook: 35
    servings: 12
    notes: La harina integral absorbe más agua; la masa debe quedar algo pegajosa. Necesita unas 2 horas y media de levado.
    tags: [pan, integral, vegana]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina integral de trigo, 400, g]
          - [harina de trigo de fuerza, 100, g]
          - [agua templada, 360, g]
          - [levadura seca de panadería, 7, g]
          - [miel o sirope de agave, 1, cucharada]
          - [aceite de oliva, 2, cucharada]
          - [sal, 10, g]
          - [semillas variadas, 40, g, optional]
    steps:
      - Mezcla todos los ingredientes menos las semillas y amasa 10 minutos. Añade las semillas al final.
      - Deja que fermente tapada 1 hora y media, hasta que doble su volumen.
      - Dale forma alargada y colócala en un molde de 25 cm engrasado. Deja que leve 1 hora.
      - Pinta con agua, espolvorea semillas por encima y hornea a 200 °C 35 minutos.

  - name: Pan de centeno
    health: [GREEN, "Pan de centeno con mucha fibra y sin grasa. Sacia más que el pan blanco."]
    nutrition: [160, 5, 33, 1]
    photo: panaderia/pan-de-centeno.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 20
    cook: 45
    servings: 12
    notes: Pan mixto con un 60 % de centeno, al estilo centroeuropeo. La masa es muy pegajosa y no se amasa como la de trigo; trabájala con las manos mojadas. Deja que repose un día antes de cortarlo.
    tags: [pan, centeno, vegana]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de centeno, 300, g]
          - [harina de trigo de fuerza, 200, g]
          - [agua templada, 380, g]
          - [levadura seca de panadería, 7, g]
          - [miel, 1, cucharada]
          - [alcaravea, 1, cucharadita, optional]
          - [sal, 10, g]
    steps:
      - Mezcla todos los ingredientes con una cuchara o la amasadora durante 5 minutos, hasta tener una masa homogénea y pegajosa.
      - Deja que fermente tapada 1 hora.
      - Con las manos mojadas, dale forma alargada y colócala en un molde de 25 cm engrasado y enharinado. Alisa la superficie con agua y deja que leve 45-60 minutos, hasta que aparezcan grietas.
      - Hornea a 230 °C 10 minutos y a 200 °C 35 minutos más.
      - Desmolda y deja que se enfríe del todo sobre una rejilla, mejor hasta el día siguiente.

  - name: Chapata
    health: [GREEN, "Pan de harina, agua y un poco de aceite, sin azúcar. Ligero, pero de harina blanca."]
    nutrition: [900, 30, 180, 8]
    photo: panaderia/chapata.jpg
    category: Panes y masas
    difficulty: MEDIUM
    prep: 30
    cook: 25
    servings: 2
    notes: La versión española de la ciabatta italiana. Necesita una biga (prefermento) de 12-16 horas. La masa es muy hidratada; no añadas más harina.
    tags: [pan, vegana]
    utensils: [Horno]
    ingredients:
      - group: Biga
        items:
          - [harina de trigo de fuerza, 200, g]
          - [agua, 120, g]
          - [levadura fresca, 1, g]
      - group: Masa
        items:
          - [harina de trigo de fuerza, 300, g]
          - [agua, 280, g]
          - [levadura fresca, 3, g]
          - [sal, 10, g]
          - [aceite de oliva, 1, cucharada]
    steps:
      - La víspera, mezcla los ingredientes de la biga y déjala tapada a temperatura ambiente 12-16 horas.
      - Mezcla la biga con la harina, 250 g de agua y la levadura. Añade la sal y el resto del agua poco a poco, batiendo la masa en el bol con la mano hasta que esté elástica, unos 10 minutos. Añade el aceite.
      - Deja que fermente en un recipiente aceitado 2 horas, con tres pliegues cada 30 minutos.
      - Vuelca la masa sobre la mesa muy enharinada, córtala en dos rectángulos sin desgasificar y pásalos a papel de horno. Deja que reposen 30 minutos.
      - Hornea a 230 °C con vapor 22-25 minutos, hasta que esté dorada.

  - name: Bollos de leche
    health: [YELLOW, "Bollos tiernos con azúcar, mantequilla y huevo. Mejor para desayunos ocasionales."]
    nutrition: [230, 6, 36, 6]
    photo: panaderia/bollos-de-leche.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 30
    cook: 15
    servings: 12
    notes: Bollos tiernos para el desayuno y la merienda. Necesitan unas 2 horas y media de levado en total.
    tags: [bollería, desayuno]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo de fuerza, 500, g]
          - [leche templada, 250, g]
          - [huevo, 1, null]
          - [azúcar, 60, g]
          - [mantequilla blanda, 60, g]
          - [levadura fresca, 20, g]
          - [sal, 8, g]
          - [huevo para pintar, 1, null]
          - [azúcar perlado, 2, cucharada, optional]
    steps:
      - Disuelve la levadura en la leche. Mezcla con la harina, el azúcar y el huevo y amasa 5 minutos. Añade la sal y la mantequilla y amasa 10 minutos más, hasta que esté lisa.
      - Deja que fermente tapada 1 hora y media, hasta que doble su volumen.
      - Divide en 12 piezas, bolea cada una y colócalas en una bandeja con papel de horno, separadas.
      - Deja que leven tapadas 1 hora. Píntalas con huevo, haz un corte a lo largo y espolvorea azúcar perlado.
      - Hornea a 180 °C 14-15 minutos, hasta que estén doradas.

  - name: Brioche
    health: [RED, "Brioche con mucha mantequilla, huevo y azúcar: muy calórico y graso. Para ocasiones especiales."]
    nutrition: [330, 8, 36, 18]
    photo: panaderia/brioche.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 40
    cook: 30
    servings: 12
    notes: La masa reposa una noche en la nevera, lo que la hace más fácil de formar y más sabrosa. Con mucha mantequilla, es mejor hacerla en amasadora.
    tags: [bollería, desayuno]
    utensils: [Horno, Amasadora]
    ingredients:
      - items:
          - [harina de trigo de fuerza, 500, g]
          - [huevos fríos, 5, null]
          - [leche fría, 50, g]
          - [azúcar, 60, g]
          - [levadura fresca, 20, g]
          - [sal, 10, g]
          - [mantequilla blanda en dados, 250, g]
          - [huevo para pintar, 1, null]
    steps:
      - Amasa en la amasadora la harina, el azúcar, la levadura desmenuzada, los huevos y la leche a velocidad baja 5 minutos y a velocidad media 10 minutos, hasta que la masa se despegue de las paredes.
      - Añade la sal y la mantequilla poco a poco, esperando a que se integre cada parte. Amasa hasta que la masa esté lisa, brillante y elástica.
      - Deja que fermente tapada 1 hora a temperatura ambiente y después toda la noche en la nevera.
      - Divide la masa fría en 8 bolas y colócalas en dos filas en un molde alargado engrasado. Deja que leven 2-3 horas, hasta que lleguen al borde.
      - Pinta con huevo y hornea a 180 °C 30 minutos. Si se dora demasiado, cubre con papel de aluminio.

  - name: Cruasanes
    health: [RED, "Masa hojaldrada con mucha mantequilla: muy grasa y calórica. Para darse un capricho de vez en cuando."]
    nutrition: [310, 6, 34, 17]
    photo: panaderia/cruasanes.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 240
    cook: 18
    servings: 12
    notes: Se reparte en dos días; el tiempo de preparación incluye los reposos en frío. La mantequilla debe estar fría pero flexible, a la misma consistencia que la masa.
    tags: [bollería, hojaldre, desayuno]
    utensils: [Horno]
    ingredients:
      - group: Masa
        items:
          - [harina de trigo de fuerza, 500, g]
          - [agua fría, 140, g]
          - [leche fría, 140, g]
          - [azúcar, 60, g]
          - [levadura fresca, 20, g]
          - [mantequilla blanda, 30, g]
          - [sal, 10, g]
      - group: Laminado
        items:
          - [mantequilla fría para hojaldrar, 280, g]
          - [huevo para pintar, 1, null]
    steps:
      - Amasa los ingredientes de la masa 8 minutos, hasta que esté lisa. Aplánala en un rectángulo, envuélvela y déjala en la nevera toda la noche.
      - Aplasta la mantequilla de laminar entre dos papeles hasta tener un cuadrado de 18 cm y refrigérala hasta que esté firme pero flexible.
      - Estira la masa en un rectángulo de 20 × 40 cm, coloca la mantequilla en el centro y cierra la masa sobre ella sellando los bordes.
      - Estira en un rectángulo de 60 cm de largo y dobla en tres. Refrigera 30 minutos. Repite el estirado y el plegado dos veces más, con 30 minutos de nevera entre cada vez.
      - Estira a 4 mm de grosor y corta triángulos de 10 cm de base. Haz un pequeño corte en el centro de la base y enróllalos sin apretar.
      - Colócalos en bandejas, pinta con huevo y deja que leven a unos 25 °C 2 horas, hasta que tiemblen al mover la bandeja. Pinta otra vez y hornea a 200 °C 15-18 minutos.

  - name: Napolitanas de chocolate
    health: [RED, "Hojaldre con mantequilla y chocolate: mucha grasa saturada y azúcar. Bollería para ocasiones puntuales."]
    nutrition: [360, 6, 40, 20]
    photo: panaderia/napolitanas-de-chocolate.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 240
    cook: 18
    servings: 12
    notes: Se hacen con la misma masa laminada que los cruasanes; puedes preparar la receta de cruasanes y destinar la masa a napolitanas.
    tags: [bollería, hojaldre, chocolate]
    utensils: [Horno]
    ingredients:
      - items:
          - [masa de cruasán laminada, 1, kg]
          - [barritas de chocolate para napolitanas, 24, null]
          - [huevo para pintar, 1, null]
    steps:
      - Estira la masa laminada a 4 mm de grosor y córtala en rectángulos de 8 × 12 cm.
      - Coloca una barrita de chocolate en un extremo, enrolla una vuelta, pon la segunda barrita y termina de enrollar con el cierre hacia abajo.
      - Colócalas en bandejas, pinta con huevo y deja que leven a unos 25 °C 2 horas.
      - Pinta otra vez y hornea a 200 °C 15-18 minutos, hasta que estén muy doradas.

  - name: Ensaimadas
    health: [RED, "Masa dulce con manteca de cerdo y azúcar glas: mucha grasa saturada y azúcar."]
    nutrition: [310, 6, 42, 13]
    photo: panaderia/ensaimadas.jpg
    category: Panes y masas
    difficulty: HARD
    prep: 60
    cook: 15
    servings: 12
    origin: Mallorca
    originCountry: ES
    notes: La manteca de cerdo es la que les da su textura hojaldrada y su sabor; no se sustituye por mantequilla en la receta tradicional. Necesitan levar toda la noche.
    tags: [bollería, desayuno]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo de fuerza, 500, g]
          - [azúcar, 100, g]
          - [huevos, 2, null]
          - [agua templada, 150, g]
          - [levadura fresca, 25, g]
          - [aceite de oliva suave, 1, cucharada]
          - [sal, 5, g]
          - [manteca de cerdo blanda, 150, g]
          - [azúcar glas, 50, g]
    steps:
      - Disuelve la levadura en el agua. Mezcla con la harina, el azúcar, los huevos, el aceite y la sal y amasa 10-15 minutos, hasta que la masa esté fina y elástica. Deja que repose 30 minutos.
      - Divide la masa en 12 bolas, úntalas con aceite y deja que reposen tapadas 30 minutos.
      - Estira cada bola sobre la mesa untada de manteca hasta que esté muy fina, casi transparente. Úntala de manteca, enróllala como un cordón y deja que repose 15 minutos.
      - Enrolla cada cordón sobre sí mismo en espiral, sin apretar, y colócalos en bandejas con papel de horno, separados.
      - Deja que leven tapadas toda la noche, unas 10-12 horas, hasta que tripliquen su volumen. Pulveriza con agua y hornea a 180 °C 12-15 minutos. Espolvorea con azúcar glas ya frías.

  - name: Magdalenas
    health: [RED, "Bizcochos con mucho azúcar y aceite: dulces y calóricos. Mejor como capricho ocasional."]
    nutrition: [210, 3, 22, 12]
    photo: panaderia/magdalenas.jpg
    category: Postres
    difficulty: EASY
    prep: 15
    cook: 15
    servings: 16
    notes: El reposo de la masa en la nevera y el golpe de calor inicial hacen que salga el copete.
    tags: [bollería, desayuno]
    utensils: [Horno]
    ingredients:
      - items:
          - [huevos, 3, null]
          - [azúcar, 150, g]
          - [aceite de girasol, 150, g]
          - [leche, 50, g]
          - [ralladura de limón, 1, cucharadita]
          - [harina, 200, g]
          - [levadura química, 8, g]
          - [azúcar para espolvorear, 2, cucharada]
    steps:
      - Bate los huevos con el azúcar 5 minutos, hasta que blanqueen y doblen su volumen.
      - Añade el aceite y la leche en hilo sin dejar de batir, y la ralladura.
      - Incorpora la harina tamizada con la levadura con movimientos envolventes. Tapa y deja la masa en la nevera al menos 1 hora.
      - Precalienta el horno a 220 °C. Llena las cápsulas hasta tres cuartos y espolvorea azúcar por encima.
      - Hornea 5 minutos a 220 °C y 10 minutos a 200 °C, hasta que estén doradas.

  - name: Pan de pita
    health: [GREEN, "Pan plano de harina, agua y un poco de aceite, sin azúcar. Ideal para rellenar con verduras y proteína."]
    nutrition: [250, 7, 47, 4]
    photo: panaderia/pan-de-pita.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 8
    notes: Se hinchan formando un bolsillo gracias al calor fuerte de la bandeja. Necesitan 1 hora y media de levado.
    tags: [pan, vegana]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina de trigo, 500, g]
          - [agua templada, 300, g]
          - [levadura seca de panadería, 7, g]
          - [azúcar, 1, cucharadita]
          - [aceite de oliva, 2, cucharada]
          - [sal, 10, g]
    steps:
      - Mezcla todos los ingredientes y amasa 10 minutos. Deja que fermente tapada 1 hora y media.
      - Precalienta el horno a 250 °C con una bandeja dentro.
      - Divide la masa en 8 bolas y estira cada una en un disco de 5 mm de grosor. Deja que reposen 10 minutos.
      - Hornea 2-3 discos a la vez sobre la bandeja caliente 4-5 minutos, hasta que se inflen y estén apenas dorados.
      - Envuélvelos en un paño para que se mantengan blandos.

  - name: Naan
    health: [YELLOW, "Pan plano con yogur y leche, pintado con ghee o mantequilla. Algo más graso que un pan normal."]
    nutrition: [230, 7, 38, 5]
    photo: panaderia/naan.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 8
    origin: India
    originCountry: IN
    notes: En la India se hacen en el horno tandoor; en una sartén de hierro muy caliente quedan muy parecidos. Necesitan 1 hora y media de levado.
    tags: [pan, vegetariana]
    ingredients:
      - items:
          - [harina de trigo, 400, g]
          - [yogur natural, 125, g]
          - [leche templada, 120, g]
          - [levadura seca de panadería, 5, g]
          - [azúcar, 1, cucharadita]
          - [levadura química, 1, cucharadita]
          - [sal, 1, cucharadita]
          - [ghee o mantequilla derretida, 2, cucharada]
          - [ajo picado, 1, cucharadita, optional]
          - [cilantro fresco picado, 1, cucharada, optional]
    steps:
      - Mezcla la harina, las levaduras, el azúcar y la sal. Añade el yogur, la leche y 1 cucharada de ghee y amasa 8 minutos, hasta que esté suave. Deja que fermente tapada 1 hora y media.
      - Divide en 8 bolas y estíralas en forma de lágrima de 5 mm de grosor.
      - Calienta mucho una sartén de hierro sin aceite. Pon un naan, espera a que salgan burbujas, unos 1-2 minutos, y dale la vuelta. Cocina 1 minuto más, hasta que tenga manchas tostadas.
      - Píntalos con el resto del ghee mezclado con el ajo y el cilantro.

