description: >-
  Complete dishes with cheap, seasonal ingredients, the home cooking of a lifetime: green beans
  with potatoes, battered potatoes in sauce, vegetable rice, tuna and tomato spaghetti, chicken
  and potato stew, Flamenco eggs, tuna empanadillas, baked mackerel, liver and onions, French
  onion soup, cauliflower with garlic and paprika and broccoli pasta. With money-saving tips in
  the notes.
