      - Pela el boniato y córtalo en dados. Corta las cebollas en gajos. Mézclalos con la mitad del aceite, las especias y sal y hornea 15 minutos.
      - Mezcla el pavo con el resto del aceite y sal, añádelo a la bandeja y hornea 15 minutos más.

  - name: Coliflor asada entera
    health: [GREEN, "Coliflor asada con especias y yogur: ligera, sabrosa y llena de fibra."]
    nutrition: [180, 8, 14, 11]
    photo: horno-en-una-bandeja/coliflor-asada-entera.jpg
    category: Verduras
    difficulty: EASY
    prep: 10
    cook: 55
    servings: 4
    notes: Primero se cuece un poco para que se haga por dentro. Como plato principal, sírvela con garbanzos o arroz.
    tags: [una bandeja, verduras, vegetariana, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [coliflor entera, 1, null]
          - [yogur griego natural, 150, g]
          - [pimentón ahumado, 1, cucharadita]
          - [comino molido, 1, cucharadita]
          - [cúrcuma, 0.5, cucharadita]
          - [diente de ajo, 1, null]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [perejil o cilantro, null, null]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 200 °C. Quita las hojas a la coliflor y cuécela entera en agua con sal 8 minutos. Escúrrela bien.
      - Mezcla la mitad del yogur con las especias, el ajo rallado, el aceite y sal y unta toda la coliflor.
      - Ásala en la bandeja 40-45 minutos, hasta que esté dorada y tierna al pincharla.
      - Sirve con el resto del yogur y las hierbas picadas.

  - name: Merluza con patatas panaderas
    health: [GREEN, "Pescado blanco con patata y cebolla al horno: completo y ligero."]
    nutrition: [400, 30, 36, 15]
    photo: horno-en-una-bandeja/merluza-con-patatas-panaderas.jpg
    category: Pescados y mariscos
    difficulty: EASY
    prep: 15
    cook: 40
    servings: 4
    notes: Las patatas panaderas se asan con la cebolla y el pimiento hasta que están tiernas; el pescado se hace encima en pocos minutos.
    tags: [una bandeja, pescado, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [lomos de merluza, 4, null]
          - [patatas, 700, g]
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [vino blanco, 100, ml]
          - [dientes de ajo, 2, null]
          - [perejil picado, 2, cucharada]
          - [aceite de oliva virgen extra, 4, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 190 °C. Corta las patatas en rodajas finas y la cebolla y el pimiento en tiras. Mézclalos con 3 cucharadas de aceite y sal y hornea 25 minutos.
      - Coloca la merluza salada encima y riega con el vino.
      - Mezcla el ajo y el perejil picados con el resto del aceite y repártelo sobre el pescado.
      - Hornea 10-12 minutos, hasta que la merluza esté hecha.

  - name: Pizza de bandeja
    health: [YELLOW, "Pizza casera: mejor que la comprada, pero con queso y embutido."]
    nutrition: [520, 22, 62, 20]
    photo: horno-en-una-bandeja/pizza-de-bandeja.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 20
    cook: 20
    servings: 4
    notes: La masa se estira directamente en la bandeja del horno engrasada. Vale masa comprada.
    tags: [una bandeja, pizza, al horno]
    utensils: [Horno]
    ingredients:
      - items:
          - [masa de pizza, 500, g]
          - [tomate triturado, 200, g]
          - [orégano seco, 1, cucharadita]
          - [mozzarella rallada, 250, g]
          - [jamón cocido o champiñones, 150, g]
          - [pimiento rojo en tiras, 0.5, null]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 230 °C.
      - Engrasa la bandeja con 1 cucharada de aceite y estira la masa con los dedos hasta cubrirla.
      - Cubre con el tomate mezclado con el orégano y la sal, la mozzarella, el jamón y el pimiento.
      - Riega con el resto del aceite y hornea 15-20 minutos, hasta que el borde esté dorado.

