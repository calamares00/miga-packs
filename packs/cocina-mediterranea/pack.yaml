    notes: Necesita enfriar al menos 3 horas. Para quemar el azúcar, mejor soplete o pala de hierro.
    ingredients:
      - items:
          - [leche entera, 1, l]
          - [yemas de huevo, 8, null]
          - [azúcar, 150, g]
          - [maicena, 30, g]
          - [piel de limón, 1, null]
          - [rama de canela, 1, null]
          - [azúcar para quemar, 6, cucharada]
    steps:
      - Infusiona la leche con la piel de limón y la canela hasta que hierva. Retira y deja reposar 10 minutos.
      - Bate las yemas con el azúcar y la maicena hasta blanquear.
      - Cuela la leche sobre las yemas, mezcla y devuelve al fuego suave, removiendo sin parar hasta que espese, sin que hierva.
      - Reparte en cazuelitas, enfría y refrigera al menos 3 horas.
      - Antes de servir, espolvorea azúcar y quémalo con soplete hasta caramelizar.
