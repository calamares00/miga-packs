          - [pimienta negra, null, null]
    steps:
      - Remoja el pan rallado en la leche y mézclalo con la carne, el huevo, el ajo y el perejil picados, la sal y la pimienta.
      - Forma bolas del tamaño de una nuez.
      - Colócalas en la cesta sin que se toquen y cocina a 190 °C durante 10-12 minutos, agitando la cesta a mitad de tiempo.
      - Sírvelas solas o termínalas 5 minutos en la salsa de tomate que más te guste.

  - name: Hamburguesas caseras
    health: [YELLOW, "Hamburguesa de ternera con queso y pan. Más sana que la de comida rápida, pero calórica y con grasa."]
    nutrition: [640, 40, 32, 38]
    photo: freidora-de-aire/hamburguesas-caseras.jpg
    category: Carnes
    difficulty: EASY
    prep: 10
    cook: 12
    servings: 4
    tags: [niños]
    utensils: [Freidora de aire]
    ingredients:
      - group: Hamburguesas
        items:
          - [carne picada de ternera, 600, g]
          - [sal, 1, cucharadita]
          - [pimienta negra, 0.5, cucharadita]
          - [lonchas de queso cheddar, 4, null, optional]
      - group: Para servir
        items:
          - [panes de hamburguesa, 4, null]
          - [lechuga, 4, hoja]
          - [tomate, 1, null]
          - [cebolla morada, 0.5, null]
    steps:
      - Divide la carne en 4 porciones y forma hamburguesas de unos 2 cm de grosor, sin apretar demasiado. Hazles un pequeño hueco en el centro con el pulgar para que no se abomben.
      - Salpimiéntalas y cocina a 190 °C durante 10-12 minutos, dándoles la vuelta a mitad de tiempo.
      - Si llevan queso, ponlo encima el último minuto.
      - Tuesta los panes 2 minutos en la freidora y monta las hamburguesas con la lechuga, el tomate y la cebolla.

  - name: Costillas de cerdo con miel y mostaza
    health: [RED, "Costillas de cerdo, un corte graso, con glaseado de miel. Mucha grasa y azúcar: mejor de vez en cuando."]
    nutrition: [620, 38, 14, 46]
    photo: freidora-de-aire/costillas-de-cerdo-con-miel-y-mostaza.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 10
