description: >-
  La cocina indochina, nacida entre los chinos hakka de Calcuta y hoy en todos los puestos
  callejeros de la India: gobi manchurian, pollo al chile, fideos hakka, arroz frito schezwan,
  paneer al chile, sopa manchow, sopa de maíz dulce y patatas con miel y chile.
