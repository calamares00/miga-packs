recipes:

  - name: Frittata de verduras
    health: [GREEN, "Huevo con mucha verdura y poco queso, al horno: proteína completa y fibra."]
    nutrition: [290, 19, 9, 20]
    photo: saludable-vegetariano/frittata-de-verduras.jpg
    category: Huevos
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 4
    tags: [huevos, vegetariano, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [huevos, 8, null]
          - [calabacín, 1, null]
          - [pimiento rojo, 1, null]
          - [cebolla, 1, null]
          - [espinacas baby, 80, g]
          - [queso parmesano rallado, 30, g]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [albahaca fresca, 1, puñado]
          - [sal y pimienta negra, null, null]
    steps:
      - "Precalienta el horno a 190 °C. Saltea la cebolla, el pimiento y el calabacín en dados en una sartén apta para horno 8 minutos. Añade las espinacas."
      - "Bate los huevos con el parmesano, la albahaca, sal y pimienta y viértelos sobre las verduras."
      - "Cuaja 2 minutos al fuego y termina en el horno 12-15 minutos, hasta que esté hecha en el centro."

  - name: Berenjenas rellenas de quinoa y feta
    health: [GREEN, "Berenjena con quinoa, verduras y un poco de feta: fibra y proteína con grasa moderada."]
    nutrition: [380, 15, 40, 18]
    photo: saludable-vegetariano/berenjenas-rellenas-de-quinoa-y-feta.jpg
    category: Verduras
    difficulty: EASY
    prep: 20
    cook: 40
    servings: 4
    tags: [vegetariano, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [berenjenas, 2, null]
          - [quinoa, 120, g]
          - [tomates cherry, 200, g]
          - [cebolla morada, 1, null]
          - [ajo, 2, diente]
          - [queso feta, 100, g]
          - [menta o perejil fresco, 1, puñado]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [comino molido, 1, cucharadita]
          - [sal y pimienta negra, null, null]
    steps:
      - "Parte las berenjenas por la mitad, haz cortes en la carne, riégalas con 1 cucharada de aceite y ásalas a 200 °C 25 minutos."
      - Cuece la quinoa en el doble de agua 12 minutos.
      - "Vacía las berenjenas dejando 1 cm. Saltea la cebolla y el ajo con el resto del aceite, añade la pulpa picada, los tomates y el comino y cocina 5 minutos. Mezcla con la quinoa y salpimienta."
      - "Rellena las berenjenas, desmenuza el feta por encima y hornea 10 minutos. Termina con las hierbas."

  - name: Pimientos rellenos de arroz integral
    health: [GREEN, "Pimiento con arroz integral, alubias y verdura: fibra y proteína vegetal."]
    nutrition: [400, 15, 58, 12]
    photo: saludable-vegetariano/pimientos-rellenos-de-arroz-integral.jpg
    category: Verduras
    difficulty: EASY
    prep: 20
    cook: 45
    servings: 4
    tags: [vegetariano, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [pimientos rojos grandes, 4, null]
          - [arroz integral cocido, 300, g]
          - [alubias negras cocidas, 200, g]
          - [maíz dulce, 100, g]
          - [cebolla, 1, null]
          - [tomate triturado, 200, g]
          - [comino molido, 1, cucharadita]
          - [pimentón ahumado, 1, cucharadita]
          - [queso mozzarella rallado, 60, g]
          - [aceite de oliva, 2, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 190 °C. Corta la tapa de los pimientos y vacíalos.
      - "Pocha la cebolla picada en el aceite, añade el tomate y las especias y cocina 5 minutos. Mezcla con el arroz, las alubias y el maíz y sala."
      - "Rellena los pimientos, ponles el queso por encima y tápalos con sus tapas."
      - "Hornea 35-40 minutos, hasta que los pimientos estén tiernos."

  - name: Hamburguesas de alubias negras
    health: [GREEN, "Hamburguesas de legumbre y avena a la plancha: fibra y proteína vegetal."]
    nutrition: [320, 14, 42, 10]
    photo: saludable-vegetariano/hamburguesas-de-alubias-negras.jpg
    category: Legumbres
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 4
    notes: "Se congelan crudas, separadas con papel de horno."
    tags: [legumbres, vegetariano]
    ingredients:
      - items:
          - [alubias negras cocidas, 500, g]
          - [copos de avena, 60, g]
          - [huevo, 1, null]
          - [cebolla morada, 0.5, null]
          - [ajo, 1, diente]
          - [comino molido, 1, cucharadita]
          - [pimentón ahumado, 1, cucharadita]
          - [cilantro fresco, 1, puñado]
          - [aceite de oliva, 1, cucharada]
          - [sal, null, null]
    steps:
      - Escurre y seca bien las alubias. Aplasta tres cuartas partes con un tenedor y deja el resto enteras.
      - "Mézclalas con la avena, el huevo, la cebolla y el ajo picados, las especias, el cilantro y sal. Deja reposar 10 minutos."
      - Forma 4 hamburguesas y cocínalas a la plancha con el aceite 4-5 minutos por lado.
      - Sírvelas en pan integral o con ensalada.

