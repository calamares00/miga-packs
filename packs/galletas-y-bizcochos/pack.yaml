name: Galletas y bizcochos
series: Cocina de cada día
family: galletas-y-bizcochos
description: >-
  Bizcochos para el desayuno y galletas para la merienda, de los de casa: bizcocho de naranja,
  marmolado, de zanahoria, de limón y amapola, de manzana y de cacao y café, y galletas de avena y
  pasas, de jengibre, de limón y de canela, pastas de té y lenguas de gato. Con notas para
  conservarlos y congelarlos.
