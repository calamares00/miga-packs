recipes:

  - name: Sopa de miso
    health: [GREEN, "Caldo dashi con miso, tofu y algas: muy ligero y nutritivo. El miso aporta bastante sal."]
    nutrition: [70, 6, 4, 3]
    photo: cocina-japonesa/sopa-de-miso.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 15
    servings: 4
    notes: El miso no debe hervir, porque pierde aroma. Si tienes prisa, usa dashi instantáneo disuelto en agua.
    tags: [sopa, dashi]
    ingredients:
      - group: Dashi
        items:
          - [agua, 1, l]
          - [alga kombu, 10, g]
          - [copos de bonito seco (katsuobushi), 15, g]
      - group: Sopa
        items:
          - [miso, 3, cucharada]
          - [tofu sedoso, 150, g]
          - [alga wakame seca, 1, cucharada]
          - [cebolleta, 1, null]
    steps:
      - Deja el kombu en remojo en el agua 30 minutos. Calienta a fuego suave y retíralo justo antes de que hierva.
      - Añade el katsuobushi, deja que hierva 1 minuto, apaga el fuego y deja que repose 5 minutos. Cuela.
      - Hidrata la wakame en agua 5 minutos y escúrrela.
      - Calienta el dashi sin que hierva, añade el tofu en dados y la wakame.
      - Disuelve el miso en un cazo con un poco de dashi caliente, incorpóralo a la sopa y apaga el fuego. Sirve con cebolleta picada.

  - name: Pollo teriyaki
    health: [YELLOW, "Pollo con piel glaseado con soja, mirin y azúcar: buena proteína, pero con azúcar y sal."]
    nutrition: [420, 30, 18, 24]
    photo: cocina-japonesa/pollo-teriyaki.jpg
    category: Carnes
    difficulty: EASY
    prep: 5
    cook: 15
    servings: 2
    tags: [pollo, rápida]
    ingredients:
      - items:
          - [contramuslos de pollo deshuesados con piel, 2, null]
          - [salsa de soja, 3, cucharada]
          - [mirin, 3, cucharada]
          - [sake, 2, cucharada]
          - [azúcar, 1, cucharada]
          - [aceite de girasol, 1, cucharadita]
          - [sésamo tostado, 1, cucharadita, optional]
    steps:
      - Mezcla la soja, el mirin, el sake y el azúcar.
      - Pincha la piel del pollo con un tenedor y ponlo con la piel hacia abajo en una sartén con el aceite, a fuego medio, 6-7 minutos, hasta que la piel esté dorada y crujiente.
      - Dale la vuelta y cocina 4 minutos más. Retira la grasa que haya soltado.
      - Añade la salsa y deja que hierva, dando la vuelta al pollo, hasta que quede glaseado y brillante.
      - Corta en tiras y sirve con arroz y sésamo por encima.

  - name: Gyoza
    health: [GREEN, "Empanadillas de cerdo y col a la plancha y al vapor: completas, con grasa moderada. Moderar la salsa."]
    nutrition: [420, 18, 40, 20]
    photo: cocina-japonesa/gyoza.jpg
    category: Entrantes
    difficulty: MEDIUM
    prep: 40
    cook: 10
    servings: 4
    tags: [empanadillas]
    ingredients:
      - group: Gyoza
        items:
          - [obleas de gyoza, 30, null]
          - [carne picada de cerdo, 250, g]
          - [col china, 200, g]
          - [cebollino o cebolleta, 2, cucharada]
          - [ajo, 1, diente]
          - [jengibre fresco rallado, 1, cucharadita]
          - [salsa de soja, 1, cucharada]
          - [aceite de sésamo, 1, cucharadita]
          - [sal, 0.5, cucharadita]
          - [aceite de girasol, 2, cucharada]
      - group: Salsa
        items:
          - [salsa de soja, 3, cucharada]
          - [vinagre de arroz, 2, cucharada]
          - [rayu (aceite de chile), 0.5, cucharadita, optional]
    steps:
      - Pica la col muy fina, sálala, deja que repose 10 minutos y escúrrela apretando.
      - Mezcla la carne con la col, el cebollino, el ajo, el jengibre, la soja y el aceite de sésamo.
      - Pon una cucharadita de relleno en cada oblea, moja el borde y ciérrala haciendo pliegues en un solo lado.
      - Coloca las gyoza en una sartén con el aceite caliente y fríelas 2 minutos, hasta que la base esté dorada.
      - Añade 80 ml de agua, tapa enseguida y cuece al vapor 4-5 minutos. Destapa y deja que se evapore el agua para que la base vuelva a quedar crujiente.
      - Sirve con la salsa mezclada.

  - name: Ramen de shoyu
    health: [YELLOW, "Fideos en caldo con huevo y cerdo: muy completo y reconfortante, pero muy salado."]
    nutrition: [620, 32, 72, 20]
    photo: cocina-japonesa/ramen-de-shoyu.jpg
    category: Sopas y cremas
    difficulty: MEDIUM
    prep: 20
    cook: 30
    servings: 4
    notes: Los huevos (ajitama) se marinan desde la víspera. Una versión casera más sencilla que la de los restaurantes, que cuecen el caldo durante horas.
    tags: [sopa, fideos]
    ingredients:
      - group: Huevos marinados
        items:
          - [huevos, 4, null]
          - [salsa de soja, 4, cucharada]
          - [mirin, 4, cucharada]
          - [agua, 4, cucharada]
      - group: Caldo
        items:
          - [caldo de pollo, 1.5, l]
          - [dashi, 500, ml]
          - [jengibre fresco, 3, cm]
          - [ajo, 2, diente]
          - [salsa de soja, 6, cucharada]
          - [mirin, 2, cucharada]
          - [aceite de sésamo, 1, cucharada]
      - group: Para servir
        items:
          - [fideos de ramen, 4, ración]
          - [cerdo asado o chashu en lonchas, 300, g]
          - [brotes de bambú (menma), 100, g, optional]
          - [alga nori, 2, hoja]
          - [cebolletas, 2, null]
    steps:
      - group: Huevos marinados
        items:
          - Cuece los huevos 6 minutos y medio en agua hirviendo y pásalos a agua con hielo. Pélalos.
          - Mételos en una bolsa con la soja, el mirin y el agua y déjalos en la nevera al menos 8 horas.
      - group: Ramen
        items:
          - Cuece el caldo de pollo y el dashi con el jengibre y el ajo machacado 20 minutos a fuego suave. Cuela.
          - Pon en cada cuenco 1,5 cucharadas de soja, media de mirin y un chorrito de aceite de sésamo.
          - Cuece los fideos según el paquete y escúrrelos bien.
          - Llena los cuencos con el caldo caliente, añade los fideos y coloca encima el cerdo, el huevo partido por la mitad, el bambú, media hoja de nori y la cebolleta.

  - name: Tonkatsu
    health: [RED, "Chuleta de cerdo empanada y frita: mucha grasa. La col cruda que la acompaña ayuda."]
    nutrition: [620, 36, 30, 38]
    photo: cocina-japonesa/tonkatsu.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 10
    servings: 2
    tags: [frito, cerdo]
    ingredients:
      - items:
          - [chuletas de lomo de cerdo deshuesadas de 2 cm, 2, null]
          - [harina, 3, cucharada]
          - [huevo, 1, null]
          - [pan rallado panko, 80, g]
          - [aceite de girasol para freír, null, null]
          - [col blanca, 0.25, null]
          - [salsa tonkatsu, 4, cucharada]
          - [sal, null, null]
          - [pimienta negra, null, null]
    steps:
      - Haz unos cortes en la grasa del borde de las chuletas para que no se curven. Salpimiéntalas.
      - Pásalas por harina, huevo batido y panko, apretando bien.
      - Fríelas en aceite a 170 °C 3 minutos por cada lado, hasta que estén doradas. Deja que reposen 2 minutos sobre una rejilla.
      - Córtalas en tiras y sírvelas con la col en juliana muy fina y la salsa tonkatsu.

  - name: Oyakodon
    health: [GREEN, "Arroz con pollo y huevo en caldo dashi: completo y equilibrado. La salsa lleva algo de azúcar."]
    nutrition: [560, 30, 80, 12]
    photo: cocina-japonesa/oyakodon.jpg
    category: Arroces
    difficulty: EASY
    prep: 10
    cook: 15
    servings: 2
    notes: Su nombre significa «cuenco de padre e hijo», por el pollo y el huevo.
    tags: [arroz, pollo, donburi]
    ingredients:
      - items:
          - [arroz japonés cocido, 400, g]
          - [contramuslo de pollo deshuesado, 1, null]
          - [cebolla, 0.5, null]
          - [huevos, 3, null]
          - [dashi, 150, ml]
          - [salsa de soja, 2, cucharada]
          - [mirin, 2, cucharada]
          - [azúcar, 1, cucharadita]
          - [cebolleta o mitsuba, 1, null]
    steps:
      - Corta el pollo en trozos pequeños y la cebolla en tiras finas.
      - Calienta el dashi con la soja, el mirin y el azúcar en una sartén pequeña. Añade la cebolla y el pollo y cuece 5-6 minutos.
      - Bate los huevos ligeramente, sin que se mezclen del todo, y viértelos sobre el pollo en dos veces.
      - Tapa y cuece 1 minuto, hasta que el huevo esté cuajado pero jugoso.
      - Desliza la mezcla sobre el arroz caliente y termina con la cebolleta.

  - name: Onigiri
    health: [GREEN, "Bolas de arroz con relleno de salmón o ciruela: sencillas y con poca grasa."]
    nutrition: [290, 10, 55, 4]
    photo: cocina-japonesa/onigiri.jpg
    category: Arroces
    difficulty: EASY
    prep: 20
    cook: 0
    servings: 4
    notes: Se hacen con el arroz aún caliente y las manos mojadas y saladas, para que no se pegue.
    tags: [arroz, para llevar]
    ingredients:
      - items:
          - [arroz japonés cocido, 600, g]
          - [salmón cocinado y desmenuzado, 100, g]
          - [umeboshi (ciruela encurtida), 2, null, optional]
          - [atún en lata con mayonesa, 2, cucharada, optional]
          - [alga nori, 2, hoja]
          - [sal, null, null]
    steps:
      - Mójate las manos y frótalas con un poco de sal.
      - Toma un puñado de arroz caliente, hazle un hueco en el centro y pon una cucharadita de relleno.
      - Cierra el arroz sobre el relleno y dale forma de triángulo apretando con firmeza, sin aplastar.
      - Envuelve la base con una tira de nori justo antes de comerlos para que esté crujiente.

  - name: Tamagoyaki
    health: [GREEN, "Tortilla japonesa enrollada con un toque de azúcar: proteína con poca grasa."]
    nutrition: [230, 13, 8, 16]
    photo: cocina-japonesa/tamagoyaki.jpg
    category: Huevos
    difficulty: MEDIUM
    prep: 5
    cook: 10
    servings: 2
    notes: Se hace en una sartén rectangular (makiyakinabe); en una redonda pequeña también sale, recortando los bordes.
    tags: [huevo, desayuno]
    ingredients:
      - items:
          - [huevos, 4, null]
          - [dashi, 3, cucharada]
          - [azúcar, 1, cucharada]
          - [salsa de soja clara, 1, cucharadita]
          - [mirin, 1, cucharadita]
          - [aceite de girasol, 1, cucharada]
    steps:
      - Bate los huevos con el dashi, el azúcar, la soja y el mirin sin hacer espuma.
      - Engrasa la sartén con papel de cocina mojado en aceite y caliéntala a fuego medio.
      - Vierte una capa fina de huevo. Cuando esté casi cuajada, enróllala hacia ti con unos palillos.
      - Empuja el rollo al fondo, engrasa, vierte otra capa levantando el rollo para que pase por debajo y vuelve a enrollar. Repite hasta terminar el huevo.
      - Da forma al rollo con una esterilla de bambú, deja que repose 5 minutos y córtalo en rodajas gruesas.

  - name: Okonomiyaki
    health: [YELLOW, "Tortita de col con harina y huevo, completa, pero la panceta y las salsas aportan grasa y sal."]
    nutrition: [620, 24, 52, 34]
    photo: cocina-japonesa/okonomiyaki.jpg
    category: Panes y masas
    difficulty: EASY
    prep: 15
    cook: 15
    servings: 2
    origin: Osaka
    tags: [col, tortita]
    ingredients:
      - group: Masa
        items:
          - [harina de trigo, 100, g]
          - [dashi frío, 120, ml]
          - [huevos, 2, null]
          - [col blanca, 250, g]
          - [cebolletas, 2, null]
          - [jengibre encurtido rojo (beni shoga), 1, cucharada, optional]
          - [panceta de cerdo, 6, loncha]
          - [aceite de girasol, 1, cucharada]
      - group: Para cubrir
        items:
          - [salsa okonomiyaki, 3, cucharada]
          - [mayonesa japonesa, 2, cucharada]
          - [copos de bonito seco (katsuobushi), 1, puñado]
          - [aonori (alga en polvo), 1, cucharadita, optional]
    steps:
      - Mezcla la harina con el dashi y los huevos. Añade la col muy picada, la cebolleta y el beni shoga y mezcla sin trabajar demasiado.
      - Pon la mitad de la masa en una sartén engrasada a fuego medio y dale forma de tortita de 2 cm de grosor. Cubre con la mitad de la panceta.
      - Cocina 5 minutos, dale la vuelta con cuidado y cocina 5 minutos más con la panceta hacia abajo, hasta que esté crujiente.
      - Dale la vuelta otra vez, cubre con la salsa, la mayonesa en zigzag, el katsuobushi y el aonori. Repite con el resto de la masa.

  - name: Yakitori
    health: [YELLOW, "Brochetas de pollo a la parrilla con salsa dulce de soja: buena proteína, con azúcar y sal."]
    nutrition: [380, 32, 18, 18]
    photo: cocina-japonesa/yakitori.jpg
    category: Carnes
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 4
    notes: Lo ideal es hacerlos sobre brasas; en la plancha o el grill del horno también quedan bien.
    tags: [brochetas, barbacoa]
    ingredients:
      - group: Brochetas
        items:
          - [contramuslos de pollo deshuesados, 600, g]
          - [cebolletas o puerros finos, 4, null]
          - [aceite de girasol, 1, cucharada]
      - group: Salsa tare
        items:
          - [salsa de soja, 100, ml]
          - [mirin, 100, ml]
          - [sake, 50, ml]
          - [azúcar, 2, cucharada]
    steps:
      - Cuece los ingredientes de la tare a fuego suave 10 minutos, hasta que se reduzca un tercio y espese.
      - Corta el pollo en dados de 3 cm y la cebolleta en trozos de 3 cm. Ensártalos alternándolos en brochetas remojadas (negima).
      - Úntalos con aceite y ásalos a fuego fuerte 4 minutos por cada lado.
      - Píntalos con la tare y ásalos 1 minuto más por cada lado, dos veces, hasta que estén glaseados.

  - name: Tempura de verduras y gambas
    health: [YELLOW, "Verduras y langostinos rebozados y fritos: masa ligera, pero frita en aceite."]
    nutrition: [380, 14, 40, 18]
    photo: cocina-japonesa/tempura-de-verduras-y-gambas.jpg
    category: Entrantes
    difficulty: MEDIUM
    prep: 20
    cook: 15
    servings: 4
    notes: El agua muy fría y la masa poco batida, con algún grumo, son el secreto de un rebozado ligero.
    tags: [frito]
    ingredients:
      - group: Tempura
        items:
          - [langostinos, 8, null]
          - [boniato, 1, null]
          - [calabacín, 1, null]
          - [berenjena, 1, null]
          - [pimiento verde, 1, null]
          - [harina floja, 120, g]
          - [yema de huevo, 1, null]
          - [agua con gas muy fría, 200, ml]
          - [aceite de girasol para freír, null, null]
      - group: Salsa tentsuyu
        items:
          - [dashi, 150, ml]
          - [salsa de soja, 3, cucharada]
          - [mirin, 3, cucharada]
          - [rábano daikon rallado, 2, cucharada, optional]
    steps:
      - Calienta los ingredientes de la salsa hasta que hiervan y deja que se templen.
      - Pela los langostinos dejando la cola y hazles unos cortes en la parte de abajo para que queden rectos. Corta las verduras en láminas de 5 mm.
      - Mezcla la yema con el agua y añade la harina tamizada de golpe. Remueve con palillos solo unos segundos; deben quedar grumos.
      - Pasa cada pieza por un poco de harina y después por la masa, y fríe en tandas en aceite a 170-180 °C hasta que esté crujiente y apenas dorada.
      - Escurre sobre una rejilla y sirve enseguida con la salsa y el daikon.

  - name: Makis de salmón y pepino
    health: [GREEN, "Arroz con salmón y pepino envuelto en alga: ligero y equilibrado. La soja aporta sal."]
    nutrition: [370, 13, 66, 5]
    photo: cocina-japonesa/makis-de-salmon-y-pepino.jpg
    category: Pescados y mariscos
    difficulty: MEDIUM
    prep: 40
    cook: 20
    servings: 4
    notes: El salmón para comer crudo debe haberse congelado antes al menos 5 días a -20 °C, o comprarse ya congelado para este uso.
    tags: [sushi, arroz]
    ingredients:
      - group: Arroz de sushi
        items:
          - [arroz japonés para sushi, 300, g]
          - [agua, 330, ml]
          - [vinagre de arroz, 4, cucharada]
          - [azúcar, 1.5, cucharada]
          - [sal, 1, cucharadita]
      - group: Makis
        items:
          - [alga nori, 4, hoja]
          - [salmón fresco apto para crudo, 150, g]
          - [pepino, 0.5, null]
          - [salsa de soja, null, null]
          - [wasabi, null, null]
          - [jengibre encurtido (gari), null, null]
    steps:
      - Lava el arroz hasta que el agua salga transparente y escúrrelo 15 minutos. Cuécelo tapado con el agua a fuego suave 12 minutos y deja que repose 10 minutos sin destapar.
      - Disuelve el azúcar y la sal en el vinagre, mézclalo con el arroz con movimientos cortantes y deja que se temple.
      - Corta el salmón y el pepino en bastones de 1 cm.
      - Pon media hoja de nori sobre una esterilla de bambú, cúbrela con una capa fina de arroz con las manos mojadas, dejando 1 cm libre arriba.
      - Coloca una tira de salmón o de pepino, enrolla apretando con la esterilla y corta cada rollo en 6 piezas con un cuchillo mojado.
      - Sirve con soja, wasabi y gari.

  - name: Karaage
    health: [YELLOW, "Pollo marinado y frito: mucha proteína, pero con grasa por la fritura."]
    nutrition: [450, 30, 18, 28]
    photo: cocina-japonesa/karaage.jpg
    category: Carnes
    difficulty: EASY
    prep: 40
    cook: 15
    servings: 4
    tags: [frito, pollo]
    ingredients:
      - items:
          - [contramuslos de pollo deshuesados, 600, g]
          - [salsa de soja, 2, cucharada]
          - [sake, 1, cucharada]
          - [jengibre fresco rallado, 2, cucharadita]
          - [ajo rallado, 1, cucharadita]
          - [fécula de patata o maicena, 80, g]
          - [aceite de girasol para freír, null, null]
          - [limón, 1, null]
          - [mayonesa japonesa, null, null, optional]
    steps:
      - Corta el pollo en trozos de 4 cm y mézclalo con la soja, el sake, el jengibre y el ajo. Deja que marine 30 minutos.
      - Escúrrelo y rebózalo en la fécula, sacudiendo el exceso.
      - Fríelo en aceite a 160 °C 3-4 minutos y sácalo. Deja que repose 4 minutos.
      - Fríelo de nuevo a 180 °C 1 minuto, hasta que esté muy crujiente. Sirve con limón y mayonesa.

  - name: Nikujaga
    health: [GREEN, "Ternera con patata y verduras en caldo dashi: completo y con poca grasa. Lleva algo de azúcar."]
    nutrition: [380, 18, 45, 13]
    photo: cocina-japonesa/nikujaga.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    notes: Guiso casero de carne y patatas; su nombre es la unión de niku (carne) y jagaimo (patata).
    tags: [guiso, casero]
    ingredients:
      - items:
          - [ternera en lonchas muy finas, 250, g]
          - [patatas, 4, null]
          - [cebolla, 1, null]
          - [zanahoria, 1, null]
          - [fideos shirataki, 150, g, optional]
          - [dashi, 400, ml]
          - [salsa de soja, 4, cucharada]
          - [mirin, 3, cucharada]
          - [sake, 2, cucharada]
          - [azúcar, 2, cucharada]
          - [aceite de girasol, 1, cucharada]
          - [tirabeques o guisantes, 50, g, optional]
    steps:
      - Pela las patatas y córtalas en trozos grandes. Corta la cebolla en gajos y la zanahoria en trozos.
      - Saltea la carne en el aceite hasta que cambie de color. Añade la cebolla, la zanahoria y las patatas y saltea 2 minutos.
      - Añade el dashi, el sake, el azúcar y el mirin y lleva a ebullición. Retira la espuma.
      - Añade la soja y los shirataki, cubre con una tapa más pequeña que la olla o con papel de horno y cuece a fuego suave 20 minutos, hasta que las patatas estén tiernas.
      - Añade los tirabeques los últimos 2 minutos.

