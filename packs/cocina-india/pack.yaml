      - "Cocina cada chapati en una sartén muy caliente 30 segundos, dale la vuelta y cocina 1 minuto más."
      - Dale la vuelta otra vez y presiona los bordes con un paño para que se hinche. Guárdalos envueltos en un paño y úntalos con ghee si quieres.

