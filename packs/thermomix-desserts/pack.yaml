description: >-
  Homemade desserts programmed for the Thermomix TM6, which work just the same on the TM5 and
  TM7: Spanish custard, crème caramel, fried custard squares, lemon curd, chocolate mousse, lemon
  sorbet, express strawberry ice cream, yoghurt cake, creamy baked cheesecake, chocolate
  truffles, strawberry jam, pastry cream, butter biscuits, walnut brownie and Spanish biscuit
  cake. On a TM31, use 90°C where 85°C is given and check the texture before finishing.
author: Miga
authorGithub: calamares00
