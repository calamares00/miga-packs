          - [chopped parsley, 2, tbsp]
          - [salt, null, null]
    steps:
      - Peel and slice the carrots and boil them with the garlic in salted water for 8-10 minutes, until tender but firm.
      - Drain and crush the garlic.
      - Dress with the remaining ingredients and leave to cool.

  - name: Bissara
    health: [GREEN, "Dried broad bean purée with oil: lots of plant protein and fibre."]
    nutrition: [320, 18, 40, 10]
    photo: cocina-marroqui/bissara.jpg
    category: Legumes
    difficulty: EASY
    prep: 10
    cook: 60
    servings: 4
    notes: The winter breakfast of northern Morocco. Served with a good drizzle of oil, cumin and paprika.
    tags: [legumes, vegan, gluten-free, winter]
    utensils: [Blender, Pressure cooker]
    ingredients:
      - items:
          - [split dried broad beans, 300, g]
          - [garlic cloves, 4, null]
          - [ground cumin, 2, tsp]
          - [sweet paprika, 1, tsp]
          - [extra virgin olive oil, 5, tbsp]
          - [lemon juice, 1, tbsp]
          - [salt, null, null]
    steps:
      - Rinse the beans and simmer them with the garlic in 1.5 litres of water for 50-60 minutes (20 in a pressure cooker), until they fall apart.
      - Blend with half the cumin, the salt and half the oil into a thick soup; add water if needed.
      - Serve in bowls with the rest of the oil, cumin, paprika and a few drops of lemon.

