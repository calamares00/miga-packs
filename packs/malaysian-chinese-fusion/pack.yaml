description: >-
  The cooking of Malaysia's Chinese (Hokkien, Cantonese, Hainanese and Hakka) at the hawker stalls
  of Penang and Kuala Lumpur: char kway teow, bak kut teh, Hokkien mee, yong tau foo, claypot
  chicken rice, wantan mee, Hainanese chicken chop and kaya toast.
