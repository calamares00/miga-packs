          - [queso que funda sin sal (mozzarella fresca escurrida), 200, g]
          - [pistachos picados, 2, cucharada]
    steps:
      - Hierve el azúcar con el agua 10 minutos, añade el limón y deja enfriar.
      - Desmenuza la masa kadaif con los dedos y mézclala con la mantequilla.
      - Precalienta el horno a 200 °C. En un molde de 22 cm, aprieta la mitad de la masa, cubre con el queso y luego con el resto de la masa apretando.
      - Hornea 20-25 minutos, hasta que esté dorado. Dale la vuelta en un plato, riega con el almíbar frío y espolvorea los pistachos. Sírvelo caliente.

