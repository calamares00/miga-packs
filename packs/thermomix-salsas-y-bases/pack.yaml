          - [zumo de limón, 1, cucharada]
          - [sal, 1, pizca]
    steps:
      - Pon el ajo y las hierbas en el vaso y pica 5 seg/vel 7. Baja los restos con la espátula.
      - Añade el yogur, el limón y la sal y mezcla 10 seg/vel 3.
      - Deja reposar 30 minutos en la nevera para que coja sabor.

  - name: Salsa de champiñones
    health: [YELLOW, "Champiñones con nata: sabrosa, pero con grasa saturada."]
    nutrition: [120, 3, 5, 10]
    photo: thermomix-salsas-y-bases/salsa-de-champinones.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 15
    servings: 6
    notes: Programado para Thermomix TM6. Para carnes a la plancha, pollo o pasta.
    tags: [salsa, vegetariana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [chalota, 1, null]
          - [aceite de oliva virgen extra, 20, g]
          - [champiñones, 250, g]
          - [vino blanco, 50, g]
          - [nata para cocinar, 200, g]
          - [sal, 0.5, cucharadita]
          - [pimienta negra, null, null]
    steps:
      - Pon la chalota en el vaso y pica 4 seg/vel 5. Añade el aceite y sofríe 4 min/120 °C/vel 1.
      - Añade los champiñones en trozos y trocea 3 seg/vel 4. Programa 5 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el vino y programa 2 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade la nata, la sal y la pimienta y programa 4 min/90 °C/giro a la izquierda/vel cuchara.

  - name: Caldo de verduras
    health: [GREEN, "Caldo casero sin grasa, muy ligero y sin los potenciadores de sabor de los de brick."]
    nutrition: [20, 1, 4, 0]
    photo: thermomix-salsas-y-bases/caldo-de-verduras.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 40
    servings: 6
    notes: Programado para Thermomix TM6. Salen unos 1,3 litros. Se congela en táperes o cubiteras.
    tags: [sopa, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [puerro, 1, null]
          - [zanahorias, 2, null]
          - [cebolla, 1, null]
          - [rama de apio, 1, null]
          - [nabo, 1, null, optional]
          - [ramitas de perejil, 3, null]
          - [agua, 1500, g]
          - [sal, 1, cucharadita]
    steps:
      - Pon las verduras en trozos grandes en el vaso con el agua y la sal.
      - Programa 40 min/100 °C/giro a la izquierda/vel cuchara.
      - Cuela el caldo y deja enfriar antes de guardarlo.

  - name: Caldo de pollo
    health: [GREEN, "Caldo casero con poca grasa si lo desgrasas en frío: ligero y reconfortante."]
    nutrition: [40, 4, 2, 2]
    photo: thermomix-salsas-y-bases/caldo-de-pollo.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 50
    servings: 6
    notes: Programado para Thermomix TM6. Al enfriar en la nevera, la grasa sube y se retira con una cuchara.
    tags: [sopa, pollo]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [carcasas o alitas de pollo, 400, g]
          - [puerro, 1, null]
          - [zanahoria, 1, null]
          - [rama de apio, 1, null]
          - [cebolla, 0.5, null]
          - [agua, 1500, g]
          - [sal, 1, cucharadita]
    steps:
      - Pon todos los ingredientes en el vaso, con las verduras en trozos grandes.
      - Programa 50 min/100 °C/giro a la izquierda/vel cuchara.
      - Cuela el caldo, déjalo enfriar en la nevera y retira la grasa de la superficie.
