language: en
name: "Healthy cooking: low salt"
series: Healthy cooking
description: >-
  Recipes with no added salt or very little, that get their flavour from herbs, spices, garlic,
  citrus and vinegars, and without very salty ingredients such as cured meats, aged cheeses or soy
  sauce: lemon-marinated chicken, sea bass with fennel and orange, pork tenderloin with apple, leek
  and apple soup, brown rice salad, spiced roast vegetables, courgette omelette, salt-free seeded
  bread, homemade tomato sauce and baked pears.
