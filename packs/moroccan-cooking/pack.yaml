    category: Starters
    difficulty: MEDIUM
    prep: 30
    cook: 15
    servings: 6
    notes: Makes about 24. They can also be baked at 200 °C, brushed with butter.
    tags: [appetizer, fried, vegetarian]
    utensils: []
    ingredients:
      - items:
