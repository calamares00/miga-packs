          - [sal, null, null]
    steps:
      - Corta la base de las coles y pártelas por la mitad.
      - Mézclalas con el aceite y la sal.
      - Cocina a 190 °C durante 12-15 minutos, agitando la cesta un par de veces, hasta que estén tostadas por fuera.
      - Aliña con el vinagre balsámico y la miel recién salidas.

