description: >-
  La cocina de los chinos de Malasia (hokkien, cantoneses, hainaneses y hakka) en los puestos de
  comida de Penang y Kuala Lumpur: char kway teow, bak kut teh, hokkien mee, yong tau foo, arroz
  con pollo en cazuela de barro, wantan mee, chuleta de pollo hainanesa y tostadas con kaya.
