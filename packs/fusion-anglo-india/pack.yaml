description: >-
  Los platos nacidos del encuentro entre la India y Gran Bretaña, de los clubes y trenes del Raj a
  los restaurantes de curry británicos: kedgeree, sopa mulligatawny, pollo tikka masala, pollo
  coronación, jalfrezi, curry de cordero del ferrocarril, country captain y chutney de mango.
