    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 45
    servings: 4
    notes: Programado para Thermomix TM6. Pide en la carnicería que te corten la costilla en trozos pequeños.
    tags: [cuchara, cerdo, invierno]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 30, g]
          - [costilla de cerdo troceada, 500, g]
          - [tomate triturado, 100, g]
          - [pimentón dulce, 1, cucharadita]
          - [vino blanco, 50, g]
          - [patatas, 700, g]
          - [agua, 600, g]
          - [hoja de laurel, 1, null]
          - [sal, 1.5, cucharadita]
    steps:
      - Pon la cebolla, el pimiento y el ajo en trozos en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y la costilla salpimentada y sofríe 10 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el tomate, el pimentón y el vino y programa 5 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade las patatas «chascadas» en trozos, el agua, el laurel y la sal y programa 30 min/100 °C/giro a la izquierda/vel cuchara.
      - Deja reposar 5 minutos y sirve con su caldo.

  - name: Ternera guisada con champiñones
    health: [YELLOW, "Buena fuente de proteína y hierro; la salsa lleva vino y algo de grasa, así que mejor con una guarnición ligera."]
    nutrition: [430, 38, 12, 22]
    category: Carnes
    difficulty: MEDIUM
    prep: 15
    cook: 75
    servings: 4
    notes: Programado para Thermomix TM6. Usa carne de guisar (morcillo, aguja o espaldilla) en dados de 3 cm. Si la salsa queda líquida, programa 5 min/Varoma/giro a la izquierda/vel cuchara con el cestillo en lugar del cubilete.
    tags: [guiso, ternera, invierno]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [zanahorias, 2, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 40, g]
          - [ternera para guisar en dados, 700, g]
          - [harina, 1, cucharada]
          - [vino tinto, 100, g]
          - [champiñones laminados, 250, g]
          - [caldo de carne, 250, g]
          - [tomillo seco, 0.5, cucharadita]
          - [hoja de laurel, 1, null]
          - [sal, 1, cucharadita]
          - [pimienta negra, null, null]
    steps:
      - Pon la cebolla, las zanahorias y el ajo en trozos en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 8 min/120 °C/vel 1.
      - Añade la carne enharinada y salpimentada y programa 8 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el vino y programa 3 min/120 °C/giro a la izquierda/vel cuchara para que se evapore el alcohol.
      - Añade el caldo, el tomillo y el laurel y programa 50 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade los champiñones y programa 15 min/100 °C/giro a la izquierda/vel cuchara. Ajusta de sal y sirve con arroz o patatas.

  - name: Pollo en pepitoria
    health: [YELLOW, "Pollo con salsa de almendras y huevo: mucha proteína, pero la salsa es calórica."]
    nutrition: [480, 40, 8, 31]
    category: Carnes
    difficulty: MEDIUM
    prep: 15
    cook: 40
    servings: 4
    notes: Programado para Thermomix TM6. El azafrán puede sustituirse por colorante alimentario.
    tags: [guiso, pollo, tradicional]
    utensils: [Thermomix]
    ingredients:
      - group: Para el majado
        items:
          - [almendras crudas peladas, 40, g]
          - [yemas de huevo cocido, 2, null]
          - [dientes de ajo, 2, null]
          - [azafrán, 1, pizca]
      - group: Para el guiso
        items:
          - [cebolla, 1, null]
          - [aceite de oliva virgen extra, 40, g]
          - [contramuslos de pollo troceados, 800, g]
          - [vino blanco, 100, g]
          - [caldo de pollo, 300, g]
          - [hoja de laurel, 1, null]
          - [sal, 1, cucharadita]
    steps:
      - Pon en el vaso las almendras y el ajo y pica 10 seg/vel 8. Añade las yemas y el azafrán, mezcla 5 seg/vel 5 y reserva el majado.
      - Pon la cebolla en trozos en el vaso y pica 4 seg/vel 5. Añade el aceite y sofríe 7 min/120 °C/vel 1.
      - Añade el pollo salpimentado y programa 8 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el vino y programa 3 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el caldo, el laurel y la sal y programa 20 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade el majado y programa 5 min/100 °C/giro a la izquierda/vel cuchara, hasta que la salsa espese. Sirve con la clara picada por encima.

  - name: Pollo al curry
    health: [YELLOW, "Pollo con especias y verduras; la leche de coco aporta grasa saturada, así que mejor con arroz y sin repetir."]
    nutrition: [450, 36, 14, 28]
    category: Carnes
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programado para Thermomix TM6. Sirve con arroz basmati cocido en el cestillo mientras se hace el curry (pon el cestillo con el arroz lavado en el paso del caldo y añade 300 g más de agua).
    tags: [curry, pollo, picante]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [dientes de ajo, 2, null]
          - [jengibre fresco, 10, g]
          - [aceite de oliva virgen extra, 30, g]
          - [curry en polvo, 2, cucharada]
          - [pechugas de pollo en dados, 700, g]
          - [tomate triturado, 200, g]
          - [leche de coco, 400, ml]
          - [sal, 1, cucharadita]
          - [cilantro fresco, null, null, optional]
    steps:
      - Pon la cebolla, el ajo y el jengibre en el vaso y pica 5 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 7 min/120 °C/vel 1.
      - Añade el curry y programa 1 min/120 °C/vel 1 para tostar las especias.
      - Añade el pollo, el tomate y la sal y programa 10 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade la leche de coco y programa 10 min/100 °C/giro a la izquierda/vel cuchara. Sirve con cilantro picado.

  - name: Bacalao con tomate
    health: [GREEN, "Pescado blanco con sofrito de tomate: mucha proteína y poca grasa."]
    nutrition: [320, 34, 14, 14]
    category: Pescados y mariscos
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programado para Thermomix TM6. Usa lomos de bacalao desalado; el Varoma los cuece al vapor sin que se rompan.
    tags: [pescado, tradicional]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebollas, 2, null]
          - [pimiento verde, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 40, g]
          - [tomate triturado, 600, g]
          - [azúcar, 1, cucharadita]
          - [lomos de bacalao desalado, 600, g]
          - [sal, null, null]
    steps:
      - Pon las cebollas, el pimiento y el ajo en trozos en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 10 min/120 °C/vel 1.
      - Añade el tomate y el azúcar. Coloca los lomos de bacalao en el recipiente Varoma, ponlo en su sitio y programa 20 min/Varoma/vel 1.
      - Retira el Varoma. Si quieres una salsa fina, tritura 20 seg/vel 5. Ajusta de sal.
      - Pon el bacalao en una fuente, cúbrelo con la salsa y sirve.

