name: "Oven: sheet-pan dinners"
series: Kitchen appliances
family: horno-en-una-bandeja
description: >-
  Complete dinners made on a single oven tray: prepare, put it in and forget it, with only one
  thing to wash up. Mustard chicken with vegetables, salmon with potatoes and asparagus, sausages
  with vegetables, chicken fajitas, gnocchi with cherry tomatoes, pork chops with potatoes,
  turkey with sweet potato, whole roast cauliflower, hake with boulangère potatoes, tray pizza,
  vegetables with halloumi and chicken with chorizo and chickpeas.
author: Miga
authorGithub: calamares00
