name: "Thermomix: stews and one-pot dishes"
series: Kitchen appliances
family: thermomix-guisos-y-cuchara
description: >-
  Home-style stews programmed for the Thermomix TM6 (2.2 litre bowl), which work just the same on
  the TM5 and TM7: lentils with rice, chickpea and salt cod stew, white beans with chorizo,
  potatoes with pork ribs, beef with mushrooms, chicken in almond sauce, chicken curry, salt cod
  in tomato, turkey stew, mixed vegetable stew, prawn risotto, Spanish broth with egg and ham,
  pork cheeks in red wine, squid with potatoes and chicken in tomato. On a TM31 (2 litre bowl,
  100 °C maximum), fry at Varoma temperature and scale the quantities down a little.
author: Miga
authorGithub: calamares00
