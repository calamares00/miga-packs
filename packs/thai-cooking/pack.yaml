recipes:

  - name: Pad thai
    health: [YELLOW, "Rice noodles with prawns, tofu, egg and vegetables: complete, but with sugar and oil."]
    nutrition: [650, 34, 80, 22]
    photo: cocina-tailandesa/pad-thai.jpg
    category: Pasta
    difficulty: MEDIUM
    prep: 30
    cook: 10
    servings: 2
    notes: It works best two portions at a time, so the wok doesn't cool down. Soak the noodles in lukewarm water, not hot, so they don't overcook.
    tags: [noodles, stir-fry]
    utensils: [Wok]
    ingredients:
      - group: Sauce
        items:
          - [tamarind paste, 3, tbsp]
          - [fish sauce, 2, tbsp]
          - [palm or brown sugar, 2, tbsp]
      - group: Stir-fry
        items:
          - [medium flat rice noodles, 200, g]
          - [peeled prawns, 200, g]
          - [firm tofu, 100, g]
          - [eggs, 2, null]
          - [shallot, 1, null]
          - [garlic, 2, clove]
          - [sweet preserved radish, 1, tbsp, optional]
          - [bean sprouts, 100, g]
          - [garlic chives or spring onion, 1, bunch]
          - [chopped roasted peanuts, 3, tbsp]
          - [chilli powder, null, null]
          - [lime, 1, null]
          - [sunflower oil, 3, tbsp]
    steps:
      - Soak the noodles in lukewarm water for 30 minutes, until pliable. Drain.
      - Heat the sauce ingredients until the sugar dissolves.
      - In the wok with the oil, stir-fry the diced tofu, chopped shallot and garlic and the radish. Add the prawns and stir-fry for 1 minute.
      - Push to one side, scramble the beaten eggs and break them up.
      - Add the noodles and sauce and stir-fry over a high heat for 2-3 minutes, until tender. If they dry out, add a splash of water.
      - Add the bean sprouts and chives in lengths, toss for 30 seconds and serve with peanuts, chilli powder and lime.

  - name: Tom yum kung
    health: [GREEN, "A hot and sour prawn and mushroom soup: high in protein and very low in calories."]
    nutrition: [150, 22, 8, 3]
    photo: cocina-tailandesa/tom-yum-kung.jpg
    category: Soups
    difficulty: EASY
    prep: 20
    cook: 20
    servings: 4
    notes: Thailand's most famous hot and sour soup. The lemongrass, galangal and lime leaves add aroma but aren't eaten.
    tags: [soup, spicy, seafood]
    ingredients:
      - items:
          - [king prawns, 400, g]
          - [water, 1, l]
          - [lemongrass, 3, stalk]
          - [galangal, 5, slice]
          - [kaffir lime leaves, 5, null]
          - [mushrooms (button or oyster), 150, g]
          - [Thai chillies, 4, null]
          - [fish sauce, 3, tbsp]
          - [lime juice, 4, tbsp]
          - [nam prik pao (roasted chilli paste), 1, tbsp, optional]
          - [fresh coriander, 1, bunch]
    steps:
      - Peel the prawns and simmer the heads and shells in the water for 10 minutes. Strain.
      - Add the bruised lemongrass in pieces, the galangal and the torn lime leaves to the stock and simmer for 5 minutes.
      - Add the mushrooms and crushed chillies and simmer for 2 minutes. Add the prawns and simmer for 2 more minutes.
      - Off the heat, add the fish sauce, lime juice and nam prik pao. Taste and adjust. Serve with coriander.

  - name: Tom kha gai
    health: [YELLOW, "A chicken soup with coconut milk: protein and aromas, but the coconut adds saturated fat."]
    nutrition: [380, 26, 10, 27]
    photo: cocina-tailandesa/tom-kha-gai.jpg
    category: Soups
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: Chicken soup with coconut milk and galangal (kha). Milder than tom yum.
    tags: [soup, coconut milk]
    ingredients:
      - items:
          - [chicken breast or thigh, 400, g]
          - [coconut milk, 400, ml]
          - [chicken stock, 300, ml]
          - [galangal, 8, slice]
          - [lemongrass, 2, stalk]
          - [kaffir lime leaves, 5, null]
          - [mushrooms, 150, g]
          - [Thai chillies, 3, null]
          - [fish sauce, 3, tbsp]
          - [lime juice, 3, tbsp]
          - [palm sugar, 1, tsp]
          - [fresh coriander, 1, bunch]
    steps:
      - Bring the coconut milk and stock to the boil with the galangal, bruised lemongrass and torn lime leaves.
      - Add the chicken in strips and simmer gently for 8 minutes.
      - Add the mushrooms and crushed chillies and simmer for 3 minutes.
      - Off the heat, add the fish sauce, sugar and lime juice. Serve with coriander.

  - name: Green chicken curry
    health: [YELLOW, "Chicken and aubergine in green curry with coconut milk: complete, but with saturated fat from the coconut."]
    nutrition: [460, 30, 12, 33]
    photo: cocina-tailandesa/curry-verde-de-pollo.jpg
    category: Meat
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: In Thai, kaeng khiao wan gai. Frying the curry paste in the coconut fat is the key to its flavour. In Thailand they use small round aubergines.
    tags: [curry, spicy]
    ingredients:
      - items:
          - [boneless chicken thighs, 500, g]
          - [green curry paste, 3, tbsp]
          - [coconut milk, 400, ml]
          - [chicken stock, 150, ml]
          - [aubergine, 1, null]
          - [kaffir lime leaves, 4, null]
          - [fish sauce, 2, tbsp]
          - [palm sugar, 1, tbsp]
          - [Thai basil, 1, bunch]
          - [red chilli, 1, null]
          - [sunflower oil, 1, tbsp]
    steps:
      - Heat the oil with the thick part of the coconut milk until the fat separates. Add the curry paste and fry for 2 minutes.
      - Add the chicken in pieces and cook for 3 minutes.
      - Add the rest of the coconut milk, the stock, the diced aubergine and the torn lime leaves. Simmer for 10-12 minutes.
      - Season with the fish sauce and sugar. Add the basil and sliced chilli and serve with jasmine rice.

  - name: Beef massaman curry
    health: [YELLOW, "Beef and potato in a coconut curry with peanuts: very complete but calorie-dense and fatty."]
    nutrition: [620, 32, 30, 42]
    photo: cocina-tailandesa/curry-massaman-de-ternera.jpg
    category: Meat
    difficulty: MEDIUM
    prep: 20
    cook: 120
    servings: 6
    notes: A mild, spiced curry of Persian influence, with potatoes and peanuts. Massaman paste contains cinnamon, cardamom and cloves.
    tags: [curry, stew]
    ingredients:
      - items:
          - [stewing beef, 600, g]
          - [massaman curry paste, 3, tbsp]
          - [coconut milk, 800, ml]
          - [potatoes, 3, null]
          - [onion, 1, null]
          - [roasted peanuts, 50, g]
          - [tamarind paste, 2, tbsp]
          - [palm sugar, 2, tbsp]
          - [fish sauce, 2, tbsp]
          - [cinnamon stick, 1, null]
          - [green cardamom pods, 3, null]
          - [bay leaves, 2, null]
    steps:
      - Simmer the cubed beef with half the coconut milk, the cinnamon, cardamom and bay leaves, covered, for 1 hour.
      - In another pan, heat the thick part of the rest of the coconut milk until the fat separates and fry the curry paste for 2 minutes.
      - Add the fried paste to the beef with the rest of the coconut milk, the potatoes in chunks, the onion in wedges and the peanuts.
      - Simmer for 40 minutes, until the potatoes are tender. Season with the tamarind, sugar and fish sauce.

  - name: Pork panang curry
    health: [YELLOW, "Lean pork in a coconut curry: good protein, though the coconut milk adds saturated fat."]
    nutrition: [450, 32, 8, 32]
    photo: cocina-tailandesa/curry-panang-de-cerdo.jpg
    category: Meat
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: A thick, slightly sweet curry with little sauce. Very finely shredded lime leaves are essential.
    tags: [curry, spicy]
    ingredients:
      - items:
          - [pork loin, 500, g]
          - [panang curry paste, 2, tbsp]
          - [coconut milk, 400, ml]
          - [kaffir lime leaves, 6, null]
          - [fish sauce, 2, tbsp]
          - [palm sugar, 1, tbsp]
          - [chopped roasted peanuts, 2, tbsp, optional]
          - [red chilli, 1, null]
          - [Thai basil, 1, bunch]
    steps:
      - Slice the pork thinly.
      - Heat half the coconut milk until the fat separates and fry the curry paste for 2 minutes.
      - Add the pork and cook for 3 minutes. Add the rest of the coconut milk, the fish sauce, sugar and peanuts.
      - Simmer gently for 10 minutes, until the sauce thickens.
      - Serve with the very finely shredded lime leaves, sliced chilli and basil.

  - name: Som tam
    health: [GREEN, "Green papaya with vegetables, peanuts and lime: very light, spicy and with fibre."]
    nutrition: [120, 4, 16, 5]
    photo: cocina-tailandesa/som-tam.jpg
    category: Salads
    difficulty: EASY
    prep: 20
    cook: 0
    servings: 4
    origin: Isan
    notes: Green papaya salad pounded in a mortar. If you can't find green papaya, use kohlrabi or cucumber and carrot.
    tags: [salad, spicy]
    ingredients:
      - items:
          - [shredded green papaya, 300, g]
          - [garlic, 2, clove]
          - [Thai chillies, 3, null]
          - [yardlong beans, 50, g]
          - [cherry tomatoes, 6, null]
          - [roasted peanuts, 2, tbsp]
          - [dried shrimps, 1, tbsp, optional]
          - [fish sauce, 2, tbsp]
          - [lime juice, 2, tbsp]
          - [palm sugar, 1, tbsp]
    steps:
      - Pound the garlic and chillies in a large mortar. Add the beans in pieces and the peanuts and pound lightly.
      - Add the sugar, fish sauce, lime juice, dried shrimps and halved tomatoes, and pound so they release their juice.
      - Add the papaya and mix with the pestle and a spoon, bruising it gently so it absorbs the dressing.
      - Taste and adjust. Serve straight away with sticky rice.

  - name: Larb gai
    health: [GREEN, "Minced chicken with fresh herbs and lime: high in protein and very low in fat."]
    nutrition: [220, 24, 8, 10]
    photo: cocina-tailandesa/larb-gai.jpg
    category: Salads
    difficulty: EASY
    prep: 20
    cook: 10
    servings: 4
    origin: Isan
    notes: A warm minced meat salad with herbs. Toasted ground sticky rice (khao khua) gives it its aroma and texture.
    tags: [salad, spicy]
    ingredients:
      - items:
          - [minced chicken, 400, g]
          - [uncooked sticky rice, 2, tbsp]
          - [shallots, 3, null]
          - [spring onions, 2, null]
          - [fresh mint, 1, bunch]
          - [fresh coriander, 1, bunch]
          - [fish sauce, 3, tbsp]
          - [lime juice, 3, tbsp]
          - [chilli powder, 1, tsp]
          - [water, 3, tbsp]
          - [lettuce, 1, null]
    steps:
      - Toast the sticky rice in a dry pan until golden and grind it in a mortar.
      - Cook the chicken with the water in a frying pan, breaking it up, for 5-6 minutes, until cooked. Turn off the heat.
      - Add the fish sauce, lime juice, chilli, sliced shallots and spring onion.
      - Stir in the mint, coriander and toasted rice. Serve warm with lettuce leaves.

  - name: Thai fried rice (khao pad)
    health: [YELLOW, "Fried rice with prawns and egg: complete, though with oil and fish sauce."]
    nutrition: [620, 34, 85, 15]
    photo: cocina-tailandesa/arroz-frito-tailandes-khao-pad.jpg
    category: Rice
    difficulty: EASY
    prep: 10
    cook: 10
    servings: 2
    notes: Served with cucumber, lime and prik nam pla (fish sauce with chopped chilli).
    tags: [rice, quick]
    utensils: [Wok]
    ingredients:
      - items:
          - [day-old cooked jasmine rice, 600, g]
          - [peeled prawns or chicken, 250, g]
          - [eggs, 2, null]
          - [onion, 0.5, null]
          - [garlic, 2, clove]
          - [tomato, 1, null, optional]
          - [fish sauce, 2, tbsp]
          - [soy sauce, 1, tbsp]
          - [sugar, 1, tsp]
          - [spring onions, 2, null]
          - [sunflower oil, 3, tbsp]
          - [cucumber, 0.5, null]
          - [lime, 1, null]
    steps:
      - Stir-fry the chopped garlic and sliced onion in the oil for 1 minute. Add the prawns and stir-fry for 2 minutes.
      - Push to one side, scramble the eggs and break them up.
      - Add the rice and tomato wedges and stir-fry over a high heat for 3 minutes.
      - Add the fish sauce, soy sauce and sugar and stir-fry for 1 more minute. Finish with the spring onion.
      - Serve with cucumber slices and lime wedges.

  - name: Pad kra pao
    health: [YELLOW, "Minced meat stir-fried with basil and chilli: protein, but served with rice and a fried egg."]
    nutrition: [520, 40, 14, 34]
    photo: cocina-tailandesa/pad-kra-pao.jpg
    category: Meat
    difficulty: EASY
    prep: 10
    cook: 10
    servings: 2
    notes: Thailand's most popular street stir-fry, with holy basil (kra pao). Thai basil works well too. Served with rice and a crispy fried egg.
    tags: [stir-fry, spicy, quick]
    utensils: [Wok]
    ingredients:
      - items:
          - [minced pork or chicken, 400, g]
          - [holy or Thai basil, 1, bunch]
          - [garlic, 4, clove]
          - [Thai chillies, 4, null]
          - [oyster sauce, 1, tbsp]
          - [soy sauce, 1, tbsp]
          - [fish sauce, 1, tbsp]
          - [dark soy sauce, 1, tsp]
          - [sugar, 1, tsp]
          - [sunflower oil, 3, tbsp]
          - [eggs, 2, null]
          - [cooked jasmine rice, 400, g]
    steps:
      - Pound the garlic and chillies in a mortar to a coarse paste.
      - Fry the eggs in plenty of very hot oil until the edges are crisp. Set aside.
      - Stir-fry the garlic and chilli paste in 1 tablespoon of oil for a few seconds. Add the meat and stir-fry over a high heat for 4 minutes.
      - Add the sauces and sugar and stir-fry for 1 minute. Stir in the basil and turn off the heat.
      - Serve over rice with the fried egg on top.

  - name: Pad see ew
    health: [YELLOW, "Wide noodles stir-fried with chicken, greens and egg: complete, but with sweet and salty sauces."]
    nutrition: [680, 34, 90, 20]
    photo: cocina-tailandesa/pad-see-ew.jpg
    category: Pasta
    difficulty: EASY
    prep: 15
    cook: 10
    servings: 2
    notes: Wide rice noodles stir-fried with dark soy sauce. Separate fresh noodles before stir-frying so they don't clump.
    tags: [noodles, stir-fry]
    utensils: [Wok]
    ingredients:
      - items:
          - [fresh wide rice noodles, 400, g]
          - [sliced chicken or pork, 200, g]
          - [Chinese broccoli (kai lan) or Tenderstem, 200, g]
          - [eggs, 2, null]
          - [garlic, 2, clove]
          - [dark soy sauce, 1, tbsp]
          - [soy sauce, 1, tbsp]
          - [oyster sauce, 1, tbsp]
          - [sugar, 1, tsp]
          - [sunflower oil, 3, tbsp]
          - [white pepper, null, null]
    steps:
      - Separate the noodles by hand. Cut the broccoli into pieces, keeping stems and leaves apart.
      - Stir-fry the garlic and meat in the oil over a high heat for 3 minutes. Add the broccoli stems and stir-fry for 1 minute.
      - Push to one side, scramble the eggs and break them up.
      - Add the noodles, sauces and sugar and stir-fry without moving too much, letting them char a little, for 2-3 minutes. Add the leaves at the end.
      - Serve with white pepper.

  - name: Cashew chicken
    health: [YELLOW, "Chicken with cashews and vegetables: good protein and healthy fats, with sauces that add salt."]
    nutrition: [400, 30, 16, 24]
    photo: cocina-tailandesa/pollo-con-anacardos.jpg
    category: Meat
    difficulty: EASY
    prep: 15
    cook: 15
    servings: 4
    notes: In Thai, gai pad med mamuang. The fried dried chillies add aroma more than heat.
    tags: [stir-fry, chicken]
    utensils: [Wok]
    ingredients:
      - items:
          - [chicken breast, 400, g]
          - [plain flour, 2, tbsp]
          - [raw cashews, 80, g]
          - [dried chillies, 4, null]
          - [onion, 1, null]
          - [red pepper, 1, null]
          - [spring onions, 2, null]
          - [garlic, 3, clove]
          - [oyster sauce, 2, tbsp]
          - [soy sauce, 1, tbsp]
          - [fish sauce, 1, tbsp]
          - [sugar, 1, tsp]
          - [nam prik pao (roasted chilli paste), 1, tbsp, optional]
          - [sunflower oil, 5, tbsp]
    steps:
      - Fry the cashews in the oil until golden and lift them out. Fry the chillies in pieces for a few seconds and lift them out.
      - Coat the diced chicken in the flour and fry it in the same oil until golden. Pour off some of the oil.
      - Stir-fry the garlic, onion and pepper in pieces for 2 minutes.
      - Add the chicken, sauces, sugar, nam prik pao and a splash of water and toss for 1 minute.
      - Add the cashews, chillies and spring onion in lengths and serve with rice.

  - name: Thai beef salad (yam nua)
    health: [GREEN, "Grilled beef with fresh vegetables, herbs and lime: protein and vegetables with little fat."]
    nutrition: [280, 26, 10, 15]
    category: Salads
    difficulty: EASY
    prep: 20
    cook: 10
    servings: 4
    tags: [salad, spicy]
    ingredients:
      - group: Salad
        items:
          - [beef sirloin or fillet, 400, g]
          - [cucumber, 1, null]
          - [cherry tomatoes, 10, null]
          - [red onion, 0.5, null]
          - [spring onions, 2, null]
          - [fresh mint, 1, bunch]
          - [fresh coriander, 1, bunch]
      - group: Dressing
        items:
          - [fish sauce, 3, tbsp]
          - [lime juice, 3, tbsp]
          - [palm sugar, 1, tbsp]
          - [Thai chillies, 2, null]
          - [garlic, 1, clove]
    steps:
      - Griddle or grill the beef for 3-4 minutes on each side, rare. Rest for 5 minutes and slice thinly.
      - Mix the dressing ingredients with the very finely chopped chillies and garlic until the sugar dissolves.
      - Toss the beef with the cucumber half-moons, halved tomatoes, sliced onion, spring onion and herbs.
      - Pour over the dressing and serve straight away.

  - name: Thai fish cakes (tod mun pla)
    health: [YELLOW, "Fish cakes with curry paste, deep-fried: protein, but with fat."]
    nutrition: [260, 22, 6, 16]
    photo: cocina-tailandesa/tortitas-de-pescado-tod-mun-pla.jpg
    category: Fish and seafood
    difficulty: MEDIUM
    prep: 30
    cook: 15
    servings: 4
    notes: The paste is kneaded by slapping it against the bowl so it turns springy. Served with a sweet and sour cucumber relish (ajad).
    tags: [fried, snack]
    utensils: [Food processor]
    ingredients:
      - group: Fish cakes
        items:
          - [white fish fillets, 400, g]
          - [red curry paste, 2, tbsp]
          - [egg, 1, null]
          - [fish sauce, 1, tbsp]
          - [sugar, 1, tsp]
          - [yardlong beans, 50, g]
          - [kaffir lime leaves, 5, null]
          - [sunflower oil for frying, null, null]
      - group: Ajad relish
        items:
          - [rice vinegar, 80, ml]
          - [sugar, 4, tbsp]
          - [salt, 0.5, tsp]
          - [cucumber, 0.5, null]
          - [shallot, 1, null]
          - [red chilli, 1, null]
    steps:
      - Heat the vinegar with the sugar and salt until dissolved. Let it cool and add the diced cucumber and chopped shallot and chilli.
      - Process the fish with the curry paste, egg, fish sauce and sugar to a paste.
      - Tip it into a bowl and knead it by slapping it against the bowl for 2 minutes. Add the thinly sliced beans and the shredded lime leaves.
      - With wet hands, shape 5 cm cakes 1 cm thick.
      - Fry them in oil at 170 °C for 2-3 minutes on each side, until golden and puffed. Serve with the relish.

  - name: Thai omelette (kai jeow)
    health: [RED, "An omelette deep-fried in plenty of oil, over rice: very fatty."]
    nutrition: [620, 20, 56, 34]
    category: Eggs
    difficulty: EASY
    prep: 5
    cook: 5
    servings: 1
    notes: Fried in plenty of very hot oil, it puffs up, crisp outside and soft inside. Eaten over rice with sriracha.
    tags: [egg, quick]
    utensils: [Wok]
    ingredients:
      - items:
          - [eggs, 3, null]
          - [fish sauce, 1, tsp]
          - [lime juice, 0.5, tsp]
          - [sunflower oil, 100, ml]
          - [cooked jasmine rice, 200, g]
          - [sriracha sauce, null, null, optional]
    steps:
      - Beat the eggs with the fish sauce and lime juice until frothy.
      - Heat the oil in the wok until smoking.
      - Pour in the eggs from a height into the centre; they will puff up straight away.
      - Fry for 1 minute, flip and fry for 30 more seconds. Drain and serve over the rice with sriracha.

  - name: Khao man gai
    health: [YELLOW, "Rice cooked in stock with chicken fat, and chicken with skin: complete but fatty."]
    nutrition: [620, 32, 78, 20]
    photo: cocina-tailandesa/khao-man-gai.jpg
    category: Rice
    difficulty: MEDIUM
    prep: 20
    cook: 60
    servings: 4
    notes: Hainanese-style chicken rice, one of Bangkok's most common street dishes. The rice is cooked with the chicken's fat and stock.
    tags: [rice, chicken]
    ingredients:
      - group: Chicken and stock
        items:
          - [skin-on chicken thighs, 6, null]
          - [fresh ginger, 5, cm]
          - [garlic, 4, clove]
          - [spring onions, 2, null]
          - [water, 2, l]
          - [salt, 1, tsp]
      - group: Rice
        items:
          - [jasmine rice, 400, g]
          - [chicken fat or oil, 2, tbsp]
          - [chopped garlic, 1, tbsp]
          - [chopped fresh ginger, 1, tbsp]
      - group: Sauce
        items:
          - [fermented soybean paste (tao jiew), 3, tbsp]
          - [grated fresh ginger, 1, tbsp]
          - [garlic, 1, clove]
          - [red chilli, 1, null]
          - [rice vinegar, 1, tbsp]
          - [sugar, 1, tsp]
          - [dark soy sauce, 1, tsp]
      - group: To serve
        items:
          - [cucumber, 1, null]
          - [fresh coriander, 1, bunch]
    steps:
      - Simmer the chicken with the ginger, garlic, spring onions, salt and water very gently for 30 minutes. Take it out and set aside. Strain the stock.
      - Fry the chopped garlic and ginger in the chicken fat, add the rinsed rice and stir for 2 minutes.
      - Add 550 ml of the stock, cover and cook over the lowest heat for 15 minutes. Rest for 10 minutes.
      - Mix the sauce ingredients with the chopped garlic and chilli.
      - Serve the rice with the sliced chicken, cucumber, coriander, the sauce and a bowl of hot stock.

  - name: Isan grilled chicken (gai yang)
    health: [YELLOW, "Marinated grilled chicken: high in protein, though the skin adds fat."]
    nutrition: [420, 40, 4, 27]
    photo: cocina-tailandesa/pollo-a-la-parrilla-de-isan-gai-yang.jpg
    category: Meat
    difficulty: EASY
    prep: 20
    cook: 40
    servings: 4
    origin: Isan
    notes: Served with som tam, sticky rice and jaew sauce. Marinate the chicken for at least 4 hours. Coriander stems can replace the roots.
    tags: [grill, chicken]
    utensils: [Barbecue]
    ingredients:
      - items:
          - [whole chicken legs, 1, kg]
          - [garlic, 6, clove]
          - [coriander roots or stems, 4, null]
          - [white peppercorns, 1, tsp]
          - [lemongrass, 2, stalk]
          - [fish sauce, 3, tbsp]
          - [soy sauce, 1, tbsp]
          - [palm sugar, 1, tbsp]
    steps:
      - Pound the garlic, coriander, pepper and chopped lemongrass in a mortar to a paste.
      - Mix it with the sauces and sugar and marinate the chicken for at least 4 hours.
      - Grill over medium embers for 35-40 minutes, turning often, until the skin is golden and the juices run clear.
      - Serve with jaew sauce, som tam and sticky rice.

  - name: Jaew dipping sauce
    health: [GREEN, "A sauce of chilli, lime and fish sauce: almost no calories, but salty."]
    nutrition: [25, 1, 5, 0]
    photo: cocina-tailandesa/salsa-jaew.jpg
    category: Sauces
    difficulty: EASY
    prep: 10
    cook: 5
    servings: 6
