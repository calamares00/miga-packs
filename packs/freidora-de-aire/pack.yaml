    steps:
      - Separa el brócoli en ramilletes medianos, lávalos y sécalos bien.
      - Mézclalos con el aceite, el ajo en polvo y la sal.
      - Cocina a 190 °C durante 6 minutos, espolvorea el parmesano y cocina 3-4 minutos más.
      - Sirve con unas gotas de limón.

