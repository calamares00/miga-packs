          - [pepino, 1, null]
          - [pimiento verde, 1, null]
          - [cebolla morada, 0.5, null]
          - [aceitunas kalamata, 100, g]
          - [queso feta, 200, g]
          - [orégano seco, 1, cucharadita]
          - [aceite de oliva virgen extra, 4, cucharada]
          - [vinagre de vino tinto, 1, cucharada]
          - [sal, null, null]
    steps:
      - Corta el tomate en gajos, el pepino en medias lunas, el pimiento en tiras y la cebolla en aros finos.
      - Mezcla las verduras con las aceitunas y sala ligeramente.
      - Coloca el feta en un bloque encima y espolvorea el orégano.
      - Aliña con el aceite y el vinagre justo antes de servir.

  - name: Tzatziki
    health: [GREEN, "Yogur con pepino y hierbas: proteína, probióticos y pocas calorías."]
    nutrition: [120, 9, 6, 7]
    photo: cocina-mediterranea/tzatziki.jpg
