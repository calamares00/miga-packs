          - [garbanzos cocidos, 800, g]
          - [aceite, 3, cucharada]
          - [comino en grano, 1, cucharadita]
          - [cebollas, 2, null]
          - [pasta de jengibre y ajo, 1, cucharada]
          - [chile verde, 1, null]
          - [tomate triturado, 400, g]
          - [cilantro molido, 2, cucharadita]
          - [chile en polvo, 0.5, cucharadita]
          - [cúrcuma, 0.5, cucharadita]
          - [amchur (mango seco en polvo) o zumo de limón, 1, cucharadita]
          - [garam masala, 1, cucharadita]
          - [cilantro fresco, 1, manojo]
          - [sal, null, null]
    steps:
      - Fríe el comino en el aceite 30 segundos. Añade la cebolla picada y dórala 10 minutos.
      - "Agrega la pasta de jengibre y ajo y el chile picado, y luego el cilantro molido, el chile en polvo y la cúrcuma. Cocina 1 minuto."
      - "Añade el tomate y cuece 8 minutos, hasta que el aceite se separe."
      - Incorpora los garbanzos escurridos y 200 ml de agua. Aplasta algunos para espesar y cuece 10 minutos.
      - "Termina con el amchur, el garam masala, sal y el cilantro picado."

