          - [chile rojo, 1, null]
    steps:
      - Cuece el pollo en agua con sal 15-20 minutos, deja que se enfríe y desmenúzalo.
      - Corta la col en juliana muy fina, ralla la zanahoria y corta la cebolla en láminas finas.
      - Mezcla los ingredientes del aliño con el ajo y el chile muy picados, hasta que se disuelva el azúcar.
      - Mezcla el pollo con las verduras, la menta y el aliño. Sirve con los cacahuetes y las chalotas fritas por encima.

  - name: Nước chấm
    health: [GREEN, "Salsa de pescado con lima, ajo y azúcar: pocas calorías, pero salada."]
    nutrition: [25, 1, 6, 0]
    photo: cocina-vietnamita/nuoc-cham.jpg
    category: Salsas
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 8
    notes: La salsa para mojar de casi todos los platos vietnamitas. Debe quedar equilibrada entre dulce, ácida y salada.
    tags: [salsa]
    ingredients:
      - items:
          - [salsa de pescado, 4, cucharada]
          - [zumo de lima, 3, cucharada]
          - [azúcar, 3, cucharada]
          - [agua tibia, 120, ml]
          - [ajo, 2, diente]
          - [chile rojo, 1, null]
    steps:
      - Disuelve el azúcar en el agua tibia.
      - Añade la salsa de pescado y el zumo de lima y prueba; ajusta hasta que esté equilibrada.
      - Añade el ajo y el chile muy picados justo antes de servir, para que floten.

  - name: Bún thịt nướng
    health: [YELLOW, "Fideos de arroz con cerdo a la parrilla, verduras y hierbas: completo, aunque la paleta aporta grasa."]
    nutrition: [560, 30, 60, 22]
    photo: cocina-vietnamita/bun-thit-nuong.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 40
    cook: 15
    servings: 4
    origin: Saigón
    notes: Cuenco de fideos fríos con cerdo a la parrilla, verduras y hierbas. Marina el cerdo al menos 1 hora.
    tags: [fideos, parrilla]
    ingredients:
      - group: Cerdo
        items:
          - [paleta o aguja de cerdo en lonchas finas, 500, g]
          - [hierba limón (citronela), 2, tallo]
          - [chalotas, 2, null]
          - [ajo, 2, diente]
          - [salsa de pescado, 2, cucharada]
          - [miel, 1, cucharada]
          - [azúcar, 1, cucharada]
          - [aceite de girasol, 1, cucharada]
      - group: Cuencos
        items:
          - [fideos de arroz finos (bún), 300, g]
          - [lechuga, 1, null]
          - [pepino, 1, null]
          - [zanahoria y daikon encurtidos, 100, g]
          - ["hierbas frescas (menta, cilantro, perilla)", 1, manojo]
          - [cacahuetes tostados picados, 3, cucharada]
          - [cebolletas en aceite (mỡ hành), 3, cucharada]
          - [nước chấm, 300, ml]
    steps:
      - Tritura la citronela, las chalotas y el ajo y mézclalos con la salsa de pescado, la miel, el azúcar y el aceite. Marina el cerdo.
      - Ásalo a la parrilla o en el grill del horno 3-4 minutos por cada lado, hasta que esté caramelizado.
      - Cuece los fideos, pásalos por agua fría y escúrrelos.
      - Pon en cada cuenco lechuga, pepino y hierbas, los fideos y el cerdo encima, con el encurtido, los cacahuetes y la cebolleta en aceite.
      - Riega con nước chấm al comer.

  - name: Tofu en salsa de tomate (đậu hũ sốt cà chua)
    health: [GREEN, "Tofu en salsa de tomate: proteína vegetal con poca grasa y verdura."]
    nutrition: [200, 14, 10, 12]
    category: Legumbres
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 4
    notes: Plato casero muy habitual. Para hacerlo vegano, usa salsa de soja en lugar de salsa de pescado.
    tags: [tofu, casero]
    ingredients:
      - items:
          - [tofu firme, 400, g]
          - [tomates maduros, 4, null]
          - [chalota, 1, null]
          - [ajo, 2, diente]
          - [salsa de pescado o de soja, 2, cucharada]
          - [azúcar, 1, cucharadita]
          - [cebolletas, 2, null]
          - [aceite de girasol, 4, cucharada]
          - [pimienta negra, null, null]
    steps:
      - Seca el tofu, córtalo en dados grandes y fríelo en el aceite hasta que esté dorado por todos los lados. Retíralo.
      - En el mismo aceite, sofríe la chalota y el ajo picados. Añade los tomates en dados y cocina 8 minutos, hasta que se deshagan.
      - Añade la salsa de pescado, el azúcar y un chorrito de agua.
      - Incorpora el tofu y cuece 5 minutos para que se impregne. Sirve con cebolleta y pimienta.

  - name: Plátano con leche de coco (chè chuối)
    health: [RED, "Plátano en leche de coco con tapioca y azúcar: dulce y con grasa saturada del coco."]
    nutrition: [380, 4, 52, 19]
    photo: cocina-vietnamita/platano-con-leche-de-coco-che-chuoi.jpg
    category: Postres
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 4
    notes: Postre templado de plátano y perlas de tapioca. En Vietnam se usan plátanos pequeños y dulces.
    tags: [postre, sin gluten, vegano]
    ingredients:
      - items:
          - [plátanos maduros, 4, null]
          - [leche de coco, 400, ml]
          - [agua, 200, ml]
          - [perlas de tapioca pequeñas, 30, g]
          - [azúcar, 50, g]
          - [sal, 1, pizca]
          - [cacahuetes tostados picados, 2, cucharada]
          - [sésamo tostado, 1, cucharadita]
    steps:
      - Remoja la tapioca en agua 20 minutos y escúrrela.
      - Calienta la leche de coco con el agua, el azúcar y la sal. Añade la tapioca y cuece 10 minutos, removiendo, hasta que las perlas sean transparentes.
      - Añade los plátanos en rodajas gruesas y cuece 3-4 minutos, sin que se deshagan.
      - Sirve templado con los cacahuetes y el sésamo.

  - name: Café con leche condensada (cà phê sữa đá)
    health: [YELLOW, "Café con leche condensada: estimulante y muy dulce."]
    nutrition: [130, 3, 22, 3]
    photo: cocina-vietnamita/cafe-con-leche-condensada-ca-phe-sua-a.jpg
    category: Bebidas
    difficulty: EASY
    prep: 5
    cook: 5
    servings: 1
    notes: Se hace con un filtro de goteo vietnamita (phin) y café robusta de tueste oscuro; con un café expreso doble también sale bien.
    tags: [café, bebida]
    ingredients:
      - items:
          - [café molido de tueste oscuro, 2, cucharada]
          - [leche condensada, 2, cucharada]
          - [agua hirviendo, 100, ml]
          - [hielo, 1, taza]
    steps:
      - Pon la leche condensada en el fondo de un vaso.
      - Coloca el phin con el café sobre el vaso, vierte un poco de agua para que se hinche y después el resto. Deja que gotee 4-5 minutos.
      - Mezcla el café con la leche condensada y viértelo sobre un vaso con hielo.

