  - name: Pollo a la mantequilla
    health: [RED, "Pollo en salsa de tomate con mantequilla y nata: muy sabroso pero con bastante grasa saturada."]
    nutrition: [560, 38, 14, 39]
    photo: cocina-india/pollo-a-la-mantequilla.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 40
    servings: 4
    origin: Delhi
    notes: "Si puedes, marina el pollo la víspera. El kasuri methi (hojas secas de fenogreco) es lo que le da su aroma típico."
    tags: [curry, pollo, sin gluten]
    ingredients:
      - group: Marinada
        items:
          - [contramuslos de pollo deshuesados, 800, g]
          - [yogur natural, 150, g]
          - [garam masala, 1, cucharadita]
          - [pimentón picante o chile en polvo, 1, cucharadita]
          - [pasta de jengibre y ajo, 1, cucharada]
          - [sal, 1, cucharadita]
      - group: Salsa
        items:
          - [mantequilla, 60, g]
          - [cebolla, 1, null]
          - [pasta de jengibre y ajo, 1, cucharada]
          - [tomate triturado, 400, g]
          - [garam masala, 1, cucharadita]
          - [comino molido, 1, cucharadita]
          - [anacardos, 40, g]
          - [nata para cocinar, 150, ml]
          - [kasuri methi, 1, cucharada]
          - [azúcar, 1, cucharadita]
    steps:
      - Corta el pollo en trozos y mézclalo con los ingredientes de la marinada. Déjalo en la nevera al menos 1 hora.
      - "Dora el pollo en una sartén muy caliente con un poco de mantequilla, por tandas, hasta que tenga zonas tostadas. Resérvalo."
      - "En la misma sartén, derrite el resto de la mantequilla y sofríe la cebolla picada 8 minutos. Añade la pasta de jengibre y ajo, las especias y luego el tomate y los anacardos. Cuece 15 minutos."
      - Tritura la salsa hasta que quede muy fina y vuelve a ponerla en la sartén con el pollo. Cuece 10 minutos.
      - "Añade la nata, el azúcar y el kasuri methi frotado entre las manos. Rectifica de sal y sirve con arroz basmati o naan."

  - name: Pollo tandoori
    health: [GREEN, "Pollo marinado en yogur y especias y asado al horno, sin apenas grasa añadida."]
    nutrition: [320, 42, 6, 13]
    photo: cocina-india/pollo-tandoori.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 4
    origin: Punyab
    notes: El color rojo tradicional viene del chile de Cachemira; el pimentón dulce da un color parecido sin picar tanto.
    tags: [pollo, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [muslos y contramuslos de pollo sin piel, 1.2, kg]
          - [yogur griego, 200, g]
          - [zumo de limón, 2, cucharada]
          - [pasta de jengibre y ajo, 2, cucharada]
          - [chile de Cachemira o pimentón dulce, 2, cucharadita]
          - [garam masala, 2, cucharadita]
          - [comino molido, 1, cucharadita]
          - [cúrcuma, 0.5, cucharadita]
          - [aceite, 2, cucharada]
          - [sal, 1.5, cucharadita]
          - [cebolla morada y limón para servir, null, null]
    steps:
      - Haz cortes profundos en el pollo y úntalo con el zumo de limón y la sal. Déjalo 15 minutos.
      - "Mezcla el yogur con la pasta de jengibre y ajo, las especias y el aceite. Cubre bien el pollo y déjalo marinar en la nevera de 4 a 12 horas."
      - Precalienta el horno a 230 °C. Pon el pollo sobre una rejilla con una bandeja debajo.
      - "Hornea 30-35 minutos, dándole la vuelta a mitad, y termina 3 minutos con el grill para que se tueste."
      - "Sirve con aros de cebolla morada, gajos de limón y raita."

  - name: Rogan josh
    health: [YELLOW, "Cordero guisado en salsa especiada: mucha proteína, pero la carne de cordero es grasa."]
    nutrition: [480, 36, 10, 32]
    photo: cocina-india/rogan-josh.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 90
    servings: 4
    origin: Cachemira
    tags: [curry, cordero, sin gluten]
    ingredients:
      - items:
          - [paletilla de cordero deshuesada, 900, g]
          - [aceite o ghee, 3, cucharada]
          - [cebollas, 2, null]
          - [vainas de cardamomo, 4, null]
          - [clavos, 4, null]
          - [canela, 1, rama]
          - [hojas de laurel, 2, null]
          - [pasta de jengibre y ajo, 2, cucharada]
          - [chile de Cachemira o pimentón dulce, 1, cucharada]
          - [comino molido, 1, cucharadita]
          - [cilantro molido, 2, cucharadita]
          - [yogur natural, 200, g]
          - [garam masala, 1, cucharadita]
          - [sal, null, null]
    steps:
      - "Corta el cordero en dados de 4 cm. Calienta el aceite en una olla y fríe 1 minuto el cardamomo, los clavos, la canela y el laurel."
      - "Añade las cebollas picadas y dóralas bien, unos 12 minutos. Agrega la pasta de jengibre y ajo y cocina 1 minuto."
      - "Sube el fuego, añade el cordero y dóralo. Incorpora el chile, el comino y el cilantro molido."
      - "Baja el fuego y añade el yogur cucharada a cucharada, removiendo para que no se corte. Agrega 250 ml de agua y sal."
      - "Tapa y cuece a fuego suave 1 hora y cuarto, hasta que el cordero esté tierno. Termina con el garam masala."

  - name: Korma de pollo
    health: [YELLOW, "Curry suave con yogur y frutos secos: buena proteína, pero los anacardos y la nata suman calorías."]
    nutrition: [510, 38, 15, 33]
    photo: cocina-india/korma-de-pollo.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 4
    origin: Uttar Pradesh
    tags: [curry, pollo, suave, sin gluten]
    utensils: [Batidora]
    ingredients:
      - items:
          - [pechugas o contramuslos de pollo, 700, g]
          - [anacardos, 60, g]
          - [ghee o aceite, 3, cucharada]
          - [cebollas, 2, null]
          - [vainas de cardamomo, 5, null]
          - [canela, 1, rama]
          - [pasta de jengibre y ajo, 1, cucharada]
          - [cilantro molido, 2, cucharadita]
          - [yogur natural, 150, g]
          - [nata para cocinar, 100, ml]
          - [garam masala, 1, cucharadita]
          - [sal, null, null]
    steps:
      - Remoja los anacardos en 150 ml de agua caliente 15 minutos y tritúralos con el agua hasta obtener una crema.
      - Calienta el ghee y fríe el cardamomo y la canela 30 segundos. Añade las cebollas en láminas finas y póchalas 12 minutos sin que se doren mucho.
      - "Agrega la pasta de jengibre y ajo y el cilantro molido, y luego el pollo en trozos. Cocina 5 minutos."
      - "Añade el yogur poco a poco, la crema de anacardos y 100 ml de agua. Sala y cuece tapado 20 minutos a fuego suave."
      - Incorpora la nata y el garam masala y cuece 2 minutos más. Sirve con arroz basmati.

  - name: Vindaloo de cerdo
    health: [YELLOW, "Cerdo en un adobo de vinagre y chile: mucha proteína, con grasa moderada según el corte."]
    nutrition: [450, 35, 9, 30]
    photo: cocina-india/vindaloo-de-cerdo.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 75
    servings: 4
    origin: Goa
    notes: "Es un plato goano de origen portugués (vinha d'alhos). Pica bastante: ajusta la cantidad de chile."
    tags: [curry, cerdo, picante, sin gluten]
    utensils: [Batidora]
    ingredients:
      - group: Pasta de especias
        items:
          - [chiles rojos secos, 8, null]
          - [comino en grano, 1, cucharadita]
          - [pimienta negra en grano, 1, cucharadita]
          - [clavos, 6, null]
          - [canela, 1, rama]
          - [ajo, 8, diente]
          - [jengibre fresco, 3, cm]
          - [vinagre de vino tinto, 80, ml]
          - [azúcar, 1, cucharadita]
      - group: Guiso
        items:
          - [paleta o aguja de cerdo, 900, g]
          - [aceite, 3, cucharada]
          - [cebollas, 2, null]
          - [cúrcuma, 1, cucharadita]
          - [sal, 1.5, cucharadita]
    steps:
      - "Remoja los chiles en agua caliente 15 minutos. Tuesta en seco el comino, la pimienta, los clavos y la canela 1 minuto."
      - "Tritura los chiles escurridos con las especias, el ajo, el jengibre, el vinagre y el azúcar hasta obtener una pasta."
      - "Corta el cerdo en dados, mézclalo con la pasta, la cúrcuma y la sal y déjalo marinar en la nevera al menos 4 horas."
      - Dora la cebolla picada en el aceite 10 minutos. Añade el cerdo con su marinada y cocina 5 minutos.
      - "Agrega 200 ml de agua, tapa y cuece a fuego suave 1 hora, hasta que el cerdo esté tierno y la salsa espesa."

  - name: Palak paneer
    health: [GREEN, "Espinacas con queso fresco paneer: mucho hierro, calcio y proteína vegetal y láctea."]
    nutrition: [380, 19, 12, 28]
    photo: cocina-india/palak-paneer.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 4
    origin: Punyab
    notes: "Si no encuentras paneer, usa halloumi o queso fresco firme."
    tags: [vegetariano, sin gluten]
    utensils: [Batidora]
    ingredients:
      - items:
          - [espinacas frescas, 500, g]
          - [paneer, 250, g]
          - [ghee o aceite, 3, cucharada]
          - [comino en grano, 1, cucharadita]
          - [cebolla, 1, null]
          - [tomate, 1, null]
          - [pasta de jengibre y ajo, 1, cucharada]
          - [chile verde, 1, null]
          - [garam masala, 1, cucharadita]
          - [nata para cocinar, 3, cucharada]
          - [sal, null, null]
    steps:
      - "Escalda las espinacas 1 minuto en agua hirviendo, enfríalas en agua con hielo y tritúralas con el chile."
      - Corta el paneer en dados y dóralo en 1 cucharada de ghee. Resérvalo.
      - "En el resto del ghee fríe el comino 30 segundos, añade la cebolla picada y póchala 8 minutos. Agrega la pasta de jengibre y ajo y el tomate picado y cocina 5 minutos."
      - "Incorpora el puré de espinacas, el garam masala y sal, y cuece 5 minutos."
      - "Añade el paneer y la nata, calienta 2 minutos y sirve con chapatis o arroz."

  - name: Chana masala
    health: [GREEN, "Garbanzos en salsa de tomate especiada: mucha fibra y proteína vegetal, poca grasa."]
    nutrition: [330, 14, 45, 10]
    photo: cocina-india/chana-masala.jpg
