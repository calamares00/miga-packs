    steps:
      - Ralla el pepino con piel, sálalo y deja que escurra 10 minutos. Aprieta para quitar el agua.
      - Mezcla el yogur con el pepino, el ajo rallado, el eneldo, el limón y el aceite.
      - Prueba de sal y refrigera 30 minutos. Sirve con pan de pita.

  - name: Musaka
    health: [YELLOW, "Verdura y carne con bechamel: completo, pero la carne, el aceite y la bechamel lo hacen muy calórico."]
    nutrition: [520, 26, 28, 34]
    photo: cocina-mediterranea/musaka.jpg
    category: Carnes
    difficulty: HARD
    prep: 40
    cook: 75
    servings: 6
    origin: Grecia
    originCountry: GR
    tags: [horno, cordero, berenjena]
    utensils: [Horno]
    ingredients:
      - group: Capas
        items:
          - [berenjenas, 3, null]
          - [patatas, 2, null, optional]
          - [aceite de oliva, 4, cucharada]
          - [sal, null, null]
      - group: Carne
        items:
          - [carne picada de cordero o ternera, 600, g]
          - [cebolla, 1, null]
          - [ajo, 2, diente]
          - [tomate triturado, 400, g]
          - [vino tinto, 100, ml]
          - [canela molida, 0.5, cucharadita]
          - [orégano seco, 1, cucharadita]
      - group: Bechamel
        items:
          - [mantequilla, 60, g]
          - [harina de trigo, 60, g]
          - [leche, 700, ml]
          - [huevo, 1, null]
          - [queso kefalotiri o parmesano rallado, 60, g]
          - [nuez moscada, 1, pizca]
    steps:
      - group: Preparación
        items:
          - Corta las berenjenas en rodajas de 1 cm, sálalas 20 minutos y sécalas. Úntalas con aceite y ásalas en el horno a 200 °C 20 minutos. Si usas patata, ásala igual en rodajas.
          - Sofríe la cebolla y el ajo, añade la carne y dórala. Agrega el vino, el tomate, la canela y el orégano, y cocina 20 minutos.
          - Para la bechamel, cocina la harina en la mantequilla 2 minutos, añade la leche poco a poco y cuece hasta espesar. Fuera del fuego, añade el huevo, la mitad del queso y la nuez moscada.
      - group: Montaje
        items:
          - En una fuente, alterna patata, berenjena y carne, y termina con la bechamel y el resto del queso.
          - Hornea a 180 °C 45 minutos, hasta que esté dorada. Deja reposar 20 minutos antes de cortar.

