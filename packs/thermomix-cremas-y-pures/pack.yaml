recipes:

  - name: Crema de calabaza
    health: [GREEN, "Crema de verdura con poco aceite y un toque de nata. Rica en fibra y vitamina A, y con pocas calorías."]
    nutrition: [170, 3, 18, 10]
    photo: thermomix-cremas-y-pures/crema-de-calabaza.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 4
    notes: Programada para Thermomix TM6. No superes la marca de 2,2 litros del vaso.
    tags: [crema, otoño, vegetariana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [aceite de oliva virgen extra, 30, g]
          - [calabaza pelada en trozos, 600, g]
          - [zanahoria, 1, null]
          - [patata, 150, g]
          - [caldo de verduras, 500, g]
          - [nata para cocinar, 50, g, optional]
          - [nuez moscada, 1, pizca]
          - [sal, 1, cucharadita]
    steps:
      - Pon la cebolla en trozos en el vaso y pica 5 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 5 min/120 °C/vel 1.
      - Añade la calabaza, la zanahoria y la patata en trozos y trocea 5 seg/vel 5.
      - Añade el caldo, la sal y la nuez moscada y programa 25 min/100 °C/vel 1.
      - Añade la nata y tritura 1 min/vel 5-10, subiendo la velocidad progresivamente. Ajusta de sal.

  - name: Crema de verduras
    health: [GREEN, "Muchas verduras distintas con un poco de aceite de oliva. Ligera, saciante y llena de fibra."]
    nutrition: [150, 3, 17, 8]
    photo: thermomix-cremas-y-pures/crema-de-verduras.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 4
    notes: Programada para Thermomix TM6. Vale cualquier mezcla de verduras de temporada, con un peso total parecido.
    tags: [crema, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [puerro, 1, null]
          - [aceite de oliva virgen extra, 30, g]
          - [zanahorias, 2, null]
          - [calabacín, 1, null]
          - [judías verdes, 100, g]
          - [patata, 200, g]
          - [agua o caldo de verduras, 600, g]
          - [sal, 1, cucharadita]
    steps:
      - Pon la cebolla y el puerro en trozos en el vaso y pica 5 seg/vel 5.
      - Añade el aceite y sofríe 6 min/120 °C/vel 1.
      - Añade el resto de las verduras en trozos y trocea 5 seg/vel 5.
      - Añade el agua y la sal y programa 25 min/100 °C/vel 1.
      - Tritura 1 min/vel 5-10 progresivamente y ajusta de sal.

  - name: Puré de patatas
    health: [YELLOW, "Patata con leche entera y mantequilla: reconfortante, pero con grasa. Buen acompañamiento en cantidad moderada."]
    nutrition: [250, 6, 36, 11]
    photo: thermomix-cremas-y-pures/pure-de-patatas.jpg
    category: Verduras
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programado para Thermomix TM6. Usa siempre la mariposa y no superes la velocidad 3,5, o el puré quedará elástico.
    tags: [puré, guarnición, vegetariana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [patatas harinosas, 800, g]
          - [leche entera, 300, g]
          - [mantequilla, 40, g]
          - [sal, 1, cucharadita]
          - [nuez moscada, 1, pizca]
    steps:
      - Coloca la mariposa en las cuchillas.
      - Pela las patatas, córtalas en rodajas de 1 cm y ponlas en el vaso con la leche y la sal.
      - Programa 25 min/100 °C/giro a la izquierda/vel cuchara, hasta que las patatas estén tiernas.
      - Añade la mantequilla y la nuez moscada y mezcla 20 seg/vel 3,5. Quita la mariposa y sirve.

  - name: Vichyssoise
    health: [YELLOW, "Puerro y patata ligeros, pero la mantequilla y la nata la hacen más grasa. Aligerarla con menos nata."]
    nutrition: [250, 4, 20, 17]
    photo: thermomix-cremas-y-pures/vichyssoise.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programada para Thermomix TM6. Se sirve fría, con cebollino picado.
    tags: [crema, fría, vegetariana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [puerros (la parte blanca), 3, null]
          - [cebolla, 0.5, null]
          - [mantequilla, 30, g]
          - [patatas, 300, g]
          - [caldo de pollo o de verduras, 600, g]
          - [nata para cocinar, 150, g]
          - [sal, 1, cucharadita]
          - [pimienta blanca, null, null]
          - [cebollino picado, 1, cucharada]
    steps:
      - Pon los puerros y la cebolla en trozos en el vaso y pica 5 seg/vel 5.
      - Añade la mantequilla y sofríe 8 min/100 °C/vel 1, sin que tomen color.
      - Añade las patatas en trozos, el caldo, la sal y la pimienta y programa 20 min/100 °C/vel 1.
      - Añade la nata y tritura 1 min/vel 5-10 progresivamente.
      - Enfría en la nevera al menos 3 horas y sirve con cebollino.

