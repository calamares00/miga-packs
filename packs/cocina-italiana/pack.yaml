description: >-
  Los grandes clásicos de las regiones de Italia: carbonara, amatriciana, cacio e pepe, lasaña,
  pasta alla Norma, espaguetis con almejas, risotto a la milanesa, ossobuco, saltimbocca,
  parmigiana, minestrone, pasta e fagioli, pizza margarita, focaccia, arancini, vitello tonnato,
