  source: "Pack «Horno: todo en una bandeja» de Miga"
recipes:

  - name: Pollo con verduras a la mostaza
    health: [GREEN, "Pollo con muchas verduras asadas: completo y con poca grasa añadida."]
    nutrition: [430, 36, 30, 18]
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 40
    servings: 4
    notes: Horno con calor arriba y abajo. Una bandeja grande, para que las verduras se asen sin amontonarse.
    tags: [una bandeja, pollo, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [contramuslos de pollo, 8, null]
          - [patatas pequeñas, 500, g]
          - [zanahorias, 3, null]
          - [cebolla roja, 1, null]
          - [mostaza de Dijon, 2, cucharada]
          - [miel, 1, cucharada]
          - [tomillo seco, 1, cucharadita]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 210 °C.
      - Corta las patatas por la mitad, la zanahoria en bastones y la cebolla en gajos. Mézclalas en la bandeja con la mitad del aceite y sal.
      - Mezcla la mostaza, la miel, el tomillo y el resto del aceite y unta el pollo salado.
      - Coloca el pollo sobre las verduras y hornea 35-40 minutos, hasta que esté dorado y las patatas tiernas.

  - name: Salmón con patatas y espárragos
    health: [GREEN, "Pescado azul con verdura y patata: omega 3 en una cena completa."]
    nutrition: [460, 32, 30, 23]
    photo: horno-en-una-bandeja/salmon-con-patatas-y-esparragos.jpg
    category: Pescados y mariscos
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 4
    notes: Las patatas van primero porque tardan más; el salmón y los espárragos entran al final.
    tags: [una bandeja, pescado, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [lomos de salmón, 4, null]
          - [patatas pequeñas, 600, g]
          - [espárragos verdes, 1, manojo]
          - [limón, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 210 °C. Corta las patatas por la mitad, mézclalas con la mitad del aceite y sal y ásalas 20 minutos.
      - Aparta las patatas a los lados y coloca los espárragos y el salmón salado en el centro.
      - Riega con el resto del aceite mezclado con el ajo picado y pon rodajas de limón encima.
      - Hornea 12-15 minutos más.

  - name: Salchichas con verduras asadas
    health: [YELLOW, "Muchas verduras, pero las salchichas tienen grasa y sal: mejor de pollo o de buena calidad."]
    nutrition: [480, 18, 34, 30]
    photo: horno-en-una-bandeja/salchichas-con-verduras-asadas.jpg
    category: Carnes
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 4
    notes: Pínchalas con un tenedor para que no revienten.
    tags: [una bandeja, al horno, rápida]
    utensils: [Horno]
    ingredients:
      - items:
          - [salchichas frescas, 8, null]
          - [patatas, 500, g]
          - [pimiento rojo, 1, null]
          - [calabacín, 1, null]
          - [cebolla roja, 1, null]
          - [romero seco, 1, cucharadita]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 200 °C.
      - Corta las patatas y las verduras en trozos grandes y mézclalas en la bandeja con el aceite, el romero y la sal.
      - Coloca las salchichas encima y hornea 30-35 minutos, dándoles la vuelta a mitad.

  - name: Fajitas de pollo al horno
    health: [GREEN, "Pollo y pimientos asados con especias: ligeras y completas con las tortillas."]
    nutrition: [450, 34, 46, 14]
    photo: horno-en-una-bandeja/fajitas-de-pollo-al-horno.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 4
    notes: Sirve las tortillas calientes con guacamole, yogur o salsa.
    tags: [una bandeja, pollo, al horno, picante]
    utensils: [Horno]
    ingredients:
      - items:
          - [pechugas de pollo en tiras, 600, g]
          - [pimientos de colores, 3, null]
          - [cebolla, 1, null]
          - [comino molido, 1, cucharadita]
          - [pimentón ahumado, 1, cucharadita]
          - [chile en polvo, 0.5, cucharadita]
          - [lima, 1, null]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [tortillas de trigo, 8, null]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 220 °C.
      - Mezcla en la bandeja el pollo, los pimientos y la cebolla en tiras con las especias, el aceite y la sal.
      - Hornea 20-25 minutos, removiendo a mitad, hasta que el pollo esté hecho y los pimientos tostados.
      - Riega con zumo de lima y sirve con las tortillas calientes.

  - name: Ñoquis al horno con tomates cherry
    health: [YELLOW, "Ñoquis con tomate y mozzarella: sencillo y rico, con algo de grasa."]
    nutrition: [480, 16, 66, 17]
