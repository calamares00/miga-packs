          - [extra virgin olive oil, 4, tbsp]
          - [lemon juice, 1, tbsp]
          - [salt, null, null]
    steps:
      - Roast the whole aubergines in the oven or over a flame until soft. Peel and chop them.
      - Peel and grate the tomatoes and cook them with the chopped garlic, spices and oil for 10 minutes.
      - Add the aubergine and cook, mashing with a fork, for 15 minutes, until you have a textured purée.
      - Add the herbs and lemon, season and serve warm or cold.

