  La cocina de los inmigrantes italianos en Nueva York, Nueva Jersey y San Francisco, más generosa
  en carne, queso y salsa que la de Italia: espaguetis con albóndigas, pollo a la parmesana, penne
  alla vodka, fettuccine Alfredo, ziti al horno, gambas scampi, cioppino y sopa de boda italiana.
