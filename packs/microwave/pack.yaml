name: Microwave
series: Kitchen appliances
family: microondas
description: >-
  The microwave is good for much more than reheating: mug cake, baked eggs with ham, salmon and
  cod with vegetables, cheese flan, risotto, broccoli with almonds, lemon chicken, stuffed
  aubergines, express berry jam, chocolate custard and candied almonds. Times for an 800 W
  microwave: shorten them with more power, lengthen them with less. Use microwave-safe dishes and
  cover with a microwave lid or vented cling film.
