    origin: Marruecos
    originCountry: MA
    tags: [pollo, guiso]
    notes: Sin tajín de barro, una cazuela de fondo grueso con tapa da buen resultado.
    ingredients:
      - items:
          - [muslos de pollo, 8, null]
          - [cebollas, 2, null]
