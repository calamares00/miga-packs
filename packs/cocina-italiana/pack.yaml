          - [azúcar, 180, g]
          - [almendras crudas con piel, 180, g]
          - [huevos, 2, null]
          - [yema de huevo, 1, null]
          - [levadura química, 1, cucharadita]
          - [ralladura de naranja, 1, cucharadita]
          - [sal, 1, pizca]
    steps:
      - "Precalienta el horno a 180 °C. Mezcla la harina, el azúcar, la levadura, la sal y la ralladura."
      - Añade los huevos y la yema y amasa hasta que se forme una masa pegajosa. Incorpora las almendras.
      - Forma 2 rulos de 4 cm de ancho sobre una bandeja con papel y hornéalos 25 minutos.
      - "Déjalos templar 10 minutos y córtalos en diagonal en rebanadas de 1,5 cm."
      - "Coloca las rebanadas tumbadas y hornéalas 10-12 minutos más, hasta que estén secas y doradas."
