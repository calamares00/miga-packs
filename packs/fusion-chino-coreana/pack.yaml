description: >-
  Los platos de los restaurantes chinos de Corea, creados por inmigrantes de Shandong en Incheon y
  que se piden a domicilio en todo el país: jajangmyeon, jjamppong, tangsuyuk, kkanpunggi, lajogi,
  yusanseul, gun-mandu y goguma mattang.
