description: >-
  Dishes without wheat, barley or rye, made with rice, corn, pulses, buckwheat and nuts: chickpea
  socca, asparagus risotto, almond-crusted salmon, cauliflower-crust pizza, buckwheat galettes,
  polenta with mushrooms, courgette lasagne, meatballs in almond sauce, salt-baked sea bream and
  flourless chocolate cake. Always check the labels of stocks, sauces and spices.
