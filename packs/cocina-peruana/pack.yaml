name: "Cocina del mundo: Perú"
description: >-
  La cocina peruana de la costa, la sierra y la herencia chifa: ceviche, tiradito, lomo saltado,
  ají de gallina, causa limeña, papa a la huancaína, ocopa, arroz chaufa, anticuchos, pollo a la
  brasa, rocoto relleno, seco de res, arroz con pollo, chupe de camarones, papa rellena,
  tallarines verdes, suspiro limeño, picarones, mazamorra morada y chicha morada. Con
  equivalencias para los ajíes peruanos.
