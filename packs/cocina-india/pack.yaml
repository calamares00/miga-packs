      - "Lava las lentejas y cuécelas con 900 ml de agua, la cúrcuma y el tomate picado 25-30 minutos, hasta que se deshagan. Sala y bate un poco para que quede cremoso."
      - "Para el tadka, calienta el ghee y fríe la mostaza y el comino hasta que chisporroteen. Añade los chiles y el ajo laminado."
      - Agrega la cebolla picada y dórala 6 minutos. Retira del fuego y añade el chile en polvo.
      - "Vierte el tadka chisporroteante sobre el dal, espolvorea cilantro y sirve con arroz o chapatis."

  - name: Rajma
    health: [GREEN, "Alubias rojas en salsa de tomate especiada: mucha fibra y proteína vegetal."]
