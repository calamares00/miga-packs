  - name: Rosquillas de anís
    health: [RED, "Rosquillas fritas y rebozadas en azúcar: mucha grasa y azúcar. Dulce típico para ocasiones."]
    nutrition: [190, 3, 26, 8]
    category: Postres
    difficulty: MEDIUM
    prep: 30
    cook: 20
    servings: 24
    origin: España
    originCountry: ES
    notes: Las rosquillas fritas de la abuela. El aceite se aromatiza antes con piel de limón. La masa debe quedar blanda, sin pasarse de harina.
    tags: [dulce, fritura]
    ingredients:
      - items:
          - [huevos, 3, null]
          - [azúcar, 150, g]
          - [aceite de oliva suave, 100, g]
          - [piel de limón, 1, trozo]
          - [licor de anís, 50, g]
          - [leche, 50, g]
          - [ralladura de limón, 1, cucharadita]
          - [levadura química, 16, g]
          - [harina, 500, g]
          - [aceite de girasol para freír, null, null]
          - [azúcar para rebozar, 100, g]
    steps:
      - Fríe la piel de limón en el aceite de oliva hasta que se dore, retírala y deja que el aceite se enfríe.
      - Bate los huevos con el azúcar. Añade el aceite aromatizado, el anís, la leche y la ralladura.
      - Incorpora la harina tamizada con la levadura poco a poco, hasta tener una masa blanda que apenas se pegue a las manos. Deja que repose 15 minutos.
      - Con las manos untadas de aceite, haz cordones de 15 cm y une los extremos formando aros.
      - Fríelas en aceite a 170 °C, dándoles la vuelta, hasta que estén doradas. Escúrrelas y rebózalas en azúcar.
