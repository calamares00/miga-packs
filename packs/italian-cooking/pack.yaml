    steps:
      - Separate the eggs. Whisk the yolks with the sugar until pale and beat in the mascarpone until smooth.
      - Whisk the whites to stiff peaks and fold them into the cream.
      - Dip the ladyfingers in the coffee, one at a time and very quickly, and line the bottom of a dish with them.
      - Cover with half the cream, add another layer of ladyfingers and finish with the rest of the cream.
      - Chill for at least 6 hours and dust with cocoa just before serving.

