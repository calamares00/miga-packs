          - [lentejas cocidas, 500, g]
          - [tomates cherry, 200, g]
          - [pepino, 1, null]
          - [pimiento rojo, 1, null]
          - [cebolla morada, 0.5, null]
          - [queso feta, 100, g]
          - [perejil fresco, 1, puñado]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [vinagre de vino tinto, 1, cucharada]
          - [orégano seco, 1, cucharadita]
          - [sal y pimienta negra, null, null]
    steps:
      - Enjuaga y escurre las lentejas.
      - Corta las verduras en dados pequeños y mézclalas con las lentejas.
      - "Aliña con el aceite, el vinagre, el orégano, sal y pimienta, y termina con el feta desmenuzado y el perejil."

  - name: Quiche sin masa de espinacas
    health: [GREEN, "Huevo, espinacas y queso fresco sin masa: proteína y verdura con poca grasa."]
    nutrition: [260, 20, 7, 17]
    photo: saludable-vegetariano/quiche-sin-masa-de-espinacas.jpg
    category: Huevos
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 6
    tags: [huevos, vegetariano, sin gluten, al horno]
    utensils: [Horno]
    ingredients:
      - items:
          - [huevos, 6, null]
          - [espinacas frescas, 400, g]
          - [cebolla, 1, null]
          - [queso fresco batido, 250, g]
          - [queso gruyère o emmental rallado, 50, g]
          - [nuez moscada, 1, pizca]
          - [aceite de oliva, 1, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - "Precalienta el horno a 180 °C. Pocha la cebolla picada en el aceite, añade las espinacas y cocina hasta que pierdan el agua."
      - "Bate los huevos con el queso fresco, la mitad del queso rallado, la nuez moscada, sal y pimienta. Añade las espinacas."
      - "Vierte en un molde engrasado, cubre con el resto del queso y hornea 30-35 minutos, hasta que esté cuajada y dorada."

  - name: Calabacines rellenos de requesón
    health: [GREEN, "Calabacín con requesón, hierbas y tomate: ligero y con proteína láctea."]
    nutrition: [240, 14, 12, 15]
    photo: saludable-vegetariano/calabacines-rellenos-de-requeson.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    tags: [vegetariano, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [calabacines, 4, null]
          - [requesón o ricotta, 250, g]
          - [huevo, 1, null]
          - [queso parmesano rallado, 30, g]
          - [albahaca fresca, 1, puñado]
          - [ralladura de limón, 1, cucharadita]
          - [salsa de tomate, 250, ml]
          - [aceite de oliva virgen extra, 1, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - Precalienta el horno a 190 °C. Parte los calabacines a lo largo y vacíalos con una cucharilla.
      - "Mezcla el requesón con el huevo, la mitad del parmesano, la albahaca, la ralladura, la pulpa picada, sal y pimienta."
      - "Extiende la salsa en una fuente, coloca los calabacines rellenos, espolvorea el resto del parmesano y riega con el aceite."
      - "Hornea 25-30 minutos, hasta que estén tiernos y dorados."

  - name: Coliflor gratinada con yogur
    health: [GREEN, "Coliflor gratinada con yogur en vez de bechamel: mucho más ligera."]
    nutrition: [210, 13, 14, 12]
    photo: saludable-vegetariano/coliflor-gratinada-con-yogur.jpg
