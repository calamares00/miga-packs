    steps:
      - Precalienta el horno a 200 °C. Corta las patatas en rodajas, la cebolla y los pimientos en tiras, mézclalos con el aceite y sal y hornea 20 minutos.
      - Salpimienta las chuletas y frótalas con el ajo picado y el orégano.
      - Colócalas sobre las verduras, riega con el vino y hornea 15-20 minutos, dándoles la vuelta a mitad.

  - name: Pavo con boniato y cebolla roja
    health: [GREEN, "Pavo magro con boniato asado: proteína y fibra, con poca grasa."]
