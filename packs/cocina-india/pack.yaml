      - "Corta las cebollas en juliana fina, sálalas y déjalas 10 minutos para que suelten agua."
      - "Añade las harinas, las especias, el chile y el cilantro picados. Mezcla con las manos, añadiendo solo el agua justa para que la masa ligue."
      - "Calienta el aceite a 170 °C y fríe cucharadas de la mezcla, por tandas, 4-5 minutos, hasta que estén doradas y crujientes."
      - Escúrrelas sobre papel y sírvelas calientes con raita o chutney.

