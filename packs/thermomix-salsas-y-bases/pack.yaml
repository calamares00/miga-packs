  source: "Pack «Thermomix: salsas y bases» de Miga"
recipes:

  - name: Bechamel
    health: [YELLOW, "Leche, mantequilla y harina: aporta calcio, pero también grasa saturada."]
    nutrition: [140, 4, 10, 9]
    photo: thermomix-salsas-y-bases/bechamel.jpg
    category: Salsas
    difficulty: EASY
    prep: 2
    cook: 8
    servings: 6
    notes: Programado para Thermomix TM6. Para croquetas, duplica la harina; para lasaña, úsala tal cual.
    tags: [salsa]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [leche entera, 600, g]
          - [harina de trigo, 50, g]
          - [mantequilla, 40, g]
          - [sal, 1, cucharadita]
          - [nuez moscada, 1, pizca]
          - [pimienta blanca, 1, pizca]
    steps:
      - Pon todos los ingredientes en el vaso y mezcla 10 seg/vel 4.
      - Programa 8 min/90 °C/vel 4, hasta que espese.
      - Úsala enseguida o tápala con film en contacto para que no haga costra.

  - name: Mayonesa
    health: [RED, "Casi todo es aceite: muy calórica, mejor en poca cantidad."]
    nutrition: [180, 1, 0, 20]
    photo: thermomix-salsas-y-bases/mayonesa.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 0
    servings: 10
    notes: Hecha en Thermomix TM6. Lleva huevo crudo; guárdala en la nevera y consúmela en 24 horas. Las raciones son de una cucharada generosa.
    tags: [salsa, sin gluten]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [huevo a temperatura ambiente, 1, null]
          - [zumo de limón, 1, cucharada]
          - [sal, 0.5, cucharadita]
          - [aceite de girasol, 200, g]
    steps:
      - Pon el huevo, el limón y la sal en el vaso.
      - Programa 1 min 30 seg/vel 4 y vierte el aceite poco a poco sobre la tapa, con el cubilete puesto, para que caiga en un hilo fino.
      - Cuando termine, comprueba la textura; si la quieres más espesa, mezcla 10 seg/vel 4.

  - name: Alioli
    health: [RED, "Aceite emulsionado con ajo: muy calórico, para usar con moderación."]
    nutrition: [170, 1, 1, 19]
    photo: thermomix-salsas-y-bases/alioli.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 0
    servings: 10
    notes: Hecho en Thermomix TM6. Lleva huevo crudo; guárdalo en la nevera y consúmelo en 24 horas.
    tags: [salsa, sin gluten]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [dientes de ajo, 2, null]
          - [huevo a temperatura ambiente, 1, null]
          - [zumo de limón, 1, cucharadita]
          - [sal, 0.5, cucharadita]
          - [aceite de oliva suave, 180, g]
    steps:
      - Pon los ajos en el vaso y pica 5 seg/vel 7. Baja los restos con la espátula.
      - Añade el huevo, el limón y la sal.
      - Programa 1 min 30 seg/vel 4 y vierte el aceite sobre la tapa poco a poco, con el cubilete puesto.

  - name: Sofrito
    health: [GREEN, "Cebolla, pimiento y tomate con aceite de oliva: la base de muchos platos."]
    nutrition: [90, 1, 7, 6]
    photo: thermomix-salsas-y-bases/sofrito.jpg
    category: Salsas
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 8
    notes: Programado para Thermomix TM6. Congélalo en porciones (cubiteras) y tendrás la base de guisos y arroces lista.
    tags: [salsa, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebollas, 2, null]
          - [pimiento rojo, 1, null]
          - [pimiento verde, 1, null]
          - [dientes de ajo, 3, null]
          - [aceite de oliva virgen extra, 60, g]
          - [tomate triturado, 400, g]
          - [azúcar, 1, cucharadita]
          - [sal, 1, cucharadita]
    steps:
      - Pon las cebollas, los pimientos y el ajo en trozos en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 15 min/120 °C/vel 1, con el cestillo sobre la tapa en lugar del cubilete.
      - Añade el tomate, el azúcar y la sal y programa 20 min/Varoma/vel 1, con el cestillo sobre la tapa.

  - name: Tomate frito casero
    health: [GREEN, "Tomate con aceite de oliva y sin los azúcares añadidos del de bote."]
    nutrition: [80, 2, 8, 5]
    photo: thermomix-salsas-y-bases/tomate-frito-casero.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 35
    servings: 8
    notes: Programado para Thermomix TM6. Con tomates maduros pelados queda mejor; si no, vale tomate triturado de lata.
    tags: [salsa, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [diente de ajo, 1, null]
          - [aceite de oliva virgen extra, 40, g]
          - [tomates maduros pelados, 1000, g]
          - [azúcar, 1, cucharadita]
          - [sal, 1, cucharadita]
    steps:
      - Pon la cebolla y el ajo en el vaso y pica 4 seg/vel 5. Añade el aceite y sofríe 6 min/120 °C/vel 1.
      - Añade los tomates en trozos, el azúcar y la sal y programa 30 min/Varoma/vel 1, con el cestillo sobre la tapa en lugar del cubilete.
      - Tritura 30 seg/vel 5-10 subiendo poco a poco. Si lo quieres más espeso, programa 5 minutos más en Varoma.

  - name: Pesto de albahaca
    health: [YELLOW, "Albahaca, piñones y aceite de oliva: grasas saludables, pero muy calórico."]
    nutrition: [190, 4, 1, 19]
    photo: thermomix-salsas-y-bases/pesto-de-albahaca.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 0
    servings: 6
    notes: Hecho en Thermomix TM6. Para pasta para 4 personas. Cúbrelo con un poco de aceite para que no se oscurezca.
    tags: [salsa, vegetariana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [queso parmesano en trozos, 50, g]
          - [piñones, 30, g]
          - [diente de ajo, 1, null]
          - [hojas de albahaca fresca, 50, g]
          - [aceite de oliva virgen extra, 100, g]
          - [sal, 1, pizca]
    steps:
      - Pon el parmesano en el vaso y ralla 10 seg/vel 10.
      - Añade los piñones y el ajo y pica 5 seg/vel 7.
      - Añade la albahaca, el aceite y la sal y tritura 10 seg/vel 5, bajando los restos con la espátula. No lo tritures de más o se calienta y amarga.

  - name: Salsa boloñesa
    health: [YELLOW, "Carne picada con tomate y verduras: proteína e hierro, con algo de grasa."]
    nutrition: [290, 20, 10, 18]
    photo: thermomix-salsas-y-bases/salsa-bolonesa.jpg
    category: Salsas
    difficulty: EASY
    prep: 10
    cook: 45
    servings: 6
    notes: Programado para Thermomix TM6. Para pasta o lasaña. Se congela muy bien.
    tags: [salsa, pasta, ternera]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [zanahoria, 1, null]
          - [rama de apio, 1, null]
          - [diente de ajo, 1, null]
          - [aceite de oliva virgen extra, 40, g]
          - [carne picada mixta, 500, g]
          - [vino tinto, 100, g]
          - [tomate triturado, 400, g]
          - [orégano seco, 1, cucharadita]
          - [sal, 1, cucharadita]
          - [pimienta negra, null, null]
    steps:
      - Pon la cebolla, la zanahoria, el apio y el ajo en el vaso y pica 5 seg/vel 5. Añade el aceite y sofríe 8 min/120 °C/vel 1.
      - Añade la carne y programa 8 min/120 °C/giro a la izquierda/vel cuchara, deshaciéndola con la espátula al empezar.
      - Añade el vino y programa 3 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el tomate, el orégano, la sal y la pimienta y programa 25 min/100 °C/giro a la izquierda/vel cuchara, con el cestillo sobre la tapa en lugar del cubilete.

  - name: Salsa de queso
    health: [RED, "Queso, leche y mantequilla: muy rica en grasa saturada y sal."]
    nutrition: [220, 10, 6, 17]
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 8
    servings: 6
    notes: Programado para Thermomix TM6. Para nachos, pasta, patatas o verduras gratinadas.
    tags: [salsa, queso]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [queso cheddar en trozos, 150, g]
          - [leche entera, 300, g]
          - [mantequilla, 20, g]
          - [harina de trigo, 15, g]
          - [mostaza, 1, cucharadita]
          - [sal, 1, pizca]
    steps:
      - Pon el queso en el vaso y ralla 10 seg/vel 8.
      - Añade el resto de ingredientes y mezcla 10 seg/vel 4.
      - Programa 7 min/90 °C/vel 3, hasta que esté lisa y espesa.

  - name: Salsa brava
    health: [YELLOW, "Salsa de tomate con pimentón picante; ligera si no lleva demasiado aceite."]
    nutrition: [60, 1, 6, 4]
    photo: thermomix-salsas-y-bases/salsa-brava.jpg
    category: Salsas
    difficulty: EASY
    prep: 5
    cook: 15
    servings: 6
    notes: Programado para Thermomix TM6. Para patatas bravas. Regula el picante con la cantidad de pimentón y cayena.
    tags: [salsa, picante, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla pequeña, 1, null]
          - [diente de ajo, 1, null]
          - [aceite de oliva virgen extra, 30, g]
          - [harina de trigo, 1, cucharada]
          - [pimentón picante, 2, cucharadita]
          - [pimentón dulce, 1, cucharadita]
          - [cayena, 1, null, optional]
          - [tomate triturado, 200, g]
          - [caldo de pollo o de verduras, 200, g]
          - [vinagre de Jerez, 1, cucharadita]
          - [sal, 0.5, cucharadita]
    steps:
      - Pon la cebolla y el ajo en el vaso y pica 4 seg/vel 5. Añade el aceite y sofríe 5 min/120 °C/vel 1.
      - Añade la harina y los pimentones y programa 1 min/100 °C/vel 1.
      - Añade el tomate, el caldo, la cayena, el vinagre y la sal y programa 10 min/100 °C/vel 1.
      - Tritura 30 seg/vel 5-10 subiendo poco a poco.

  - name: Salsa holandesa
    health: [RED, "Yemas y mantequilla: muy calórica, para ocasiones."]
    nutrition: [200, 2, 0, 22]
    photo: thermomix-salsas-y-bases/salsa-holandesa.jpg
    category: Salsas
    difficulty: MEDIUM
    prep: 5
    cook: 6
    servings: 6
    notes: Hecha en Thermomix TM6. Para huevos Benedict, espárragos o pescado. Sírvela enseguida; no se recalienta bien.
    tags: [salsa, sin gluten]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [yemas de huevo, 3, null]
          - [mantequilla en dados, 150, g]
          - [zumo de limón, 1, cucharada]
          - [agua, 30, g]
          - [sal, 1, pizca]
          - [pimienta blanca, 1, pizca]
    steps:
      - Coloca la mariposa. Pon todos los ingredientes en el vaso.
      - Programa 6 min/80 °C/vel 4, hasta que la salsa esté espesa y brillante.
      - Si se corta, añade una cucharada de agua fría y mezcla 10 seg/vel 4.

  - name: Salsa romesco
    health: [GREEN, "Pimientos asados, tomate, frutos secos y aceite de oliva: grasas saludables y mucho sabor."]
    nutrition: [150, 3, 7, 13]
    photo: thermomix-salsas-y-bases/salsa-romesco.jpg
    category: Salsas
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 8
    notes: Hecha en Thermomix TM6. Con verduras a la parrilla, calçots o pescado. Usa tomates y ajos ya asados al horno.
    tags: [salsa, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [almendras tostadas, 40, g]
          - [avellanas tostadas, 30, g]
          - [tomates asados, 2, null]
          - [cabeza de ajo asada, 0.5, null]
          - [carne de pimiento choricero o ñora, 2, cucharada]
          - [rebanada de pan frito, 1, null]
          - [vinagre de Jerez, 15, g]
          - [aceite de oliva virgen extra, 80, g]
          - [sal, 0.5, cucharadita]
    steps:
      - Pon las almendras, las avellanas y el pan en el vaso y pica 10 seg/vel 7.
      - Añade los tomates pelados, los ajos asados pelados, la carne de pimiento, el vinagre y la sal y tritura 20 seg/vel 7.
      - Programa 1 min/vel 4 y vierte el aceite poco a poco sobre la tapa. Ajusta de sal y vinagre.

  - name: Salsa de yogur con hierbas
    health: [GREEN, "Yogur con hierbas y limón: ligera, fresca y con poca grasa."]
    nutrition: [45, 3, 4, 2]
    photo: thermomix-salsas-y-bases/salsa-de-yogur-con-hierbas.jpg
