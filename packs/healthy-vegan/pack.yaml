recipes:

  - name: Tofu and broccoli stir-fry with sesame
    health: [GREEN, "Tofu with vegetables and brown rice: complete plant protein and fibre."]
    nutrition: [430, 22, 46, 17]
    photo: saludable-vegano/tofu-salteado-con-brocoli-y-sesamo.jpg
    category: Vegetables
    difficulty: EASY
    prep: 15
    cook: 15
    servings: 4
    tags: [vegan, tofu, stir-fry]
    utensils: [Wok]
    ingredients:
      - items:
          - [firm tofu, 400, g]
          - [broccoli, 1, null]
          - [red pepper, 1, null]
          - [garlic, 2, clove]
          - [grated fresh ginger, 1, tbsp]
          - [low-salt soy sauce, 3, tbsp]
          - [maple syrup, 1, tbsp]
          - [rice vinegar, 1, tbsp]
          - [cornflour, 2, tbsp]
          - [sunflower oil, 2, tbsp]
          - [sesame seeds, 1, tbsp]
          - [cooked brown rice, 600, g]
    steps:
      - "Drain the tofu, pat it dry, cut it into cubes and toss in the cornflour."
      - Brown it in the wok with the oil on all sides and remove it.
      - "Stir-fry the garlic and ginger, add the broccoli florets and pepper and stir-fry for 4 minutes with a splash of water."
      - "Add the soy sauce, maple syrup and vinegar, return the tofu and toss for 1 minute. Serve with brown rice and sesame seeds."

  - name: Lentil bolognese
    health: [GREEN, "Lentil and vegetable sauce with wholemeal pasta: fibre, iron and plant protein."]
    nutrition: [520, 24, 86, 9]
    photo: saludable-vegano/bolonesa-de-lentejas.jpg
    category: Pasta
    difficulty: EASY
    prep: 15
    cook: 40
    servings: 4
    tags: [vegan, pasta, pulses]
    ingredients:
      - items:
          - [red or brown lentils, 200, g]
          - [onion, 1, null]
          - [carrot, 1, null]
          - [celery, 1, stalk]
          - [garlic, 2, clove]
          - [mushrooms, 200, g]
          - [crushed tomatoes, 800, g]
          - [dried oregano, 1, tsp]
          - [extra virgin olive oil, 2, tbsp]
          - [wholemeal spaghetti, 320, g]
          - [nutritional yeast (optional), 2, tbsp]
          - [salt and black pepper, null, null]
    steps:
      - "Finely chop the onion, carrot, celery, garlic and mushrooms and soften them in the oil for 10 minutes."
      - "Add the rinsed lentils, tomatoes, oregano and 400 ml of water. Simmer for 25-30 minutes, until the lentils are tender. Season."
      - Cook the pasta and serve with the sauce and the nutritional yeast on top.

  - name: Chili sin carne
    health: [GREEN, "Chili of beans and vegetables: high in fibre and plant protein, almost no fat."]
    nutrition: [380, 18, 60, 7]
    photo: saludable-vegano/chili-sin-carne.jpg
    category: Legumes
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 6
    tags: [vegan, pulses, gluten-free]
    ingredients:
      - items:
          - [cooked kidney beans, 400, g]
          - [cooked black beans, 400, g]
          - [cooked lentils, 250, g]
          - [onion, 1, null]
          - [red pepper, 1, null]
          - [green pepper, 1, null]
          - [garlic, 3, clove]
          - [crushed tomatoes, 800, g]
          - [sweetcorn, 150, g]
          - [ground cumin, 2, tsp]
          - [smoked paprika, 2, tsp]
          - [chilli powder, 1, tsp]
          - [unsweetened cocoa powder, 1, tsp]
          - [olive oil, 2, tbsp]
          - [salt, null, null]
    steps:
      - "Fry the chopped onion, peppers and garlic in the oil for 8 minutes. Add the spices and cocoa and stir for 1 minute."
      - Add the tomatoes and 200 ml of water and simmer for 10 minutes.
      - "Stir in the drained pulses and sweetcorn, salt and cook for 15 more minutes. Serve with brown rice or avocado."

  - name: Quinoa and chickpea bowl
    health: [GREEN, "Bowl of wholegrain, pulses, vegetables and tahini: balanced and filling."]
    nutrition: [540, 20, 62, 23]
    photo: saludable-vegano/bol-de-quinoa-y-garbanzos.jpg
    category: Salads
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 2
    tags: [vegan, gluten-free, salad]
    utensils: [Oven]
    ingredients:
      - items:
          - [quinoa, 120, g]
          - [cooked chickpeas, 250, g]
          - [smoked paprika, 1, tsp]
          - [sweet potato, 1, null]
          - [kale or spinach, 60, g]
          - [avocado, 1, null]
          - [red cabbage, 80, g]
          - [tahini, 2, tbsp]
          - [lemon juice, 2, tbsp]
          - [extra virgin olive oil, 1, tbsp]
          - [salt, null, null]
    steps:
      - "Roast the diced sweet potato and the chickpeas with the oil, paprika and salt at 210 °C for 25 minutes."
      - Cook the quinoa in twice its volume of water for 12 minutes.
      - "Mix the tahini with the lemon juice, a pinch of salt and water until it is a pourable sauce."
      - "Divide the quinoa, kale, shredded cabbage, sweet potato, chickpeas and avocado between bowls and drizzle with the sauce."

  - name: Roasted cauliflower tacos
    health: [GREEN, "Spiced cauliflower, avocado and vegetables in corn tortillas: light and high in fibre."]
    nutrition: [360, 9, 46, 17]
    photo: saludable-vegano/tacos-de-coliflor-asada.jpg
    category: Vegetables
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 4
    tags: [vegan, tacos, gluten-free]
    utensils: [Oven]
    ingredients:
      - items:
          - [cauliflower, 1, null]
          - [olive oil, 2, tbsp]
          - [ground cumin, 1, tsp]
          - [smoked paprika, 1, tsp]
          - [chilli powder, 0.5, tsp]
          - [corn tortillas, 8, null]
          - [avocado, 1, null]
          - [red cabbage, 100, g]
          - [pickled or fresh red onion, 0.5, null]
          - [lime, 1, null]
          - [fresh coriander, 1, handful]
          - [salt, null, null]
    steps:
      - "Cut the cauliflower into small florets, toss with the oil, spices and salt and roast at 220 °C for 20-25 minutes."
      - Mash the avocado with lime juice and salt.
      - "Warm the tortillas and fill them with avocado, cauliflower, thinly shredded cabbage, onion and coriander."

  - name: Lentil burgers
    health: [GREEN, "Lentil and vegetable burgers cooked on a griddle: fibre and plant protein."]
    nutrition: [300, 14, 40, 9]
    photo: saludable-vegano/hamburguesas-de-lentejas.jpg
    category: Legumes
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 4
    tags: [vegan, pulses]
    ingredients:
      - items:
          - [cooked lentils, 400, g]
          - [rolled oats, 60, g]
          - [grated carrot, 1, null]
          - [onion, 0.5, null]
          - [garlic, 1, clove]
          - [ground flaxseed, 1, tbsp]
          - [ground cumin, 1, tsp]
          - [fresh parsley, 1, handful]
          - [olive oil, 1, tbsp]
          - [salt and black pepper, null, null]
    steps:
      - Mix the flaxseed with 3 tablespoons of water and leave for 5 minutes.
      - "Mash the drained lentils and mix with the oats, carrot, chopped onion and garlic, flax, cumin, parsley, salt and pepper."
      - "Shape into 4 burgers, chill for 15 minutes and cook on a griddle with the oil for 4 minutes per side."

  - name: Vegetable and chickpea coconut curry
    health: [GREEN, "Vegetable and pulse curry with light coconut milk: complete and tasty."]
    nutrition: [400, 13, 48, 18]
    photo: saludable-vegano/curry-de-verduras-y-garbanzos-con-coco.jpg
    category: Vegetables
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    tags: [vegan, curry, gluten-free]
    ingredients:
      - items:
          - [cooked chickpeas, 400, g]
          - [pumpkin or sweet potato, 400, g]
          - [cauliflower, 0.5, null]
          - [spinach, 100, g]
          - [onion, 1, null]
          - [garlic, 2, clove]
          - [grated fresh ginger, 1, tbsp]
          - [red curry paste or curry powder, 2, tbsp]
          - [light coconut milk, 400, ml]
          - [crushed tomatoes, 200, g]
          - [oil, 1, tbsp]
          - [lime, 1, null]
          - [salt, null, null]
    steps:
      - "Soften the chopped onion in the oil for 6 minutes, add the garlic, ginger and curry and cook for 1 minute."
      - "Add the diced pumpkin, cauliflower, tomatoes and coconut milk, and simmer for 20 minutes."
      - Stir in the chickpeas and spinach and cook for 5 minutes. Salt and finish with lime juice. Serve with brown rice.

  - name: Rice noodle salad with tofu
    health: [GREEN, "Noodles with plenty of raw vegetables, tofu and a peanut dressing: fresh and complete."]
    nutrition: [470, 19, 58, 18]
    photo: saludable-vegano/ensalada-de-fideos-de-arroz-con-tofu.jpg
    category: Salads
    difficulty: EASY
    prep: 20
    cook: 10
    servings: 4
    tags: [vegan, salad, noodles]
    ingredients:
      - items:
          - [rice noodles, 200, g]
          - [firm tofu, 250, g]
          - [carrots, 2, null]
          - [cucumber, 1, null]
          - [red pepper, 1, null]
          - [red cabbage, 100, g]
          - [fresh mint and coriander, 1, handful]
          - [natural peanut butter, 3, tbsp]
          - [low-salt soy sauce, 2, tbsp]
          - [lime juice, 2, tbsp]
          - [maple syrup, 1, tsp]
          - [roasted peanuts, 30, g]
    steps:
      - "Soak or cook the noodles as the packet says, rinse in cold water and drain."
      - Brown the diced tofu in a non-stick pan.
      - Cut the vegetables into thin strips.
      - "Whisk the peanut butter with the soy sauce, lime juice, maple syrup and water into a pourable dressing. Toss everything together and serve with the herbs and chopped peanuts."

  - name: White bean and vegetable stew
    health: [GREEN, "Beans stewed with vegetables and olive oil: fibre and plant protein."]
    nutrition: [360, 17, 50, 10]
    photo: saludable-vegano/guiso-de-alubias-blancas-con-verduras.jpg
    category: Legumes
    difficulty: EASY
    prep: 15
    cook: 35
    servings: 4
    tags: [vegan, pulses, gluten-free]
    ingredients:
      - items:
          - [cooked white beans, 800, g]
          - [onion, 1, null]
          - [leek, 1, null]
          - [carrots, 2, null]
          - [red pepper, 1, null]
          - [courgette, 1, null]
          - [garlic, 2, clove]
          - [crushed tomatoes, 200, g]
          - [sweet paprika, 1, tsp]
          - [vegetable stock, 600, ml]
          - [extra virgin olive oil, 3, tbsp]
          - [salt, null, null]
    steps:
      - "Soften the chopped onion, leek, pepper and garlic in the oil for 10 minutes."
      - "Add the sliced carrots, paprika and tomatoes and cook for 3 minutes."
      - Add the stock and simmer for 10 minutes. Add the diced courgette and the beans and cook for 12 more minutes. Salt.

  - name: Chocolate avocado mousse
    health: [YELLOW, "Avocado and cocoa dessert with little sugar: healthy fats, but calorie-dense."]
    nutrition: [260, 4, 22, 18]
    photo: saludable-vegano/mousse-de-chocolate-y-aguacate.jpg
    category: Desserts
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 4
    tags: [dessert, vegan, gluten-free, no-cook]
    utensils: [Blender]
    ingredients:
      - items:
          - [ripe avocados, 2, null]
          - [unsweetened cocoa powder, 4, tbsp]
          - [maple syrup or dates, 4, tbsp]
          - [plant milk, 60, ml]
          - [vanilla extract, 1, tsp]
          - [salt, 1, pinch]
          - [raspberries to serve, 100, g]
    steps:
      - "Blend the avocado flesh with the cocoa, maple syrup, milk, vanilla and salt until very smooth."
      - Taste and adjust the sweetness.
      - Divide among small glasses and chill for 1 hour. Serve with raspberries.
