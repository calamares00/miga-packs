  - name: Tres leches cake
    health: [RED, "Sponge soaked in three milks and topped with cream: very sweet."]
    nutrition: [430, 9, 54, 20]
    photo: cocina-mexicana/pastel-tres-leches.jpg
    category: Desserts
    difficulty: MEDIUM
    prep: 25
    cook: 30
    servings: 12
    notes: The sponge soaked in evaporated milk, condensed milk and cream, loved in Mexico and across Latin America. It needs a night in the fridge.
    tags: [dessert, cake, oven]
    utensils: [Oven, Blender]
    ingredients:
      - group: For the sponge
        items:
          - [eggs, 5, null]
          - [sugar, 180, g]
          - [flour, 160, g]
          - [baking powder, 1, tsp]
          - [milk, 60, ml]
          - [vanilla extract, 1, tsp]
      - group: For the three milks and topping
        items:
          - [evaporated milk, 350, ml]
          - [condensed milk, 400, g]
          - [single cream, 200, ml]
          - [whipping cream, 300, ml]
          - [icing sugar, 30, g]
          - [ground cinnamon, null, null]
    steps:
      - Heat the oven to 180 °C. Whisk the eggs with the sugar until tripled in volume, add the milk and vanilla, then fold in the flour with the baking powder.
      - Bake in a 22 x 30 cm dish for 25-30 minutes. Let it cool slightly and prick all over with a fork.
      - Mix the three milks and pour them slowly over the sponge until absorbed. Chill overnight.
      - Whip the cream with the icing sugar, spread over the cake and dust with cinnamon.
