description: >-
  Recetas para una fiesta de Halloween, con calabaza y mucho juego para hacer con los peques:
  sopa de calabaza y boniato, momias de salchicha, pizza telaraña, huevos endiablados con arañas,
  dedos de bruja, fantasmas de plátano, mandarinas calabaza, brownie cementerio, manzanas de
  caramelo, pan de calabaza, galletas de calabaza con especias y ponche de bruja. Pregunta por
  alergias, y cuidado con el caramelo caliente y las aceitunas enteras con los más pequeños.
