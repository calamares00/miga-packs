description: >-
  Thailand's balance of hot, sour, sweet and salty: pad thai, tom yum, tom kha gai, green,
  massaman and panang curries, som tam, larb, fried rice, pad kra pao, pad see ew, cashew chicken,
  beef salad, fish cakes, Thai omelette, khao man gai, gai yang, jaew dipping sauce, mango sticky
  rice and Thai iced tea. With substitutes for the less common ingredients.
