description: >-
  Recetas para una fiesta de verano alrededor de la barbacoa o la parrilla: hamburguesas de cerdo
  ibérico, costillas, brochetas de pollo y de verduras, secreto ibérico, chuletas de cordero,
  salmón y sardinas a la brasa, mazorcas de maíz, patatas en papillote, parrillada de verduras,
  salsa barbacoa casera, ensalada de tomate con ventresca y, de postre, piña y plátanos asados.
  Casi todo funciona también en una plancha o en el horno con el grill.
