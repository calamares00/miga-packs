language: en
name: 20-minute dinners
description: >-
  Home-made dinners on the table in 20 minutes or less, with ingredients from any supermarket:
  omelettes, scrambled eggs, pasta, griddled fish, chicken stir-fry, vegetable soups, hearty
  salads and quick pizzas. For the days when you don't feel like a fuss.
author: Miga
authorGithub: calamares00
cover:
  emoji: "🍳"
  title: 20-minute dinners
  colors: ["#6d28d9", "#db2777"]
defaults:
  source: Miga «20-minute dinners» pack
recipes:

  - name: Spinach and cheese omelette
    category: Eggs
    difficulty: EASY
    prep: 5
    cook: 5
    servings: 1
    tags: [quick, dinner, vegetarian]
    ingredients:
      - items:
          - [eggs, 2, null]
          - [fresh spinach, 1, handful]
          - [grated cheese, 30, g]
          - [olive oil, 1, tsp]
          - [salt, null, null]
          - [black pepper, null, null, optional]
    steps:
      - Sauté the spinach in the frying pan with the oil for 1 minute, until wilted.
      - Beat the eggs with a pinch of salt and pepper and pour them over the spinach.
      - When the base starts to set, scatter the cheese over the top.
      - Fold the omelette in half and cook for 1 more minute. Serve it soft in the middle.

  - name: Scrambled eggs with mushrooms and ham
    category: Eggs
    difficulty: EASY
    prep: 5
    cook: 8
    servings: 2
    tags: [quick, dinner, gluten-free]
    ingredients:
      - items:
          - [mushrooms, 200, g]
          - [diced serrano ham, 60, g]
          - [eggs, 4, null]
          - [garlic, 1, clove]
          - [olive oil, 2, tbsp]
          - [chopped parsley, 1, tbsp, optional]
          - [salt, null, null]
    steps:
      - Clean and slice the mushrooms. Chop the garlic.
      - Fry the garlic in the oil, add the mushrooms and sauté over a high heat for 4 minutes.
      - Add the ham and sauté for 1 more minute.
      - Lower the heat, add the eggs beaten with a pinch of salt and stir until just set, without letting them dry out.
      - Sprinkle with the parsley and serve straight away.

  - name: Spaghetti with garlic, oil and chilli
    category: Pasta
    difficulty: EASY
    prep: 3
    cook: 12
    servings: 2
    origin: Italy
    originCountry: IT
    tags: [quick, dinner, vegan]
    ingredients:
      - items:
          - [spaghetti, 200, g]
          - [garlic, 4, clove]
          - [dried chilli, 1, null]
          - [extra virgin olive oil, 5, tbsp]
          - [chopped parsley, 2, tbsp]
          - [salt, null, null]
    steps:
      - Cook the spaghetti in plenty of salted water for the time on the packet. Keep a glass of the cooking water.
      - Meanwhile, slice the garlic and fry it gently in the oil with the chilli, broken into pieces, without letting it burn.
      - Drain the pasta and add it to the pan with a splash of the cooking water.
      - Toss for 1 minute so the sauce comes together, add the parsley and serve.

  - name: Pasta with cherry tomatoes and basil
    category: Pasta
    difficulty: EASY
    prep: 5
    cook: 12
    servings: 2
    tags: [quick, dinner, vegetarian]
    ingredients:
      - items:
          - [short pasta, 200, g]
          - [cherry tomatoes, 250, g]
          - [garlic, 1, clove]
          - [extra virgin olive oil, 3, tbsp]
          - [fresh basil, 1, bunch]
          - [grated Parmesan, 30, g, optional]
          - [salt, null, null]
    steps:
      - Cook the pasta in salted water.
      - Halve the tomatoes and sauté them with the oil and chopped garlic over a high heat for 5 minutes, until they release their juices.
      - Drain the pasta and toss it with the tomatoes and a splash of the cooking water.
      - Finish with the basil, torn by hand, and the Parmesan.

  - name: Griddled salmon with asparagus
    category: Fish and seafood
    difficulty: EASY
    prep: 5
    cook: 12
    servings: 2
    tags: [quick, dinner, gluten-free]
    ingredients:
      - items:
          - [salmon fillets, 2, null]
          - [green asparagus, 1, bunch]
          - [lemon, 1, null]
          - [olive oil, 2, tbsp]
          - [flaky salt, null, null]
          - [black pepper, null, null]
    steps:
      - Snap off the woody ends of the asparagus.
      - Heat a frying pan or griddle with half the oil and cook the asparagus for 5 minutes, turning them. Set aside.
      - Pat the salmon dry, brush it with the rest of the oil and lay it skin side down. Cook for 4 minutes, turn it over and cook for 2-3 minutes more.
      - Serve with the asparagus, flaky salt, pepper and a few drops of lemon.

  - name: Lemon and parsley hake
    category: Fish and seafood
    difficulty: EASY
    prep: 5
    cook: 10
    servings: 2
    tags: [quick, dinner, light]
    ingredients:
      - items:
          - [hake fillets, 2, null]
          - [flour, 2, tbsp]
          - [garlic, 2, clove]
          - [lemon, 1, null]
          - [white wine, 50, ml]
          - [olive oil, 3, tbsp]
          - [chopped parsley, 2, tbsp]
          - [salt, null, null]
    steps:
      - Season the hake with salt and dust it with flour, shaking off the excess.
      - Brown it in the oil for 2 minutes on each side and take it out.
      - In the same oil, fry the sliced garlic, add the wine and the lemon juice and let it reduce for 2 minutes.
      - Return the hake to the pan, sprinkle with the parsley and cook for 2 more minutes, shaking the pan so the sauce thickens.

  - name: Chicken and vegetable stir-fry
    category: Meat
    difficulty: EASY
    prep: 8
    cook: 10
    servings: 2
    tags: [quick, dinner]
    utensils: [Wok]
    ingredients:
      - items:
          - [chicken breast, 300, g]
          - [red pepper, 1, null]
          - [courgette, 1, null]
          - [spring onion, 1, null]
          - [soy sauce, 3, tbsp]
          - [honey, 1, tsp]
          - [grated ginger, 1, tsp, optional]
          - [sunflower oil, 2, tbsp]
          - [toasted sesame seeds, 1, tbsp, optional]
    steps:
      - Cut the chicken and the vegetables into thin strips.
      - Get the wok very hot with the oil and stir-fry the chicken for 4 minutes. Take it out.
      - Stir-fry the vegetables over a high heat for 3-4 minutes; they should stay crunchy.
      - Return the chicken, add the soy sauce, honey and ginger and stir-fry for 1 more minute.
      - Serve topped with sesame seeds.

  - name: Lemon chicken with couscous
    category: Meat
    difficulty: EASY
    prep: 5
    cook: 12
    servings: 2
    tags: [quick, dinner]
    ingredients:
      - group: Chicken
        items:
          - [chicken breast fillets, 2, null]
          - [lemon, 1, null]
          - [garlic, 1, clove]
          - [dried oregano, 1, tsp]
          - [olive oil, 2, tbsp]
          - [salt, null, null]
      - group: Couscous
        items:
          - [couscous, 150, g]
          - [hot vegetable stock, 150, ml]
          - [butter, 10, g]
    steps:
      - Put the couscous in a bowl, pour over the hot stock, cover and leave for 5 minutes.
      - Season the chicken with salt and brown it in the oil for 4 minutes on each side.
      - Add the chopped garlic, the oregano and the lemon's juice and zest, and let the sauce reduce for 1 minute.
      - Fluff up the couscous with a fork and the butter and serve it with the chicken and its sauce.

  - name: Beef fajitas
    category: Meat
    difficulty: EASY
    prep: 8
    cook: 10
    servings: 2
    tags: [quick, dinner]
    ingredients:
      - items:
          - [thin beef steaks, 300, g]
          - [red pepper, 1, null]
          - [green pepper, 1, null]
          - [onion, 1, null]
          - [ground cumin, 0.5, tsp]
          - [sweet paprika, 1, tsp]
          - [olive oil, 2, tbsp]
          - [flour tortillas, 4, null]
          - [soured cream or Greek yoghurt, 4, tbsp, optional]
          - [salt, null, null]
    steps:
      - Cut the beef, peppers and onion into strips.
      - Stir-fry the vegetables in the oil over a high heat for 5 minutes and push them to one side of the pan.
      - Add the meat with the cumin, paprika and salt and stir-fry for 2-3 minutes.
      - Warm the tortillas in another pan and fill them with the mixture and a spoonful of soured cream.

  - name: Pork loin with honey mustard sauce
    category: Meat
    difficulty: EASY
    prep: 3
    cook: 10
    servings: 2
    tags: [quick, dinner, gluten-free]
    ingredients:
      - items:
          - [pork loin steaks, 4, null]
          - [Dijon mustard, 1, tbsp]
          - [honey, 1, tbsp]
          - [single cream, 100, ml]
          - [olive oil, 1, tbsp]
          - [salt, null, null]
          - [black pepper, null, null]
    steps:
      - Season the steaks and cook them in the pan with the oil for 2 minutes on each side. Take them out.
      - Lower the heat and add the mustard, honey and cream. Stir until it bubbles and thickens slightly.
      - Return the pork to the pan for 1 minute to coat it and serve with the sauce.

  - name: Egg fried rice with peas
    category: Rice
    difficulty: EASY
    prep: 5
    cook: 10
    servings: 2
    notes: It works best with rice cooked the day before, which stays looser.
    tags: [quick, dinner, leftovers]
    ingredients:
      - items:
          - [cooked rice, 400, g]
          - [eggs, 2, null]
          - [frozen peas, 100, g]
          - [carrot, 1, null]
          - [spring onion, 1, null]
          - [soy sauce, 2, tbsp]
          - [sunflower oil, 2, tbsp]
    steps:
      - Finely dice the spring onion and the carrot.
      - Stir-fry them in the oil with the peas for 3 minutes.
      - Push the vegetables aside, scramble the beaten eggs in the gap and break them into pieces.
      - Add the rice and soy sauce and stir-fry over a high heat for 3-4 minutes, until the rice is hot and loose.

  - name: Gnocchi with butter and sage
    category: Pasta
    difficulty: EASY
    prep: 2
    cook: 8
    servings: 2
    origin: Italy
    originCountry: IT
    tags: [quick, dinner, vegetarian]
    ingredients:
      - items:
          - [potato gnocchi, 400, g]
          - [butter, 50, g]
          - [fresh sage leaves, 8, null]
          - [grated Parmesan, 40, g]
          - [black pepper, null, null]
          - [salt, null, null]
    steps:
      - Cook the gnocchi in boiling salted water; they are ready when they float to the surface.
      - Meanwhile, melt the butter with the sage over a medium heat until it turns nutty brown.
      - Add the drained gnocchi to the pan, toss for 1 minute and serve with Parmesan and pepper.

  - name: Quick courgette soup
    category: Soups
    difficulty: EASY
    prep: 5
    cook: 15
    servings: 4
    tags: [quick, dinner, vegetarian, light]
    utensils: [Blender]
    ingredients:
      - items:
          - [courgettes, 2, null]
          - [onion, 1, null]
          - [small potato, 1, null]
          - [vegetable stock, 600, ml]
          - [processed cheese triangles, 2, null]
          - [olive oil, 2, tbsp]
          - [salt, null, null]
    steps:
      - Cut the onion, the unpeeled courgettes and the potato into small dice so they cook faster.
      - Soften the onion in the oil for 3 minutes, add the rest of the vegetables and the stock and simmer for 12 minutes.
      - Blend with the cheese triangles until smooth. Season to taste.

  - name: Quick noodle soup
    category: Soups
    difficulty: EASY
    prep: 2
    cook: 10
    servings: 2
    tags: [quick, dinner, comfort food]
    ingredients:
      - items:
          - [chicken stock, 1, l]
          - [fine noodles, 80, g]
          - [hard-boiled egg, 1, null, optional]
          - [diced serrano ham, 40, g, optional]
          - [fresh mint, 1, sprig, optional]
    steps:
      - Bring the stock to the boil.
      - Add the noodles and cook them for the time on the packet, usually 4-5 minutes.
      - Serve with the chopped egg, the ham and a few mint leaves.

  - name: Chickpea and tuna salad
    category: Salads
    difficulty: EASY
    prep: 10
    cook: 0
    servings: 2
    tags: [quick, dinner, gluten-free, cold]
    ingredients:
      - items:
          - [cooked chickpeas, 400, g]
          - [tuna in oil, 2, can]
          - [tomato, 1, null]
          - [green pepper, 0.5, null]
          - [red onion, 0.5, null]
          - [black olives, 12, null, optional]
          - [extra virgin olive oil, 3, tbsp]
          - [vinegar, 1, tbsp]
          - [salt, null, null]
    steps:
      - Rinse and drain the chickpeas.
      - Finely dice the tomato, pepper and onion.
      - Mix everything with the drained tuna and the olives.
      - Dress with the oil, vinegar and salt just before serving.

  - name: Chicken Caesar salad
    category: Salads
    difficulty: EASY
    prep: 10
    cook: 8
    servings: 2
    tags: [quick, dinner]
    ingredients:
      - group: Salad
        items:
          - [romaine lettuce, 1, null]
          - [chicken breast, 1, null]
          - [bread, 2, slice]
          - [Parmesan shavings, 30, g]
          - [olive oil, 2, tbsp]
      - group: Dressing
        items:
          - [mayonnaise, 3, tbsp]
          - [grated Parmesan, 1, tbsp]
          - [lemon juice, 1, tsp]
          - [mustard, 0.5, tsp]
          - [garlic, 0.5, clove]
    steps:
      - Cut the bread into cubes and toast them in the pan with 1 tablespoon of oil. Set aside.
      - Cook the chicken in the same pan with the rest of the oil, 4 minutes on each side, and slice it.
      - Mix the dressing ingredients with the garlic, very finely chopped, and a splash of water if it is too thick.
      - Tear up the lettuce and serve it with the chicken, croutons, Parmesan and dressing.

  - name: Avocado toast with egg
    category: Eggs
    difficulty: EASY
    prep: 5
    cook: 5
    servings: 2
    tags: [quick, dinner, vegetarian]
    ingredients:
      - items:
          - [country bread, 2, slice]
          - [ripe avocado, 1, null]
          - [eggs, 2, null]
          - [lemon juice, 1, tsp]
          - [chilli flakes, null, null, optional]
          - [olive oil, 1, tbsp]
          - [flaky salt, null, null]
    steps:
      - Toast the bread.
      - Mash the avocado with the lemon and a pinch of salt and spread it on the toast.
      - Fry the eggs in the oil, keeping the yolks runny.
      - Put an egg on each toast and finish with flaky salt and chilli flakes.

  - name: Tortilla wrap pizza
    category: Breads and doughs
    difficulty: EASY
    prep: 5
    cook: 8
    servings: 2
    tags: [quick, dinner, kids]
    utensils: [Oven]
    ingredients:
      - items:
          - [large flour tortillas, 2, null]
          - [tomato sauce, 4, tbsp]
          - [grated mozzarella, 120, g]
          - [cooked ham, 4, slice]
          - [sliced mushrooms, 4, null, optional]
          - [dried oregano, 1, pinch]
    steps:
      - Preheat the oven to 220 °C.
      - Spread the tortillas with the tomato sauce and top with the mozzarella, the ham in pieces and the mushrooms.
      - Bake for 7-8 minutes, until the cheese melts and the edges are crisp.
      - Sprinkle with the oregano and cut into slices.

  - name: Chicken and avocado wrap
    category: Meat
    difficulty: EASY
    prep: 10
    cook: 8
    servings: 2
    tags: [quick, dinner]
    ingredients:
      - items:
          - [chicken breast, 1, null]
          - [large flour tortillas, 2, null]
          - [avocado, 1, null]
          - [tomato, 1, null]
          - [lettuce, 2, handful]
          - [plain yoghurt, 3, tbsp]
          - [sweet paprika, 0.5, tsp]
          - [olive oil, 1, tbsp]
          - [salt, null, null]
    steps:
      - Cut the chicken into strips, season with the paprika and salt and brown it in the oil for 6-7 minutes.
      - Slice the avocado and the tomato.
      - Spread the tortillas with the yoghurt and add the lettuce, tomato, avocado and chicken.
      - Roll them up tightly and cut them in half on the diagonal.

  - name: Prawns with sautéed courgette
    category: Fish and seafood
    difficulty: EASY
    prep: 5
    cook: 8
    servings: 2
    tags: [quick, dinner, gluten-free, light]
    ingredients:
      - items:
          - [peeled prawns, 300, g]
          - [courgettes, 2, null]
          - [garlic, 2, clove]
          - [chilli, 1, null, optional]
          - [olive oil, 3, tbsp]
          - [chopped parsley, 1, tbsp]
          - [salt, null, null]
    steps:
      - Cut the courgettes into thin half-moons.
      - Sauté them in 2 tablespoons of oil over a high heat for 4 minutes, with salt. Set aside.
      - Add the rest of the oil with the sliced garlic and the chilli and, when the garlic starts to colour, add the prawns.
      - Sauté for 2 minutes, until they turn pink, mix with the courgette and finish with the parsley.
