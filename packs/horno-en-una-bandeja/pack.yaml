language: es
name: "Horno: todo en una bandeja"
series: Electrodomésticos
family: horno-en-una-bandeja
description: >-
  Cenas completas hechas en una sola bandeja de horno: preparas, metes y te olvidas, y solo hay
  que fregar una cosa. Pollo a la mostaza con verduras, salmón con patatas y espárragos,
  salchichas con verduras, fajitas de pollo, ñoquis con tomates cherry, chuletas de cerdo con
  patatas, pavo con boniato, coliflor asada entera, merluza con patatas panaderas, pizza de
  bandeja, verduras con halloumi y pollo con chorizo y garbanzos.
author: Miga
authorGithub: calamares00
cover:
  emoji: "🍗"
  kicker: Horno
  title: Todo en una bandeja
  colors: ["#9a3412", "#fb923c"]
