name: "Thermomix: guisos y cuchara"
series: Electrodomésticos
family: thermomix-guisos-y-cuchara
description: >-
  Guisos de toda la vida programados para Thermomix TM6 (vaso de 2,2 litros), que funcionan igual
  en TM5 y TM7: lentejas con arroz, potaje de garbanzos con bacalao, alubias con chorizo, patatas
  con costillas, ternera con champiñones, pollo en pepitoria, pollo al curry, bacalao con tomate,
  estofado de pavo, menestra, risotto de gambas, sopa de picadillo, carrillada al vino tinto,
  calamares con patatas y pollo con tomate. En TM31 (vaso de 2 litros y 100 °C como máximo),
  sofríe a temperatura Varoma y reduce un poco las cantidades.
author: Miga
authorGithub: calamares00
cover:
  emoji: "🍲"
  kicker: Thermomix
  title: Guisos y cuchara
  colors: ["#7c2d12", "#d97706"]
defaults:
  source: "Pack «Thermomix: guisos y cuchara» de Miga"
recipes:

  - name: Lentejas con arroz
    health: [GREEN, "Legumbre con cereal: proteína vegetal completa, mucha fibra y hierro, con poca grasa."]
    nutrition: [380, 18, 62, 7]
    category: Legumbres
    difficulty: EASY
    prep: 10
    cook: 45
    servings: 4
    notes: Programado para Thermomix TM6. Con lentejas pardinas no hace falta ponerlas en remojo.
    tags: [legumbres, cuchara, vegana]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [dientes de ajo, 2, null]
          - [zanahoria, 1, null]
          - [aceite de oliva virgen extra, 30, g]
          - [tomate triturado, 100, g]
          - [pimentón dulce, 1, cucharadita]
          - [comino molido, 0.5, cucharadita]
          - [lentejas pardinas, 250, g]
          - [arroz redondo, 60, g]
          - [agua, 1100, g]
          - [hoja de laurel, 1, null]
          - [sal, 1.5, cucharadita]
    steps:
      - Pon en el vaso la cebolla, el pimiento, el ajo y la zanahoria en trozos y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 8 min/120 °C/vel 1.
      - Añade el tomate, el pimentón y el comino y programa 3 min/120 °C/vel 1.
      - Añade las lentejas lavadas, el agua, el laurel y la sal y programa 30 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade el arroz y programa 15 min/100 °C/giro a la izquierda/vel cuchara, hasta que el arroz esté tierno.
      - Deja reposar 5 minutos en el vaso, quita el laurel y ajusta de sal.

  - name: Potaje de garbanzos con bacalao
    health: [GREEN, "Garbanzos, espinacas y bacalao: proteína, fibra y hierro en un plato completo y poco graso."]
    nutrition: [420, 30, 45, 12]
    category: Legumbres
    difficulty: EASY
    prep: 15
    cook: 25
    servings: 4
    notes: Programado para Thermomix TM6. Usa bacalao desalado; si lo desalas tú, empieza 48 horas antes cambiando el agua varias veces.
    tags: [legumbres, cuchara, pescado]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 40, g]
          - [tomate triturado, 100, g]
          - [pimentón dulce, 1, cucharadita]
          - [garbanzos cocidos, 600, g]
          - [caldo de pescado, 600, g]
          - [espinacas frescas, 150, g]
          - [bacalao desalado en trozos, 300, g]
          - [huevos cocidos, 2, null, optional]
          - [sal, null, null]
    steps:
      - Pon la cebolla y el ajo en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y sofríe 6 min/120 °C/vel 1.
      - Añade el tomate y el pimentón y programa 3 min/120 °C/vel 1.
      - Añade los garbanzos escurridos y el caldo y programa 10 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade las espinacas y el bacalao y programa 6 min/90 °C/giro a la izquierda/vel cuchara, hasta que el bacalao se separe en lascas.
      - Ajusta de sal (el bacalao ya sala) y sirve con el huevo cocido picado por encima.

  - name: Alubias blancas con chorizo
    health: [YELLOW, "Legumbre rica en fibra y proteína, pero el chorizo aporta bastante grasa saturada y sal."]
    nutrition: [520, 27, 48, 24]
    category: Legumbres
    difficulty: EASY
    prep: 10
    cook: 30
    servings: 4
    notes: Programado para Thermomix TM6, con alubias ya cocidas. Para una versión más ligera, usa la mitad de chorizo.
    tags: [legumbres, cuchara, invierno]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [cebolla, 1, null]
          - [pimiento rojo, 0.5, null]
          - [dientes de ajo, 2, null]
          - [aceite de oliva virgen extra, 20, g]
          - [chorizo en rodajas, 150, g]
          - [pimentón de la Vera, 1, cucharadita]
          - [alubias blancas cocidas, 700, g]
          - [patata, 1, null]
          - [caldo de verduras, 500, g]
          - [hoja de laurel, 1, null]
          - [sal, null, null]
    steps:
      - Pon la cebolla, el pimiento y el ajo en trozos en el vaso y pica 4 seg/vel 5. Baja los restos con la espátula.
      - Añade el aceite y el chorizo y sofríe 7 min/120 °C/giro a la izquierda/vel cuchara.
      - Añade el pimentón, la patata en trozos pequeños, el caldo y el laurel y programa 15 min/100 °C/giro a la izquierda/vel cuchara.
      - Añade las alubias escurridas y programa 8 min/100 °C/giro a la izquierda/vel cuchara.
      - Deja reposar 10 minutos para que espese el caldo. Ajusta de sal.

  - name: Patatas con costillas
    health: [YELLOW, "Plato completo y saciante, pero la costilla de cerdo es grasa: mejor de vez en cuando."]
