    category: Desserts
    difficulty: MEDIUM
    prep: 15
    cook: 30
    servings: 4
    notes: In Thai, khao niao mamuang. Soak the sticky rice for at least 4 hours and steam it.
    tags: [dessert, gluten-free]
    utensils: [Steamer]
    ingredients:
      - group: Rice
        items:
          - [sticky (glutinous) rice, 300, g]
          - [coconut milk, 300, ml]
          - [sugar, 80, g]
          - [salt, 0.5, tsp]
      - group: Coconut sauce
        items:
          - [coconut milk, 100, ml]
          - [sugar, 1, tbsp]
          - [salt, 1, pinch]
          - [cornflour, 1, tsp]
      - group: To serve
        items:
          - [ripe mangoes, 2, null]
          - [toasted sesame seeds or mung beans, 1, tbsp]
    steps:
      - Soak the rice for at least 4 hours, drain and steam it on a cloth for 25 minutes, until tender and translucent.
      - Warm the coconut milk with the sugar and salt until dissolved, without boiling. Mix it into the hot rice, cover and let it soak in for 20 minutes.
