          - [aceite de oliva, 2, cucharada]
          - [comino molido, 1, cucharadita]
          - [pimentón ahumado, 1, cucharadita]
          - [chile en polvo, 0.5, cucharadita]
          - [tortillas de maíz, 8, null]
          - [aguacate, 1, null]
          - [col lombarda, 100, g]
          - [cebolla morada encurtida o fresca, 0.5, null]
          - [lima, 1, null]
          - [cilantro fresco, 1, puñado]
          - [sal, null, null]
    steps:
      - "Corta la coliflor en ramilletes pequeños, mézclala con el aceite, las especias y sal y ásala a 220 °C 20-25 minutos."
      - Aplasta el aguacate con zumo de lima y sal.
      - "Calienta las tortillas y rellénalas con aguacate, coliflor, lombarda en tiras finas, cebolla y cilantro."

  - name: Hamburguesas de lentejas
    health: [GREEN, "Hamburguesas de lentejas y verdura a la plancha: fibra y proteína vegetal."]
    nutrition: [300, 14, 40, 9]
    photo: saludable-vegano/hamburguesas-de-lentejas.jpg
    category: Legumbres
    difficulty: EASY
    prep: 20
    cook: 15
    servings: 4
    tags: [vegano, legumbres]
    ingredients:
      - items:
          - [lentejas cocidas, 400, g]
          - [copos de avena, 60, g]
          - [zanahoria rallada, 1, null]
          - [cebolla, 0.5, null]
          - [ajo, 1, diente]
          - [semillas de lino molidas, 1, cucharada]
          - [comino molido, 1, cucharadita]
          - [perejil fresco, 1, puñado]
          - [aceite de oliva, 1, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - Mezcla el lino con 3 cucharadas de agua y deja 5 minutos.
      - "Aplasta las lentejas escurridas y mézclalas con la avena, la zanahoria, la cebolla y el ajo picados, el lino, el comino, el perejil, sal y pimienta."
      - "Forma 4 hamburguesas, refrigéralas 15 minutos y cocínalas a la plancha con el aceite 4 minutos por lado."

  - name: Curry de verduras y garbanzos con coco
    health: [GREEN, "Curry de verduras y legumbre con leche de coco ligera: completo y sabroso."]
    nutrition: [400, 13, 48, 18]
    photo: saludable-vegano/curry-de-verduras-y-garbanzos-con-coco.jpg
    category: Verduras
    difficulty: EASY
    prep: 15
    cook: 30
    servings: 4
    tags: [vegano, curry, sin gluten]
    ingredients:
      - items:
          - [garbanzos cocidos, 400, g]
          - [calabaza o boniato, 400, g]
          - [coliflor, 0.5, null]
          - [espinacas, 100, g]
          - [cebolla, 1, null]
          - [ajo, 2, diente]
          - [jengibre fresco rallado, 1, cucharada]
          - [pasta de curry rojo o curry en polvo, 2, cucharada]
          - [leche de coco ligera, 400, ml]
          - [tomate triturado, 200, g]
          - [aceite, 1, cucharada]
          - [lima, 1, null]
          - [sal, null, null]
    steps:
      - "Pocha la cebolla picada en el aceite 6 minutos, añade el ajo, el jengibre y el curry y cocina 1 minuto."
      - "Añade la calabaza en dados, la coliflor, el tomate y la leche de coco, y cuece 20 minutos."
      - Incorpora los garbanzos y las espinacas y cuece 5 minutos. Sala y termina con zumo de lima. Sirve con arroz integral.

  - name: Ensalada de fideos de arroz con tofu
    health: [GREEN, "Fideos con mucha verdura cruda, tofu y aliño de cacahuete: fresca y completa."]
    nutrition: [470, 19, 58, 18]
    photo: saludable-vegano/ensalada-de-fideos-de-arroz-con-tofu.jpg
    category: Ensaladas
    difficulty: EASY
    prep: 20
    cook: 10
    servings: 4
    tags: [vegano, ensalada, fideos]
    ingredients:
      - items:
          - [fideos de arroz, 200, g]
          - [tofu firme, 250, g]
          - [zanahorias, 2, null]
          - [pepino, 1, null]
          - [pimiento rojo, 1, null]
          - [col lombarda, 100, g]
          - [menta y cilantro frescos, 1, puñado]
          - [crema de cacahuete natural, 3, cucharada]
          - [salsa de soja baja en sal, 2, cucharada]
          - [zumo de lima, 2, cucharada]
          - [sirope de arce, 1, cucharadita]
          - [cacahuetes tostados, 30, g]
    steps:
      - "Remoja o cuece los fideos según el paquete, enjuágalos en agua fría y escúrrelos."
      - Dora el tofu en dados en una sartén antiadherente.
      - Corta las verduras en juliana fina.
      - "Bate la crema de cacahuete con la soja, la lima, el sirope y agua hasta obtener un aliño fluido. Mézclalo todo y sirve con las hierbas y los cacahuetes picados."

  - name: Guiso de alubias blancas con verduras
    health: [GREEN, "Alubias guisadas con verduras y aceite de oliva: fibra y proteína vegetal."]
