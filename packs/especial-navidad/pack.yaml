description: >-
  Las recetas de siempre para Nochebuena, Navidad y Reyes: cóctel de gambas, croquetas, sopa de
  galets, cordero asado, cochinillo, besugo, merluza en salsa verde, lombarda, roscón de Reyes,
  turrones, polvorones y mazapanes. Con notas para adelantar trabajo y cocinar para mucha gente.
