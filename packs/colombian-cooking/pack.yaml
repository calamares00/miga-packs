description: >-
  Cooking from Colombia's regions: bandeja paisa, Antioquian beans, ajiaco, sancocho, arepas,
  empanadas, patacones, hogao, ají, arroz con pollo, changua, pandebono, buñuelos, natilla,
  posta negra, mote de queso, coconut rice, seafood casserole, sobrebarriga and coconut
  lemonade. With substitutes for the ingredients that are harder to find outside Colombia.
