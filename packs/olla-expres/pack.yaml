    category: Pescados y mariscos
    difficulty: EASY
    prep: 20
    cook: 25
    servings: 4
    notes: La sepia queda tierna en pocos minutos de presión.
    tags: [olla exprés, pescado, guiso]
    utensils: [Olla exprés]
    ingredients:
      - items:
          - [sepia limpia en trozos, 600, g]
          - [patatas, 700, g]
          - [cebolla, 1, null]
          - [dientes de ajo, 2, null]
          - [tomate triturado, 150, g]
          - [vino blanco, 100, ml]
          - [guisantes, 150, g]
          - [caldo de pescado, 600, ml]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - Sofríe la cebolla y el ajo picados en la olla con el aceite 8 minutos. Añade la sepia y rehoga 5 minutos.
      - Añade el tomate y el vino y cocina 3 minutos.
      - Añade el caldo, cierra la olla y cuece 10 minutos desde que suba la presión.
      - Deja que baje la presión, añade las patatas chascadas y los guisantes, cierra y cuece 6 minutos más.

  - name: Arroz caldoso con pollo
    health: [GREEN, "Arroz con pollo y verduras en caldo: completo y reconfortante."]
    nutrition: [470, 30, 58, 13]
    photo: olla-expres/arroz-caldoso-con-pollo.jpg
    category: Arroces
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: El arroz solo necesita 6-7 minutos de presión. Sírvelo enseguida, que sigue absorbiendo caldo.
    tags: [olla exprés, arroz, pollo]
    utensils: [Olla exprés]
    ingredients:
      - items:
          - [contramuslos de pollo en trozos, 500, g]
          - [arroz redondo, 300, g]
          - [cebolla, 1, null]
          - [pimiento rojo, 1, null]
          - [tomate triturado, 100, g]
          - [judías verdes, 150, g]
          - [pimentón dulce, 1, cucharadita]
          - [azafrán o colorante, 1, pizca]
          - [caldo de pollo, 1.4, l]
          - [aceite de oliva virgen extra, 3, cucharada]
          - [sal, null, null]
    steps:
      - Dora el pollo salado en la olla abierta con el aceite. Añade la cebolla, el pimiento y las judías picadas y rehoga 8 minutos.
      - Añade el tomate y el pimentón y cocina 3 minutos. Añade el arroz y rehoga 1 minuto.
      - Añade el caldo caliente y el azafrán, cierra la olla y cuece 7 minutos desde que suba la presión.
      - Libera la presión con cuidado y sirve enseguida.

  - name: Conejo al ajillo
    health: [GREEN, "Carne de conejo muy magra con ajo y vino: mucha proteína y poca grasa."]
    nutrition: [380, 40, 4, 20]
    photo: olla-expres/conejo-al-ajillo.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 20
    servings: 4
    notes: El conejo queda tierno en la olla y no se seca.
    tags: [olla exprés, tradicional, sin gluten]
    utensils: [Olla exprés]
    ingredients:
      - items:
          - [conejo troceado, 1.2, kg]
          - [dientes de ajo, 10, null]
          - [vino blanco, 150, ml]
          - [hoja de laurel, 1, null]
          - [tomillo seco, 1, cucharadita]
          - [guindilla, 1, null, optional]
          - [aceite de oliva virgen extra, 5, cucharada]
          - [sal, null, null]
    steps:
      - Sala el conejo y dóralo en la olla abierta con el aceite y los ajos sin pelar, ligeramente aplastados.
      - Añade el vino, el laurel, el tomillo, la guindilla y 100 ml de agua.
      - Cierra y cuece 12 minutos desde que suba la presión.
      - Deja que baje la presión y reduce la salsa sin tapa 5 minutos.
