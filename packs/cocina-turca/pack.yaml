          - [sal, null, null]
    steps:
      - Mezcla todos los ingredientes menos el pollo y marina los dados en la nevera 2 horas o toda la noche.
      - Ensarta el pollo en broquetas.
      - Ásalas en la barbacoa o la plancha 12-15 minutos, dándoles la vuelta, hasta que estén doradas.

  - name: Berenjenas rellenas karnıyarık
    health: [YELLOW, "Berenjena frita rellena de carne: verdura y proteína, pero absorbe aceite."]
    nutrition: [440, 20, 18, 33]
    photo: cocina-turca/berenjenas-rellenas-karnyark.jpg
    category: Verduras
    difficulty: MEDIUM
    prep: 25
    cook: 45
    servings: 4
    notes: Karnıyarık significa «vientre abierto». Para que absorban menos aceite, puedes asar las berenjenas en el horno.
    tags: [berenjena, carne picada, horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [berenjenas medianas, 4, null]
          - [carne picada de ternera, 300, g]
          - [cebolla, 1, null]
          - [pimientos verdes alargados, 2, null]
          - [tomates, 2, null]
          - [dientes de ajo, 2, null]
          - [concentrado de tomate, 1, cucharada]
          - [perejil picado, 2, cucharada]
          - [aceite de oliva para freír, null, null]
          - [sal, null, null]
    steps:
      - Pela las berenjenas a rayas, déjalas en agua con sal 20 minutos, sécalas y fríelas enteras hasta que estén blandas.
      - Sofríe la cebolla y el ajo, añade la carne y luego un tomate picado, sal y el perejil. Cocina 10 minutos.
      - Precalienta el horno a 180 °C. Abre las berenjenas a lo largo, ponlas en una fuente y rellénalas con la carne. Coloca encima una rodaja de tomate y medio pimiento.
      - Diluye el concentrado en un vaso de agua caliente, viértelo en la fuente y hornea 25 minutos.

  - name: İmam bayıldı
    health: [YELLOW, "Berenjena con cebolla y tomate en aceite de oliva: vegetal, pero con mucho aceite."]
    nutrition: [290, 4, 20, 22]
    photo: cocina-turca/imam-bayld.jpg
    category: Verduras
    difficulty: MEDIUM
    prep: 25
    cook: 60
    servings: 4
    notes: «El imán se desmayó», de lo rico que estaba. Es un plato de aceite de oliva y se toma a temperatura ambiente.
    tags: [berenjena, vegana, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [berenjenas medianas, 4, null]
          - [cebollas, 3, null]
          - [dientes de ajo, 5, null]
          - [tomates maduros, 3, null]
          - [pimiento verde, 1, null]
          - [perejil picado, 4, cucharada]
          - [azúcar, 1, cucharadita]
          - [aceite de oliva virgen extra, 120, ml]
          - [zumo de limón, 1, cucharada]
          - [sal, null, null]
    steps:
      - Pela las berenjenas a rayas, déjalas en agua con sal 20 minutos, sécalas y dóralas enteras en parte del aceite. Ábrelas a lo largo.
      - Pocha la cebolla en juliana y el ajo en láminas en el resto del aceite 15 minutos. Añade el pimiento, la mitad del tomate picado, el azúcar y la sal y cocina 5 minutos más. Añade el perejil.
      - Precalienta el horno a 180 °C. Rellena las berenjenas, pon una rodaja de tomate encima y vierte medio vaso de agua con el limón en la fuente.
      - Hornea tapado 30 minutos y destapado 10 más. Deja enfriar antes de servir.

  - name: Pilaf de bulgur
    health: [GREEN, "Trigo bulgur con verduras: cereal integral con fibra."]
    nutrition: [290, 8, 50, 8]
    category: Pastas
    difficulty: EASY
    prep: 10
    cook: 25
    servings: 4
    notes: El bulgur pilavı acompaña carnes y kebabs, o se toma solo con yogur.
    tags: [cereal, guarnición, vegana]
    utensils: []
    ingredients:
      - items:
          - [bulgur grueso, 250, g]
          - [cebolla, 1, null]
          - [pimiento verde, 1, null]
          - [tomate, 1, null]
          - [concentrado de tomate, 1, cucharada]
          - [aceite de oliva o mantequilla, 2, cucharada]
          - [caldo de verduras caliente, 500, ml]
          - [copos de pimiento rojo (pul biber), 0.5, cucharadita]
          - [sal, null, null]
    steps:
      - Pocha la cebolla y el pimiento picados en el aceite 5 minutos. Añade el tomate rallado y el concentrado y cocina 3 minutos.
      - Añade el bulgur lavado y remueve 2 minutos.
      - Vierte el caldo, sala, tapa y cuece a fuego mínimo 15 minutos, hasta que absorba el líquido.
      - Apaga, pon un paño bajo la tapa y deja reposar 10 minutos.

