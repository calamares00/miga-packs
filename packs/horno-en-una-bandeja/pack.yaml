      - Corta el halloumi en lonchas gruesas, colócalas sobre las verduras con los tomates y hornea 10 minutos más, hasta que se dore.

  - name: Pollo con chorizo y garbanzos en bandeja
    health: [YELLOW, "Pollo con garbanzos y verduras: completo; el chorizo añade grasa y sal."]
    nutrition: [560, 42, 32, 28]
    category: Carnes
    difficulty: EASY
    prep: 10
    cook: 40
    servings: 4
    notes: Los garbanzos de bote se tuestan con la grasa del chorizo y quedan crujientes.
    tags: [una bandeja, pollo, al horno, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [contramuslos de pollo, 8, null]
          - [garbanzos cocidos, 400, g]
          - [chorizo en rodajas, 100, g]
          - [pimientos rojos, 2, null]
          - [cebolla roja, 1, null]
          - [tomates cherry, 200, g]
          - [pimentón ahumado, 1, cucharadita]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [sal, null, null]
    steps:
      - Precalienta el horno a 210 °C.
      - Mezcla en la bandeja los garbanzos escurridos, el chorizo, los pimientos y la cebolla en trozos y los tomates con el aceite y la mitad del pimentón.
      - Coloca el pollo salado y espolvoreado con el resto del pimentón encima, con la piel hacia arriba.
      - Hornea 35-40 minutos, hasta que el pollo esté dorado y hecho.
