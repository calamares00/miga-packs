  - name: Flan napolitano
    health: [RED, "Flan con leche condensada, queso crema y caramelo: mucho azúcar y grasa."]
    nutrition: [380, 10, 50, 16]
    photo: cocina-mexicana/flan-napolitano.jpg
    category: Postres
    difficulty: MEDIUM
    prep: 15
    cook: 60
    servings: 8
    tags: [postre, horno, vegetariana]
    utensils: [Horno, Batidora]
    notes: Mejor de un día para otro. Se hace al baño maría en una flanera o molde redondo de unos 20 cm.
    ingredients:
      - group: Caramelo
        items:
          - [azúcar, 150, g]
          - [agua, 3, cucharada]
      - group: Flan
        items:
          - [leche condensada, 397, g]
          - [leche evaporada, 410, g]
          - [queso crema, 150, g]
          - [huevos, 5, null]
          - [extracto de vainilla, 1, cucharadita]
    steps:
      - Calienta el azúcar con el agua sin remover hasta obtener un caramelo dorado. Viértelo en el molde y cubre el fondo.
      - Tritura las leches con el queso crema, los huevos y la vainilla, sin batir de más.
      - Vierte la mezcla en el molde, tapa con aluminio y hornea al baño maría a 170 °C unos 60 minutos, hasta que cuaje.
      - Deja enfriar y refrigera al menos 4 horas.
      - Pasa un cuchillo por el borde y desmolda sobre un plato con algo de fondo.
