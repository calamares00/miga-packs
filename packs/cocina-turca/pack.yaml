    cook: 10
    servings: 4
    notes: El kebab picante de Adana, con la carne picada a cuchillo. Necesita broquetas planas y anchas.
    tags: [kebab, barbacoa, cordero, sin gluten]
    origin: Adana
    utensils: [Barbacoa]
    ingredients:
      - items:
          - [carne picada de cordero con algo de grasa, 600, g]
          - [pimiento rojo, 1, null]
          - [copos de pimiento rojo (pul biber), 2, cucharadita]
