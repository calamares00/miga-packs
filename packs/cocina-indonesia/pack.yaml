  - name: Martabak manis
    category: Postres
    difficulty: MEDIUM
    prep: 70
    cook: 15
    servings: 6
    notes: Se hace en una sartén gruesa de unos 22 cm, tapada. Las burbujas de la masa le dan su textura de esponja.
    tags: [postre, chocolate]
    ingredients:
      - group: Masa
        items:
          - [harina de trigo, 250, g]
          - [azúcar, 2, cucharada]
          - [levadura seca de panadería, 1, cucharadita]
          - [bicarbonato, 0.5, cucharadita]
          - [sal, 1, pizca]
          - [huevo, 1, null]
          - [leche tibia, 300, ml]
      - group: Relleno
        items:
          - [mantequilla blanda, 40, g]
          - [fideos de chocolate, 4, cucharada]
          - [cacahuetes tostados picados, 4, cucharada]
          - [leche condensada, 4, cucharada]
          - [azúcar, 2, cucharada]
    steps:
      - Bate todos los ingredientes de la masa, menos el bicarbonato, hasta que no queden grumos. Tapa y deja que repose 1 hora.
      - Añade el bicarbonato disuelto en una cucharada de agua y mezcla.
      - Calienta la sartén a fuego medio, vierte la masa y espera a que se llene de burbujas. Espolvorea el azúcar, tapa y cuece a fuego suave 8-10 minutos, hasta que la superficie esté hecha.
      - Desmolda, unta con la mantequilla, reparte el chocolate, los cacahuetes y la leche condensada, dobla por la mitad y corta en porciones.

  - name: Klepon
    category: Postres
    difficulty: MEDIUM
    prep: 25
    cook: 10
    servings: 6
    origin: Java
    notes: Al morderlos, el azúcar de palma fundido sale del centro. Cómelos el mismo día.
    tags: [postre, sin gluten, vegana]
    ingredients:
      - items:
          - [harina de arroz glutinoso, 200, g]
          - [agua tibia, 150, ml]
          - [extracto de pandan, 0.5, cucharadita]
          - [azúcar de palma, 80, g]
          - [coco rallado, 100, g]
          - [sal, 1, pizca]
    steps:
      - Mezcla el coco rallado con la sal y cuécelo al vapor 5 minutos para que se ablande.
      - Mezcla la harina con el agua y el extracto de pandan hasta tener una masa lisa y moldeable. Si se agrieta, añade un poco más de agua.
      - Pica el azúcar de palma en trocitos. Toma porciones de masa del tamaño de una nuez, aplánalas, pon un trocito de azúcar en el centro y ciérralas en forma de bola.
      - Cuécelas en agua hirviendo hasta que floten y 1 minuto más.
      - Escúrrelas y rebózalas en el coco.

