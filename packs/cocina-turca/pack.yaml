    steps:
      - Pica muy fino el pimiento, escúrrelo y amásalo con la carne, las especias y la sal 5 minutos, hasta que quede pegajosa. Refrigera 1 hora.
      - Con las manos mojadas, moldea la carne alrededor de las broquetas aplastándola con los dedos.
      - Asa en la barbacoa a fuego fuerte 8-10 minutos, girando.
      - Sirve con pan, la cebolla con zumaque y pimientos y tomates asados.

  - name: Brochetas de pollo a la turca
    health: [GREEN, "Pechuga adobada en yogur a la brasa: mucha proteína y poca grasa."]
