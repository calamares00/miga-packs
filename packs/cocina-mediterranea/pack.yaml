  - name: Gazpacho andaluz
    health: [GREEN, "Verduras crudas con aceite de oliva: mucha vitamina C, agua y antioxidantes. Muy saludable y refrescante."]
    nutrition: [230, 3, 15, 19]
    photo: cocina-mediterranea/gazpacho-andaluz.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 15
    cook: 0
    servings: 4
    origin: Andalucía
    originCountry: ES
    tags: [vegana, fría, verano]
    utensils: [Batidora]
    ingredients:
      - items:
          - [tomate maduro, 1, kg]
          - [pimiento verde italiano, 1, null]
          - [pepino, 0.5, null]
          - [ajo, 1, diente]
          - [pan del día anterior, 50, g, optional]
          - [aceite de oliva virgen extra, 80, ml]
          - [vinagre de Jerez, 2, cucharada]
          - [sal, 1, cucharadita]
          - [agua fría, 150, ml]
    steps:
      - Trocea los tomates, el pimiento, el pepino pelado y el ajo.
      - Tritura todo con el pan remojado, el vinagre y la sal hasta que quede muy fino.
      - Añade el aceite en hilo sin dejar de triturar para que emulsione. Ajusta la textura con el agua.
      - Cuela si quieres una textura más fina y enfría al menos 2 horas.
      - Sirve con dados de pepino, pimiento y pan tostado.

  - name: Salmorejo cordobés
    health: [GREEN, "Tomate, pan y aceite de oliva con huevo y jamón. Saludable, aunque el pan y el aceite lo hacen calórico."]
    nutrition: [470, 11, 35, 33]
    photo: cocina-mediterranea/salmorejo-cordobes.jpg
    category: Sopas y cremas
    difficulty: EASY
    prep: 15
    cook: 10
    servings: 4
    origin: Córdoba
    originCountry: ES
    tags: [fría, verano, vegetariana]
    utensils: [Batidora]
    ingredients:
      - items:
          - [tomate maduro, 1, kg]
          - [pan de miga densa del día anterior, 200, g]
          - [ajo, 1, diente]
          - [aceite de oliva virgen extra, 150, ml]
          - [sal, 1, cucharadita]
          - [huevos, 2, null]
          - [jamón serrano en taquitos, 50, g, optional]
    steps:
      - Cuece los huevos 10 minutos, enfríalos y pícalos.
      - Tritura los tomates con el ajo y la sal. Cuela para quitar pieles y semillas.
      - Añade el pan troceado, deja que se empape 10 minutos y tritura de nuevo.
      - Incorpora el aceite poco a poco hasta lograr una crema espesa y brillante.
      - Enfría y sirve con el huevo, el jamón y un hilo de aceite.

  - name: Paella valenciana
    health: [GREEN, "Pollo, conejo, verdura y garrofón con arroz: un plato completo y equilibrado con aceite de oliva."]
    nutrition: [680, 42, 72, 22]
    photo: cocina-mediterranea/paella-valenciana.jpg
    category: Arroces
    difficulty: HARD
    prep: 20
    cook: 45
    servings: 6
    origin: Valencia
    originCountry: ES
    tags: [arroz, pollo, fin de semana]
    notes: Lo ideal es una paella de 40-45 cm. No se remueve el arroz una vez añadido.
    ingredients:
      - items:
          - [pollo troceado, 800, g]
          - [conejo troceado, 600, g]
          - [judía verde plana (bajoqueta), 250, g]
          - [garrofón, 150, g]
          - [tomates rallados, 2, null]
          - [arroz bomba o redondo, 500, g]
          - [aceite de oliva, 100, ml]
          - [pimentón dulce, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [romero fresco, 1, rama, optional]
          - [agua, 1.5, l]
          - [sal, null, null]
    steps:
      - Calienta el aceite en la paella, sala la carne y dórala bien a fuego medio, unos 15 minutos.
      - Añade las judías y el garrofón y rehógalos 5 minutos.
      - Haz un hueco en el centro, sofríe el tomate y, al final, el pimentón sin que se queme.
      - Vierte el agua, añade el azafrán y sal, y cuece 20 minutos a fuego medio para hacer el caldo.
      - Reparte el arroz en cruz, extiéndelo y cuece 10 minutos a fuego fuerte y 8 a fuego suave, sin remover. Pon el romero los últimos minutos.
      - Sube el fuego el último minuto para el socarrat y deja reposar 5 minutos tapada con un paño.

  - name: Tortilla de patatas
    health: [YELLOW, "Huevo y patata, buena combinación, pero la patata se fríe en mucho aceite. Escurrirla bien la aligera."]
    nutrition: [420, 13, 32, 27]
    photo: cocina-mediterranea/tortilla-de-patatas.jpg
    category: Huevos
    difficulty: MEDIUM
    prep: 15
    cook: 30
    servings: 4
    origin: España
    originCountry: ES
    tags: [vegetariana, sin gluten, clásico]
    ingredients:
      - items:
          - [patata, 700, g]
          - [huevos, 6, null]
          - [cebolla, 1, null, optional]
          - [aceite de oliva, 400, ml]
          - [sal, null, null]
    steps:
      - Pela las patatas y córtalas en láminas finas. Pica la cebolla.
      - Confita las patatas y la cebolla en el aceite a fuego medio-bajo 20 minutos, hasta que estén tiernas. Escúrrelas.
      - Bate los huevos con sal, mezcla con las patatas y deja reposar 5 minutos.
      - Cuaja la mezcla en una sartén con una cucharada de aceite, 3 minutos a fuego medio.
      - Dale la vuelta con un plato y cuaja 2 minutos más por el otro lado. Mejor jugosa por dentro.

  - name: Pisto manchego
    health: [GREEN, "Verduras guisadas en aceite de oliva con huevo: mucha fibra y vitaminas. Freír el huevo con poco aceite."]
    nutrition: [310, 10, 17, 23]
    photo: cocina-mediterranea/pisto-manchego.jpg
