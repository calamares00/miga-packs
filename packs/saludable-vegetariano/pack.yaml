description: >-
  Platos sin carne ni pescado, con huevo, lácteos, legumbres y mucha verdura, completos en
  proteína: frittata de verduras, berenjenas rellenas de quinoa y feta, pimientos rellenos de arroz
  integral, hamburguesas de alubias negras, ensalada de lentejas con feta, quiche sin masa de
  espinacas, calabacines rellenos de requesón, coliflor gratinada con yogur, cuscús con verduras y
  halloumi y huevos al horno con espinacas.
