    steps:
      - Corta la coliflor en ramilletes y las patatas en dados de 2 cm.
      - "Fríe el comino en el aceite, añade la cebolla picada y póchala 6 minutos. Agrega la pasta de jengibre y ajo y el tomate picado y cocina 3 minutos."
      - "Añade la cúrcuma, el cilantro molido y el chile, y luego las patatas y la coliflor. Sala y remueve para cubrirlas de especias."
      - "Tapa y cocina a fuego medio-bajo 20 minutos, removiendo de vez en cuando, hasta que estén tiernas. Destapa los últimos minutos para que se doren."
      - Termina con el garam masala y el cilantro picado.

