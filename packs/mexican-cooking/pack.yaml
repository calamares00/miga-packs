      - Separately fry the almonds, peanuts, half the sesame, raisins, tortilla, tomato, onion, garlic and spices in the lard. Blend everything with the chillies and stock into a smooth paste.
      - Fry the paste in lard for 10 minutes, stirring, add the chocolate, sugar and enough stock for a sauce and simmer for 30 minutes. Add the chicken and serve with the rest of the sesame, toasted.

