recipes:

  - name: Jajangmyeon
    health: [YELLOW, "Fideos con salsa de soja negra, cerdo y verduras: completo pero con bastantes hidratos y sal."]
    nutrition: [640, 24, 92, 20]
    photo: fusion-chino-coreana/jajangmyeon.jpg
    category: Pastas
    difficulty: MEDIUM
    prep: 20
    cook: 25
    servings: 4
    origin: Incheon
    notes: La pasta de soja negra coreana (chunjang) se encuentra en tiendas asiáticas; se fríe antes para quitarle el amargor.
    tags: [fideos, cerdo]
    utensils: [Wok]
    ingredients:
      - items:
          - [fideos frescos de trigo gruesos, 600, g]
          - [panceta o paleta de cerdo, 250, g]
          - [chunjang (pasta de soja negra), 5, cucharada]
          - [cebollas, 2, null]
          - [calabacín, 1, null]
          - [patata, 1, null]
          - [col blanca, 150, g]
          - [azúcar, 1, cucharada]
          - [maicena, 2, cucharada]
          - [aceite de girasol, 5, cucharada]
          - [pepino para servir, 0.5, null]
    steps:
      - "Fríe el chunjang en 3 cucharadas de aceite a fuego medio 3 minutos, removiendo. Resérvalo y guarda el aceite."
      - "Corta el cerdo, las cebollas, el calabacín, la patata y la col en dados de 1 cm. Dora el cerdo en el wok con el resto del aceite y añade las verduras; saltea 5 minutos."
      - "Añade el chunjang frito con su aceite y el azúcar, saltea 1 minuto y agrega 400 ml de agua. Cuece 10 minutos, hasta que la patata esté tierna."
      - Espesa con la maicena disuelta en 4 cucharadas de agua.
      - "Cuece los fideos, escúrrelos y sírvelos cubiertos con la salsa y pepino en juliana. Se mezcla todo en la mesa."

  - name: Jjamppong
    health: [YELLOW, "Sopa picante de fideos con marisco y verduras: proteína y verdura, pero muy salada."]
    nutrition: [520, 30, 70, 13]
    photo: fusion-chino-coreana/jjamppong.jpg
    category: Sopas y cremas
    difficulty: MEDIUM
    prep: 20
    cook: 25
    servings: 4
    tags: [sopa, marisco, picante, fideos]
    utensils: [Wok]
    ingredients:
      - items:
          - [fideos frescos de trigo gruesos, 500, g]
          - [mejillones, 300, g]
          - [gambas, 200, g]
          - [calamar, 200, g]
          - [panceta de cerdo, 100, g]
          - [cebolla, 1, null]
          - [col blanca, 150, g]
          - [calabacín, 0.5, null]
          - [zanahoria, 0.5, null]
          - [ajo, 4, diente]
          - [gochugaru (chile coreano en copos), 3, cucharada]
          - [salsa de soja, 2, cucharada]
          - [caldo de pollo, 1.2, l]
          - [aceite de girasol, 3, cucharada]
          - [sal, null, null]
    steps:
      - Corta el cerdo y las verduras en tiras y el calamar en anillas.
      - Saltea el ajo picado y el cerdo en el wok con el aceite 2 minutos. Añade las verduras y saltea 3 minutos a fuego fuerte.
      - "Baja el fuego, añade el gochugaru y remueve 30 segundos sin que se queme. Agrega la soja y el caldo y lleva a ebullición."
      - "Añade el marisco y cuece 4-5 minutos, hasta que los mejillones se abran. Sala."
      - "Cuece los fideos aparte, repártelos en cuencos y cúbrelos con la sopa."

  - name: Tangsuyuk
    health: [RED, "Cerdo rebozado y frito con salsa agridulce: frito y con azúcar."]
    nutrition: [610, 28, 62, 28]
    photo: fusion-chino-coreana/tangsuyuk.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 30
    cook: 25
    servings: 4
    notes: El rebozado de fécula de patata remojada es lo que lo hace tan crujiente. En Corea se discute si la salsa se vierte por encima o se moja.
    tags: [cerdo, frito]
    ingredients:
      - group: Cerdo
        items:
          - [lomo de cerdo, 500, g]
          - [fécula de patata, 150, g]
          - [clara de huevo, 1, null]
          - [jengibre fresco rallado, 1, cucharadita]
          - [salsa de soja, 1, cucharada]
          - [aceite de girasol para freír, 1, l]
      - group: Salsa
        items:
          - [azúcar, 80, g]
          - [vinagre, 80, ml]
          - [salsa de soja, 1, cucharada]
          - [agua, 300, ml]
          - [zanahoria, 0.5, null]
          - [pepino, 0.5, null]
          - [cebolla, 0.5, null]
          - [piña en trozos, 100, g]
          - [fécula de patata, 2, cucharada]
    steps:
      - Remoja la fécula en 250 ml de agua 1 hora; tira el agua que queda arriba y quédate con la pasta del fondo.
      - "Corta el cerdo en tiras gruesas, adóbalo con la soja y el jengibre y mézclalo con la clara y la pasta de fécula."
      - "Fríelo a 170 °C 4 minutos, sácalo y vuelve a freírlo a 190 °C 2 minutos, hasta que esté muy crujiente."
      - "Para la salsa, hierve el agua con el azúcar, el vinagre y la soja, añade las verduras en trozos y la piña y cuece 2 minutos. Espesa con la fécula disuelta en un poco de agua."
      - Sirve el cerdo con la salsa caliente por encima o aparte.

  - name: Kkanpunggi
    health: [RED, "Pollo frito con salsa de ajo, chile y vinagre: sabroso pero frito y salado."]
    nutrition: [520, 34, 30, 28]
    photo: fusion-chino-coreana/kkanpunggi.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 20
    servings: 4
    tags: [pollo, frito, picante]
    utensils: [Wok]
    ingredients:
      - group: Pollo
        items:
          - [contramuslos de pollo deshuesados, 700, g]
          - [salsa de soja, 1, cucharada]
          - [huevo, 1, null]
          - [fécula de patata, 80, g]
          - [aceite de girasol para freír, 1, l]
      - group: Salsa
        items:
          - [ajo, 6, diente]
          - [jengibre fresco, 2, cm]
          - [chiles rojos secos, 6, null]
          - [chile verde, 1, null]
          - [cebolletas, 2, null]
          - [salsa de soja, 3, cucharada]
          - [vinagre, 2, cucharada]
          - [azúcar, 2, cucharada]
          - [agua, 3, cucharada]
    steps:
      - "Corta el pollo en trozos, mézclalo con la soja y el huevo y rebózalo en la fécula."
      - "Fríelo dos veces: 5 minutos a 170 °C y 2 minutos a 190 °C."
      - "Mezcla la soja, el vinagre, el azúcar y el agua."
      - "En el wok con 2 cucharadas de aceite, saltea el ajo y el jengibre picados, los chiles y la cebolleta 1 minuto. Añade la salsa y, cuando hierva, el pollo. Saltea hasta que la salsa se absorba y sirve."

  - name: Lajogi
    health: [YELLOW, "Pollo frito salteado con verduras y aceite de chile: proteína con verdura, pero frito y picante."]
    nutrition: [480, 33, 24, 28]
    photo: fusion-chino-coreana/lajogi.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 20
    cook: 20
    servings: 4
    notes: "Es una versión coreana del la zi ji de Sichuan, con más verdura y salsa."
    tags: [pollo, picante, frito]
    utensils: [Wok]
    ingredients:
      - items:
          - [contramuslos de pollo deshuesados, 600, g]
          - [fécula de patata, 70, g]
          - [huevo, 1, null]
          - [aceite de girasol para freír, 1, l]
          - [chiles rojos secos, 10, null]
          - [aceite de chile, 2, cucharada]
          - [ajo, 4, diente]
          - [pimiento rojo, 1, null]
          - [cebolla, 1, null]
          - [champiñones, 100, g]
          - [brotes de bambú, 100, g]
          - [salsa de soja, 3, cucharada]
          - [salsa de ostras, 1, cucharada]
          - [caldo de pollo, 150, ml]
          - [fécula de patata para la salsa, 1, cucharada]
    steps:
      - "Corta el pollo en dados, mézclalo con el huevo y la fécula y fríelo a 175 °C 5 minutos, hasta que esté crujiente."
      - Calienta el aceite de chile en el wok y fríe los chiles secos y el ajo 30 segundos.
      - Añade las verduras en trozos y saltea 3 minutos a fuego fuerte.
      - "Agrega la soja, la salsa de ostras y el caldo, espesa con la fécula disuelta en agua y echa el pollo. Saltea 1 minuto y sirve."

  - name: Yusanseul
    health: [GREEN, "Salteado de marisco, setas y verduras en tiras: ligero y con mucha proteína magra."]
    nutrition: [290, 30, 14, 12]
    photo: fusion-chino-coreana/yusanseul.jpg
    category: Pescados y mariscos
    difficulty: MEDIUM
    prep: 30
    cook: 10
    servings: 4
    notes: "Es un plato de banquete: se sirve en la mesa para compartir, a veces sobre arroz."
    tags: [marisco, salteado]
    utensils: [Wok]
    ingredients:
      - items:
          - [gambas peladas, 200, g]
          - [calamar, 200, g]
          - [pepino de mar o vieiras, 150, g]
          - [setas shiitake, 6, null]
          - [brotes de bambú, 100, g]
          - [pimiento rojo, 1, null]
          - [pimiento verde, 1, null]
          - [cebolleta, 2, null]
          - [ajo, 3, diente]
          - [jengibre fresco rallado, 1, cucharadita]
          - [salsa de ostras, 2, cucharada]
          - [caldo de pollo, 150, ml]
          - [fécula de patata, 1, cucharada]
          - [aceite de sésamo, 1, cucharadita]
          - [aceite de girasol, 3, cucharada]
    steps:
      - "Corta en tiras finas el marisco, las setas, el bambú y los pimientos, todo del mismo tamaño."
      - Escalda el marisco 30 segundos en agua hirviendo y escúrrelo.
      - "Saltea el ajo, el jengibre y la cebolleta en el wok muy caliente, añade las setas, el bambú y los pimientos y saltea 2 minutos."
      - "Añade el marisco, la salsa de ostras y el caldo, espesa con la fécula disuelta en agua y termina con el aceite de sésamo."

  - name: Gun-mandu
    health: [YELLOW, "Empanadillas de cerdo y verdura doradas en la sartén: equilibradas, aunque llevan aceite."]
    nutrition: [380, 18, 38, 17]
    photo: fusion-chino-coreana/gun-mandu.jpg
    category: Entrantes
    difficulty: MEDIUM
    prep: 45
    cook: 15
    servings: 4
    notes: "En los restaurantes chino-coreanos se sirven gratis con el jajangmyeon, como 'servicio'."
    tags: [empanadillas, cerdo]
    ingredients:
      - items:
          - [obleas para empanadillas, 30, null]
          - [carne picada de cerdo, 250, g]
          - [tofu firme, 100, g]
          - [col china, 150, g]
          - [cebollino chino o cebolleta, 1, manojo]
          - [fideos de batata (dangmyeon) remojados, 40, g]
          - [ajo, 2, diente]
          - [jengibre fresco rallado, 1, cucharadita]
          - [salsa de soja, 1, cucharada]
          - [aceite de sésamo, 1, cucharada]
          - [aceite de girasol, 4, cucharada]
          - [salsa de soja con vinagre para mojar, null, null]
    steps:
      - "Pica la col, sálala 10 minutos y escúrrela apretando. Desmiga el tofu y escúrrelo en un paño."
      - "Mezcla el cerdo con la col, el tofu, el cebollino y los fideos picados, el ajo, el jengibre, la soja y el aceite de sésamo."
      - "Pon una cucharadita de relleno en cada oblea, moja el borde y ciérrala en media luna, plegando un lado."
      - "Dóralas en una sartén con el aceite 2 minutos, añade 80 ml de agua, tapa y cuece 5 minutos. Destapa y deja que se tuesten de nuevo por la base."
      - Sírvelas con soja mezclada con vinagre y un poco de chile.

  - name: Goguma mattang
    health: [RED, "Boniato frito y caramelizado: un dulce con azúcar y frito."]
    nutrition: [340, 2, 58, 12]
    photo: fusion-chino-coreana/goguma-mattang.jpg
    category: Postres
    difficulty: EASY
    prep: 10
    cook: 20
    servings: 4
    notes: "Viene del basi digua chino. El caramelo se endurece al enfriarse: hay que servirlo enseguida."
    tags: [postre, vegano, frito]
    ingredients:
      - items:
          - [boniatos, 600, g]
          - [aceite de girasol para freír, 750, ml]
          - [azúcar, 80, g]
          - [sirope de arroz o de maíz, 2, cucharada]
          - [semillas de sésamo negro, 1, cucharada]
    steps:
      - Pela los boniatos y córtalos en trozos irregulares de 3 cm. Remójalos 10 minutos en agua fría y sécalos bien.
      - "Fríelos a 160 °C 8 minutos, hasta que estén tiernos, y luego 2 minutos a 180 °C para dorarlos."
      - "En una sartén con 2 cucharadas de aceite, derrite el azúcar a fuego medio sin remover hasta que sea un caramelo claro. Añade el sirope."
      - "Echa el boniato, mezcla para cubrirlo y espolvorea sésamo. Sírvelo enseguida, separando los trozos."
