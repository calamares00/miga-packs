    difficulty: HARD
    prep: 40
    cook: 25
    servings: 8
    notes: Salen unas 24 bolitas. Rellénalas justo antes de servir para que no se ablanden.
    tags: [postre, chocolate]
    utensils: [Horno, Batidora]
    ingredients:
      - group: Para la pasta choux
        items:
          - [agua, 125, ml]
          - [leche, 125, ml]
          - [mantequilla, 100, g]
          - [sal, 1, pizca]
          - [harina de trigo, 150, g]
          - [huevos, 4, null]
      - group: Para el relleno y la salsa
        items:
          - [nata para montar, 400, ml]
          - [azúcar glas, 40, g]
          - [chocolate negro, 150, g]
          - [nata para cocinar, 150, ml]
    steps:
      - Precalienta el horno a 200 °C. Lleva a ebullición el agua, la leche, la mantequilla y la sal, añade la harina de golpe y remueve hasta que la masa se despegue.
      - Deja templar y añade los huevos uno a uno, batiendo bien.
      - Forma bolitas con una manga en una bandeja con papel de horno y hornea 20-25 minutos sin abrir el horno. Deja enfriar.
      - Monta la nata con el azúcar glas y rellena los profiteroles por debajo con una manga.
      - Funde el chocolate con la nata caliente y sirve los profiteroles bañados con la salsa.

