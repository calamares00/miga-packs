description: >-
  La cocina criolla de Nueva Orleans, donde se mezclaron Francia, España, África occidental y el
  Caribe: gambas a la criolla, alubias rojas con arroz, étouffée de cangrejo de río, grillades con
  sémola de maíz, arroz sucio, muffuletta, beignets y pudin de pan con salsa de whisky.
