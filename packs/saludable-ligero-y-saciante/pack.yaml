    tags: [sopa, frío, vegetariano, sin gluten]
    utensils: [Batidora]
    ingredients:
      - items:
          - [pepinos, 3, null]
          - [yogur natural, 300, g]
          - [ajo, 1, diente]
          - [menta fresca, 1, puñado]
          - [eneldo fresco, 1, puñado]
          - [zumo de limón, 1, cucharada]
          - [aceite de oliva virgen extra, 1, cucharada]
          - [agua fría, 150, ml]
          - [sal, null, null]
    steps:
      - "Pela los pepinos y trocéalos, reservando un poco en dados para servir."
      - "Tritúralos con el yogur, el ajo, las hierbas, el limón, el agua y sal hasta que quede fino."
      - Enfría al menos 1 hora y sirve con el pepino en dados y un hilo de aceite.

  - name: Hamburguesas de pollo y calabacín
    health: [GREEN, "Hamburguesas de pollo con verdura rallada a la plancha: magras y jugosas."]
    nutrition: [230, 30, 6, 9]
    photo: saludable-ligero-y-saciante/hamburguesas-de-pollo-y-calabacin.jpg
    category: Carnes
    difficulty: EASY
    prep: 15
    cook: 12
    servings: 4
    tags: [pollo, plancha]
    utensils: [Plancha]
    ingredients:
      - items:
          - [pechuga de pollo picada, 500, g]
          - [calabacín, 1, null]
          - [cebolleta, 2, null]
          - [ajo, 1, diente]
          - [huevo, 1, null]
          - [copos de avena, 30, g]
          - [perejil fresco, 1, puñado]
          - [aceite de oliva, 1, cucharada]
          - [sal y pimienta negra, null, null]
    steps:
      - "Ralla el calabacín, sálalo 10 minutos y escúrrelo apretando bien."
      - "Mézclalo con el pollo, la cebolleta y el ajo picados, el huevo, la avena, el perejil y pimienta."
      - Forma 4 hamburguesas y cocínalas a la plancha con el aceite 5-6 minutos por lado. Sírvelas con ensalada.

  - name: "Ensalada de pollo, mango y aguacate"
    health: [GREEN, "Pollo con fruta, aguacate y hojas verdes: proteína y grasas saludables."]
    nutrition: [380, 32, 20, 19]
    photo: saludable-ligero-y-saciante/ensalada-de-pollo-mango-y-aguacate.jpg
    category: Ensaladas
    difficulty: EASY
    prep: 15
    cook: 12
    servings: 4
    tags: [ensalada, pollo, sin gluten]
    utensils: [Plancha]
    ingredients:
      - items:
          - [pechugas de pollo, 500, g]
          - [mango, 1, null]
          - [aguacate, 1, null]
          - [mezcla de hojas verdes, 150, g]
          - [cebolla morada, 0.5, null]
          - [lima, 1, null]
          - [aceite de oliva virgen extra, 2, cucharada]
          - [cilantro fresco, 1, puñado]
          - [sal y pimienta negra, null, null]
    steps:
      - Salpimienta el pollo y hazlo a la plancha 5-6 minutos por lado. Déjalo reposar y córtalo en tiras.
      - Corta el mango y el aguacate en dados y la cebolla en juliana fina.
      - "Bate el aceite con el zumo de lima y sal. Mezcla las hojas con el mango, el aguacate, la cebolla y el pollo, aliña y termina con cilantro."
