name: "Cocina fusión: peranakan"
series: Cocina fusión
description: >-
  La cocina nyonya de los peranakan, descendientes de chinos y malayos de Malaca, Penang y
  Singapur, que mezcla técnicas chinas con especias, coco y tamarindo: laksa lemak, asam laksa,
  ayam pongteh, ayam buah keluak, otak-otak, kueh pie tee, chap chye y kuih dadar.
author: Miga
authorGithub: calamares00
