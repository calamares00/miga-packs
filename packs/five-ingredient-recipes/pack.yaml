name: Five-ingredient recipes
series: Everyday cooking
family: recetas-con-5-ingredientes
description: >-
  Dishes with five ingredients or fewer (not counting salt, pepper, oil or water), for when the
  fridge is nearly empty or you can't be bothered: poor man's potatoes with egg, baked salmon with
  lemon, beetroot hummus, baked prawns, ham and cheese stuffed chicken, spaghetti al pomodoro,
  scrambled eggs with prawns and green garlic, Galician-style hake, Brazilian cheese bread and,
  for dessert, banana and cocoa ice cream, peanut butter cookies and strawberries and cream.
author: Miga
authorGithub: calamares00
