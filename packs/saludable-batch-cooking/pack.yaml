description: >-
  Platos sanos para cocinar en una tarde y comer toda la semana: aguantan bien en la nevera o el
  congelador y se recalientan sin perder nada. Bandeja de pollo y verduras, lentejas con verduras,
  espinacas con garbanzos, chili de pavo, albóndigas de pavo, ratatouille, ensalada de quinoa,
  salmón con boniato, pollo al curry con garbanzos y tacos de boniato.
