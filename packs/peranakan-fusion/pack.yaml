description: >-
  The Nyonya cooking of the Peranakan, descendants of Chinese and Malays in Malacca, Penang and
  Singapore, which blends Chinese techniques with spices, coconut and tamarind: laksa lemak, asam
  laksa, ayam pongteh, ayam buah keluak, otak-otak, kueh pie tee, chap chye and kuih dadar.
