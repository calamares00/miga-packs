language: en
name: "World cuisine: Peru"
series: World cuisine
description: >-
  Peruvian cooking from the coast, the Andes and the chifa tradition: ceviche, tiradito, lomo
  saltado, ají de gallina, causa limeña, papa a la huancaína, ocopa, arroz chaufa, anticuchos,
  pollo a la brasa, rocoto relleno, seco de res, arroz con pollo, chupe de camarones, papa
  rellena, tallarines verdes, suspiro limeño, picarones, mazamorra morada and chicha morada.
  With substitutes for Peruvian chillies.
