      - group: For the mole
        items:
          - [mulato chillies, 4, null]
          - [ancho chillies, 4, null]
          - [pasilla chillies, 3, null]
          - [almonds, 50, g]
          - [peanuts, 50, g]
          - [sesame seeds, 60, g]
          - [raisins, 40, g]
          - [day-old corn tortilla, 1, null]
          - [tomato, 1, null]
          - [onion for the mole, 0.5, null]
          - [garlic cloves for the mole, 3, null]
          - [cinnamon, 1, stick]
          - [cloves, 3, null]
          - [black peppercorns, 6, null]
          - [Mexican table chocolate, 60, g]
