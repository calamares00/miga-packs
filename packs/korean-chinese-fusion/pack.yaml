description: >-
  The dishes of Korea's Chinese restaurants, created by Shandong immigrants in Incheon and ordered
  for delivery all over the country: jajangmyeon, jjamppong, tangsuyuk, kkanpunggi, lajogi,
  yusanseul, gun-mandu and goguma mattang.
