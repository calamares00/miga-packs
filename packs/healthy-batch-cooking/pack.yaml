description: >-
  Healthy dishes to cook in one afternoon and eat all week: they keep well in the fridge or freezer
  and reheat without losing anything. Chicken and vegetable traybake, lentils with vegetables,
  spinach with chickpeas, turkey chili, turkey meatballs, ratatouille, quinoa salad, salmon with
  sweet potato, chicken curry with chickpeas and sweet potato tacos.
