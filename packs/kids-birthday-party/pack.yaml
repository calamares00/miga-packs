language: en
name: Kids' birthday party
series: Specials
family: cumpleanos-infantiles
description: >-
  Everything for a children's birthday party, easy to make ahead: chocolate cake, rainbow cake,
  vanilla cupcakes, decorated biscuits, mini pizzas, mini sandwiches, baked chicken fingers,
  sausage rolls, mini burgers, fruit skewers, popcorn and homemade lemonade. Always ask families
  about allergies and intolerances, and avoid whole nuts and popcorn for under-fours because of
  the choking risk.
author: Miga
authorGithub: calamares00
