description: >-
  Panes y masas amasados en Thermomix TM6, que funcionan igual en TM5 y TM7 (en TM31, amasa con la
  función espiga): pan de molde de avena, hogaza, masa de pizza, trenza de pan de leche, pan de
  espelta, pan de cerveza, pan de aceitunas, tortillas de trigo, colines, empanada de pollo,
  crepes, quiche de puerro y bacon, bollitos de chocolate y bollos preñaos. La Thermomix amasa;
  el horno hace el resto.
