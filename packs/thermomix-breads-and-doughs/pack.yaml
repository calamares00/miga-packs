name: "Thermomix: breads and doughs"
series: Kitchen appliances
family: thermomix-masas-y-panes
description: >-
  Breads and doughs kneaded in the Thermomix TM6, which work just the same on the TM5 and TM7 (on
  a TM31, knead with the dough function): oat sandwich loaf, country loaf, pizza dough, braided
  milk bread, spelt bread, beer bread, olive bread, flour tortillas, breadsticks, chicken and
  pepper empanada, crêpes, leek and bacon quiche, chocolate chip buns and Asturian chorizo buns.
  The Thermomix kneads; the oven does the rest.
author: Miga
authorGithub: calamares00
