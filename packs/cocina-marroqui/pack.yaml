          - [semillas de sésamo tostado y molido, 150, g]
          - [semillas de sésamo para decorar, 50, g]
          - [anís molido, 1, cucharadita]
          - [canela molida, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [huevo, 1, null]
          - [mantequilla derretida, 60, g]
          - [vinagre, 2, cucharada]
          - [agua de azahar, 60, ml]
          - [levadura seca de panadería, 1, cucharadita]
          - [miel, 1, kg]
          - [aceite para freír, null, null]
    steps:
      - Mezcla la harina con el sésamo molido, las especias, el huevo, la mantequilla, el vinagre, el azahar y la levadura y amasa hasta tener una masa firme. Deja reposar 30 minutos.
      - Estira fina y corta rectángulos de 8 x 6 cm. Haz 4 cortes paralelos dentro de cada rectángulo sin llegar a los bordes.
      - Pasa las tiras alternas por un dedo, junta las esquinas y da la vuelta para formar la flor.
      - Fríelas en aceite a fuego medio hasta que estén doradas y pásalas enseguida a la miel caliente 5 minutos.
      - Escúrrelas y espolvorea con sésamo.

