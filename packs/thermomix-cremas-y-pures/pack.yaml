id: thermomix-cremas-y-pures
version: 3
updated: 2026-11-06
language: es
name: "Thermomix: cremas y purés"
series: Electrodomésticos
description: >-
  Cremas y purés programados para Thermomix TM6 (vaso de 2,2 litros), que funcionan igual en
  TM5 y TM7. Calabaza, verduras, vichyssoise, champiñones, zanahoria con jengibre, brócoli,
  espárragos, guisantes con menta, tomate, lentejas rojas, coliflor, espinacas, boniato,
  alcachofas, pimientos asados, castañas, apio nabo, alubias, remolacha y puré de patatas.
  En TM31 (vaso de 2 litros y 100 °C como máximo), sofríe a temperatura Varoma.
author: Miga
authorGithub: calamares00
