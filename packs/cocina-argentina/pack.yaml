    difficulty: EASY
    prep: 25
    cook: 35
    servings: 8
    notes: La tarta de la merienda argentina. El dulce de membrillo se puede sustituir por dulce de batata o de leche.
    tags: [tarta, merienda]
    utensils: [Horno]
    ingredients:
      - items:
          - [harina, 300, g]
          - [manteca (mantequilla) fría, 150, g]
          - [azúcar, 100, g]
          - [huevo, 1, null]
          - [yema de huevo, 1, null]
          - [polvo de hornear, 1, cucharadita]
          - [ralladura de limón, 1, cucharadita]
          - [dulce de membrillo, 500, g]
          - [agua caliente, 3, cucharada]
    steps:
      - Mezcla la harina, el azúcar y el polvo de hornear. Añade la manteca en dados y arena con los dedos. Incorpora el huevo, la yema y la ralladura y une sin amasar. Refrigera 30 minutos.
      - Ablanda el membrillo con un tenedor y el agua caliente hasta que se pueda untar.
      - Precalienta el horno a 180 °C. Estira dos tercios de la masa y forra un molde de 24 cm. Rellena con el membrillo.
      - Estira el resto de la masa, córtala en tiras y colócalas en forma de rejilla.
      - Hornea 30-35 minutos, hasta que esté dorada.

  - name: Medialunas de manteca
    health: [RED, "Bollería con mucha mantequilla y almíbar: grasa saturada y azúcar. Para darse un capricho."]
    nutrition: [270, 4, 30, 15]
    category: Panes y masas
    difficulty: HARD
    prep: 180
    cook: 15
    servings: 16
    notes: Más pequeñas y dulces que los cruasanes, con un almíbar brillante por encima. Se toman con el café con leche.
    tags: [bollería, desayuno]
    utensils: [Horno]
    ingredients:
      - group: Masa
        items:
          - [harina de fuerza, 500, g]
          - [leche tibia, 200, ml]
          - [azúcar, 80, g]
          - [huevo, 1, null]
          - [levadura fresca, 25, g]
          - [miel, 1, cucharada]
          - [extracto de vainilla, 1, cucharadita]
          - [sal, 1, cucharadita]
          - [manteca (mantequilla) fría para el hojaldrado, 250, g]
      - group: Almíbar
        items:
          - [azúcar, 100, g]
          - [agua, 100, ml]
    steps:
      - Disuelve la levadura en la leche con la miel. Mezcla con la harina, el azúcar, el huevo, la vainilla y la sal y amasa 10 minutos. Refrigera 1 hora.
      - Aplasta la manteca fría entre dos papeles hasta tener un cuadrado. Estira la masa en un rectángulo, pon la manteca en el centro y cierra la masa sobre ella.
      - Estira en un rectángulo largo y dobla en tres. Refrigera 20 minutos. Repite el estirado y el plegado dos veces más.
      - Estira la masa a 4 mm, corta triángulos de base estrecha y enróllalos desde la base, curvando las puntas. Deja que leven tapados 1 hora y media, hasta que doblen su volumen.
      - Pinta con huevo y hornea a 200 °C 12-15 minutos. Hierve el azúcar con el agua 2 minutos y pinta las medialunas recién salidas del horno.

