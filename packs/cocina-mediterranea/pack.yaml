    steps:
      - Tritura brevemente la albahaca con el ajo, los piñones y la sal. Añade los quesos y el aceite y tritura a impulsos sin calentar la mezcla.
      - Cuece la pasta en agua con sal; si usas patata y judías, échalas en la misma olla 8 minutos antes del final.
      - Reserva un vaso del agua de cocción y escurre.
      - Mezcla la pasta con el pesto fuera del fuego, aligerando con un poco del agua reservada.

