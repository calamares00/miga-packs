      - Add the squid and cook 5 min/120°C/reverse/speed soft.
      - Add the tomato, paprika and wine and cook 3 min/120°C/reverse/speed soft.
      - Add the stock and salt and cook 10 min/100°C/reverse/speed soft.
      - Add the potatoes broken into chunks and the peas and cook 18 min/100°C/reverse/speed soft. Leave to rest 5 minutes.

  - name: Chicken in tomato sauce
    health: [GREEN, "Chicken in a homemade tomato sauce with vegetables: lots of protein and little fat."]
    nutrition: [330, 38, 14, 13]
    category: Meat
    difficulty: EASY
    prep: 10
    cook: 35
    servings: 4
    notes: Programmed for the Thermomix TM6. Skinless thighs stay juicier than breast.
    tags: [chicken, home-style]
    utensils: [Thermomix]
    ingredients:
      - items:
          - [onion, 1, null]
          - [red pepper, 1, null]
          - [garlic, 2, clove]
