      - Escúrrelas y aplasta los ajos.
      - Aliña con el resto de los ingredientes y deja enfriar.

  - name: Bissara
    health: [GREEN, "Puré de habas secas con aceite: mucha proteína vegetal y fibra."]
    nutrition: [320, 18, 40, 10]
    photo: cocina-marroqui/bissara.jpg
    category: Legumbres
    difficulty: EASY
    prep: 10
    cook: 60
    servings: 4
    notes: El desayuno de invierno en el norte de Marruecos. Se sirve con un buen chorro de aceite, comino y pimentón.
    tags: [legumbres, vegana, sin gluten, invierno]
    utensils: [Batidora, Olla exprés]
    ingredients:
      - items:
          - [habas secas peladas, 300, g]
          - [dientes de ajo, 4, null]
          - [comino molido, 2, cucharadita]
          - [pimentón dulce, 1, cucharadita]
          - [aceite de oliva virgen extra, 5, cucharada]
          - [zumo de limón, 1, cucharada]
          - [sal, null, null]
    steps:
      - Lava las habas y cuécelas con los ajos en 1,5 litros de agua 50-60 minutos (20 en olla exprés), hasta que se deshagan.
      - Tritura con la mitad del comino, la sal y la mitad del aceite hasta tener una sopa espesa; añade agua si hace falta.
      - Sirve en cuencos con el resto del aceite, comino, pimentón y unas gotas de limón.

  - name: Briouats de queso
    health: [RED, "Triángulos de pasta brick fritos: muy calóricos."]
    nutrition: [290, 9, 18, 20]
    photo: cocina-marroqui/briouats-de-queso.jpg
    category: Entrantes
    difficulty: MEDIUM
    prep: 30
    cook: 15
    servings: 6
    notes: Salen unos 24. También pueden hornearse a 200 °C, pintados con mantequilla.
    tags: [aperitivo, fritos, vegetariana]
    utensils: []
    ingredients:
      - items:
          - [queso fresco o feta, 200, g]
          - [queso mozzarella rallado, 100, g]
          - [huevo, 1, null]
          - [perejil y cilantro picados, 3, cucharada]
          - [comino molido, 0.5, cucharadita]
          - [hojas de pasta brick, 8, null]
          - [aceite para freír, null, null]
    steps:
      - Desmenuza los quesos y mézclalos con el huevo, las hierbas y el comino.
      - Corta las hojas de brick en tiras de 6 cm de ancho.
      - Pon una cucharadita de relleno en un extremo y dobla en triángulos hasta el final de la tira. Sella con un poco de huevo.
      - Fríe en aceite caliente hasta que estén dorados y escurre en papel.

  - name: Rfissa
    health: [YELLOW, "Pollo con lentejas sobre masa de msemen: completo, pero contundente."]
    nutrition: [690, 42, 62, 30]
    photo: cocina-marroqui/rfissa.jpg
    category: Carnes
    difficulty: HARD
    prep: 30
    cook: 90
    servings: 6
    notes: Plato de celebración que se hace tras un nacimiento. Usa msemen del día anterior. La fenogreco es la especia que le da su aroma.
    tags: [pollo, legumbres, fiesta]
    utensils: []
    ingredients:
      - items:
          - [pollo de corral en trozos, 1.5, kg]
          - [msemen o trid del día anterior, 8, null]
          - [lentejas, 150, g]
          - [semillas de fenogreco remojadas, 2, cucharada]
          - [cebollas, 3, null]
          - [ras el hanout, 2, cucharadita]
          - [jengibre molido, 1, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [manojo de cilantro y perejil, 1, null]
          - [mantequilla, 30, g]
          - [aceite de oliva, 4, cucharada]
          - [sal, null, null]
    steps:
      - Rehoga el pollo con la cebolla en juliana, las especias, el aceite, la mantequilla y las hierbas atadas 10 minutos.
      - Añade el fenogreco, las lentejas y 1,5 litros de agua y cuece tapado 1 hora, hasta que el pollo esté tierno.
      - Desmenuza el msemen en tiras y caliéntalo al vapor 10 minutos.
      - Pon el msemen en una fuente, riégalo con buena parte del caldo y coloca encima el pollo y las lentejas.

  - name: Mechui de cordero
    health: [YELLOW, "Cordero asado con mantequilla y especias: mucha proteína y grasa."]
    nutrition: [620, 46, 1, 48]
    photo: cocina-marroqui/mechui-de-cordero.jpg
    category: Carnes
    difficulty: MEDIUM
    prep: 15
    cook: 240
    servings: 6
    notes: El cordero asado de las fiestas. Se sirve con comino y sal para mojar, y se come con las manos.
    tags: [cordero, horno, fiesta, sin gluten]
    utensils: [Horno]
    ingredients:
      - items:
          - [paletilla de cordero, 2, null]
          - [mantequilla blanda, 80, g]
          - [dientes de ajo, 4, null]
          - [comino molido, 2, cucharadita]
          - [pimentón dulce, 2, cucharadita]
          - [hebras de azafrán, 1, pizca]
          - [sal, null, null]
          - [comino y sal para servir, null, null]
    steps:
      - Mezcla la mantequilla con el ajo machacado, las especias y la sal.
      - Haz unos cortes en la carne y úntala bien con la mantequilla. Déjala reposar 1 hora.
      - Asa en el horno a 160 °C, en una fuente con un vaso de agua, tapada con papel de aluminio 3 horas, regando de vez en cuando.
      - Destapa, sube a 220 °C y asa 30 minutos más, hasta que la piel esté crujiente y la carne se separe del hueso.

  - name: Pinchos de kefta
    health: [YELLOW, "Carne picada a la brasa: mucha proteína, con la grasa de la carne."]
    nutrition: [380, 28, 4, 28]
    photo: cocina-marroqui/pinchos-de-kefta.jpg
