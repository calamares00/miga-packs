  Cakes for breakfast and biscuits for the afternoon, homemade: orange cake, marble cake, carrot
  cake, lemon and poppy seed cake, apple cake and coffee cocoa cake, and oat and raisin, ginger,
  lemon and cinnamon biscuits, butter tea biscuits and langues de chat. With notes on keeping and
  freezing them.
