description: >-
  El chūka ryōri, la cocina china a la japonesa de los barrios chinos de Yokohama y Nagasaki y de
  los restaurantes de barrio: chāhan, tenshinhan, ebi chili, ebi mayo, hiyashi chūka, champon de
  Nagasaki, shūmai y nira reba.
